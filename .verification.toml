schema_version = 1

[[checks]]
name = "lint"
lanes = ["quick"]
command = ["{python}", "{project}/tools/verify_lint.py"]
identity_command = ["{python}", "{project}/tools/verify_lint.py", "--probe"]
fix_command = ["{python}", "{project}/tools/verify_lint.py", "--fix", "--files", "{files}"]
timeout = 150

[[checks]]
name = "types-pilot"
lanes = ["quick"]
command = ["{python}", "{project}/tools/verify_types.py"]
identity_command = ["{python}", "{project}/tools/verify_types.py", "--probe"]
timeout = 60

[[checks]]
name = "lint-all"
lanes = ["full"]
command = ["{python}", "{project}/tools/verify_lint.py", "--all"]
identity_command = ["{python}", "{project}/tools/verify_lint.py", "--probe"]
timeout = 150

[[checks]]
name = "merge-check"
lanes = ["full"]
command = ["uv", "run", "--offline", "--frozen", "python", "tools/verify_full.py"]
identity_command = ["uv", "run", "--offline", "--frozen", "python", "tools/verify_full.py", "--probe"]
# An outer net only. verify_full stops the run 30 minutes after ADMISSION, so
# time spent queued behind two other merge checks never cancels this one.
timeout = 7200
