[project]
name = "sm64-events"
version = "1.8.2"
description = "Event API for SM64 (Usamune v1.93u) running in Project64 1.6"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymem>=1.13",
    "av>=14",
    "numpy>=1.26",
    "proc-tap>=1.0.0",
    "pyaudiowpatch>=0.2.12",
    "pycaw>=20251023",
    "pillow>=12.2.0",
    "pywebview>=5.0",
    "pystray>=0.19",
    "yt-dlp>=2025.1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.8", "pytest-testmon>=2.1", "httpx>=0.27",
       "pyinstaller>=6.0", "playwright>=1.49"]

# playwright is declared HERE, not inherited from uilab, and that is on purpose.
# uilab is resolved by PATH (see tests/test_responsive.py) because `uv sync`
# prunes an editable install absent from the lockfile -- but a path only
# supplies uilab's own modules, never its dependencies. Naming the browser
# driver as this project's dev dependency is also just true: the layout gate
# renders the app in a browser, with or without uilab supplying the harness.
# The browser BINARY is a separate ~110MB download, deliberately not automatic:
#   uv run python -m playwright install chromium

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sm64_events"]

# uilab is a machine-level module shared with the other projects here, installed
# EDITABLE from one source tree rather than copied. That is what makes "always
# the newest instrumentation" true by construction: site-packages holds a .pth
# and a path finder, not a copy, so an improvement over there is live here on
# the next run with no reinstall and no version to pin. The cost is the other
# half of the same coin — a breaking change there breaks this immediately, which
# is what uilab's own tools/check_consumers.py exists to tell you.
#
# It is deliberately NOT listed in [project] dependencies at all. Naming it
# there breaks `uv run pytest -q` -- this project's documented command -- because
# uv re-resolves declared dependencies against an index and uilab is not
# published. An editable install lives as a .pth that uv does not prune, so the
# import keeps working without the declaration. The setup command below is the
# only thing that has to be run.
#
# The related trap, for whoever adds the declaration back: NO [tool.uv.sources]
# entry works either, because
# every form that entry can take is wrong: an absolute path is one machine's home
# directory in a public repo, a relative path cannot serve both this checkout and
# a worktree under .claude/worktrees/<slug> four levels deeper, and a git URL
# installs a copy and ends the live-edit property the arrangement exists for.
#
# The checkout is supplied on the command line instead, once, at setup:
#
#   uv pip install --python ".venv\Scripts\python.exe" -e <uilab> -e . pytest
#   .venv\Scripts\python.exe -m playwright install chromium

# ---------------------------------------------------------------------------
# The Python half of the AGENT-MAINTAINABILITY GATE.
#
# Every rule below earns its place by making the NEXT agent fail, not by taste.
# The evidence for each family, the thresholds, what was deliberately left out,
# and how to re-evaluate this list live in docs/agent-maintainability.md. Read
# that before adding or removing a rule — a rule with no failure story is how
# this becomes a style preset nobody reads.
#
# The gate is DIFF-SCOPED (.claude/hooks/lint-gate.py): only findings on lines
# a commit actually adds can block it. That is why a 312-finding backlog can
# sit here without anyone declaring bankruptcy.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
markers = [
    "spread: each case of this test is its own worker group under pytest-xdist loadgroup instead of staying with its file (tests/conftest.py::pytest_collection_modifyitems)",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "dist", "ds-bundle", ".design-sync", "replays", "logs"]

[tool.ruff.lint]
select = [
    # --- the code does not mean what it says ---
    "F",      # pyflakes: undefined names, unused imports/vars, f-string slips
    "E9",     # syntax / IO errors
    "E711", "E712", "E713", "E714", "E721",  # None/True/type compared by value
    "PLE",    # pylint errors — genuine mistakes, not preferences
    "B",      # bugbear: mutable defaults, loop-variable capture, zip truncation
    "ASYNC",  # a blocking call inside an async def — this app is FastAPI
    "DTZ",    # naive datetime; domain rule 7 says timestamps are UTC
    "RUF059", # an unpacked value nobody reads

    # --- something failed and nothing said so ---
    # This family is the one with direct evidence behind it: the 2026
    # agent-maintainability study found error/validation contract drift to be
    # THE code-level predictor of a later agent failing on earlier agent code.
    "E722",   # bare except
    "BLE",    # except Exception with no re-raise
    "S110", "S112",  # try/except/pass and try/except/continue
    "TRY400", "TRY401",  # logging.error inside except discards the traceback
    "LOG",    # logging misuse
    "PLW",    # pylint warnings; the useful one is subprocess-run without check

    # --- size and shape, calibrated in docs/agent-maintainability.md ---
    "C901", "PLR0912", "PLR0915",
]
ignore = [
    "PLW2901",  # rebinding a loop variable is idiomatic here
    "PLW0603",  # module-level singletons are a deliberate pattern in this app
    "PLW0108",  # unnecessary-lambda is style
    "PLW1508",  # os.getenv default type is style
    "PLW1514",  # explicit encoding on open(); worth doing, not worth blocking
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 50   # ~= a 75-line function; see the calibration in the doc
max-branches = 18

[tool.ruff.lint.per-file-ignores]
# Test STYLE is explicitly not policed (his call, 2026-08-28) — but everything
# in the silent-failure family still applies, because a test that swallows an
# error is a test that passes while proving nothing.
"tests/**" = [
    "RUF059",   # `a, b = f()` asserting only on `a` is normal in a test
    "PLW1510",  # a test inspects returncode itself
    "F811",     # fixture shadowing is how pytest works
]
"tools/**" = ["PLW1510"]  # scripts check their own subprocess results
