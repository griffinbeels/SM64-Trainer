[project]
name = "sm64-events"
version = "1.8.1"
description = "Event API for SM64 (Usamune v1.93u) running in Project64 1.6"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymem>=1.13",
    "av>=14",
    "numpy>=1.26",
    "windows-capture>=2.0.0",
    "proc-tap>=1.0.0",
    "pyaudiowpatch>=0.2.12",
    "pycaw>=20251023",
    "pillow>=12.2.0",
    "pywebview>=5.0",
    "pystray>=0.19",
    "yt-dlp>=2025.1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "pyinstaller>=6.0", "playwright>=1.49"]

# playwright is declared HERE, not inherited from uilab, and that is on purpose.
# uilab is resolved by PATH (see tests/test_responsive.py) because `uv sync`
# prunes an editable install absent from the lockfile -- but a path only
# supplies uilab's own modules, never its dependencies. Naming the browser
# driver as this project's dev dependency is also just true: the layout gate
# renders the app in a browser, with or without uilab supplying the harness.
# The browser BINARY is a separate ~110MB download, deliberately not automatic:
#   uv run python -m playwright install chromium

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sm64_events"]

# uilab is a machine-level module shared with the other projects here, installed
# EDITABLE from one source tree rather than copied. That is what makes "always
# the newest instrumentation" true by construction: site-packages holds a .pth
# and a path finder, not a copy, so an improvement over there is live here on
# the next run with no reinstall and no version to pin. The cost is the other
# half of the same coin — a breaking change there breaks this immediately, which
# is what uilab's own tools/check_consumers.py exists to tell you.
#
# It is deliberately NOT listed in [project] dependencies at all. Naming it
# there breaks `uv run pytest -q` -- this project's documented command -- because
# uv re-resolves declared dependencies against an index and uilab is not
# published. An editable install lives as a .pth that uv does not prune, so the
# import keeps working without the declaration. The setup command below is the
# only thing that has to be run.
#
# The related trap, for whoever adds the declaration back: NO [tool.uv.sources]
# entry works either, because
# every form that entry can take is wrong: an absolute path is one machine's home
# directory in a public repo, a relative path cannot serve both this checkout and
# a worktree under .claude/worktrees/<slug> four levels deeper, and a git URL
# installs a copy and ends the live-edit property the arrangement exists for.
#
# The checkout is supplied on the command line instead, once, at setup:
#
#   uv pip install --python ".venv\Scripts\python.exe" -e <uilab> -e . pytest
#   .venv\Scripts\python.exe -m playwright install chromium
