<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost overlay</title>
<!--
  The ghost overlay's own page: one muted video, no chrome at all, sized to
  whatever window it is put in. The companion window (the ghost/window package)
  points a frameless, click-through, never-focused window at this URL and glues
  it to Project64's picture; opening the same URL in an ordinary browser tab is
  how you look at it without a window manager in the way.

  Deliberately NOT part of the app shell: it must paint a video and nothing
  else, and the design system's background, cards and fonts would all be
  something to see through. Everything it draws is below.
-->
<style>
  /* NOTHING HERE PAINTS EXCEPT THE VIDEO. This page sits over the running
     game, so every surface it could tint is a surface it would tint wrongly:
     an opaque background is a black rectangle over Project64, which is exactly
     what his first real try saw (2026-09-19). No background on the document,
     none on the element, and the letterbox around a clip of another aspect is
     see-through rather than black.

     A page can only decline to paint; it cannot make the window behind it
     transparent. What composites this page onto the desktop is WebView2's own
     `DefaultBackgroundColor`, and the host asks for opaque black -- so the
     window side owns the other half of this (ghost/window/host.py). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Full-bleed element, `contain` picture, CENTRED -- and the reason is
     measured rather than chosen.

     His report, 2026-09-19: *"it's ALMOST overlaid properly -- you can see
     that the bottom of the gameplay (where the red becomes black) is slightly
     shifted."* The cause was the WINDOW, not this rule: it covered Project64's
     whole client area, status-bar strip included, so a 1600x1200 clip was
     stretched over a 1600x1224-ish box -- about 1.9% vertically. The window
     track now sits the window on the rectangle the renderer actually draws
     into (1600x1201 on his machine, against clips that are all 1600x1200).

     What decides this property is that THE GAME IMAGE IS ALREADY 4:3. This
     project's GLideN64 build forces it (`frameBufferEmulation\aspect=1`), so
     the picture is inscribed 4:3 and centred inside whatever rectangle the
     renderer has, and the black bands at the top and bottom of his footage are
     the GAME's own borders -- they scale with the picture rather than sitting
     outside it. So the correct mapping is the clip's 4:3 box onto the live 4:3
     box. When the window's aspect equals the clip's, `contain` and `fill` are
     the same picture; when he has resized Project64 to another shape they are
     not, and `fill` would distort exactly what this round is about. `cover`
     would crop instead. Centred because that is where the renderer puts it.

     The ELEMENT still covers the window (`inset: 0`): what it does not paint,
     it leaves see-through, which over a running game is the whole point. */
  #ghost {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    background: transparent; pointer-events: none;
  }
  /* Nothing to show yet, or nothing to show at all: paint nothing. A
     chrome-less overlay has no room to explain itself, so the reason lives on
     the body's data attributes and in ghostStatus() instead.

     `data-shown` is a SEPARATE question from `data-ghost`: ready means a clip
     resolved and its metadata loaded, shown means the decoder has actually
     presented a picture. Between the two an element with a src and no decoded
     frame paints its own (transparent) box, and before the first seek lands
     that box would be the PRE-ROLL -- a picture from the run before this one.
     Neither is something to put on top of his game. */
  #ghost, #mario { visibility: hidden; }
  /* TWO SURFACES, and which of them paints is the ghost VIEW.

     `#ghost` is the whole recorded screen -- the ghost he already knows.
     `#mario` is a canvas holding ONLY the rectangle Mario is in, cut out of
     the very same picture and drawn at the very same place, which is why it
     sits in the identical box (`inset: 0`) under the identical `contain`
     mapping (ui/ghost/mariobox.js reproduces it so it can be measured).
     His report is what this is for: *"all the camera movement / scenery
     overlaps"* -- so the Mario view stops painting the scenery and nothing
     else changes.

     THE CANVAS PAINTS IN THE MARIO VIEW AND NOWHERE ELSE, and that is a
     correction. It used to paint in both, laying a coloured Mario over an
     untouched picture in the whole view -- which reads well and does not
     survive the compositor: the canvas and the element reach the screen by
     two different paths, so on a pan the cut-out can land a refresh after the
     picture under it. What he would see is a rectangle of scenery tinted and
     sliding against the footage, with the whole-picture colour he asked for
     in round 3 gone. His words name the narrow case anyway: *"the cutout
     mario"*. So the whole view is exactly the base behaviour -- the hue on
     the element, this canvas never painted. */
  #mario {
    position: fixed; inset: 0; width: 100%; height: 100%;
    background: transparent; pointer-events: none;
  }
  body[data-ghost="ready"][data-shown="yes"]:not([data-view="mario"]) #ghost {
    visibility: visible;
  }
  body[data-ghost="ready"][data-shown="yes"][data-view="mario"] #mario {
    visibility: visible;
  }
</style>
</head>
<body data-ghost="loading">
<video id="ghost" muted playsinline preload="auto" disablepictureinpicture></video>
<canvas id="mario"></canvas>
<script type="module">
// THE GHOST IS A FUNCTION OF THE CLOCK. This file is only the wiring: resolve
// which clip to show, open the clock, and hand every sample to the follower,
// which owns every decision. See ./follower.js for the rule itself.
import { createFollower, DEFAULTS } from "./follower.js";
import { MARGIN_FRACTION, containRect, marioDraw,
         usableBoxes } from "./mariobox.js";
import { clipClock, slotAtTime } from "../frame.js";
import { presentedVideoTime, watchVideoPicture } from "../videopicture.js";

const params = new URLSearchParams(location.search);
const video = document.getElementById("ghost");
const canvas = document.getElementById("mario");
// `decision` is the last thing a CLOCK SAMPLE decided and `holding` is the
// separate question of whether any clock is arriving at all. Folding the two
// together would let a quiet second overwrite why the ghost is where it is,
// which is the one thing a live diagnosis needs to read back.
const status = { state: "loading", reason: null, reason_text: null,
                 samples: 0, decision: null, sample: null, template: null,
                 holding: null, tint: null,
                 //: WHAT IS BEING DRAWN, and what was asked for. They differ
                 //: whenever he asks for Mario on a ghost whose clip has no
                 //: boxes: the page shows the whole picture and this is where
                 //: it says so, because a chrome-less overlay has nowhere else.
                 view: "whole", view_requested: "whole",
                 boxes_available: false, boxes_reason: null, boxes_pictures: 0,
                 //: the picture the LAST PAINT used and the box it read for it
                 //: -- a failed try is read back here, per picture.
                 mario_picture: null, mario_box: null, mario_drawn: null,
                 //: WHY NOTHING IS ON SCREEN, when nothing is, in one word:
                 //:
                 //:   drawn        the cut-out is up
                 //:   no_mario     this PICTURE has no box -- a cutscene, a
                 //:                fade, or one of the single-picture dropouts
                 //:                a fast flip leaves. The list says null and
                 //:                nothing bridges it: null means null.
                 //:   no_boxes     this recording has no list at all
                 //:   whole_view   he is not asking for the cut-out
                 //:   no_picture   nothing has been presented yet
                 //:
                 //: `no_mario` and `no_boxes` look identical on screen -- an
                 //: empty overlay -- and a flicker he reports is one of them.
                 //: Counting the first is what makes that readable off the log
                 //: rather than a thing to reproduce.
                 mario_state: "no_picture", pictures_without_mario: 0,
                 margin_fraction: MARGIN_FRACTION,
                 //: pictures whose cut-out was drawn from a picture that had
                 //: already moved on. `drawImage` reads the element's CURRENT
                 //: picture, and under main-thread jank that can be a newer
                 //: one than the box was looked up for -- a single paint with
                 //: Mario clipped. Counted rather than prevented: it is rare,
                 //: self-correcting on the next picture, and a number here is
                 //: what makes a bad sitting readable off the log.
                 late_pictures: 0 };
let follower = null;
//: The clip's own per-picture clock and its box list, both fixed once the
//: source answers. `boxes` is null for every ghost recorded before Mario was
//: ever found in one, which is most of them.
let clipTiming = null;
let boxes = null;
//: What the CUT-OUT is drawn with -- the same string the element wears, so
//: the two views colour the ghost identically and only the scenery differs.
let boxFilter = "none";
//: The last picture `requestVideoFrameCallback` reported, and the query that
//: resolved this ghost. The first is what lets anything but a new picture
//: cause a repaint (a colour change on a still ghost, a view flip, a resize);
//: the second is what lets the page ask again for a box list that did not
//: exist when it loaded.
let lastPresented = null;
let sourceQuery = "";
let canWatchPictures = false;
const paint = canvas.getContext("2d", { alpha: true });
//: A picture's own start time IS `frame_times[k]` (measured 2026-09-20, worst
//: gap 0.44 microseconds), so the lookup sits exactly on the boundary with
//: nothing to spare: a `mediaTime` a float hair below it names picture k-1.
//: A tenth of a millisecond is far under a picture (33 ms) and far over the
//: error.
const PICTURE_EPSILON = 0.0001;
//: How often the page asks again for a box list it does not have, while the
//: Mario view is the one he wants. The boxes are made outside the app and
//: appear beside the clip whenever that finishes, and a ghost already up would
//: otherwise need switching off and on.
const RECHECK_MS = 4000;
// The last nudge the SERVER stated. The clock's value is adopted on the edge,
// not held as a level: the parent window may push its own nudge by
// postMessage, and a level would overwrite that on the very next game frame.
// Null until the first sample, which is how a page that has just loaded takes
// the current value straight away.
let clockNudge = null;
// The same for the colour treatment, and THIS PAGE SHIPS NO DEFAULT FOR IT.
// The angle and the switch are a preference the session owns and persists, so
// a copy here would be a second opinion that drifts the first time he changes
// the shipped one. There is no gap to cover: the window shows itself only
// while a picture is presentable, and nothing is presentable before the first
// clock sample, so the first frame the player ever sees is already coloured.
let clockTint = null;

function mark(state, reason = null, reasonText = null) {
  Object.assign(status, { state, reason, reason_text: reasonText });
  document.body.dataset.ghost = state;
  if (reason) document.body.dataset.reason = reason;
  else delete document.body.dataset.reason;
  // Anything but a running ghost goes back to painting nothing: a refusal, an
  // unreachable source or a media error must leave the game's own picture
  // untouched rather than freeze the last thing that was decoded.
  if (state !== "ready") delete document.body.dataset.shown;
}

// WHAT IS ON SCREEN, not what was asked for. `requestVideoFrameCallback` hands
// back the picture Chromium actually presented; a seek's own `currentTime` is
// a request. Correcting against the presented picture is also what keeps the
// element running one frame ahead of the screen, which is where it belongs.
const videoTime = () => {
  const presented = presentedVideoTime(video);
  return presented == null ? (video.currentTime || 0) : presented;
};

function apply(decision) {
  if (decision.action === "seek" && decision.time != null)
    video.currentTime = decision.time;
  if (decision.rate > 0) {
    if (Math.abs(video.playbackRate - decision.rate) > 0.005)
      video.playbackRate = decision.rate;
    if (video.paused) video.play().catch(() => {});
  } else if (!video.paused) {
    video.pause();
  }
}

function onSample(sample) {
  if (!follower) return;
  // THE NUDGE ARRIVES WITH THE CLOCK. It is part of the same rule -- the
  // picture whose timer equals the live timer plus the nudge -- so it rides
  // the same message, and a change takes effect on this very sample. The
  // alternative, re-pointing the window at a URL carrying the new value, is a
  // page LOAD: the overlay blinks off and re-seeks, once per press of a key he
  // holds down. Absent (an older server, or a parent pushing only a clock)
  // leaves whatever the page already had.
  if (typeof sample.nudge_frames === "number"
      && sample.nudge_frames !== clockNudge) {
    clockNudge = sample.nudge_frames;
    setNudge(clockNudge);
  }
  if (sample.tint) setTint(sample.tint);
  if (sample.view) setView(sample.view);
  status.samples += 1;
  status.sample = sample;
  status.holding = null;
  status.decision = follower.sample(sample, videoTime(), performance.now());
  apply(status.decision);
}

function setNudge(frames) {
  if (!follower) return;
  follower.setNudge(frames);
}

// WHAT THE GHOST SHOWS: the whole recorded screen, or only Mario. His report
// is the reason there is a choice at all -- *"it's still extremely hard to
// understand the ghost, because all the camera movement / scenery overlaps"* --
// and it rides the clock for the same reason the nudge does: re-pointing the
// window at a URL is a page LOAD, so a ghost that blinked off every time he
// changed his mind would be worse than either view.
//
// ASKING IS NOT GETTING. The setting is app-wide and he walks between stars,
// so "mario" arrives on ghosts whose clip has no boxes. Those draw the whole
// picture and say so here rather than going blank, which is what a hard
// refusal would look like from over the game.
function setView(asked) {
  status.view_requested = asked;
  const drawn = asked === "mario" && boxes ? "mario" : "whole";
  if (status.view === drawn && document.body.dataset.view === drawn) return;
  status.view = drawn;
  document.body.dataset.view = drawn;
  redraw();
}

// THE GHOST IS COLOURED, so it cannot be read as the live game. His words,
// 2026-09-19: *"It feels really hard to understand which one is the ACTUAL
// LIVE GAMEPLAY and which one is the GHOST gameplay... apply a color filter to
// the entire picture."*
//
// AND SINCE 2026-09-20 THE MARIO VIEW PUTS IT ON THE CUT-OUT: *"color
// correction should only apply to the Mario box now (it shouldn't impact
// anything other than the cutout mario)."* Which surface wears it follows the
// VIEW, not the presence of boxes:
//
//   whole picture -> the filter on the element, exactly as before this round.
//   only Mario    -> the element is hidden and the canvas draws the cut-out
//                    through the same filter, so it is the only thing tinted
//                    because it is the only thing on screen.
//
// Both get the same string, so flipping the view never changes the colour --
// only what is under it.
//
// Adopted only when the VALUE changes, and written to the element only when
// the FILTER changes -- two different questions. The first keeps the page from
// handing the compositor a string 30 times a second for a colour that has not
// moved; the second is why they are separate: switching the treatment off and
// then moving the wheel leaves the filter `none` both times, and comparing the
// strings alone would leave the readback reporting the angle from before.
function setTint(tint) {
  const enabled = Boolean(tint.enabled);
  const hue = Number(tint.hue_degrees) || 0;
  if (clockTint && clockTint.enabled === enabled && clockTint.hue === hue)
    return;
  // Zero degrees IS no shift, so it asks for no filter at all rather than for
  // a turn of nothing; the switch beside it is what he uses to mean "off".
  const wanted = enabled && hue ? `hue-rotate(${hue}deg)` : "none";
  clockTint = { enabled, hue, filter: wanted };
  status.tint = { enabled, hue_degrees: hue };
  applyTreatment();
}

// The colour, on both surfaces, and a REPAINT.
//
// The repaint is the fix for a defect a still ghost makes obvious: the canvas
// only paints when a new picture is presented, so with the game paused, the
// Usamune menu open, or Project64 auto-paused because he clicked the trainer,
// dragging the colour slider changed nothing at all. Painted from the LAST
// PRESENTED picture, never from `currentTime` -- the element may have been
// seeked somewhere it has not shown yet.
function applyTreatment() {
  const filter = clockTint ? clockTint.filter : "none";
  if (video.style.filter !== filter) video.style.filter = filter;
  boxFilter = filter;
  redraw();
}

// Everything that changes what the cut-out should look like WITHOUT a new
// picture arriving: the colour, the view, and the window's own size.
function redraw() {
  if (lastPresented != null) drawMario(lastPresented);
}

// ONLY MARIO, AND ONLY THE PICTURE THAT IS ACTUALLY ON SCREEN.
//
// Called from inside `requestVideoFrameCallback` with the presented picture's
// own media time, which is what makes the box and the picture change in the
// SAME paint. The alternative -- a CSS clip updated after the fact, or a box
// looked up from `currentTime` -- lags by a refresh, and a Mario one picture
// behind his own footage is a cut-out that visibly swims.
//
// `slotAtTime` is the clip's own owner of time -> picture (ui/frame.js), the
// same door the follower reads through; the boxes index exactly like the
// clip's per-picture arrays, so the slot IS the box's index with no
// arithmetic in between.
//
// MEASURED by the boxes worker, 2026-09-20 (evidence in the feature folder's
// `evidence/mario_boxes/`): the k-th presented picture's exact 90 kHz tick
// matches `media_clock.source_pts` for every picture of all three of his
// clips. The two quantities THIS lookup compares are the browser's `mediaTime`
// and the STORED `frame_times[k]` (`replay/service.py` rounds to six decimal
// places), and they come out as the same double -- so the index lands where
// the follower's own does for `picture_igt`.
//
// EQUALITY, NOT TOLERANCE: `slotAtTime` takes the last picture whose start is
// `<= seconds`, so a microsecond under names the picture BEFORE -- a box one
// picture late, on every frame. `PICTURE_EPSILON` is what makes this true by
// construction rather than by trusting the equality, and the real-browser
// check runs on a clip with per-picture `frame_times` so the boundary is
// exercised instead of rounded away.
//
// A clip that decodes more frames than it has entries (0573: 440 against 435)
// is a keyframe lead-in the edit list hides, and the browser never presents
// one.
function drawMario(time) {
  if (!paint) return;
  lastPresented = time;
  const size = sizeCanvas();
  if (status.view !== "mario" || !boxes || !clipTiming) {
    status.mario_drawn = null;
    status.mario_state = status.view !== "mario" ? "whole_view" : "no_boxes";
    return;
  }
  const slot = slotAtTime(time + PICTURE_EPSILON, clipTiming);
  const box = slot >= 0 && slot < boxes.boxes.length ? boxes.boxes[slot] : null;
  if (slot !== status.mario_picture && !box) status.pictures_without_mario += 1;
  status.mario_picture = slot;
  status.mario_box = box;
  status.mario_state = box ? "drawn" : "no_mario";
  // A picture Mario is not in paints NOTHING, and that is the honest answer:
  // carrying the previous box forward would put a stale Mario on his screen
  // through a cutscene or a warp.
  const rect = containRect(size.width, size.height,
                           video.videoWidth, video.videoHeight);
  const draw = box && marioDraw(box, boxes, {
    width: video.videoWidth, height: video.videoHeight,
  }, rect, MARGIN_FRACTION);
  status.mario_drawn = draw || null;
  if (!draw) {
    // A box the geometry cannot use is the same story on screen as no box at
    // all, and the counter above has already recorded it.
    if (box) status.mario_state = "no_mario";
    return;
  }
  paint.filter = boxFilter;
  paint.drawImage(video, draw.sx, draw.sy, draw.sw, draw.sh,
                  draw.dx, draw.dy, draw.dw, draw.dh);
  paint.filter = "none";
  // WHICH PICTURE DID `drawImage` ACTUALLY TAKE? It reads the element's
  // current one, and under main-thread jank that can already be newer than the
  // box was looked up for. Rare, and it corrects itself on the next picture,
  // so it is counted rather than prevented -- a number a live look can read.
  const at = presentedVideoTime(video);
  if (at != null && Math.abs(at - time) > PICTURE_EPSILON)
    status.late_pictures += 1;
}

// The backing store follows the window, and the canvas is CLEARED here.
//
// Cleared in DEVICE pixels before the ratio transform goes on: at 150% a
// `clearRect` in CSS pixels rounds inward, so a box touching the bottom or
// right edge could leave a one-device-pixel line of the previous cut-out
// behind -- a stripe over his game, from footage that has moved on. Sized from
// `getBoundingClientRect()` for the same reason: `clientWidth` is a rounded
// integer, and rounding the size the picture is mapped into puts the cut-out
// up to half a pixel off the whole picture's own mapping.
//
// NOT COVERED BY A TEST, and the reason is worth knowing rather than
// discovering: this can only bite when the canvas's CSS box is FRACTIONAL,
// and a browser viewport never gives it one -- `inset: 0` on an 800px viewport
// is 800 CSS pixels at any device ratio, so the mutation that clears in CSS
// pixels passes every check here. The real case is his own window: sized in
// DEVICE pixels to the renderer's rectangle (1600x1201) at 150%, which is
// 1066.67 x 800.67 CSS pixels. The edge-touching box and the outside-pixel
// count in `tests/test_ui_ghost_page.py` guard the clear generally; this
// particular half-pixel needs the real window to show it.
function sizeCanvas() {
  const box = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(box.width * ratio));
  const height = Math.max(1, Math.round(box.height * ratio));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  paint.setTransform(1, 0, 0, 1, 0, 0);
  paint.clearRect(0, 0, canvas.width, canvas.height);
  // Drawn in CSS pixels whatever the device does, so every rectangle in
  // `mariobox.js` is in the same space as the video element's own box.
  paint.setTransform(ratio, 0, 0, ratio, 0, 0);
  return { width: box.width, height: box.height };
}

// The clock. One tiny message per game snapshot, and only while this socket is
// open -- see server/ghost_clock.py. A dropped connection retries: the overlay
// outlives a server restart, and the follower holds meanwhile because no
// sample is arriving.
function openClock() {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const connect = () => {
    const socket = new WebSocket(`${scheme}//${location.host}/ws/ghost-clock`);
    socket.onmessage = (event) => {
      try { onSample(JSON.parse(event.data)); } catch { /* not our message */ }
    };
    socket.onerror = () => socket.close();
    socket.onclose = () => setTimeout(connect, 1000);
  };
  connect();
}

// The parent window can push the nudge (his timing hotkey), the colour, and
// -- if the socket ever proves too slow to feel locked -- the clock itself,
// which is the escalation the brainstorm calls A+: the graphics plugin
// publishes the picture it is drawing and the window follows that instead of
// the memory poll. Same message, another source.
//
// THE VIEW HAS NO DOOR HERE, deliberately. Every clock sample carries it, so a
// pushed value would be overwritten 33 ms later -- a control that appears to
// work and does not. The colour's door survives only because a parent pushing
// one is a parent that also owns the session's value; the view is the
// session's alone.
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;
  if (data.type === "ghost-nudge") setNudge(data.nudge_frames);
  else if (data.type === "ghost-tint" && data.tint) setTint(data.tint);
  else if (data.type === "ghost-clock") onSample(data);
});

// IS THERE FOOTAGE ON SCREEN RIGHT NOW? The window that owns this page shows
// itself only while this is true, so a page with nothing to draw costs the
// player nothing at all -- no sheet of tint over the game, which is what he
// saw at 80% and 100% opacity on the first try.
//
// It is a claim about a DECODED PICTURE, not about a loaded source, and every
// clause below is a state in which the page has nothing truthful to show:
//
//   not ready          -> refused, unavailable, loading, or a media error
//   no presented frame -> a src with nothing decoded yet, or a seek in flight
//   no sample yet      -> nothing has said where the player is
//   holding for a hold -> the clock feed stopped arriving (the emulator, or us)
//   elsewhere          -> he is in another level; the template was never there
//   he took the star   -> HIS run is over, whoever got there first; see below
//   past the attempt   -> the ghost's run is over; see below
//   too far off        -> the picture on screen is not the one the rule names
//
// THE TWO RUNS END SEPARATELY AND EITHER ENDING TAKES THE WINDOW AWAY. `past
// the attempt` is the ghost finishing first; `grabbed` is HIM finishing first,
// which is the case his own words name -- *"sometimes I might be faster than
// the ghost!"* Both leave a picture on screen that says nothing he does not
// already know, over a star he has just taken. His next reset brings the
// window straight back, by the same route in both cases: the counter returns
// to near zero and the follower re-places the ghost.
//
// THE TWO ENDS OF THE SPAN ARE NOT THE SAME CASE, and the difference is what
// the player gets out of it. Before the template's first picture -- the tenth
// of a second of reload after a reset -- the ghost is parked on the frame it
// is about to run from, and hiding the window for three game frames would be
// a blink he reads as a fault. Past its last picture he is SLOWER than the
// ghost was, and a frozen star-grab frame at half opacity sits over his game
// telling him nothing he does not already know, exactly while he is still
// trying to finish. So the ghost's run ending takes the window away, which is
// itself the useful signal; his next reset brings it straight back, because
// the counter returns to near zero and the follower re-places it.
//
// The follower still PARKS on the last picture either way (his ruling: never
// a frame outside the attempt). This is only about whether the window is up.
function presentable() {
  if (status.state !== "ready" || document.body.dataset.shown !== "yes")
    return false;
  if (!follower || !status.decision || !status.sample || status.holding)
    return false;
  const reason = status.decision.reason;
  if (reason === "elsewhere" || reason === "past_template"
      || reason === "grabbed") return false;
  if (reason === "before_template") return true;
  const shown = follower.template.igtAtTime(videoTime());
  const target = status.sample.igt + follower.nudge;
  // The follower's own resync threshold: past it the ghost is not following,
  // it is on its way somewhere. One number, and it lives in the module that
  // acts on it.
  return Math.abs(shown - target) <= DEFAULTS.seekFrames;
}

// The page's whole readable surface. A chrome-less overlay cannot show what it
// is doing, so this is how the window that owns it, a test, or a live
// diagnosis asks.
window.ghostStatus = () => ({
  ...status,
  nudge_frames: follower ? follower.nudge : null,
  video_time: videoTime(),
  //: whether the element is actually painting. False is the honest answer for
  //: every state in which this page must leave the game's picture alone.
  shown: document.body.dataset.shown === "yes",
  //: THE WINDOW'S OWN SIGNAL: true only while a decoded picture of the one the
  //: rule names is on screen. The companion window polls this and shows itself
  //: only while it holds.
  presentable: presentable(),
  //: whether HIS OWN grab is holding the ghost down, as opposed to the ghost
  //: having finished: two reasons for one empty screen, told apart here.
  grabbed: follower ? follower.grabbed : false,
  //: the colour treatment actually applied, and the filter string each
  //: surface is wearing -- a tint nobody can see reads identically to one that
  //: was never sent. With boxes the element wears nothing and the BOX carries
  //: the colour, so both are reported or a live look could not tell which of
  //: the two rules ran.
  tint_filter: video.style.filter || "none",
  box_filter: boxFilter,
  //: whether this engine can say which picture is on screen at all. Without
  //: it the cut-out has nothing to key on, so the Mario view is refused the
  //: same way a clip with no boxes refuses it.
  frame_callback: canWatchPictures,
  //: the size the browser decoded, against the size the boxes were measured
  //: in -- the one comparison that says whether a cut-out landing beside
  //: Mario is the maker's fault or the page's.
  picture_size: pictureSize(),
  paused: video.paused,
  playback_rate: video.playbackRate,
  shown_igt: follower && follower.template.ok
    ? follower.template.igtAtTime(videoTime()) : null,
  target_igt: follower && status.sample
    ? status.sample.igt + follower.nudge : null,
});

// The clip's picture size, for a live look that wants to know whether the
// boxes were measured on the same decode the browser made.
const pictureSize = () => ({ width: video.videoWidth || null,
                             height: video.videoHeight || null });

// WHERE MARIO IS, PICTURE BY PICTURE -- when this clip has a list beside it.
// Validated on the server every time it is served (ghost/mariobox.py), so the
// page's own job is two checks: the boxes have to index like the clip's
// per-picture arrays, and this engine has to be able to say which picture is
// on screen.
//
// `requestVideoFrameCallback` is the second one and it is not a formality: the
// cut-out is drawn from the presented picture's own index, so without it the
// page would have no picture to key on and would paint nothing while reporting
// itself presentable -- a window up over his game with nothing in it. Refused
// by name instead, exactly like a clip with no list.
//
// IDEMPOTENT, because it is also the re-ask: an answer that says what the page
// already believes changes nothing and paints nothing.
function adoptBoxes(source) {
  const stamps = (source.view && source.view.picture_igt) || [];
  const answer = usableBoxes(source, { frameCallback: canWatchPictures,
                                       pictures: stamps.length });
  // The list itself is always taken: a rewritten one of the same length is a
  // different list, and the next presented picture must use it.
  boxes = answer.usable ? source.mario_boxes : null;
  if (status.boxes_available === answer.usable
      && status.boxes_reason === answer.reason
      && status.boxes_pictures === answer.pictures) return;
  status.boxes_available = answer.usable;
  status.boxes_reason = answer.reason;
  status.boxes_pictures = answer.pictures;
  if (answer.usable) document.body.dataset.boxes = "yes";
  else delete document.body.dataset.boxes;
  applyTreatment();
  setView(status.view_requested);
}

// A BOX LIST CAN APPEAR WHILE THE GHOST IS ALREADY UP. They are made outside
// the app, one clip at a time, and land beside the clip whenever that
// finishes -- the practice card notices within a couple of seconds because the
// session re-resolves on a timer, and until this the PAGE did not, so the
// control said the Mario view was available and the overlay still drew the
// whole picture until he switched it off and on.
//
// Asked only while the Mario view is the one he wants, and only through the
// same door the page resolved through. An answer that changes nothing changes
// nothing: no reload, no blink.
async function reaskForBoxes() {
  if (status.view_requested !== "mario" || status.state !== "ready") return;
  try {
    const answer = await (await fetch(sourceQuery)).json();
    if (answer && answer.available) adoptBoxes(answer);
  } catch { /* the next tick asks again */ }
}

async function start() {
  const query = new URLSearchParams();
  for (const key of ["kind", "entity_key", "strat"]) {
    const value = params.get(key);
    if (value) query.set(key, value);
  }
  sourceQuery = `/api/ghost/source?${query}`;
  canWatchPictures = typeof video.requestVideoFrameCallback === "function";
  let source;
  try {
    source = await (await fetch(sourceQuery)).json();
  } catch (error) {
    mark("error", "source_unreachable", String(error));
    return;
  }
  if (!source || !source.available) {
    mark("unavailable", (source && source.reason) || "no_template",
         (source && source.reason_text) || null);
    return;
  }
  follower = createFollower(source.view, {
    // WHERE THE ATTEMPT ACTUALLY STARTS AND ENDS, when the source knows. His
    // ruling: the ghost is clamped to exactly the attempt's span -- its start
    // frame to the star grab -- whatever the player's recording settings kept
    // around it. Absent (an older server, a clip whose frames cannot be
    // resolved) the follower reads the start off the counter instead.
    span: source.span || null,
    // A starting value only, for a tab opened by hand with `?nudge=`. The
    // running app does not put it in the URL at all: the live value is the
    // server's, and it arrives on the first clock sample.
    nudgeFrames: Number(params.get("nudge")) || 0,
    // Where the template was recorded, when the source knows. A counter
    // running in another course names a picture in this one, so the ghost
    // holds instead of showing a confident lie -- his report of LLL footage
    // still playing in the castle. The source answers with the target's own
    // level, and with an area only where the target names one (a course's
    // subareas are the course); a segment names neither and the gate is off.
    expect: source.level != null
      ? { level: source.level, area: source.area == null ? null : source.area }
      : null,
    // A STAR's run ends when he touches it, whoever got there first. A
    // segment's does not -- see follower.js.
    grabEndsRun: (params.get("kind") || "star") !== "segment",
  });
  // What the rule made of this clip, readable from outside: how many pictures
  // it will play, how many it threw away as pre-roll from the previous run,
  // and the counter value its first playable picture carries. A refusal names
  // itself here too -- `counter_restarts` is a template the ghost will not
  // guess at, and a chrome-less overlay has nowhere else to say so.
  status.template = { ok: follower.template.ok, reason: follower.template.reason,
                      pictures: follower.template.pictures || 0,
                      preroll_pictures: follower.template.prerollPictures || 0,
                      first_igt: follower.template.firstIgt ?? null,
                      last_igt: follower.template.lastIgt ?? null,
                      basis: follower.template.basis || null };
  if (!follower.template.ok) {
    mark("unavailable", follower.template.reason);
    return;
  }
  clipTiming = clipClock(source.view);
  adoptBoxes(source);
  // READY means a picture can be shown, not that a URL was assigned. Seeking
  // an element that has not loaded its metadata is a request the browser may
  // still be holding, and the first thing every clock sample does is seek.
  video.addEventListener("error", () => mark("error", "media_unplayable"));
  video.addEventListener("loadedmetadata", () => {
    if (status.state === "ready") return;
    // PARK IT ON THE TEMPLATE'S ZERO BEFORE ANYTHING IS SHOWN. A clip opens on
    // its pre-roll -- the tail of the run before this one -- and the element
    // decodes that picture the moment it has metadata, a whole clock sample
    // before the first decision seeks. Seeking here means the first picture
    // this page ever presents is the attempt's own first frame, which is also
    // where the ghost belongs while the live timer is still in the near-zero
    // band after a reset.
    video.currentTime = follower.template.firstTime;
    mark("ready");
    openClock();
    setInterval(reaskForBoxes, RECHECK_MS);
    // The window can be resized under a still ghost (he moves Project64), and
    // a canvas whose backing store no longer matches its box shows a stretched
    // bitmap until the next picture arrives.
    window.addEventListener("resize", redraw);
    const tick = () => {
      const idle = follower.idle(videoTime(), performance.now());
      if (idle) { status.holding = idle.reason; apply(idle); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  // THE ELEMENT APPEARS WHEN A PICTURE DOES, not when a src is assigned.
  // `requestVideoFrameCallback` fires with the picture Chromium actually
  // presented, so this is the one signal that says there is footage to show
  // rather than an empty box waiting for a decoder.
  watchVideoPicture(video, (time) => {
    if (time == null || status.state !== "ready") return;
    document.body.dataset.shown = "yes";
    // INSIDE the frame callback, on the picture Chromium just presented: the
    // cut-out and the picture it came from reach the screen together.
    drawMario(time);
  });
  // No `requestVideoFrameCallback` (an older engine, or a headless run with no
  // compositor): `loadeddata` means the element has a frame for its current
  // position, which is the same claim one signal weaker. Without this the
  // overlay would be permanently invisible there, which is the failure mode
  // this whole section exists to avoid in the other direction.
  if (typeof video.requestVideoFrameCallback !== "function")
    video.addEventListener("loadeddata", () => {
      if (status.state === "ready") document.body.dataset.shown = "yes";
    });
  video.src = source.media_url;
}

start();
</script>
</body>
</html>
