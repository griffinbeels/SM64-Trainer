<!doctype html>
<html><head><meta charset="utf-8"><title>SM64 Trainer</title>
<link rel="icon" type="image/png" href="/ui/favicon.png">
<script type="importmap">
{"imports": {
  "preact": "/ui/vendor/preact.module.js",
  "preact/hooks": "/ui/vendor/hooks.module.js",
  "htm": "/ui/vendor/htm.module.js"
}}
</script>
<style>
  body { font-family: Consolas, monospace; background: #14161a; color: #d8dee9;
         max-width: 980px; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; margin: 0; }
  a { color: #6fa8ff; }
  button { font: inherit; background: #232730; color: #d8dee9; border: 1px solid #3a4150;
           border-radius: 4px; padding: .15rem .55rem; cursor: pointer; }
  button:hover { background: #2c3140; }
  select, input { font: inherit; background: #1b1e24; color: #d8dee9;
                  border: 1px solid #3a4150; border-radius: 4px; padding: .15rem .3rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
         background: #1b1e24; border-radius: 6px; padding: .5rem .8rem; margin: .8rem 0; }
  .dot { padding: .1rem .5rem; border-radius: 4px; font-size: .85em; }
  .ok { background: #1d3a1d; color: #a3e0a3; } .bad { background: #3a1d1d; color: #e0a3a3; }
  .tabs { display: flex; gap: .3rem; margin: .8rem 0 0 0; }
  .tab { border: 1px solid #3a4150; border-bottom: none; border-radius: 6px 6px 0 0;
         padding: .25rem 1rem; cursor: pointer; opacity: .65; }
  .tab.on { background: #1b1e24; opacity: 1; font-weight: bold; }
  .pane { border: 1px solid #3a4150; border-radius: 0 6px 6px 6px; padding: .8rem; }
  .starsec { border: 1px solid #2c3140; border-radius: 8px; padding: .6rem .8rem; margin: 0 0 .8rem 0; }
  .active-star { border-color: #e0c36a; }
  .stagebanner { border-color: #2f6d8c; }
  @keyframes armedpulse { from { box-shadow: 0 0 2px #3f8a5f; }
                          to { box-shadow: 0 0 9px #3f8a5f; } }
  .armedchip { animation: armedpulse 1.1s ease-in-out infinite alternate; }
  .armedchip b, .armedchip .armedword { color: inherit; }
  .armedword { opacity: .7; font-size: .85em; }
  /* SM64 star-select row (EVERY banner mode — stars, bowser, arena, castle
     all render PracticeCell) — a single line of cells that shrinks with the
     pane but NEVER wraps and NEVER scrolls: cells are shrinkable (flex 1 1 0
     / min-width 0) and their art + type clamp on cqw against the
     .practice-page container, so all 7 stars always fit on screen (spec
     2026-07-24, pinned by tests/test_star_icons.py). Segment rows carry
     .segcells: fewer cells, pinned to the SAME per-cell width the 7-star
     row would give them. */
  .starrow { display: flex; flex-wrap: nowrap; gap: .3rem; align-items: flex-start;
             margin-top: .4rem; padding: 4px 0; }
             /* padding: vertical breathing room so the active star's
                drop-shadow glow + scale/bob clear the card's overflow clip. */
  .starcell { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
              align-items: center; gap: .28rem; padding: .5rem .25rem .45rem;
              border: 1px solid transparent; border-radius: 10px; cursor: pointer;
              text-align: center; background: none; color: inherit; font: inherit;
              position: relative;
              transition: background .12s, border-color .12s; }
  .starcell:hover { background: #20242b; }
  .starcell:focus-visible { outline: 2px solid #6fa8ff; outline-offset: 2px; }
  .starcell.active-star { border-color: #e0c36a; background: #211f14; }
  /* PROGRESSIVE DISCLOSURE is GONE (round 22, 2026-08-08), and its whole
     treatment with it: `.selector-expanded` and `.starcell.subsection-cell`
     styled the child-tray look a row wore while expanded into one parent and
     its subsections. A subsection is never a cell here -- round 22 made it a
     badge inside its parent's own art, and round 31 (2026-08-10) retired the
     badge too, so it now nests only inside the parent's practice-log card
     (`.log-card-children`, below) -- there is no child cell left for a tray to
     group, and the classes are deleted rather than left unused. Griffin,
     opening round 22: "as a complete redesign / upgrade, we should actually
     re-use the same exact design we use as the Pipe/Star selector for the
     Bowser stages." The indent rule those styles were answering ("any time we
     have child rows that imply a parent/child relationship, we should indent
     the child one level") now lands on `.log-card-children` instead, which is
     a vertical list and can honour it literally. */
  /* Round 2 (2026-07-30): a segment cell used to ALSO carry its own
     `.armed` green highlight for "the timer is running now", which fought
     this gold one whenever a segment was both armed and targeted -- the
     user asked to unify the two cell kinds ("the color of the highlight
     should also be yellow for the segments, not green"), so `.armed` and
     its glow are deleted rather than reconciled. A cell now has exactly
     ONE highlight state, active-star, for every kind. */
  /* hover ✎ -> icon picker; revealed on cell hover or keyboard focus */
  /* The ✎ icon-override affordance. ONE rule for both surfaces that offer it
     — the banner's practice cells and the Rank tab's coverage tiles — with
     exactly one named difference: the tile's is scaled down, because a 42px
     tile cannot carry the banner cell's 20px badge (2026-07-26). */
  .starcell .editicon, .entity-tile .editicon {
              position: absolute; top: 3px; right: 3px;
              width: 20px; height: 20px; display: flex; align-items: center;
              justify-content: center; border-radius: 6px; font-size: .72rem;
              color: var(--muted); background: rgba(10,23,38,.88);
              border: 1px solid var(--border-soft);
              opacity: 0; transition: opacity .12s; }
  .starcell:hover .editicon, .starcell:focus-within .editicon,
  .starcell .editicon:focus-visible,
  .entity-tile:hover .editicon, .entity-tile:focus-within .editicon,
  .entity-tile .editicon:focus-visible { opacity: 1; }
  .starcell .editicon:hover, .entity-tile .editicon:hover {
              color: var(--text); border-color: #3e607f; }
  .entity-tile .tile-editicon { top: 1px; right: 1px; width: 15px;
              height: 15px; border-radius: 5px; font-size: .55rem;
              background: rgba(10,23,38,.94); }
  /* rank medal (or "–" when unranked) sitting between the star and its name;
     nudged up (negative margin) to sit centered in the gap — the star art has
     transparent bottom margin below its legs. Bobs with the active star. */
  /* `flex: 0 0 18px` and not `height` alone — the cell is a fixed-height
     column whose contents already overflow, so every child is a shrink
     candidate and a declared height is only a starting point. Measured in
     his own Castle Lobby row: the slot collapsed to 16px where it holds a
     rank MEDAL (a 16px image resists) and to 14.41px where it holds the
     "–" (text compresses freely), so the one practised movement in the row
     stood 1.59px taller than its six neighbours and shaved its own strategy
     line at the bottom of the clip — "somehow the LBLJ text is still
     broken, but the others are fine???" (2026-08-10). One number, both
     states. Pinned by tests/test_selector_rank_slot_holds.py. */
  .starrank { display: flex; align-items: center; justify-content: center;
              flex: 0 0 18px; margin-top: -6px; color: #6c7686;
              font-size: .9rem; line-height: 1; }
  /* `min-height: 0` + `flex: 0 0 auto` are what make the declared square
     REAL, and without them a non-square icon quietly wins. The holder is a
     column-flex item, so its automatic minimum size is its CONTENT's height
     -- and `.starimg` is `height: 100%` of a height the aspect-ratio has not
     resolved yet, which falls back to the image's own intrinsic height. A
     square star PNG makes that a no-op, which is why this hid for months; the
     segment cells' portrait art inflated the holder to 82x93 at 1400px and
     pushed the strat sub-line 12.09px BELOW the cell's gold border -- live
     report 2026-08-11, *"the text for the strategy 'Standard' displays
     underneath the quick selector card"*. Measured at 850/1200/1400: 69, 90
     and 93px tall inside an 82px-wide square. */
  .starholder { display: block; width: min(74px, 72%);
                aspect-ratio: 1 / 1; min-height: 0; flex: 0 0 auto;
                transition: transform .18s ease; }
  .starcell.active-star .starholder { transform: scale(1.16); }
  /* PNG star art (ui/assets/star_N.png). object-fit:contain honours the
     transparent top/bottom margin baked into the 256x256 art, so the star
     sits centered at its natural size. active = gold glow; idle = dimmed. */
  .starimg { display: block; width: 100%; height: 100%; object-fit: contain;
             -webkit-user-select: none; user-select: none; }
  /* Course split-icon mode (t.starIcons === "course"): opaque full-bleed
     100x100 screenshots, so round the corners (the drop-shadow glow follows
     the rounded clip) and inset slightly to match the generic star art's
     baked-in transparent margin. All state styling (dim / glow / bob) is
     shared with the generic art — same classes, same animations. */
  .starimg.courseicon { width: 92%; height: 92%; margin: 4%;
                        border-radius: 16%; object-fit: cover; }
  .starcell.active-star .starimg {
    filter: drop-shadow(0 0 6px rgba(255,215,95,.85)) drop-shadow(0 0 2px rgba(255,215,95,.9)); }
  .starimg.dim { opacity: .72; filter: saturate(.85); }
  /* min-height must cover the CLAMP plus the font's descenders, or the box is
     shorter than the two lines it promises to show and `overflow: hidden`
     shaves the bottom off the second one -- live report 2026-08-02 ("'Floating
     Isle' has the bottom shaved off... it presently reads like a bug"). It was
     2.1em against 2 x 1.12em of line boxes, so EVERY two-line name lost
     0.5-2.5px of ink at every width, measured. The cell is fixed-height and its
     children were already out of free space (the name is a flex item and was
     being shrunk to exactly this min-height), so the room comes from the
     selector cell's own bottom padding below -- clearance under the active
     star's glow is the ROW's 8px, not this. */
  .starname { font-size: clamp(.55rem, 1.31cqw, .8rem); font-weight: 600;
              line-height: 1.12; min-height: 2.45em;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; }
  .starcell.active-star .starname { color: #ffd75f; }
  /* flex-shrink: 0 is load-bearing, and it is the SAME shave .starname was
     fixed for on 2026-08-02 ("'Floating Isle' has the bottom shaved off"),
     one element further down. The cell is a fixed-height column flex
     container whose children overflow it, so every flex item is a shrink
     candidate -- and this one clips its own content. Measured at 1400px:
     the .strat line box is 16px inside a .starsub squeezed to 15.08px, so
     "Standard" lost the bottom of its descenders at every wide pane (live
     report 2026-08-10). A sub-line is one line by construction (.strat is
     nowrap+ellipsis), so refusing to shrink cannot cost height elsewhere. */
  .starsub { display: flex; align-items: center; gap: .28rem; justify-content: center;
             max-width: 100%; overflow: hidden; flex-shrink: 0; }
  /* the armed "running" chip rides the same sub row as the strat text —
     slimmed so it can't push past the cell's fixed height (it clipped at
     mid widths, harness 2026-07-24) */
  .starcell .chip { font-size: .66rem; line-height: 1.35; padding: .05rem .45rem;
                    white-space: nowrap; }
  .starsub .strat { color: #6c7686; font-size: clamp(.55rem, 1.21cqw, .74rem);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Below ~600px of pane the strat sub-line is unreadable — drop it, keep
     the star + medal + name (never the stars themselves: all 7 stay). */
  @container (max-width: 600px) {
    .selector-card .starsub { display: none; }
  }
  /* icon-picker modal grid (ui/components/iconpicker.js) */
  .icongrid { display: grid; gap: 8px; max-height: 55vh; overflow-y: auto;
              grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
              padding: 2px; }
  .icontile { display: flex; flex-direction: column; align-items: center;
              gap: 4px; padding: 6px 4px; cursor: pointer;
              border: 1px solid var(--border-soft); border-radius: 8px;
              background: none; color: var(--muted); font-size: .68rem; }
  .icontile img, .icontile-default { width: 48px; height: 48px;
              border-radius: 8px; object-fit: cover; }
  .icontile-default { display: flex; align-items: center; justify-content: center;
              font-size: 1.4rem; border: 1px dashed var(--border-soft); }
  .icontile:hover { background: #20242b; color: var(--text); }
  .icontile.on { border-color: var(--gold); color: var(--gold-soft); }
  /* segment editor's Icon row (ui/components/segments.js Builder) */
  .builder-icon { display: flex; align-items: center; gap: .6rem;
                  margin: .5rem 0; }
  .builder-icon .field-label { margin: 0; }
  .builder-icon-preview { width: 34px; height: 34px; border-radius: 8px;
                          object-fit: cover; }
  .builder-origin { display: flex; align-items: center; gap: .6rem;
                    margin: .5rem 0; }
  .builder-origin .field-label { margin: 0; }
  .builder-origin select { min-width: 0; max-width: 16rem; }
  /* Round 8: the Sheet Library link, same row shape as the origin above --
     flex-wrap so the linked-state meta line drops below at narrow panes
     instead of overflowing. */
  .builder-liblink { display: flex; align-items: center; flex-wrap: wrap;
                     gap: .6rem; margin: .5rem 0; }
  .builder-liblink .field-label { margin: 0; }
  .builder-liblink select { min-width: 0; max-width: 16rem; }
  /* Entity picker (spec 2026-07-25-entity-picker-icons). The trigger reads
     like the select it replaced; the dialog rows carry art. */
  .entity-trigger {
    display: inline-flex; align-items: center; gap: .45rem;
    min-height: 34px; min-width: 0; max-width: 100%;
    padding: .3rem .5rem; text-align: left;
  }
  .entity-trigger-label {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Fixed box: art loads asynchronously and some rows fall back to different
     art entirely, so the row must not reflow when an image resolves. */
  .entity-row-icon {
    width: 22px; height: 22px; flex: 0 0 22px;
    object-fit: contain; border-radius: 4px;
  }
  /* Grid picker (spec 2026-07-25-picker-grid-navigation). Cells are the
     practice banner's, so their internals are already styled by .starcell —
     only the LAYOUT belongs here. auto-fill + minmax keeps 25 courses on one
     screen without a scrollbar, which is the entire point of the redesign. */
  .entity-grid {
    display: grid; gap: .5rem;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    align-content: start;
  }
  .entity-grid .starcell { width: auto; min-width: 0; padding-block: .35rem; }
  /* The in-flow rank ROW stays hidden in the picker grid: it cost a line per
     grid row even for an unranked cell — 4 rows of it was most of the 94px
     that made the grid scroll on a 900px-tall window (live audit 2026-07-25).
     Grading a cell (task 4, 2026-07-25) does NOT pay that cost back — a
     course with two of seven stars practiced still renders five "–"
     placeholders — so the grade now draws as .starrank-badge, an
     out-of-flow corner badge over the art that renders nothing when a cell
     is unranked. This rule STAYS as a guard against a future call site
     restoring the scrolling row, not because nothing grades a cell here. */
  .entity-grid .starrank { display: none; }
  /* Rank badge (rankBadge=true — the picker grid only): a 16px Hat silhouette
     pinned to the art's corner instead of the banner's in-flow .starrank row
     (see the guard comment above). `.starcell` is already `position: relative`
     (`.editicon`, above, already depends on it), so this needs no new
     positioning context. Top-LEFT, not top-right, so it can never contest
     `.editicon`'s `top: 3px; right: 3px` — the picker passes no `onEdit` so
     the two never actually coexist today, but placing it opposite removes
     the question rather than relying on that. */
  .starrank-badge { position: absolute; top: 3px; left: 3px; }
  /* CAVEAT MARKS (components/marks.js) — "the time behind this rank does not
     mean what the rank implies". The CORNER BADGE, picked by the user from
     tools/mark_sheet.py's three candidates on 2026-08-01; the other two were
     deleted rather than left behind a flag.
     --caveat is its own hue on purpose: gold already means earned and coral
     already means failed, and a caveat is neither — the number is real, it
     just measures something other than what the reader assumes. */
  .caveat-badge {
    position: absolute; top: 3px; left: 3px; z-index: 2;
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid var(--caveat); color: var(--caveat);
    background: rgba(12,25,40,.92);
    font-size: .62rem; font-weight: 700; line-height: 1; cursor: help;
  }
  /* The picker grid already owns top-left with its rank badge, and passes no
     onEdit, so the caveat takes the corner the ✎ occupies on the banner. */
  .entity-grid .caveat-badge { left: auto; right: 3px; }
  .caveat-chip {
    display: inline-flex; align-items: center; gap: .22rem;
    margin-left: .35rem; padding: .04rem .38rem; border-radius: 999px;
    border: 1px solid var(--caveat); color: var(--caveat);
    background: rgba(224,162,74,.1);
    font-size: .66rem; font-weight: 700; line-height: 1.35;
    white-space: nowrap; cursor: help;
  }
  /* The PB VALUE itself stays green. The badge beside it is the whole mark --
     recolouring the number too would say the same thing twice, and green
     already means "this is your best", which the caveat does not dispute. */
  /* Save-as-PB, refused: a grab-timed star is a different QUANTITY, not a
     slow time, so the button stays in place wearing the reason instead of
     disappearing (a control that vanishes reads as a bug in the tool, not as
     a rule about the run). Dimmed rather than recoloured -- the caveat hue is
     already carrying the message on the chip inside it. */
  .attempt-actions button.pb-blocked {
    opacity: .5; cursor: not-allowed; border-style: dashed;
  }
  .attempt-actions button.pb-blocked .caveat-chip {
    cursor: not-allowed; margin-left: .3rem;
  }
  /* The mark beside a practice-log row's TIME keeps the glyph and drops the
     word at EVERY width, unlike the objective card's chip which only drops it
     under 793px. Two reasons, and the first is measured: at 1500px the two-
     column practice index gives this card a ~440px pane, and "! Grab-timed"
     wrapped the result cell to a second line -- which inside a fixed-height
     `overflow: hidden` card costs no visible width and clips the rows below
     it. The second is that the word is already on the row: a blocked
     Save-as-PB button sits four cells away wearing the same chip in full, so
     spelling it twice buys nothing. The sentence still answers a hover,
     because the title rides the CHIP rather than the word. */
  .attempt-result .caveat-chip { gap: 0; padding-inline: .3rem; }
  .attempt-result .caveat-chip-word { display: none; }
  /* The clear cell ("(any level)" etc.) emits null, restoring what the native
     <select>'s placeholder option did. Muted, so it reads as an escape hatch
     rather than a choice. */
  /* Its own cell, not a .starcell — it is not a star, and borrowing that
     class also dragged a domain word into a component the parity gate keeps
     domain-free. */
  .entity-clear {
    display: grid; align-content: center; justify-items: center; gap: .3rem;
    min-height: 92px; padding: .5rem .35rem; opacity: .72;
    background: rgba(8,20,34,.4); border: 1px dashed var(--border-soft);
    border-radius: 8px; color: var(--muted);
  }
  .entity-clear:hover { opacity: 1; color: var(--text); }
  .entity-clear-mark { font-size: 1.5rem; line-height: 1; }
  .entity-clear-label { font-size: .72rem; text-align: center; }
  /* .starname's font-size is a cqw clamp tuned for the banner's 7-across row;
     the modal has no container-type ancestor, so it would track the WINDOW
     while these cells stay a fixed width (review M6). Pin it. */
  .entity-grid .starname { font-size: .74rem; }
  /* The sub-line is a count on layer 1 and "segment" on layer 2 — useful, but
     it should not be as loud as the name. */
  .entity-grid .starsub { font-size: .68rem; opacity: .75; }
  .entity-section + .entity-section { margin-top: .8rem; }
  .entity-section-head {
    padding: .2rem .1rem .35rem; color: var(--muted);
    font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
  }
  .entity-back {
    display: inline-flex; align-items: center; gap: .3rem;
    margin-bottom: .6rem; padding: .25rem .5rem;
    background: transparent; border-color: var(--border-soft);
    color: var(--muted); font-size: .78rem;
  }
  .entity-back > .ui-icon { transform: rotate(90deg); }
  .entity-back:hover { color: var(--text); }
  /* The Library tab (Task 3, spec 2026-08-07-library-page). Its course and
     target grids are `.entity-grid` + `PracticeCell` — the picker's own
     geometry and cell, reused rather than restyled, because the request was
     literally "reuse the same exact design" (task-3-caveats.md point 1). Only
     the bits the picker has no equivalent for get their own rule here: the
     card frame is `.practice-card.workshop-card` (routes.js's own choice for
     a tab-level panel), so the two below are genuinely the whole addition. */
  .library-refresh-msg {
    margin: 0 0 .8rem; font-size: .82rem; color: var(--muted);
  }
  .library-refresh-msg.is-ok { color: var(--green); }
  .library-refresh-msg.is-error { color: var(--coral); }
  /* The index-load failure state (library.js) -- had no rule at all, so the
     message and Retry button were legible but unspaced (final review
     follow-up, minor). Its own `<p class="library-refresh-msg is-error">`
     already carries the bottom margin the message needs; this just keeps the
     button from hugging it. */
  .library-load-error { display: grid; gap: .4rem; margin: 0 0 .8rem; }
  .library-load-error .library-refresh-msg { margin: 0; }
  /* Task 6: the Study-in-Compare result summary (library.js's
     `StudyMessage`) -- up to TWO independent lines (a batch can both fail
     partially AND span more than one entity, fix round 1), so the outer
     `.library-study-msg` is a plain stack and each `.library-study-msg-line`
     carries its own colour; `.is-error` matches `.library-refresh-msg`'s own
     error treatment, a plain line (the mixed-entity note) stays `--muted` --
     it is information, not a failure. */
  .library-study-msg { display: grid; gap: .3rem; margin: 0 0 .8rem; }
  .library-study-msg-line { margin: 0; font-size: .82rem; color: var(--muted); }
  .library-study-msg-line.is-error { color: var(--coral); }
  .library-target-empty { color: var(--muted); }

  /* The target page itself (Task 4, librarytarget.js) -- progression-first:
     scrolling down a section IS the climb (bands run Capless -> Mario),
     and scrolling down the PAGE is the same climb one strategy at a time
     (sections run beginner -> expert, ui/components/librarymodel.js's
     `sectionOrder`). */
  .library-target-page { display: grid; gap: .7rem; }
  .library-target-header {
    display: flex; align-items: center; gap: .7rem; margin-bottom: .2rem;
  }
  .library-target-icon {
    width: 42px; height: 42px; object-fit: contain; flex: 0 0 auto;
  }
  .library-target-heading { display: grid; gap: .25rem; }
  .library-target-heading h3 { margin: 0; }
  .library-reminder-chip {
    display: inline-flex; align-items: center; gap: .3rem; width: fit-content;
    color: var(--gold-soft); border-color: #806d34;
  }

  .library-section {
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(7,18,30,.6); overflow: hidden;
  }
  .library-section + .library-section { margin-top: .6rem; }
  .library-section-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: .6rem; text-align: left; padding: .6rem .8rem;
    border: none; background: transparent; color: #dfe7ef;
  }
  .library-section-text { min-width: 0; display: grid; gap: .3rem; }
  .library-section-identity { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; }
  .library-section-name { font-weight: 700; }
  /* The owning target's own label, shown only when it differs from the
     approach name -- final review fix, ambiguous headers: several approaches
     across sibling targets share one bare name ("100 coin star Xcam" alone
     headed 6 real entity pages with no way to tell them apart). */
  .library-section-target { font-style: italic; }
  .library-section-facts { display: flex; flex-wrap: wrap; gap: .1rem .9rem; }
  .library-section-chevron {
    flex: 0 0 auto; color: var(--muted); transition: transform .15s ease;
  }
  .library-section.open .library-section-chevron { transform: rotate(180deg); }
  .library-your-standing { display: inline-flex; align-items: center; gap: .25rem; }
  .library-section-body {
    padding: 0 .8rem .8rem; display: grid; gap: .6rem;
  }
  .library-jp-toggle { width: fit-content; }

  /* Round 5 -- the link door: assigning a movement / subsection row to a
     segment the user built. One strip per linkable row; the menu replaces
     the strip in place (no overlay -- nothing else on the page moves). */
  .library-link-state {
    display: flex; align-items: center; flex-wrap: wrap; gap: .5rem;
    font-size: .82rem;
    /* The anchor for the menu overlay below -- the menu must not shift the
       page (his standing overlay ruling, 2026-07-26). */
    position: relative;
  }
  /* Round 9: the filterable popup is ONE component (searchselect.js) and
     these are its classes — only that module may render them. Overlaid
     (anchored on .library-link-state / .search-select), never in flow. */
  .search-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
    display: grid; gap: .45rem; padding: .55rem .65rem; min-width: 240px;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(7,18,30,.97);
    box-shadow: 0 10px 28px rgba(0,0,0,.5);
  }
  .search-menu-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: .6rem; font-weight: 700; font-size: .82rem;
  }
  .search-menu-filter {
    background: rgba(3,10,18,.8); border: 1px solid var(--border-soft);
    border-radius: 6px; color: inherit; padding: .3rem .5rem; font-size: .8rem;
  }
  .search-menu-options {
    display: grid; gap: .25rem; max-height: 14rem; overflow-y: auto;
  }
  .search-menu-group { display: grid; gap: .15rem; }
  .search-menu-group-head {
    font-weight: 700; font-size: .78rem; color: var(--gold-soft);
    padding: .25rem .2rem 0;
  }
  .search-menu-option {
    justify-content: flex-start; text-align: left;
    padding: .35rem .5rem; border-radius: 6px;
    border: 1px solid transparent; background: transparent; color: inherit;
    font-size: .82rem; cursor: pointer;
  }
  .search-menu-option:hover {
    border-color: var(--border-soft); background: rgba(20,36,54,.7);
  }
  .search-menu-error { color: var(--coral); font-size: .8rem; margin: 0; }
  .search-select { position: relative; display: inline-flex; }
  .search-select-trigger { display: inline-flex; align-items: center; gap: .4rem; }
  .search-select-value {
    max-width: 16rem; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Round 7: the whole-target door sits beside the page's own name. */
  .library-target-titleline {
    display: flex; align-items: center; flex-wrap: wrap; gap: .7rem;
  }
  .library-target-titleline h3 { margin: 0; }
  .library-link-state.is-linked { color: var(--gold-soft); }
  .library-link-state.is-linked b { font-weight: 700; }
  .library-link-button, .library-unlink {
    display: inline-flex; align-items: center; gap: .35rem;
  }
  .library-link-error { color: var(--coral); font-size: .8rem; margin: 0; }

  /* Round 5 -- the sheet's subsections, finally on the page: compact rows,
     one per piece, each carrying the same link door. */
  .library-pieces {
    display: grid; gap: .5rem; padding: .6rem .8rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(7,18,30,.6);
  }
  .library-pieces-head { margin: 0; font-size: .88rem; }
  .library-piece {
    display: grid; gap: .35rem; padding-top: .45rem;
    border-top: 1px solid var(--border-soft);
  }
  .library-piece-facts {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: .5rem;
  }
  .library-piece-name { font-weight: 700; font-size: .85rem; }
  /* A row fitted from ONLY one ROM's times, with too few of the other to earn
     a second ladder -- no toggle exists to carry the label the toggle button
     above would otherwise say, so this inert chip says it instead (final
     review fix, ladder_version read nowhere). */
  .library-ladder-version-chip {
    width: fit-content; color: var(--gold-soft); border-color: #806d34;
  }

  .library-toc { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .library-toc-row {
    cursor: pointer; border-top: 1px solid var(--border-soft);
  }
  .library-toc-row:hover { background: rgba(58,141,141,.1); }
  .library-toc-row td { padding: .35rem .5rem; }
  .library-toc-tier { display: flex; align-items: center; gap: .4rem; }
  .library-toc-you { color: var(--gold); font-weight: 600; }
  .library-toc-cutoff, .library-toc-count {
    text-align: right; font-variant-numeric: tabular-nums; color: var(--muted);
  }

  .library-band-head {
    display: flex; align-items: center; gap: .4rem; padding-top: .3rem;
    border-top: 2px solid var(--border-soft);
  }

  /* Subdivisions (round 1, 2026-08-07): each tier band splits into five
     collapsible subdivision groups, collapsed by default -- the browse
     surface is the header row (winged numbered cap, name, time bracket,
     count, YOU). Indented one level under the band head: child rows implying
     a parent/child relationship indent the child (the standing rule). */
  .library-division {
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(4,13,23,.35); margin: .35rem 0 .35rem .9rem;
  }
  .library-division-head {
    width: 100%; display: flex; align-items: center; gap: .55rem;
    padding: .45rem .65rem; border: none; background: transparent;
    color: #dfe7ef; cursor: pointer; text-align: left;
  }
  .library-division-head:hover { background: rgba(58,141,141,.08); }
  .library-division-label {
    display: inline-flex; align-items: center; gap: .4rem; font-weight: 600;
  }
  .library-division-count { margin-left: auto; flex: 0 0 auto; }
  .library-division-chevron {
    flex: 0 0 auto; color: var(--muted); transition: transform .15s ease;
  }
  .library-division.open .library-division-chevron { transform: rotate(180deg); }
  .library-division.is-empty {
    display: flex; align-items: center; gap: .55rem; padding: .45rem .65rem;
    opacity: .55;
  }
  .library-division.is-empty .library-division-count { margin-left: auto; }
  .library-division-body { padding: 0 .65rem .55rem; }

  /* Runs nobody filmed: compact rows, never video cards (round 1 -- 37,268
     of 44,701 entries carry no video; a play button on those is what "the
     videos don't load" turned out to be). */
  .library-plain-rows { display: flex; flex-wrap: wrap; gap: .35rem .5rem; margin-top: .45rem; }
  .library-plain-rows:empty { display: none; }
  .library-plain-entry {
    display: inline-flex; align-items: center; gap: .4rem; font-size: .82rem;
    padding: .18rem .55rem; border: 1px solid var(--border-soft);
    border-radius: 999px; background: rgba(4,13,23,.45);
  }
  .library-plain-time { font-variant-numeric: tabular-nums; color: var(--muted); }

  /* Video cards are sized to be WATCHED (round 1: "each grid element should
     be much bigger"; round 2 bounced 300px -- "still VERY hard to click on a
     video ... even bigger". A third bounce earns the tuning-page inspector,
     per the round-2 ledger). */
  .library-examples {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: .6rem; margin-top: .45rem;
  }
  .library-examples:empty { display: none; }
  .library-example {
    border: 1px solid var(--border-soft); border-radius: 7px; overflow: hidden;
    background: rgba(4,13,23,.55);
  }
  .library-example-media {
    position: relative; aspect-ratio: 16/9; background: #0a1119;
  }
  .library-example-media.is-clickable { cursor: pointer; }
  .library-example-media video { width: 100%; height: 100%; display: block; }
  .library-example-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* A YouTube thumbnail stacks over the always-rendered branded placeholder
     and removes itself on error, so a dead link degrades to the label
     instead of a black box (media is position: relative). */
  .library-example-thumb-img { position: absolute; inset: 0; }
  /* Round 2 ("VERY hard to click on a video"): a placeholder tile has to
     READ as a button, not a dark rectangle with a small glyph -- bigger
     glyph, brighter label, a hover tint on the clickable ones. */
  .library-example-placeholder {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: .4rem; color: #b9c6d4;
    text-decoration: none; transition: background .15s ease, color .15s ease;
  }
  .library-example-placeholder svg { width: 30px; height: 30px; }
  .library-example-placeholder.is-clickable:hover,
  a.library-example-placeholder:hover {
    background: rgba(58,141,141,.14); color: #dfe7ef;
  }
  .library-example-site { font-size: .85rem; font-weight: 600; }
  .library-example-external {
    position: absolute; right: 5px; bottom: 5px; padding: 3px;
    border-radius: 4px; background: rgba(4,13,23,.75); color: #dfe7ef;
  }
  .library-embed { width: 100%; height: 100%; border: 0; display: block; }
  /* First column is `auto`, sized by the icon's own `.rank-icon-slot` --
     the slot reserves the winged cap's spill, so the runner's name never
     sits against a wing (round 2 item 3; ui-ranks.md's spacing law). */
  .library-example-meta {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto 28px;
    align-items: center; gap: .45rem; padding: .45rem .55rem; font-size: .9rem;
  }
  .library-example-runner-wrap {
    min-width: 0; display: flex; align-items: center; gap: .3rem; overflow: hidden;
  }
  .library-example-runner {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .library-example-time {
    font-variant-numeric: tabular-nums; color: #dfe7ef; font-weight: 600;
  }
  .library-example-plus {
    width: 26px; height: 26px; min-height: 0; padding: 0;
    border-radius: 5px; font-weight: 700; line-height: 1;
  }
  .library-example-plus:disabled { opacity: .4; cursor: default; }

  /* The tray (Task 5, librarytray.js): chips docked under the header,
     wrapped in its own `Disclose` so arriving/leaving is a measured-height
     animation, never a pop. `.library-tray` is Disclose's CONTENT, not the
     thing that reserves layout height -- `.library-tray-disclose` is that. */
  .library-tray-disclose { margin-bottom: .2rem; }
  .library-tray {
    display: flex; flex-direction: column; gap: .5rem;
    padding: .55rem .7rem; border: 1px solid var(--border-soft);
    border-radius: 8px; background: rgba(7,18,30,.6);
  }
  .library-tray-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .library-tray-chip {
    display: flex; flex-direction: column; gap: 0;
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(4,13,23,.55); overflow: hidden;
  }
  .library-tray-chip-row {
    display: flex; align-items: center; gap: .35rem; padding: .3rem .45rem;
  }
  .library-tray-chip-thumb {
    width: 40px; height: 23px; object-fit: cover; border-radius: 4px;
    flex: 0 0 auto; background: #0a1119;
  }
  .library-tray-chip-nothumb { background: #0a1119; }
  .library-tray-chip-runner {
    max-width: 110px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: .78rem;
  }
  .library-tray-chip-time {
    font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .library-tray-chip-trim, .library-tray-chip-remove {
    width: 22px; height: 22px; min-height: 0; padding: 0; border-radius: 5px;
    flex: 0 0 auto;
  }
  .library-tray-chip-trim[aria-pressed="true"] {
    color: var(--gold); border-color: #806d34;
  }
  .library-tray-trim {
    display: flex; gap: .6rem; padding: 0 .45rem .45rem;
  }
  .library-tray-trim label {
    display: flex; flex-direction: column; gap: .12rem;
    font-size: .68rem; color: var(--muted);
  }
  .library-tray-trim input { width: 66px; }
  .library-tray-actions { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .library-tray-count { margin-right: auto; }
  /* Fix round 1: a disabled control's reason must be visible without a
     hover, never only in `title` (acceptance.md's "put the reason where the
     click lands" -- a disabled button cannot even receive the click that
     would land it). Always-rendered text, not a tooltip. */
  .library-tray-study-note { flex-basis: 100%; }

  /* The grid overlay (Task 5): a plain fixed backdrop rather than the shared
     `Modal` -- every existing Modal call site snaps open/closed with no
     transition, and this surface needed one (task-5-caveats.md point 5), so
     copying Modal's shell would have copied the thing it needed to NOT copy.
     `container-type` sits on the PANEL, not the page, because the panel is
     `position: fixed` and sized off the viewport (`min(94vw, …)`) -- gating
     `cols = min(cols, 2)` against `.view-pane` would measure a width the
     panel does not actually have (ui-core.md's responsiveness law, same
     trap in a new shape). */
  .library-grid-backdrop {
    position: fixed; inset: 0; z-index: 200; display: flex;
    align-items: center; justify-content: center; padding: 18px;
    background: rgba(1,7,14,.74); backdrop-filter: blur(5px);
  }
  .library-grid-panel {
    width: min(94vw, 1100px); max-height: 88vh; display: flex;
    flex-direction: column; overflow: hidden; container-type: inline-size;
    background: #0b1929; border: 1px solid #42617e; border-radius: 11px;
    box-shadow: 0 26px 90px rgba(0,0,0,.55);
  }
  .library-grid-head {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: .7rem; padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
  }
  .library-grid-head h3 { margin: 0; font-size: 1.05rem; color: var(--text); }
  .library-grid-head-actions { display: flex; align-items: center; gap: .5rem; }
  .library-grid-honesty {
    margin: .6rem 16px 0; font-size: .78rem; color: var(--muted);
  }
  .library-grid {
    flex: 1 1 auto; display: grid; gap: .8rem; padding: 16px; overflow: auto;
  }
  .library-grid.cols-1 { grid-template-columns: 1fr; }
  .library-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .library-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  /* Placed AFTER the base rules above on purpose (ui-core.md: same
     specificity, later wins) -- no !important needed to clamp the JS-picked
     `cols-3` back down when the PANEL itself (not the window) goes narrow. */
  @container (max-width: 620px) {
    .library-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
  }
  .library-grid-tile {
    border: 1px solid var(--border-soft); border-radius: 7px; overflow: hidden;
    background: rgba(4,13,23,.55);
  }
  .library-grid-tile-media { position: relative; aspect-ratio: 16/9; background: #0a1119; }
  .library-grid-tile-footer {
    display: flex; justify-content: space-between; gap: .4rem;
    padding: .35rem .5rem; font-size: .78rem;
  }
  .library-grid-tile-time { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Strategy step (picker layer 3, spec 2026-07-25-target-picker-strategy-
     step): the SAME auto-fill/minmax geometry as .entity-grid above, one
     column wider — a strat card carries a rank icon plus two lines of text
     where a bare star cell carries one. `.needs-strat` (below, the no-strat
     blink) is declared AFTER this block on purpose: same specificity, so its
     border-color/animation wins over this rule's plain border when both
     classes land on the same "No strategy" card. */
  .strat-grid {
    display: grid; gap: .5rem;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    align-content: start; margin-top: .4rem;
  }
  .strat-card {
    display: grid; justify-items: center; gap: .25rem; text-align: center;
    min-height: 108px; padding: .6rem .4rem;
    background: rgba(8,20,34,.4); border: 1px solid var(--border-soft);
    border-radius: 8px; color: var(--text);
  }
  .strat-card:hover { border-color: var(--gold); }
  .strat-card:disabled { opacity: .55; cursor: default; }
  .strat-rank-name { font-size: .72rem; color: var(--muted); }
  .strat-name { font-size: .82rem; font-weight: 600; }
  .strat-current { font-size: .68rem; color: var(--gold-soft); }
  .strat-pb { font-size: .7rem; }
  .starsub .strat.none { opacity: .6; }
  @media (prefers-reduced-motion: no-preference) {
    .starcell.active-star .starholder { animation: starbob 2.4s ease-in-out infinite; }
    @keyframes starbob { 0%, 100% { transform: scale(1.16) translateY(0); }
                         50% { transform: scale(1.16) translateY(-3px); } }
    /* the rank medal bobs in sync with the active star */
    .starcell.active-star .starrank { animation: rankbob 2.4s ease-in-out infinite; }
    @keyframes rankbob { 0%, 100% { transform: translateY(0); }
                         50% { transform: translateY(-3px); } }
  }
  .segrow { display: flex; gap: .5rem; align-items: center; border: 1px solid #2c3140; border-radius: 8px; padding: .4rem .6rem; margin-bottom: .4rem; }
  .segsection { border: 1px solid #2c3140; border-radius: 8px; padding: .45rem .55rem; margin: .5rem 0; }
  .seghead { padding: .2rem .5rem; border-radius: 5px; margin-bottom: .3rem; font-size: .9em; }
  /* muted section identities: start=green, end=red, guards=orange */
  .seg-start { border-color: #2f4a38; } .seg-start .seghead { background: #16291c; color: #8fce9f; }
  .seg-end { border-color: #4a2f2f; } .seg-end .seghead { background: #291616; color: #ce8f8f; }
  .seg-guard { border-color: #4a3c2a; } .seg-guard .seghead { background: #292016; color: #cead7f; }
  .segclause { display: flex; flex-wrap: wrap; gap: .4rem; margin: .3rem 0; align-items: center; padding: .3rem .45rem; border-radius: 6px; }
  /* min-width:0 required: flex min-width:auto = min-content, so a wide level
     name punches through the pane with max-width alone. flex-basis 12rem gives
     the common names ("Bowser in the Dark World") room to render in full
     instead of ellipsising at every width, and the row wraps rather than
     squeezing them (live audit 2026-07-25). */
  .segclause select {
    max-width: 100%;
    flex: 1 1 12rem;
    /* min(12rem, 100%), not 0: the floor is what makes the ROW WRAP instead of
       squeezing three selects into one line and ellipsising all of them. It
       yields to the container below 12rem, so a narrow pane still never gets a
       horizontal scrollbar — plain min-width:12rem would reintroduce exactly
       that bug. */
    min-width: min(12rem, 100%);
  }
  .segword { color: #6c7686; font-size: .85em; }
  /* one tint per alternative clause (cycling): new color = new condition */
  .tint0 { background: #161d2b; border-left: 3px solid #4a6fa5; }
  .tint1 { background: #16241c; border-left: 3px solid #3f8a5f; }
  .tint2 { background: #221a2b; border-left: 3px solid #7e5fa5; }
  .tint3 { background: #281f14; border-left: 3px solid #a5823f; }
  .segbuilder { border: 1px solid #3a4150; border-radius: 8px; padding: .6rem; margin-top: .6rem; }
  .routebuilder { border: 1px solid #3a4150; border-radius: 8px; padding: .6rem; margin: .6rem 0; }
  .routestep { border: 1px solid #2c3140; border-radius: 8px; padding: .4rem .55rem; margin: .4rem 0; }
  .routestep.routebroken { border-color: #4a2f2f; }
  .routestep-head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .routestep-foot { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .35rem; }
  .routenum { color: #6c7686; }
  .routecands { display: flex; flex-wrap: wrap; gap: .35rem; margin: .3rem 0; }
  .routepick { display: inline-flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
  .routeadd { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .4rem; }
  .routestart { margin: .5rem 0; }
  .candx { border: none; background: transparent; color: #e0a3a3; padding: 0 0 0 .25rem; cursor: pointer; }
  .routeio { border: 1px solid #2c3140; border-radius: 8px; padding: .6rem; margin-top: .8rem; display: flex; flex-direction: column; gap: .6rem; }
  .routejson { width: 100%; min-height: 5rem; font: inherit; background: #1b1e24; color: #d8dee9; border: 1px solid #3a4150; border-radius: 4px; }
  .active-tag { color: #e0c36a; font-size: .7em; letter-spacing: 1px; margin-bottom: .2rem; }
  .listhead { letter-spacing: 1px; text-transform: uppercase; font-size: .7em; margin: .2rem 0 .4rem; }
  .shead { display: flex; flex-wrap: wrap; gap: .6rem; align-items: baseline; }
  .shead b { color: #ffd75f; }
  .meta { color: #6c7686; font-size: .85em; }
  .pbtag { color: #a3e0a3; margin-left: auto; }
  .pblink { color: inherit; text-decoration: underline; cursor: pointer; }
  .pblink:hover { color: #c9f5c9; }
  table { width: 100%; border-collapse: collapse; margin: .4rem 0; font-size: .92em; }
  td { padding: .15rem .45rem; border-bottom: 1px dotted #2c3140; }
  .good { color: #a3e0a3; } .badx { color: #e0a3a3; } .cleared { opacity: .45; text-decoration: line-through; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; }
  .chip { border: 1px solid #3a4150; border-radius: 999px; padding: .05rem .6rem; font-size: .85em; }
  /* The Stats trigger (practice.js::StatMenuTrigger, in the practice-log
     card's header since 2026-07-28) keeps the same pill language as every
     value chip it configures, plus the affordances a <button> needs that a
     <span> chip doesn't: a pointer cursor and a hover border. */
  .chip-button {
    display: inline-flex; align-items: center; gap: .3rem;
    background: transparent; color: inherit; cursor: pointer;
  }
  .chip-button:hover { border-color: var(--blue); }
  .delta-up { color: #e0a3a3; } .delta-down { color: #a3e0a3; }

  /* narrow screens: the responsive Compare rules live BELOW the base ones —
     see "Compare, narrow pane" further down. They were briefly up here, where
     the old @media block sat, and lost to `.compare-transport
     .primary-transport` at line ~2700 on source order alone: same specificity
     (0,2,0), later rule wins, so the button kept its 92px and the sweep kept
     reporting the same overlap through a fix that looked correct. */

  /* ---------------------------------------------------------------------
     Practice Index shell — calm observatory, fixed live-state tracks
     --------------------------------------------------------------------- */
  :root {
    color-scheme: dark;
    --bg: #07111e;
    --bg-deep: #050c16;
    --surface: #0c1928;
    --surface-2: #101f31;
    --surface-3: #14263a;
    --border: #294058;
    --border-soft: #1d3147;
    --text: #eef2f6;
    --muted: #8fa0b5;
    --muted-2: #66778d;
    --gold: #f0bd32;
    --gold-soft: #ffd96a;
    --blue: #68adf2;
    --green: #91e5a2;
    --coral: #ff7b73;
    /* Sixth accent, added 2026-08-03 for the standards table's exit-star
       bands: a course can have six exit stars, and the five accents above
       run out at five. Nebula violet, so it sits inside the observatory
       palette rather than beside it. Deliberately NOT a teal -- #3a8d8d is
       the active-column ring two rules down in .stdtable. */
    --violet: #b48bf0;
    --caveat: #e0a24a;
    --sidebar-wide: 206px;
    --sidebar-rail: 76px;
    /* Selector-card slot height. cqw resolves against .practice-page
       (container-type: inline-size) AT USE TIME, so the card shrinks with
       the pane: 230px while all 7 full-size star cells fit (pane >= ~980px),
       then tracking the cqw-scaled cell content below that. Width-driven
       ONLY — every banner mode (stars/bowser/arena/castle) gets the same
       height at a given pane width, so live mode swaps never move layout
       (OBS stability). */
    --selector-height: clamp(152px, calc(98px + 13.8cqw), 230px);
    /* MEASURED, not chosen. The Active Target card is a hard height on purpose
       -- the user streams it in OBS and a card that reflowed mid-run would
       shift their capture -- but the VALUE must come from what the content
       needs, not from a guess. The previous 258px was set before the card grew
       a second rank banner, the moved-in strategy picker and the target-pick
       eyebrow, and it clipped the "Ready" row by 21px at every width at or
       below 760 (live report + sweep, 2026-07-28).

       "No card on the PAGE" is the load-bearing part. The Practice page
       renders an .objective-card per index item as well as the active-target
       one, and in a fixture with no target selected the FIRST one is empty --
       no rank banners, 222px. Measuring `querySelector(".objective-card")`
       therefore answered 194px, twice, while the sweep kept failing at 277:
       the probe was measuring a different element than the defect. Any
       re-measure has to take the MAX over all of them.

       347px, measured 2026-07-29 across 320..790. That is 288 + 39 + 20: the
       39 was already owed (see below), and the 20 is the widened gap between
       two STACKED rank washes, which is real space that has to exist. Note
       the 190px band above 800px absorbed the same 20px without moving,
       because the card there had exactly that much slack.

       The 39: a flat shortfall at EVERY width in the band. Not a regression:
       288 was itself measured, honestly, against a card the fixture could only
       render as "Nothing to practice here". Once the fixture could stand in a
       stage and hold a target with a strategy and a PB (ui_fixture's `stage=`
       and `target=`), the card grew its full rank display, the strategy select
       and the PB tag it always had in the real app -- and the constant
       measured off the empty state was 39px short of holding them. Every
       number in this block is only as good as the state the fixture reached;
       re-measure after any change to what the card can contain.

       Re-measured again 2026-07-29 (final review of spec 2026-07-28-multi-
       step-segments, finding 2) against the state that review flagged as
       unreached: `.seg-waiting`, the third row an ARMED segment adds below
       the metrics row (sec.armed_detail non-null). Neither this fixture nor
       the sweep could reach it before -- `ui_fixture.py`'s `arm_segment=`
       arms a real segment alongside the star target so both cards exist on
       one page, matching the max-over-every-card rule above. That round
       measured 327px as sufficient and said so here -- which then read as a
       contradiction against the 347px declared two lines down, because the
       two numbers came from different places: 327 was this branch measuring
       a ONE-banner armed card, 347 was main's own independent +20 for the
       widened stacked-wash gap. Both were right; neither said which state it
       had seen. Hence this paragraph.

       Where it stands 2026-07-29, after the main merge:
         - the armed segment is now a TWO-banner definition (ui_fixture's
           FIXTURE_SEGMENT), because a one-strategy entity collapses its two
           measures into a single banner and the crowded layout stops
           existing -- the same hole main closed for the star card;
         - this band is `@container (max-width: 700px)`, and main made 850px
           the supported minimum. At 850 the pane is ~774px (850 less the
           76px rail), so **this block is not reached at any supported
           width** -- it is graceful degradation for a narrower browser, not
           a shipped layout. `measure_objective_card.py` filters its widths
           by `PROJECT.min_viewport_width` for exactly that reason: measured
           below the floor, the two-banner card wants 360px here, and
           chasing that would grow a fixed-height card for widths nothing
           claims.
       So 347px stands, unmeasured against the two-banner card ON PURPOSE.
       If the supported floor ever drops below ~790px viewport, this number
       becomes live again and must be re-measured first.

       CARRIED CONCERN (2026-08-04, amendment A8): `tools/measure_objective_
       card.py` is deleted along with it -- the real practice page never
       renders `.objective-card` any more, so that tool's whole premise (a
       populated Active Target card reachable via `tools/ui_fixture.py`) no
       longer holds. This class and its CSS survive only because `ui/tune.js`
       still builds a REPLICA card out of them for the climb inspector
       (`.claude/rules/ui-climb.md`'s "KNOWN GAP" paragraph). A future
       re-measure has no tool to run and would need one built against that
       replica instead -- not done here, since the number this round would
       need to re-derive it for (a narrower supported floor) has not moved. */
    --objective-card-narrow: 347px;
    --radius: 9px;
  }
  * { box-sizing: border-box; }
  html, body, #app { min-height: 100%; max-width: 100%; overflow-x: hidden; }
  /* Reserve the scrollbar's width whether or not one is showing, so a pane
     that grows past the fold can never shove the whole layout sideways (live
     audit 2026-07-25: opening a library group shifted the entire page). This
     is the belt to the viewport-bounded panes' braces — those stop the page
     from scrolling at all, this stops the SHIFT if anything ever does. */
  html { scrollbar-gutter: stable; }
  /* `color-scheme: dark` is set and still leaves Chromium drawing the OS's
     LIGHT scrollbar over this shell (verified Chrome 150, 2026-07-25) — a
     pale grey bar down a navy pane. Name the colours instead; scrollbar-color
     inherits, so one declaration covers every scroller in the page. A native
     <select> popup is NOT in the page and keeps its own. */
  html { scrollbar-color: #33506e transparent; }
  body {
    max-width: none; margin: 0; padding: 0; min-width: 320px;
    font-family: "Segoe UI Variable", "Aptos", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 91% 8%, rgba(91,147,205,.08), transparent 25rem),
      radial-gradient(circle at 20% 92%, rgba(50,104,160,.06), transparent 30rem),
      var(--bg-deep);
    color: var(--text);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .28;
    background-image:
      radial-gradient(circle at 8% 18%, #b9d9ff 0 1px, transparent 1.4px),
      radial-gradient(circle at 72% 12%, #fff4c3 0 1px, transparent 1.3px),
      radial-gradient(circle at 94% 63%, #b9d9ff 0 1px, transparent 1.4px),
      radial-gradient(circle at 34% 87%, #b9d9ff 0 1px, transparent 1.3px);
    background-size: 320px 280px, 410px 350px, 370px 300px, 460px 390px;
  }
  /* There is deliberately NO app-wide rank tint. One shipped on
     2026-07-28 (a `body::after` layer worn at rest) and was deleted the
     same day: "It should NOT be tinted by default. It should only tint
     during the animation. Default background color. During animation,
     default color -> current rank color -> colors we're ranking up to ->
     back to default" (user). `.marelo-celebrate-backdrop` already IS that
     sequence and is the only thing that tints the page. The resting layer
     was also invisible whenever it would have mattered most: the backdrop
     is `z-index: 210` and the ambient pseudo-element declared none. */
  button, select, input, textarea { font: inherit; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: .42rem;
    min-height: 34px; padding: .36rem .66rem; border-radius: 6px;
    border: 1px solid #344b64; background: #142338; color: var(--text);
  }
  button:hover { background: #1a2d45; border-color: #496784; }
  button:disabled { opacity: .48; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible,
  summary:focus-visible, a:focus-visible {
    outline: 2px solid #78b9ff; outline-offset: 2px;
  }
  select, input, textarea {
    border-color: #344b64; background: #0d1928; color: var(--text);
    min-height: 34px; padding: .32rem .5rem;
  }
  /* A <select>'s own dropdown arrow is drawn INSIDE its padding box, so with
     symmetric padding a long option runs underneath it — "Bowser in the Dark
     Worl⌄", clipped mid-word with the caret on top (live audit 2026-07-25).
     Reserve the arrow's lane on the right and ellipsise instead of clipping,
     so a name that does not fit ends in "…" clear of the caret. */
  select {
    padding-right: 1.6rem;
    text-overflow: ellipsis;
  }
  /* Native <select> popup lists. Chromium themes the popup off the SELECT's
     own background — a transparent select gave a white popup with inherited
     light text (2026-07-25), and the fix then was to colour the options.
     That fix is what made the HIGHLIGHTED row unreadable: Chromium paints it
     light-blue and picks dark text for it, but only when the author has not
     named a colour; ours survived into that row, light on light (live audit
     2026-07-25). So: set the row background — that is what makes the list
     navy rather than Chromium's grey — and NEVER the text colour, which is
     the browser's to choose per row. Every select must therefore keep an
     opaque dark background of its own; the two that look transparent
     (.context-select, .sort-control) do it without going transparent. */
  option { background-color: #0d1928; }
  a { color: #79bafc; }
  h2, h3, h4, p { margin-top: 0; }
  h2 { font-size: 1.2rem; margin-bottom: 0; }
  h3 { font-size: 1.02rem; margin-bottom: 0; }
  h4 { font-size: .82rem; font-weight: 600; margin: 0 0 .3rem; color: #dbe4ee; }
  .ui-icon { display: block; flex: 0 0 auto; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .eyebrow, .field-label, .context-label {
    color: var(--muted); font-size: .69rem; font-weight: 650;
    letter-spacing: .075em; text-transform: uppercase;
  }
  .meta { color: var(--muted); }
  .app-shell {
    position: relative; z-index: 1; min-height: 100vh;
    display: grid; grid-template-columns: var(--sidebar-wide) minmax(0, 1fr);
  }
  /* A transient "the server said no" line (store.js `notice`). Fixed and
     out of flow, so raising one never moves the thing the pointer is aimed at
     — the same reason the selection bar is overlaid rather than inserted. */
  .app-notice {
    position: fixed; z-index: 60; left: 50%; bottom: 22px;
    transform: translateX(-50%); max-width: min(56ch, calc(100vw - 32px));
    padding: .55rem .9rem; border-radius: 10px;
    border: 1px solid rgba(240,189,50,.42); background: rgba(18,26,45,.96);
    color: var(--text); font-size: .85rem; line-height: 1.35;
    box-shadow: 0 8px 26px rgba(0,0,0,.45);
    animation: app-notice-in 200ms ease both;
  }
  @keyframes app-notice-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .app-notice { animation: none; }
  }
  .app-sidebar {
    position: sticky; z-index: 10; top: 0; height: 100vh; min-height: 560px;
    display: flex; flex-direction: column; padding: 14px 12px 12px;
    background: linear-gradient(180deg, #10243a 0%, #0b1b2c 56%, #091625 100%);
    border-right: 1px solid var(--border);
  }
  .app-brand {
    display: flex; align-items: center; gap: .6rem; min-height: 70px;
    padding: 0 .3rem .55rem;
  }
  .app-brand img { width: 67px; height: 58px; object-fit: contain; }
  .app-brand span { font-weight: 750; line-height: 1.15; }
  /* The nav never scrolls internally (a scrollbar beside a 7-item list read
     as broken, 2026-07-24) — it takes its natural height, and short windows
     compress spacing instead (see the max-height media query below). */
  .sidebar-nav { flex: 0 0 auto; }
  .nav-group { padding: .62rem 0; border-bottom: 1px solid rgba(77,105,134,.34); }
  .nav-group:last-child { border-bottom: 0; }
  .nav-group-label {
    padding: 0 .66rem .32rem; color: #9cadc0; font-size: .67rem;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .nav-item {
    width: 100%; min-height: 42px; justify-content: flex-start;
    padding: .5rem .65rem; border-color: transparent; background: transparent;
    color: #dce5ee; white-space: nowrap;
  }
  .nav-item:hover { background: rgba(105,151,204,.12); border-color: transparent; }
  .nav-item.on {
    color: #fff; background: rgba(111,161,218,.22);
    box-shadow: inset 3px 0 0 #76b5f5;
  }
  .sidebar-footer { margin-top: auto; display: grid; gap: .55rem; padding-top: .5rem; }
  .settings-link { border-top: 1px solid rgba(77,105,134,.34); border-radius: 0; }
  .sidebar-status {
    display: grid; gap: .55rem; padding: .68rem .7rem;
    border: 1px solid var(--border); border-radius: 7px;
    background: rgba(8,20,33,.58);
  }
  .connection-line {
    display: grid; grid-template-columns: 9px 1fr; column-gap: .5rem; align-items: center;
  }
  .status-light { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
  .connection-line.is-live .status-light { background: var(--green); }
  .status-main { color: var(--green); font-weight: 700; font-size: .78rem; text-transform: uppercase; }
  .connection-line.is-warn .status-main { color: var(--coral); }
  .status-sub { grid-column: 2; color: var(--muted); font-size: .68rem; }
  .recording-status { min-width: 0; border-top: 1px solid var(--border-soft); padding-top: .5rem; }
  .recording-status > span, .recording-status .dot {
    display: block; max-width: 100%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; background: transparent; padding: 0; font-size: .73rem;
  }
  .recording-status .ok { color: var(--coral); }
  .recording-status .bad { color: var(--muted); }
  .app-main { min-width: 0; max-width: 100%; overflow-x: hidden; }
  .context-shell {
    position: sticky; top: 0; z-index: 24; padding: 14px 0 8px;
    background: linear-gradient(180deg, rgba(5,12,22,.98) 70%, rgba(5,12,22,.82));
  }
  /* THREE columns since 2026-08-08: session / route rank card / Grading. The
     Clock card's column went to the rank card when its select moved into the
     settings drawer (user: the default is always Usamune IGT, so a control
     nobody changes should not spend a column) -- the rank card's fr is the
     sum of its old share and the clock's, so the neighbours keep their
     proportions. */
  .context-bar {
    min-height: 56px; display: grid;
    grid-template-columns: minmax(170px,.75fr) minmax(250px,2.35fr)
                           minmax(140px,.7fr);
    gap: 10px; width: calc(100% - 28px); max-width: 1472px; margin: 0 auto;
  }
  .context-control {
    position: relative;
    min-width: 0; min-height: 54px; display: flex; align-items: center; gap: .65rem;
    padding: .42rem .75rem; border: 1px solid var(--border);
    border-radius: 7px; background: rgba(11,25,41,.92); color: var(--text);
  }
  button.context-control { justify-content: flex-start; text-align: left; }
  .context-control-copy { min-width: 0; flex: 1; display: grid; gap: 1px; }
  /* THE whole card is the control. The practice-target card highlighted and
     opened from anywhere because it IS a <button>; the select cards only
     reacted on the select itself, and the mismatch read as a bug (user,
     2026-07-25). Fix: stretch the native <select> over the entire card and
     hide it — the dropdown is still the browser's, anchored to the card, and
     the value + chevron under it are drawn by header.js.
     Hidden with OPACITY, not with transparent colours: Chromium themes the
     popup off the select's computed background, so a transparent one gets a
     white popup (see the `option` rule above). At opacity 0 the select keeps
     the shell's opaque dark background — invisible on the card, correctly
     dark in the list. */
  .context-select > select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; padding: 0; min-height: 0; border: 0; cursor: pointer;
    appearance: none; opacity: 0;
  }
  /* Round 10: the rank card's picker is the filterable popup, so its
     whole-card hit target is a stretched invisible BUTTON instead of a
     stretched invisible select -- same mechanism, same rules. */
  .context-select > .context-card-trigger {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; padding: 0; min-height: 0; border: 0; cursor: pointer;
    background: transparent; opacity: 0;
  }
  /* An opacity-0 element cannot show its own focus ring, so the card wears
     it — :has(:focus-visible), not :focus-within, so a mouse click does not
     leave a ring behind the way it would on a plain focus. */
  .context-select:has(> select:focus-visible),
  .context-select:has(> .context-card-trigger:focus-visible) {
    outline: 2px solid #78b9ff; outline-offset: 2px;
  }
  .context-select, button.context-control:not(:disabled) { cursor: pointer; }
  .context-select:hover, button.context-control:not(:disabled):hover {
    background: #1a2d45; border-color: #496784;
  }
  /* A card that cannot be opened must not offer the hover of one that can
     (the base button:hover would otherwise still fire while v is loading). */
  button.context-control:disabled:hover {
    background: rgba(11,25,41,.92); border-color: var(--border);
  }
  .context-value {
    display: block; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 650;
  }
  /* Slot 2 of the context bar: the route rank card, which took the space the
     deleted PRACTICE TARGET card used to hold (2026-07-26 — header.js carries
     the why). container-type: inline-size is what the card's own @container
     rules measure against (the sidebar's 1180px step means this column's
     width is not monotonic in window width). */
  .marelo-slot { min-width: 0; display: grid; container-type: inline-size; }
  .workspace {
    width: 100%; max-width: 1500px; min-width: 0; margin: 0 auto;
    padding: 4px 14px 28px; overflow-x: hidden;
  }
  .view-pane, .practice-page { min-width: 0; max-width: 100%; }
  /* Every page gets a size container, not just Practice.
     ------------------------------------------------------------------
     `.practice-page` has declared `container-type: inline-size` since the
     rank-banner fix; the other five pages (Run, Compare, Routes, Segments,
     Live feed) had none, so their layout had no choice but to key on the
     viewport -- which in this shell is the wrong signal, because the sidebar
     steps make pane width non-monotonic in window width (1181px window -> a
     932px pane; 1180px window -> 1061px).

     inline-size only: the block axis is untouched, so nothing that depends on
     content height changes. Note the containment this imposes means a child
     cannot measure the container with cqw and BE the thing that sizes it --
     which is why the star row's cqw units still resolve against
     `.practice-page` (its own nearer container), not this one. */
  .view-pane { container-type: inline-size; }
  /* Used by the Rank tab's scope picker (components/rankpage.js). It was
     shared with the practice toolbar's route select until 2026-07-28;
     the toolbar is gone (its route pick moved onto the header's route
     rank card) but this class outlived it, so the rule stays. Deleting
     it with the toolbar silently unstyled the Rank tab -- caught only at
     merge time, because no test on either branch rendered that picker. */
  .route-focus-control {
    display: flex; align-items: center; gap: .5rem; min-width: 230px;
  }
  .route-focus-control select { min-width: 150px; }
  .mobile-appbar, .mobile-nav, .mobile-more-backdrop { display: none; }
  /* THE size container all selector cqw units + @container rules resolve
     against — the pane the star row must fit inside. inline-size only, so
     normal height flow is untouched. */
  .practice-page { display: grid; gap: 12px; container-type: inline-size; }
  .practice-card {
    min-width: 0; max-width: 100%; margin: 0; padding: 14px 16px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(14,30,48,.98), rgba(10,24,39,.98));
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
  }
  /* Out of flow, anchored under the Stats trigger: as a grid child of
     .practice-page it added a row and shifted every card 12px on open. The
     trigger now lives in the practice-log card's header (2026-07-28, moved
     again — "the stats button... inside the practice log, to the left of the
     sort filter"). That card (`.log-list-card`) is variable-height and does
     NOT clip its overflow (Task 7: the log is the page's one variable-height
     surface by design, and a rank banner's wing paints outside its own box),
     unlike `.analysis-card`/`.objective-card` — but `fixed` positioning is
     still right here regardless of which kind of card hosts the trigger:
     `absolute` would still track the card's own scroll/growth for no reason
     the popover needs. `fixed`, with top/right set inline off the trigger's
     own measured rect (practice.js::StatMenuTrigger) — escapes any ancestor
     entirely, since nothing between the trigger and the viewport declares a
     transform/filter/perspective/contain that would trap it back inside. */
  .stats-popover { position: fixed; z-index: 30; }
  /* Stats menu: the only popover still on the legacy grey .popover base —
     pull it onto the same navy language as the replay-settings popover so the
     stat picker matches the rest of the shell (statmenu.js renders a bare
     .popover, so this is scoped CSS only, no component change). */
  .stats-popover > .popover {
    position: static; min-width: 208px; padding: .45rem;
    border-color: #42617e; background: #0b1929;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .stats-popover .popover label {
    display: flex !important; align-items: center; gap: .5rem;
    padding: .28rem .45rem; border-radius: 6px; font-size: .82rem; cursor: pointer;
  }
  .stats-popover .popover label:hover { background: rgba(105,151,204,.12); }
  .stats-popover .popover input[type="checkbox"] { min-height: 0; accent-color: var(--blue); }
  .stats-popover .popover > div:last-child {
    display: flex; gap: .5rem; justify-content: flex-end;
    margin-top: .5rem !important; padding-top: .5rem;
    border-top: 1px solid var(--border-soft);
  }
  .stats-popover .popover > div:last-child button:first-child {
    color: #1b1607; background: var(--gold); border-color: var(--gold-soft); font-weight: 700;
  }
  .selector-card {
    height: var(--selector-height); min-height: var(--selector-height);
    overflow: hidden; border-color: #315779; padding: 14px 16px 12px;
  }
  .selector-card .shead { min-height: 30px; align-items: center; }
  .selector-card .shead b { color: var(--text); font-size: 1.06rem; }
  /* 58 = card padding (14 + 12) + .shead's 30px min-height + the card's own
     1px top and bottom BORDER. That last term was missing until 2026-08-10
     and cost exactly 2px at every width -- `--selector-height` sets a
     border-box height, so a subtraction that counts only padding leaves the
     row 2px too tall for the space it is given. The sweep had been carrying
     it as 78 exempted "scrollHeight 222 > clientHeight 220" rows rather than
     as a bug; it is what left the strat sub-line with no slack of its own. */
  /* The row's bottom padding sits OUTSIDE each cell's border, so 6px of it
     was clearance nobody could see under a gold box whose own text was
     touching the edge. 8px -> 2px hands those 6px to the CELLS, which is the
     only lever that moves the sub-line inside (a cell's own bottom padding
     cannot: its column already overflows, see below). The row is border-box,
     so nothing else on the page moves -- measured, the cell's bottom goes
     from 8px inside the row to 2px, clearance under the strat line goes from
     -1.36/-12.09 to +4.64, and the active art still clears the card's bottom
     by 81-95px at every width, so the glow this padding is named for was
     never the thing using it. */
  .selector-card .starrow {
    height: calc(var(--selector-height) - 58px); align-items: stretch;
    gap: clamp(3px, .82cqw, 8px); margin: 0; padding: 4px 1px 2px;
    /* MUTATION TARGET for tests/test_selector_strat_line_fits.py: restore
       the 8px and the inside-the-cell guard goes red. */
  }
  .selector-card .starcell {
    flex: 1 1 0; min-width: 0; height: 100%;
    /* bottom padding pays for .starname's descender room (see its rule). It
       does NOT buy the strat sub-line its clearance and raising it cannot:
       the column already overflows this box, so a bottom padding reserves
       space nothing is laid out in -- measured identical at .1rem and .4rem,
       to the hundredth of a pixel, at all five widths. The row's padding
       above is the only lever, because it changes the cell's HEIGHT. */
    justify-content: flex-start; padding: .35rem .15rem .1rem;
  }
  .selector-card .starholder { width: min(82px, 8.4cqw); }
  /* segment rows (bowser/arena/castle): 1-3 cells, each pinned to the width
     a 7-cell star row would give it (100cqw card - 32px card padding - 6
     gaps ~ 48px), so the two row kinds have identical cell geometry at
     every pane width instead of a lone cell stretching across the card */
  .selector-card .starrow.segcells { justify-content: flex-start; }
  .selector-card .starrow.segcells .starcell {
    flex: 0 1 auto; width: calc((100cqw - 80px) / 7);
  }
  .selector-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: .5rem;
  }
  .selector-empty-symbol { color: var(--muted); font-size: 2.8rem; line-height: 1; }
  .selector-empty b { display: block; margin-bottom: .25rem; }
  .selector-empty .meta { display: block; }
  .practice-detail-grid {
    display: grid; grid-template-columns: minmax(330px,.9fr) minmax(520px,1.35fr);
    gap: 12px; min-width: 0;
  }
  .objective-card {
    /* Third row is the segment card's "waiting for" line (Task 6, spec
       2026-07-28-multi-step-segments) -- "auto" and simply collapses to 0
       when absent (idle segment, or a star, which never renders one), so
       ONE height budget serves every state without a resize when a segment
       arms/disarms (OBS-stable slot). Bumped from 122px (+28) for the room;
       a star card or an unarmed segment just gets a taller, still-centered
       metrics row instead of an ugly gap -- measured by CDP geometry diff,
       see task-6-report.md. */
    grid-column: 1 / -1; height: 150px; min-height: 150px; overflow: visible;
    display: grid; grid-template-rows: auto 1fr auto; padding-block: 12px;
  }
  .objective-card.active-star { border-color: rgba(240,189,50,.72); }
  /* `.step-row` is the LAYOUT (shared by the practice card's armed row and the
     segment editor's Then picker); `.seg-waiting` is the practice card's own
     spacing on top of it, and stays a distinct class because index.html keys
     real rules off `.objective-card:has(.seg-waiting)` — a picker inside a
     modal wearing that class would be claiming to be the card's armed row. */
  .step-row {
    display: flex; align-items: baseline; gap: .5rem; min-width: 0;
    font-size: .8rem; color: var(--muted);
  }
  .seg-waiting { margin-top: .4rem; }
  .seg-waiting-step {
    flex: none; color: var(--text); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .seg-waiting-for {
    min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* The step track: the whole route on ONE line, never two. `.objective-card`
     is fixed-height, so a track that wrapped would not grow the card -- it
     would push its own siblings out under `overflow: hidden`, which looks
     like nothing at all until a row silently disappears. The chips shrink
     (min-width: 0 + per-chip ellipsis) rather than wrap; the widest label the
     seeded corpus can produce is 37 characters, measured, so shrinking is the
     safety net and not the normal case. */
  .step-track {
    display: flex; align-items: baseline; min-width: 0; overflow: hidden;
    margin: 0; padding: 0; list-style: none; gap: .5rem;
  }
  .step-chip {
    display: flex; align-items: baseline; gap: .22rem; min-width: 0;
    white-space: nowrap;
    /* ONE transition declaration per element -- a :hover/state block that
       redeclares `transition` REPLACES this wholesale and the property
       silently loses its animation exactly while the state is active
       (`.claude/rules/ui-core.md`). State rules below set values only. */
    transition: color .26s ease, opacity .26s ease;
    color: var(--muted); opacity: .58;
  }
  .step-chip + .step-chip::before {
    content: "›"; margin-right: .34rem; color: var(--muted); opacity: .5;
    flex: none;
  }
  .step-chip.done { color: var(--text); opacity: .78; }
  .step-chip.now { color: var(--gold); opacity: 1; font-weight: 700; }
  .step-name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  /* One marker slot holding BOTH glyphs stacked in the same grid cell, so the
     slot is exactly as wide as the wider of them and a chip cannot shift
     sideways when its glyph changes -- the step being marked is the one thing
     on this row that is supposed to move. A grid stack rather than an absolute
     pair inside a hand-picked width: absolute children do not size their
     parent, so any glyph wider than the guess silently overprints the label
     beside it (seen at 4x on the first render of this row, 2026-08-03). */
  .step-mark { display: inline-grid; flex: none; }
  .step-mark > span {
    grid-area: 1 / 1; opacity: 0; transition: opacity .13s ease;
  }
  /* SEQUENTIAL, never a crossfade: the incoming glyph waits out the outgoing
     one's fade, so no frame paints both. Same law climbcurve.js's
     exchangeFade encodes for JS-animated text. */
  .step-chip.done .mark-done,
  .step-chip.now .mark-now,
  .step-chip.ahead .mark-ahead,
  .step-chip.required .mark-done,
  .step-chip.skipped .mark-ahead { opacity: 1; transition-delay: .13s; }
  /* The EDITOR's two states, drawn from the same chip so the row you edit and
