    /* The rail's connection + recording block.
       ----------------------------------------------------------------
       These are SIDEBAR chrome, and they belong in a viewport query: the
       sidebar's width is a fact about the shell, and the sidebar is not
       inside `.view-pane`, so it has no size container to ask.

       They spent a few hours inside `@container (max-width: 1060px)`, where
       they could never match — the Wave 2 conversion classified
       `.recording-status` as component-internal because SHELL_SELECTORS did
       not list it. The result is exactly what the user reported: "the
       recording section is clearly too big and the dot is not sized properly
       when the sidebar is small". Nothing was styling it at all. Same shape as
       the `.context-bar` rule that came back on all seven tabs at once.

       In the rail the label collapses to a dot: `font-size: 0` hides the text
       (which has no room) and `::before` draws the indicator, CENTRED rather
       than left-aligned in a full-width box, with the border and padding
       dropped so the block is a dot and not a panel containing one. */
    .connection-line { display: block; }

  /* Rank-banner crowding, keyed on the PANE and not the viewport.
     ------------------------------------------------------------------
     A rank banner cannot be abbreviated: kicker, medal, tier + division,
     and the "next" target with its delta are all the information. When the
     row runs out of room the text ellipsizes mid-word, which the user read
     as "a visual error entirely" (live report 2026-07-25). Three rounds of
     flex tuning did not fix it because the row was over-subscribed, and a
     fourth round measured it at three viewport widths and still missed it.

     These are @container rules, on .practice-page's inline-size container
     (declared above, and already what the star row's cqw units resolve
     against), because VIEWPORT WIDTH IS THE WRONG SIGNAL HERE: the sidebar
     is 206px wide above 1180px and a 76px rail below it, so the pane a card
     lives in is NOT monotonic in window width. Measured on the shipping
     shell: a 1181px window gives the card a 947px pane, while a 1180px
     window gives it 1076px. A max-width media query therefore cannot
     express "this card is too narrow"; every viewport threshold is wrong on
     one side of that jump. The container width is the thing that actually
     varies, so it is the thing that gates.

     Thresholds are measured, not guessed (headless sweep, 8 fixtures,
     scrollWidth > clientWidth on every element inside .rank-banner):
       - side by side, a banner gets about (pane - 260) / 2;
       - the widest real row is "STRATEGY * GRANDMASTER III -> Grandmaster
         II -1.28s" at 386px with the basis line hidden, 487px with it;
       - so two banners need a pane over ~1250px to keep the basis line, and
         over ~1100px without it. Below that they stack and each takes the
         full row.
     The basis line ("50/50 - 12:34.56") is what gives way first: it is
     recoverable context -- the rank mode is in the header picker and the
     full text stays in the title -- while the delta is the actionable
     number a run is chasing. Drop the recoverable thing, keep the one that
     says what to do next.

     Stacking gets its own fixed height (190px) rather than reusing the
     mobile 258px: only the metrics row grows here, the heading does not
     wrap yet. Fixed height + overflow:hidden at every breakpoint, because
     the user streams this card in OBS and a card that reflowed would shift
     their capture mid-run. */
  @container (max-width: 1250px) {
    .rank-banner-basis { display: none; }
  }
  @container (max-width: 1100px) {
    /* Height is this branch's 216px, not main's 190px: multi-step segments
       adds the `.seg-waiting` line below, which main's measurement never saw.
       Everything else here is main's (78f12dd) — see its reasoning below. */
    .objective-card { height: 216px; min-height: 216px; overflow: hidden; }
    .objective-strategy-fastest { display: none; }
    /* Stacked: the two washes must not touch, let alone overlap.
       ------------------------------------------------------------------
       Side by side, the -8px/-12px vertical bleeds carry each wash into the
       metrics row's own padding, above and below a single band. Stacked, they
       point at EACH OTHER: 20px of bleed across a 4.8px gap, so the top
       banner's wash ran 7.2px into the bottom banner's box and the bottom
       one's ran 3.2px back into the top -- 15.2px of overlap, identical at
       1100, 900, 760 and 420. The second banner paints last, so it covered the
       first one's lower edge and the two colours met with no seam. That is
       the "rank standards are still overlapping ... there needs to be some
       vertical margin between the bottom of the green rect and the top of the
       white rect" of 2026-07-29, and it is the THIRD report of it.

       That bleed is doing TWO jobs, and only one of them is about the card's
       edge. It separates the band from the edge, AND it is the band's own
       internal padding -- the 8px above the medal row and the 12px below the
       progress bar that give a band its shape side by side. Deleting it on the
       inner edges took both, so the top band ended flush against its own
       progress bar while the bottom one kept its room, and the two stopped
       matching each other (live report 2026-07-29, with the wide layout beside
       it as the reference: "breaks continuity with how the actual rank
       standard display is designed").

       So the bleeds are left EXACTLY as they are, and the gap is opened wide
       enough to clear them: 8px top + 12px bottom + the 8px of margin that is
       actually wanted between two bands = 28px. Every band is then the same
       56px tall as it is side by side, with the medal row and the progress bar
       in the same places inside it, and nothing about the decoration changes
       between layouts. A lone banner is untouched.

       Two rejected, both tried and measured:
         - killing the inner bleeds (shipped for one round) -- the band then
           ends flush against its own progress bar, which is the report above;
         - converting the inner bleed to real padding -- correct in principle,
           but `* { box-sizing: border-box }` means the banner's `min-height:
           36px` ABSORBS that padding rather than growing by it, so the bands
           came out 44px and 48px instead of 56px and did not even match each
           other. It needs a matching min-height per case, which is two more
           numbers to keep in sync with these two.
       The gap costs 20px of card height either way -- that is the honest
       price. Side by side the bleeds spend room the card already has above and
       below the row; stacked, there is no room between two bands to spend, so
       it has to be made.

       Caught by uilab probe class 5 (decoration collisions), added the same
       day. Classes 1-4 all walk the DOM, and a pseudo-element is not in it --
       which is why three sweeps in a row called this page clean while the
       user was looking straight at the defect. */
    .rank-slot { flex-direction: column; align-items: stretch; gap: 28px; }
    .rank-banner::before { left: -16px; border-radius: 0; }
    /* Give the NON-LAST banner its bottom bleed back when `.seg-waiting` is
       present. The base rule up at `.objective-card:has(.seg-waiting)` zeroes
       every banner's bottom, which is right side by side — there both banners
       sit directly above `.seg-waiting` and both would bleed onto it. Stacked,
       only the LAST one faces that row; the others face the 28px gap, which
       already clears a 12px bleed by 16px.
       Zeroing them anyway takes the bleed's SECOND job with it: it is also the
       band's own internal padding below the progress bar (the comment above
       this block explains why, and it is the rejected alternative that shipped
       for one round — "the top band ended flush against its own progress bar
       while the bottom one kept its room"). Note the decoration probe cannot
       catch this direction: no probe class fails on too LITTLE bleed, which is
       why this arrived by review rather than by the sweep. `:not(:last-child)`
       and not `:last-child` — side by side that would name the RIGHT banner
       and leave the left one bleeding onto the row. */
    .objective-card:has(.seg-waiting) .rank-banner:not(:last-child)::before {
      bottom: -12px;
    }
    /* Narrow-pane variant of the waiting-for line (Task 6, this branch):
       the stacked rank banners already claim most of the taller card, so
       this tightens rather than wraps -- .seg-waiting-for still ellipsises
       instead of growing a second line. Kept through the main merge; the
       rank rules above are main's (42404b7), which fixes the stacked-wash
       overlap by widening the gap past the bleed rather than zeroing the
       inner edges as this branch had. */
    .seg-waiting { font-size: .74rem; gap: .35rem; margin-top: .3rem; }
  }

  /* The tight band: both the star name and the strategy picker want the row.
     ------------------------------------------------------------------
     Between 700px (where the heading breaks to two rows and the pressure ends)
     and 794px, the five-column heading cannot give the widest star name AND
     the widest strategy their full width at the same time. The arithmetic, all
     measured on the shipping shell at the 850px supported floor:

       card 731 - 32 padding - 28 icon - 105 eyebrow - 30 chevron - 42 gaps
         = 494px for the name and the strategy block together
       widest star name  293px @ 19.2px   ("Quick Race Through Downtown!")
       widest strategy   194px            ("Ultimate Cycle (Pipe)" + control
                                            chrome: 8 + 25.6 padding, border)
       "STRATEGY" label   60px + 6.4 gap
       -> 293 + 194 + 66 = 553 into 494. Over by 59px.

     Two things give way, in the order of how load-bearing they are:

     1. The label. The word STRATEGY appears again three lines down as the rank
        banner's own kicker, and the select carries it as a title, so this is
        the one piece of text here that is genuinely recoverable. Same rule the
        fastest-strategy hint gives way under, one block up.
     2. A small type step on the name, 1.2rem -> 1.1rem, which buys 24px on the
        widest name for a size still comfortably above the card's body text.
        The user offered this lever explicitly ("we can also slightly decrease
        font sizes if necessary at smaller widths"); it is used ONLY here, and
        only as much as the arithmetic needs.

     That leaves 272 for the name (widest becomes 269) and 222 for the select
     (widest needs 194) -- both fit, with margin on each side rather than the
     4px a single lever would have left. What does NOT give way is the name
     itself: it is the one thing on this card that says what you are
     practising, and ellipsising it mid-word is the bug this fixes. */
  @container (max-width: 793px) {
    .objective-heading { grid-template-columns: 28px auto minmax(272px,1fr) minmax(120px,380px) auto; }
    .objective-name h2 { font-size: 1.1rem; }
    .objective-strategy { grid-template-columns: minmax(70px,1fr) auto; }
    .objective-strategy .field-label { display: none; }
    /* The caveat's WORD gives way here too, leaving the same glyph pill the
       quick-select cell wears. Measured, not chosen: at a 706px pane the wide
       metrics row overflowed the card by 23px with "? Unattributed" in it
       (the responsive sweep's own report, both Bowser stories, 850x1180 and
       851x1000). The sentence is not lost -- the title is on the chip, not on
       the word, so it still answers a hover at every width. */
    .caveat-chip { gap: 0; padding-inline: .3rem; }
    .caveat-chip-word { display: none; }
  }

  /* Objective card, narrow pane.
     ------------------------------------------------------------------
     These rules lived in `@media (max-width: 760px)` until 2026-07-28, and
     moving them here is not a relocation -- it FIXES WHICH CARDS GET THEM.

     Measured on the shipping shell:
       viewport 760 -> pane 725 -> card 699px    (sidebar gone)
       viewport 761 -> pane 642 -> card 608px    (76px rail present)
     The 3-column metrics template needs about 646px. So the 699px card had
     room for it and was being forced into the cramped 2-column layout with a
     258px height it overflowed by 21px, while the 608px card -- which cannot
     fit 646 -- was left on the 3-column template and overflowed sideways by
     29px. Both reported live (900x1180 and 760x1180, 2026-07-28); both are
     the same root cause, which is that pane width is not monotonic in window
     width and no viewport threshold can express "this card is too narrow".

     700px is the pane at which the card stops fitting the wide metrics row,
     with the sweep's two probe points (642 and 725) either side of it. */
  @container (max-width: 700px) {
    .objective-heading {
      grid-template-columns: 26px 1fr; align-items: start;
    }
    .objective-heading .eyebrow { align-self: center; }
    .objective-name { grid-column: 1 / -1; padding-left: 0; }
    .objective-name h2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; }
    .objective-strategy {
      grid-column: 1 / -1; min-width: 0;
      grid-template-columns: 70px minmax(0,1fr);
    }
    /* The label comes BACK here. The block above hides it because the heading
       is one crowded row; at this width the strategy owns a full row of its
       own and has the 70px for it. `inline` is the <span> default -- restated
       rather than `revert`, which would also undo the hide in a UA-sheet
       sense and is not what is meant. */
    .objective-strategy .field-label { display: inline; }
    .objective-strategy select { min-width: 0; max-width: 100%; }
    .objective-metrics {
      /* PB tag needs ~130-150px, not the ~239px a .7fr share was giving it
         at typical mobile widths -- rebalanced 2026-07-25 round 4 so the
         stacked rank banners (now carrying a next: delta and, on longer
         entity labels like "Segment", tighter margins) get the room. */
      grid-template-columns: minmax(0,1.7fr) minmax(125px,.55fr); gap: 8px;
      align-items: center;
    }
    /* Two side-by-side banners have no room to breathe in this narrow
       column (shared with the pbtag column) -- stack them instead. */
    /* Same 28px as the wider stacked block above, and for the same reason --
       it is 8 + 12 of bleed plus the 8px of margin that is wanted. Shrinking
       it here would put the two washes back in contact at exactly the widths
       where the card is most crowded. */
    .rank-slot { min-height: 45px; flex-direction: column; align-items: stretch; gap: 28px; }
    /* The strategy header reverts to 2 columns here (above); the
       fastest-strategy hint would otherwise drop to its own row (a 3rd
       grid child with only 2 explicit columns) rather than sit inline, so
       it's dropped at this width instead -- same "least load-bearing text
       gives way first" rule as round 3's banner crowding fix. */
    .objective-strategy-fastest { display: none; }
    .objective-live-state { grid-column: 1; grid-row: 2; border: 0; justify-content: flex-start; }
    .objective-card .pbtag { grid-column: 2; grid-row: 1 / span 2; align-self: center; white-space: normal; }
    /* Height is MEASURED, not chosen -- see the generated block below. */
    .objective-card {
      height: var(--objective-card-narrow); min-height: var(--objective-card-narrow);
      overflow: hidden;
    }
  }
  @container (max-width: 400px) {
    /* Was `@media (max-width: 430px)`; viewport 430 gives the pane 395px. */
    .objective-metrics { grid-template-columns: 1fr 118px; }
  }

    .mobile-nav .nav-item.on { box-shadow: inset 0 -2px 0 #76b5f5; }
    .mobile-more-backdrop { display: flex; }
  }

  @media (max-width: 430px) {
    .mobile-brand span { font-size: .86rem; }
    .mobile-status .status-main { display: none; }
    .mobile-status .recording-status .dot { max-width: none; }
    .context-control > .ui-icon { display: none; }
  }

  /* Short windows: the sidebar compresses instead of growing a scrollbar
     (pairs with the non-scrolling .sidebar-nav above). */
  @media (max-height: 760px) {
    .app-brand { min-height: 52px; }
    .app-brand img { width: 52px; height: 46px; }
    .nav-item { min-height: 36px; padding-block: .32rem; }
    .nav-group { padding-block: .4rem; }
    .sidebar-footer { gap: .4rem; }
    .sidebar-status { padding: .5rem .6rem; gap: .4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* Was @media (max-width: 1180px). Viewport 1180 gives the pane 1061px and viewport 1181 gives it 932px, so these never reached the NARROWER of the two. */
  @container (max-width: 1060px) {
    .practice-detail-grid { grid-template-columns: 1fr; }
    .objective-card, .detail-drawer { grid-column: 1; }
    .analysis-card, .attempts-card { height: 480px; min-height: 480px; }
    .practice-index-item > .practice-detail-grid { display: grid; }
    .segments-workshop { grid-template-columns: minmax(280px,320px) minmax(0,1fr); }
    .routes-workshop { grid-template-columns: minmax(220px,260px) minmax(0,1fr); }
    .segment-definition-grid { grid-template-columns: 1fr; }
    .segsection.seg-guard { grid-column: 1; }
    .routepick { grid-template-columns: minmax(80px,.55fr) minmax(120px,1fr) minmax(120px,1fr); }
    .routepick > button { grid-column: 1 / -1; justify-self: end; }
    .compare-stage-card { min-height: 520px; }
    .cf-row { grid-template-columns: 85px 110px minmax(0,1fr) auto 18px; }
  }

  /* Was @media (max-width: 760px). Viewport 760 gives the pane 725px and viewport 761 gives it 642px -- the mobile block was styling the WIDER pane. 700px splits them the right way round. */
  @container (max-width: 700px) {
    .workshop-hero { min-height: 76px; padding: 11px 12px; }
    .workshop-title-icon { width: 36px; height: 36px; }
    .workshop-title p { display: none; }
    .workshop-hero > .primary-button { min-width: 40px; padding-inline: .55rem; }
    .workshop-hero > .primary-button .ui-icon { margin: 0; }
    .workshop-card { padding: 12px; }
    .builder-heading h2, .route-identity h2 {
      max-width: 290px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .segment-definition-grid { grid-template-columns: 1fr; }
    .segsection.seg-guard { grid-column: 1; }
    .builder-actions .meta { flex-basis: 100%; }
    .routestart, .routeadd { grid-template-columns: 1fr; }
    .routepick { grid-template-columns: minmax(82px,.55fr) minmax(0,1.15fr); }
    .routepick select:nth-of-type(3) { grid-column: 1 / -1; }
    .routepick > button { grid-column: 1 / -1; width: 100%; }
    .route-stat { display: none; }
    .routestep-actions { margin-left: auto; }
    .routecands, .routestep-foot { margin-left: 0; }
    .routeavg .meta { display: none; }
    .run-state, .compare-sync-note { display: none; }
    .run-console-card, .run-history-card, .feed-card { padding: 12px; }
    .runbar { grid-template-columns: 1fr; align-items: stretch; }
    .run-actions { justify-content: stretch; }
    .run-actions button { flex: 1; }
    .run-pb-slot { grid-column: 1; grid-row: auto; }
    .run-live-slot { min-height: 450px; }
    .run-empty { min-height: 440px; }
    .run-clock-row { min-height: 160px; }
    .runclock { font-size: clamp(2.7rem,15vw,4.4rem); }
    .run-split-time { width: 96px; }
    .run-history-row { grid-template-columns: minmax(0,1fr) auto 20px; }
    .run-history-date { grid-column: 1 / -1; }
    .run-history-splits { padding-left: .45rem; }
    .cf-head { align-items: end; }
    .cf-head select { min-width: 0; max-width: 48%; }
    .cf-row {
      min-height: 56px; grid-template-columns: 78px minmax(0,1fr) 18px;
      grid-template-rows: auto auto; gap: .18rem .4rem;
    }
    .cf-stage { grid-column: 2; grid-row: 2; font-size: .68rem; }
    .cf-item { grid-column: 2; grid-row: 1; }
    .cf-row .chip, .cf-row > .meta { display: none; }
    .cf-load-icon { grid-column: 3; grid-row: 1 / span 2; }
    .compare-stage-heading { align-items: end; }
    .compare-stage-heading .cmp-strat { width: min(190px,55%); }
    .compare-drop { min-height: 270px; }
    .wa-btns button { flex: 1; min-width: 0; }
    .feed-scroll { height: calc(100vh - 300px); min-height: 480px; }
    .feed-footer { align-items: flex-start; flex-direction: column; gap: .25rem; padding-top: .55rem; }
    .page-state {
      min-height: 500px; align-items: center; flex-direction: column;
      text-align: center; padding-inline: 1.2rem;
    }
    .modal-backdrop { align-items: flex-end; padding: 0; }
    .modal {
      width: 100%; max-height: 92vh; border-radius: 14px 14px 0 0;
      border-inline: 0; border-bottom: 0;
    }
    .modal-header { min-height: 70px; padding: 11px 12px; }
    .modal-icon { width: 36px; height: 36px; }
    .modal-heading p { display: none; }
    .modal-body { padding: 12px; }
    .modal-actions { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .strategy-ladder-heading > span, .strategy-ladder-labels { display: none; }
    .strategy-rank-row {
      grid-template-columns: minmax(100px,.8fr) minmax(100px,1fr);
      gap: .4rem; padding: .5rem;
    }
    .strategy-rank-row label:last-child { grid-column: 1 / -1; }
    .stdtools a.meta { width: 100%; margin-left: 0; }
    .update-summary em { display: none; }
    .replay-transport { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); }
    .replay-transport button { min-width: 0; padding-inline: .2rem; font-size: .68rem; }
    .replay-frame-note { grid-column: 1 / -1; text-align: center; }
    .replay-settings-popover {
      position: fixed; z-index: 80; left: 10px; right: 10px;
      top: 68px; bottom: auto; width: auto; max-height: calc(100vh - 155px);
    }
    .replay-setting-row {
      grid-template-columns: minmax(150px,1fr) 240px; gap: .6rem;
    }
    .route-focus-control { min-width: 0; flex: 1; }
    .route-focus-control .field-label { display: none; }
    .route-focus-control select { width: 100%; min-width: 0; }
    .practice-card { padding: 12px; }
    .selector-card { padding: 12px; }
    .selector-card .starrow { height: calc(var(--selector-height) - 54px); }
    /* The Active Target card's narrow layout USED to live here, keyed to the
       viewport. It moved to an @container block (search "objective card,
       narrow pane") on 2026-07-28 -- and moving it CHANGED WHICH SIDE OF 760
       gets it, which was the bug. Measured: viewport 760 gives the card 699px
       (the 3-column metrics need ~646, so they fit fine) while viewport 761
       gives it 608px (they do not). The narrow layout was being applied to
       the WIDER card and the wide layout to the narrower one. */
    .analysis-card { height: 520px; min-height: 520px; }
    .attempts-card { height: 560px; min-height: 560px; }
    .sort-control select { max-width: 108px; font-size: .75rem; }
    /* One line per attempt even in the narrow layout (2026-07-24) — the old
       two-line grid doubled every entry's height. Long result text ellipses
       instead of wrapping. */
    .attempt-table, .attempt-table tbody { display: block; width: 100%; }
    .attempt-table tr:not(.replay-row) {
      height: auto; min-height: 44px; display: grid;
      grid-template-columns: 30px 26px minmax(0,1fr) max-content
                             minmax(0,max-content) max-content;
      align-items: center; gap: 0 .18rem;
      padding: .14rem 0; border-bottom: 1px solid var(--border-soft);
    }
    .attempt-table td { display: block; width: auto; border: 0; padding: .12rem .2rem; }
    .attempt-result { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .attempt-delta { text-align: right; }
    .attempt-strategy { min-width: 0; }
    .attempt-actions { display: flex; justify-content: flex-end; }
    .attempt-strategy select { max-width: 104px; }
    .save-pb-wide { display: none; }
    .save-pb-narrow { display: inline; }
    .replay-row, .replay-row td { display: block; height: auto; width: 100%; }
    .index-heading { align-items: start; }
    .index-heading > .meta { display: none; }
    .practice-index-item > summary { grid-template-columns: 28px minmax(0,1fr) 22px; }
    .practice-index-item > summary > .meta { display: none; }
    .settings-actions { grid-template-columns: 1fr; }
  }

  /* Was @media (max-width: 640px); viewport 640 gives the pane 605px. */
  @container (max-width: 605px) { .rank-cell-next { font-size: 11px; }
  }

  /* Was @media (max-width: 430px); viewport 430 gives the pane 395px. */
  @container (max-width: 400px) {
    .reset-toggle span { display: none; }
    .attempt-actions button { padding-inline: .32rem; }
    .save-pb-narrow { display: none; } /* icon-only Save on phones */
    .replay-setting-row { grid-template-columns: 1fr; gap: .35rem; }
    .replay-setting-controls { width: 100%; }
  }

  /* The attempt row at the reflow floor.
     ------------------------------------------------------------------
     Measured at a 300px pane: the six-column row hands `attempt-strategy`
     67px and `attempt-actions` 108px as fixed tracks, which leaves the two
     cells carrying the actual RESULT — the time and the delta — six pixels
     each. They then overrun their tracks and overlap by 4px.

     The strategy select gives way, on the same "least load-bearing text goes
     first" rule the rank banners use: the strategy is named on the card's own
     picker directly above, so the row is repeating it, while the time and the
     delta appear nowhere else. Dropping it returns ~70px to the two columns
     that had none. */
  @container (max-width: 330px) {
    .attempt-table .attempt-strategy { display: none; }
    .attempt-table tr:not(.replay-row) {
      grid-template-columns: 26px 24px minmax(0,1fr) max-content max-content;
    }
    .attempt-delta { width: auto; min-width: 0; }

    /* The practice log's HEADING overflows here too, and separately: its tools
       row measured 235px inside a 275px card, the sort control alone 144px of
       that. It cannot be allowed to wrap -- this card is a fixed height, so a
       second heading line comes straight out of the table's rows under
       `overflow: hidden`, where a screenshot of either end state looks fine.
       So the two recoverable things go instead: the "N shown" count, which the
       rows themselves answer, and the sort control's width, which still shows
       its current option. */
    .attempts-heading .attempts-tools > .meta { display: none; }
    .attempts-heading .sort-control { padding-left: .3rem; }
    .attempts-heading .sort-control select { max-width: 76px; }
  }

  /* Was @media (max-width: 900px); viewport 900 gives the pane 781px. */
  @container (max-width: 780px) {
    .segments-workshop, .routes-workshop { grid-template-columns: 1fr; }
    .segment-editor { order: 1; }
    .segment-library { order: 2; }
    .segment-library, .segment-editor, .route-library, .route-empty-card { min-height: 0; }
    .segment-library, .route-library { position: static; max-height: none; }
    .segment-list, .route-list { max-height: 340px; }
    .runbar { grid-template-columns: minmax(0,1fr) auto; align-items: end; }
    .run-pb-slot { grid-column: 1 / -1; grid-row: 2; justify-items: start; }
    .run-clock-row { grid-template-columns: 1fr; padding-block: 1rem; }
    .run-clock-note { padding: .7rem 0 0; border-left: 0; border-top: 1px solid var(--border-soft); }
    .compare-grid { grid-template-columns: 1fr; }
    .compare-stage-card { min-height: 0; }
  }

  /* Context bar: four cards in one row need 684px, and `main.app-main` is only
     670px at viewport 761 -- the narrowest window that still carries the 76px
     rail. The row overflowed by 14px through the whole 761..775 band and the
     Grading select hung past the edge. Measured: app-main is viewport - 91
     while the rail is present, so four-across stops fitting below 775.

     A VIEWPORT query on purpose, and it has to be at TOP LEVEL. `.context-bar`
     lives in the header, OUTSIDE `.view-pane`, so it has no size container
     above it -- when the Wave 2 conversion swept this rule into
     `@container (max-width: 1060px)` the query could never match and the same
     overflow came back on all seven tabs at once (2026-07-28). A shell element
     cannot be gated on a container it is not inside. */
  @media (max-width: 775px) {
    .context-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* ===================================================================
     Card collapse
     ===================================================================
     Every practice card can be folded to its heading. Requested for ALL
     layouts, not just narrow ones: at 900x1180 the practice log sits below
     two tall cards and cannot be reached without scrolling.

     A plain `height` interpolation, because both ends are real numbers --
     these cards carry hard pixel heights so an OBS capture never reflows
     mid-run, and collapsing just swaps one fixed height for a smaller one.
     The contract survives in both states, and the height only changes when
     the user asks it to.

     ONE `transition` declaration per element, and `.is-collapsed` sets only
     target VALUES. A second `transition` in the state rule would replace this
     one wholesale rather than adding to it, which is what produces the
     "smooth one way, snaps the other" asymmetry.

     The curve starts at y1 = 0 so the first frame actually moves rather than
     jumping a third of the way, and eases at both ends so nothing arrives
     still travelling. Timings are custom properties so the Wave 5 motion
     inspector can drive them instead of a future guess. */
  :root {
    --card-collapse-ms: 260ms;
    --card-collapse-ease: cubic-bezier(.32, 0, .24, 1);
    --card-collapsed-height: 52px;
  }

  /* `align-self: start` in BOTH states, so `height` is the only thing that
     moves and it moves between two real numbers.
     ------------------------------------------------------------------
     These cards are grid items sharing a row, and the default
     `align-items: normal` stretches them to the row's height — which is why a
     collapsed card sprang straight back to 458px however the rule was written,
     inline `!important` included. Opting out of the stretch costs nothing
     visually: every one of these cards already declares an explicit height,
     so they were the same size stretched or not.
     `max-height` was the first fix and it SNAPPED, because its open value is
     `none` and `none -> 52px` is not interpolable. Both ends have to be
     numbers for a transition to exist at all. */
  .practice-card {
    align-self: start;
    transition: height var(--card-collapse-ms) var(--card-collapse-ease);
  }
  /* (0,2,0) beats the bare `.objective-card` / `.analysis-card` height rules
     in the @container blocks above -- a container query adds no specificity of
     its own -- and this section sits after them, so it wins on both counts. */
  /* `max-height`, not `height`, and `align-self: start` with it.
     ------------------------------------------------------------------
     These cards are GRID ITEMS. `.practice-detail-grid` puts the analysis card
     and the practice log in the same row, and a grid item with the default
     `align-items: normal` stretches to its row — so a collapsed log sharing a
     row with an open analysis card was stretched straight back to the row's
     height. Measured: the rule matched, `var()` resolved to 52px, it had the
     highest specificity and came last, and the computed height stayed 458px.
     An INLINE `height: 52px !important` was ignored too, which is what finally
     ruled the cascade out — nothing about specificity can beat the row.
     `align-self: start` opts the item out of the stretch and `max-height`
     then binds. */
  /* UNFINISHED — collapses correctly, but SNAPS. Not merged.
     `max-height` is what actually binds here (plain `height` is ignored on
     these cards however it is written, inline !important included — see the
     note above), and its open value is `none`, which cannot interpolate. The
     honest fixes are (a) measure the open height in JS and write both ends as
     definite values, or (b) move the animation off the card and onto a body
     wrapper using the interpolable `grid-template-rows: 1fr -> 0fr`. Shipping
     it snapping would break the standing rule that every state change
     animates, so it stays behind this comment until one of those lands. */
  .practice-card.is-collapsed {
    align-self: start;
    max-height: var(--card-collapsed-height);
    min-height: 0;
    overflow: hidden;
  }
  /* Everything below the heading fades as the card folds. `visibility` rides
     the same transition so a collapsed card cannot be tabbed into, while
     `opacity` alone would leave it focusable and invisible. */
  .practice-card > *:not(.card-heading):not(.shead):not(.objective-heading) {
    transition: opacity calc(var(--card-collapse-ms) * .7) var(--card-collapse-ease),
                visibility var(--card-collapse-ms) step-end;
  }
  .practice-card.is-collapsed > *:not(.card-heading):not(.shead):not(.objective-heading) {
    opacity: 0; visibility: hidden;
    transition: opacity calc(var(--card-collapse-ms) * .5) var(--card-collapse-ease),
                visibility var(--card-collapse-ms) step-start;
  }

  .card-collapse {
    flex: 0 0 auto; width: 30px; min-width: 30px; height: 30px; min-height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: transform var(--card-collapse-ms) var(--card-collapse-ease),
                background 140ms ease, color 140ms ease;
  }
  .card-collapse:hover { background: #16283e; color: var(--text); }
  /* Points down when open, right when collapsed -- the chevron glyph itself
     points down, so collapsed is the rotated state. */
  .practice-card.is-collapsed .card-collapse { transform: rotate(-90deg); }

  /* Stacked layouts: practice log above analysis.
     The user's hierarchy is selector -> target -> practice log -> analysis
     ("all the important information is hidden!!!!"). DOM order is unchanged,
     so the two-column layout keeps the geometry it is sized for -- the log
     needs the wider column and analysis the narrower one. */
  @container (max-width: 1060px) {
    .attempts-card { order: 1; }
    .analysis-card { order: 2; }
    .detail-drawer { order: 3; }
  }
