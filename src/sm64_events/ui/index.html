<style>

  .routeavg{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
  /* combined replayable-run feed at the top */
  .compare-feed { max-width:760px; margin:0 auto 1rem; }
  .cf-head { display:flex; align-items:center; gap:.6rem; justify-content:center; margin-bottom:.35rem; }
  .cf-list { max-height:210px; overflow-y:auto; border:1px solid #2a2f3a; border-radius:6px; }

  .compare-grid { display:flex; gap:1rem; align-items:flex-start; }
  .compare-col { flex:1 1 0; min-width:0; }
  .compare-center { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; padding-top:2rem; }
  /* keep every child inside its column (no overlap into the centered transport) */
  .compare-col select, .compare-col input, .compare-col video { width:100%; max-width:100%; box-sizing:border-box; }
  .compare-transport { display:flex; flex-direction:column; gap:.4rem; align-items:center; }
  .compare-transport button { min-width:7rem; }
  .compare-empty { min-height:180px; display:flex; flex-direction:column; align-items:center;
                   justify-content:center; text-align:center; border:1px solid #2a2f3a; border-radius:6px; padding:1rem; }

  /* Premiere-style single-bar work area (in/out over the whole clip) */
  .workarea { margin:.4rem 0; }
  .wa-track { position:relative; height:14px; background:#20242c; border-radius:4px;
              margin:.25rem 0; user-select:none; touch-action:none; cursor:pointer; }
  /* the region is decorative — let pointerdowns fall through to the track to scrub */
  .wa-region { position:absolute; top:0; bottom:0; background:rgba(122,162,247,.35);
               border-left:2px solid #7aa2f7; border-right:2px solid #7aa2f7; box-sizing:border-box;
               pointer-events:none; }
  /* live playhead: a white line tracking the video's current position (drag anywhere to scrub) */
  .wa-playhead { position:absolute; top:-2px; bottom:-2px; width:2px; margin-left:-1px;
                 background:#fff; pointer-events:none; }
  .wa-handle { position:absolute; top:-3px; width:10px; height:20px; margin-left:-5px;
               background:#7aa2f7; border-radius:3px; cursor:ew-resize; }
  .wa-handle:hover { background:#9bb8ff; }
  .wa-times { text-align:center; }
  .wa-btns { display:flex; gap:.5rem; justify-content:center; margin-top:.25rem; }
  .wa-total { color:#6b7280; }

  /* per-video audio control (independent mute + volume) */
  .vaudio { display:flex; align-items:center; gap:.4rem; margin-top:.2rem; }
  .vaudio button { padding:.05rem .35rem; }
  .vaudio input[type=range] { flex:1; min-width:0; max-width:180px; }
  /* video title subheader (between the video and the audio row) */
  .vcaption { text-align:center; margin:.15rem 0; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }
  .compare-cmp { margin-bottom:1rem; }
  /* strategy selector next to the "Comparison" heading */
  .cmp-head { display:flex; align-items:center; gap:.5rem; }
  .cmp-strat { max-width:12rem; }
  /* save (name) row under the work-area buttons */
  .cmp-save { display:flex; gap:.4rem; justify-content:center; margin-top:.3rem; }
  .cmp-save input { flex:1 1 auto; min-width:0; max-width:260px; box-sizing:border-box; }
  .cd-existing select { max-width:100%; margin-left:.3rem; }

  /* comparison add: a video-sized drop zone */
  .compare-drop { border:2px dashed #3a4150; border-radius:8px; min-height:200px; margin-top:.5rem;
                  display:flex; align-items:center; justify-content:center; text-align:center; padding:1rem; box-sizing:border-box; }
  .compare-drop.over { border-color:#7aa2f7; background:rgba(122,162,247,.08); }
  .cd-inner { display:flex; flex-direction:column; gap:.5rem; align-items:center; width:100%; }
  .cd-icon { font-size:1.7rem; }
  .cd-actions { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
  .cd-strat { display:flex; align-items:center; gap:.4rem; justify-content:center; }
  /* URL input + button: wrap the button below when the column is narrow so the
     input never gets clipped */
  .cd-url { display:flex; gap:.4rem; width:100%; flex-wrap:wrap; justify-content:center; }
  .cd-url input { flex:1 1 180px; min-width:0; }
  .cd-url button { flex:0 0 auto; }

  /* narrow screens: stack (video / controls / video) with a horizontal control row */
  @media (max-width:820px){
    .compare-grid { flex-direction:column; }
    .compare-col, .compare-center { width:100%; flex:none; }
    .compare-center { padding-top:.4rem; }
    .compare-transport { flex-direction:row; flex-wrap:wrap; justify-content:center; }
  }

  /* ---------------------------------------------------------------------
     Practice Index shell — calm observatory, fixed live-state tracks
     --------------------------------------------------------------------- */
  :root {
    color-scheme: dark;
    --bg: #07111e;
    --bg-deep: #050c16;
    --surface: #0c1928;
    --surface-2: #101f31;
    --surface-3: #14263a;
    --border: #294058;
    --border-soft: #1d3147;
    --text: #eef2f6;
    --muted: #8fa0b5;
    --muted-2: #66778d;
    --gold: #f0bd32;
    --gold-soft: #ffd96a;
    --blue: #68adf2;
    --green: #91e5a2;
    --coral: #ff7b73;
    --sidebar-wide: 206px;
    --sidebar-rail: 76px;
    /* Selector-card slot height. cqw resolves against .practice-page
       (container-type: inline-size) AT USE TIME, so the card shrinks with
       the pane: 230px while all 7 full-size star cells fit (pane >= ~980px),
       then tracking the cqw-scaled cell content below that. Width-driven
       ONLY — every banner mode (stars/bowser/arena/castle) gets the same
       height at a given pane width, so live mode swaps never move layout
       (OBS stability). */
    --selector-height: clamp(152px, calc(98px + 13.8cqw), 230px);
    --radius: 9px;
  }
  * { box-sizing: border-box; }
  html, body, #app { min-height: 100%; max-width: 100%; overflow-x: hidden; }
  /* Reserve the scrollbar's width whether or not one is showing, so a pane
     that grows past the fold can never shove the whole layout sideways (live
     audit 2026-07-25: opening a library group shifted the entire page). This
     is the belt to the viewport-bounded panes' braces — those stop the page
     from scrolling at all, this stops the SHIFT if anything ever does. */
  html { scrollbar-gutter: stable; }
  body {
    max-width: none; margin: 0; padding: 0; min-width: 320px;
    font-family: "Segoe UI Variable", "Aptos", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 91% 8%, rgba(91,147,205,.08), transparent 25rem),
      radial-gradient(circle at 20% 92%, rgba(50,104,160,.06), transparent 30rem),
      var(--bg-deep);
    color: var(--text);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .28;
    background-image:
      radial-gradient(circle at 8% 18%, #b9d9ff 0 1px, transparent 1.4px),
      radial-gradient(circle at 72% 12%, #fff4c3 0 1px, transparent 1.3px),
      radial-gradient(circle at 94% 63%, #b9d9ff 0 1px, transparent 1.4px),
      radial-gradient(circle at 34% 87%, #b9d9ff 0 1px, transparent 1.3px);
    background-size: 320px 280px, 410px 350px, 370px 300px, 460px 390px;
  }
  button, select, input, textarea { font: inherit; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: .42rem;
    min-height: 34px; padding: .36rem .66rem; border-radius: 6px;
    border: 1px solid #344b64; background: #142338; color: var(--text);
  }
  button:hover { background: #1a2d45; border-color: #496784; }
  button:disabled { opacity: .48; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible,
  summary:focus-visible, a:focus-visible {
    outline: 2px solid #78b9ff; outline-offset: 2px;
  }
  select, input, textarea {
    border-color: #344b64; background: #0d1928; color: var(--text);
    min-height: 34px; padding: .32rem .5rem;
  }
  /* A <select>'s own dropdown arrow is drawn INSIDE its padding box, so with
     symmetric padding a long option runs underneath it — "Bowser in the Dark
     Worl⌄", clipped mid-word with the caret on top (live audit 2026-07-25).
     Reserve the arrow's lane on the right and ellipsise instead of clipping,
     so a name that does not fit ends in "…" clear of the caret. */
  select {
    padding-right: 1.6rem;
    text-overflow: ellipsis;
  }
  /* Native <select> popup lists: Chromium derives the popup colors from the
     select itself, and several of ours are transparent — that produced a
     white popup with inherited LIGHT text (unreadable, e.g. the sort menu).
     Style the options explicitly so every dropdown list is dark + readable. */
  option { background-color: #0d1928; color: var(--text); }
  a { color: #79bafc; }
  h2, h3, h4, p { margin-top: 0; }
  h2 { font-size: 1.2rem; margin-bottom: 0; }
  h3 { font-size: 1.02rem; margin-bottom: 0; }
  h4 { font-size: .82rem; font-weight: 600; margin: 0 0 .3rem; color: #dbe4ee; }
  .ui-icon { display: block; flex: 0 0 auto; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .eyebrow, .field-label, .context-label {
    color: var(--muted); font-size: .69rem; font-weight: 650;
    letter-spacing: .075em; text-transform: uppercase;
  }
  .meta { color: var(--muted); }
  .app-shell {
    position: relative; z-index: 1; min-height: 100vh;
    display: grid; grid-template-columns: var(--sidebar-wide) minmax(0, 1fr);
  }
  .app-sidebar {
    position: sticky; z-index: 10; top: 0; height: 100vh; min-height: 560px;
    display: flex; flex-direction: column; padding: 14px 12px 12px;
    background: linear-gradient(180deg, #10243a 0%, #0b1b2c 56%, #091625 100%);
    border-right: 1px solid var(--border);
  }
  .app-brand {

  }
  .app-brand img { width: 67px; height: 58px; object-fit: contain; }
  .app-brand span { font-weight: 750; line-height: 1.15; }
  /* The nav never scrolls internally (a scrollbar beside a 7-item list read
     as broken, 2026-07-24) — it takes its natural height, and short windows
     compress spacing instead (see the max-height media query below). */
  .sidebar-nav { flex: 0 0 auto; }
  .nav-group { padding: .62rem 0; border-bottom: 1px solid rgba(77,105,134,.34); }
  .nav-group:last-child { border-bottom: 0; }
  .nav-group-label {
    padding: 0 .66rem .32rem; color: #9cadc0; font-size: .67rem;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .nav-item {
    width: 100%; min-height: 42px; justify-content: flex-start;
    padding: .5rem .65rem; border-color: transparent; background: transparent;

  }
  .nav-item:hover { background: rgba(105,151,204,.12); border-color: transparent; }
  .nav-item.on {
    color: #fff; background: rgba(111,161,218,.22);
    box-shadow: inset 3px 0 0 #76b5f5;
  }
  .sidebar-footer { margin-top: auto; display: grid; gap: .55rem; padding-top: .5rem; }
  .settings-link { border-top: 1px solid rgba(77,105,134,.34); border-radius: 0; }
  .sidebar-status {
    display: grid; gap: .55rem; padding: .68rem .7rem;
    border: 1px solid var(--border); border-radius: 7px;
    background: rgba(8,20,33,.58);
  }
  .connection-line {
    display: grid; grid-template-columns: 9px 1fr; column-gap: .5rem; align-items: center;
  }
  .status-light { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
  .connection-line.is-live .status-light { background: var(--green); }
  .status-main { color: var(--green); font-weight: 700; font-size: .78rem; text-transform: uppercase; }
  .connection-line.is-warn .status-main { color: var(--coral); }
  .status-sub { grid-column: 2; color: var(--muted); font-size: .68rem; }
  .recording-status { min-width: 0; border-top: 1px solid var(--border-soft); padding-top: .5rem; }
  .recording-status > span, .recording-status .dot {
    display: block; max-width: 100%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; background: transparent; padding: 0; font-size: .73rem;
  }
  .recording-status .ok { color: var(--coral); }
  .recording-status .bad { color: var(--muted); }
  .app-main { min-width: 0; max-width: 100%; overflow-x: hidden; }
  .context-shell {
    position: sticky; top: 0; z-index: 24; padding: 14px 0 8px;
    background: linear-gradient(180deg, rgba(5,12,22,.98) 70%, rgba(5,12,22,.82));
  }
  .context-bar {
    min-height: 56px; display: grid;
    grid-template-columns: minmax(170px,.75fr) minmax(250px,1.45fr)
                           minmax(180px,.9fr) minmax(140px,.7fr);
    gap: 10px; width: calc(100% - 28px); max-width: 1472px; margin: 0 auto;
  }
  .context-control {
    min-width: 0; min-height: 54px; display: flex; align-items: center; gap: .65rem;
    padding: .42rem .75rem; border: 1px solid var(--border);
    border-radius: 7px; background: rgba(11,25,41,.92); color: var(--text);
  }
  button.context-control { justify-content: flex-start; text-align: left; }
  .context-control-copy { min-width: 0; flex: 1; display: grid; gap: 1px; }
  .context-control select {
    width: 100%; min-width: 0; min-height: 24px; padding: 0 1.4rem 0 0;
    border: 0; background-color: transparent; font-weight: 650;
  }
  .context-value {
    display: block; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 650;
  }
  .target-context .context-label { color: var(--green); }
  .workspace {
    width: 100%; max-width: 1500px; min-width: 0; margin: 0 auto;
    padding: 4px 14px 28px; overflow-x: hidden;
  }
  .view-pane, .practice-page { min-width: 0; max-width: 100%; }
  .mobile-appbar, .mobile-nav, .mobile-more-backdrop { display: none; }
  /* THE size container all selector cqw units + @container rules resolve
     against — the pane the star row must fit inside. inline-size only, so
     normal height flow is untouched. */
  .practice-page { display: grid; gap: 12px; container-type: inline-size; }
  .practice-card {
    min-width: 0; max-width: 100%; margin: 0; padding: 14px 16px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(14,30,48,.98), rgba(10,24,39,.98));
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
  }
  .practice-toolbar {
    position: relative; /* anchors the stats popover */
    min-height: 58px; display: flex; align-items: center; gap: .75rem;
    padding-block: 9px;
  }
  .route-focus-control {
    display: flex; align-items: center; gap: .5rem; min-width: 230px;
  }
  .route-focus-control select { min-width: 150px; }
  .toolbar-note {
    min-width: 0; flex: 1; color: var(--muted); font-size: .78rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Out of flow, anchored under the toolbar's Stats button: as a grid child
     of .practice-page it added a row and shifted every card 12px on open. */
  .stats-popover {
    position: absolute; top: calc(100% + 6px); right: 12px; z-index: 30;
  }
  /* Stats menu: the only popover still on the legacy grey .popover base —
     pull it onto the same navy language as the replay-settings popover so the
     stat picker matches the rest of the shell (statmenu.js renders a bare
     .popover, so this is scoped CSS only, no component change). */
  .stats-popover > .popover {
    position: static; min-width: 208px; padding: .45rem;
    border-color: #42617e; background: #0b1929;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .stats-popover .popover label {
    display: flex !important; align-items: center; gap: .5rem;
    padding: .28rem .45rem; border-radius: 6px; font-size: .82rem; cursor: pointer;
  }
  .stats-popover .popover label:hover { background: rgba(105,151,204,.12); }
  .stats-popover .popover input[type="checkbox"] { min-height: 0; accent-color: var(--blue); }
  .stats-popover .popover > div:last-child {
    display: flex; gap: .5rem; justify-content: flex-end;
    margin-top: .5rem !important; padding-top: .5rem;
    border-top: 1px solid var(--border-soft);
  }
  .stats-popover .popover > div:last-child button:first-child {
    color: #1b1607; background: var(--gold); border-color: var(--gold-soft); font-weight: 700;
  }
  .selector-card {
    height: var(--selector-height); min-height: var(--selector-height);
    overflow: hidden; border-color: #315779; padding: 14px 16px 12px;
  }
  .selector-card .shead { min-height: 30px; align-items: center; }
  .selector-card .shead b { color: var(--text); font-size: 1.06rem; }
  .selector-card .starrow {
    height: calc(var(--selector-height) - 56px); align-items: stretch;
    gap: clamp(3px, .82cqw, 8px); margin: 0; padding: 4px 1px 8px;
  }
  .selector-card .starcell {
    flex: 1 1 0; min-width: 0; height: 100%;
    justify-content: flex-start; padding: .35rem .15rem .4rem;
  }
  .selector-card .starholder { width: min(82px, 8.4cqw); }
  /* segment rows (bowser/arena/castle): 1-3 cells, each pinned to the width
     a 7-cell star row would give it (100cqw card - 32px card padding - 6
     gaps ~ 48px), so the two row kinds have identical cell geometry at
     every pane width instead of a lone cell stretching across the card */
  .selector-card .starrow.segcells { justify-content: flex-start; }
  .selector-card .starrow.segcells .starcell {
    flex: 0 1 auto; width: calc((100cqw - 80px) / 7);
  }
  .selector-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: .5rem;
  }
  .selector-empty-symbol { color: var(--muted); font-size: 2.8rem; line-height: 1; }
  .selector-empty b { display: block; margin-bottom: .25rem; }
  .selector-empty .meta { display: block; }
  .practice-detail-grid {
    display: grid; grid-template-columns: minmax(330px,.9fr) minmax(520px,1.35fr);
    gap: 12px; min-width: 0;
  }
  .objective-card {
    grid-column: 1 / -1; height: 122px; min-height: 122px; overflow: visible;
    display: grid; grid-template-rows: auto 1fr; padding-block: 12px;
  }
  .objective-card.active-star { border-color: rgba(240,189,50,.72); }
  .objective-heading {
    min-width: 0; display: grid;
    grid-template-columns: 28px auto minmax(180px,1fr) minmax(150px,380px);
    gap: .65rem; align-items: center;
  }
  .objective-symbol {
    color: var(--gold); display: inline-flex; align-items: center; justify-content: center;
  }
  .objective-name { min-width: 0; }
  .objective-context {
    display: block; color: var(--muted); font-size: .72rem;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .objective-name h2 {
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* Third column (auto) added 2026-07-25 round 4 for StrategyFastestHint --
     the fastest-known-strategy name moved HERE from the rank banner (it and
     the banner's next: target were clipping mid-word competing for one
     line). This row is wider and carries only text, no medal/bar, so it has
     the room the banner didn't. */
  .objective-strategy {
    min-width: 0; display: grid; grid-template-columns: auto minmax(70px,1fr) auto;
    gap: .4rem; align-items: center;
  }
  .objective-strategy select { width: 100%; min-width: 0; }
  .objective-strategy-fastest {
    color: var(--muted); white-space: nowrap; font-size: .82rem;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .objective-metrics {
    min-width: 0; display: grid; grid-template-columns: minmax(420px,2.6fr) 66px minmax(112px,auto);
    gap: 12px; align-items: center; border-top: 1px solid var(--border-soft);
    margin-top: .62rem; padding-top: .55rem;
    position: relative; z-index: 0; /* stacking context for the rank wash */
  }
  /* Rank wash: the current rank's color sweeping the full card width, fading
     left→right into the card. --rank-glow is set inline by practice.js from
     rankColor(); unset (no rank) mixes to transparent = no wash. Negative
     insets reach the card's padding so the gradient touches its edges. */
  .objective-metrics::before {
    content: ""; position: absolute; z-index: -1; pointer-events: none;
    left: -16px; right: -16px; top: 0; bottom: -12px;
    border-radius: 0 0 8px 8px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--rank-glow, transparent) 34%, transparent),
      transparent 88%);
  }
  /* Two RankBanners side by side, EQUAL treatment (spec 2026-07-25 round 2):
     a labelled, gradient Strategy Rank banner next to a small unlabelled
     "Bronze III" chip read as a rendering fault to the user, not two
     deliberate measures -- so the Overall Rank now gets the identical
     .rank-banner box, sharing the row 50/50 rather than being squeezed into
     a fixed-width hairline-divided chip. Each shrinks independently (its own
     children ellipsis); when only one banner is present (Overall Rank is
     absent when entity_rank has nothing to grade) it simply takes the row. */
  .rank-slot { min-width: 0; overflow: hidden; display: flex; align-items: stretch; gap: .7rem; }
  .rank-slot .meta { min-width: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Positioning context for an entity celebration (celebrate.js
     EntityCelebration, task F3) -- a plain wrapper, not `.rank-slot` itself,
     because `.rank-slot` keeps its own `overflow:hidden` and an absolutely
     positioned toast child would get clipped by it. The wrap has no padding
     of its own, so it shares `.rank-slot`'s exact footprint. */
  .rank-slot-wrap { position: relative; min-width: 0; }
  .rank-banner {
    min-width: 0; flex: 1 1 0; display: grid; gap: .34rem; align-content: center;
    min-height: 36px;
  }
  /* The sentinel ("no standards" / "pick a strat") variant of the SAME
     banner box -- min-height matches the graded version (medal row + bar)
     so the rare case of a sentinel Strategy banner beside a GRADED Overall
     one (e.g. the active strategy has no ladder of its own, but the star's
     best-possible ladder is still gradeable off the same time) doesn't look
     visibly shorter. */
  .rank-banner-empty { display: flex; align-items: center; gap: .5rem; }
  /* "Strategy Rank" / "Overall Rank" kickers -- which measure this banner
     is, prefixed on the SAME line as the medal, never a new line:
     .objective-card is a hard fixed height (122px desktop / 258px under
     760px, both non-reflowing) and a stacked layout here would silently
     bleed the card into whatever sits below it. Deliberately NOT `.meta`
     -- `.rank-slot .meta`'s `flex:1 1 auto; min-width:0` out-specifies a
     same-weight class rule here and shrinks the label into "STRA…", which
     reads as broken, not tight; own color/no-shrink instead. */
  .rank-banner-kicker {
    flex: 0 0 auto; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; font-size: .62rem; font-weight: 650;
  }
  .rank-banner-row {
    min-width: 0; display: flex; align-items: center; gap: .3rem;
    white-space: nowrap; overflow: hidden;
  }
  .rank-banner-name { font-weight: 800; letter-spacing: .4px; }
  .rank-banner-next { flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; }
  /* Progress toward the next rank: full slot width, never a fixed px bar —
     a 200px bar used to bleed past the card edge (2026-07-24). */
  .rank-progress-track {
    height: 5px; overflow: hidden; border-radius: 3px;
    background: rgba(4,13,23,.72);
  }
  .rank-progress-track i { display: block; height: 100%; border-radius: inherit; }
  /* MARELO header bar: its own row below the session/target/clock/rank grid
     rather than a 5th grid column -- .context-bar's 4-column template is
     redefined at two breakpoints (1180px, 760px) and adding a column would
     mean touching all three; a second flex row is additive and matches the
     same centered width formula. --border/rgba(11,25,41,.92) mirror
     .context-control's panel styling (this design system has no --panel or
     --line token). Fixed 44px height so a rank-up never reflows the OBS
     capture. */
  .marelo-row {
    width: calc(100% - 28px); max-width: 1472px; margin: 8px auto 0;
    display: flex; justify-content: flex-end;
  }
  .marelo-bar {
    display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 7px; background: rgba(11,25,41,.92);
    color: var(--text); cursor: pointer; flex: 0 0 auto;
  }
  .marelo-bar:hover { border-color: var(--gold); }
  .marelo-crest {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; background: var(--crest); color: #0d1220; flex: 0 0 auto;
    box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset;
  }
  .marelo-bar-text { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
  .marelo-track {
    width: 96px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12);
    overflow: hidden; flex: 0 0 auto;
  }
  .marelo-track > i { display: block; height: 100%; }
  .marelo-split { white-space: nowrap; }
  @media (max-width: 900px) { .marelo-track, .marelo-split { display: none; } }
  /* Scope TIER-up celebration -- the grand one (celebrate.js TierRankUp,
     task F3): fixed overlay so it can never reflow an OBS capture;
     pointer-events stay OFF on the overlay and ON only for the card, so it
     never eats a click meant for the game. The three-beat phase machine
     (fill -> flip -> hold) is JS state (TierRankUp's `phase`/`flipStep`),
     not CSS -- CSS only plays each beat's own animation (fade-in, the fill
     bar, the crest flip, the final pop), which is why those are the only
     things prefers-reduced-motion needs to gate (same opt-in pattern as
     .starholder/.page-state above). z-index sits above .modal-backdrop
     (200): a rank-up can land while a modal is open and must still be seen. */
  .rankup {
    position: fixed; inset: 0; z-index: 210; display: flex;
    align-items: center; justify-content: center; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--tier) 35%, transparent), transparent 70%);
  }
  .rankup-card {
    pointer-events: auto; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 26px 34px; border-radius: 16px;
    background: rgba(11,25,41,.92); border: 2px solid var(--tier);
    box-shadow: 0 0 60px color-mix(in srgb, var(--tier) 55%, transparent);
  }
  .rankup-card h2 { margin: 2px 0 0; font-size: 30px; color: var(--tier); }
  /* Beat 1 (fill): the division bar that visibly reaches the crossing
     point before the climb begins -- durations here (1.2s/.6s) must stay in
     lockstep with FILL_MS/FLIP_MS in celebrate.js. */
  .rankup-fill-track {
    width: 180px; height: 8px; margin: 4px 0; border-radius: 4px;
    overflow: hidden; background: rgba(255,255,255,.14);
  }
  .rankup-fill-track i { display: block; height: 100%; width: 100%; background: var(--tier); }
  /* Beat 2 (flip): the crest turning over into each tier gained. */
  .rankup-crest-flip { display: inline-flex; }
  @media (prefers-reduced-motion: no-preference) {
    .rankup { animation: rankup-in .25s ease-out; }
    .rankup-card.final { animation: rankup-pop .5s cubic-bezier(.2,1.6,.4,1); }
    @keyframes rankup-in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes rankup-pop { from { transform: scale(.86) } to { transform: scale(1) } }
    .rankup-fill-track i { animation: rankup-fill 1.2s linear; }
    @keyframes rankup-fill { from { width: 0 } to { width: 100% } }
    .rankup-crest-flip { animation: rankup-flip .6s ease-in-out; }
    @keyframes rankup-flip {
      0% { transform: rotateY(0deg); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0deg); }
    }
  }
  /* Scope DIVISION-up -- the medium one (celebrate.js DivisionRankUp): the
     same fixed/pointer-events-off family as .rankup above, but a compact
     top banner instead of a full centered takeover. A division-up happens
     often enough during ordinary play that the grand treatment would drown
     out the tier-up it's tiered against. */
  .rankup-medium {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 205; pointer-events: none;
  }
  .rankup-medium-card {
    pointer-events: auto; cursor: pointer; display: flex; align-items: center;
    gap: 10px; padding: 8px 16px; border-radius: 8px;
    background: rgba(11,25,41,.92); border: 1px solid var(--tier);
    box-shadow: 0 8px 28px color-mix(in srgb, var(--tier) 40%, transparent);
  }
  .rankup-medium-text { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .rankup-medium-text b { color: var(--tier); font-size: 1rem; }
  .rankup-medium-text i { font-style: normal; color: var(--muted); font-size: .72rem; }
  @media (prefers-reduced-motion: no-preference) {
    .rankup-medium { animation: rankup-medium-in .28s ease-out; }
    @keyframes rankup-medium-in {
      from { opacity: 0; transform: translate(-50%, -12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  }
  /* Entity DIVISION-up -- an inline pop directly on the existing rank
     display (celebrate.js EntityCelebration, `.rank-slot-pop`), no extra
     copy: the common event, so it must read as quieter than the tier-up
     toast below. */
  .rank-slot-pop > .rank-slot { border-radius: 6px; }
  @media (prefers-reduced-motion: no-preference) {
    .rank-slot-pop > .rank-slot { animation: entity-rank-pop 1.1s ease-out; }
    @keyframes entity-rank-pop {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 55%, transparent); }
      35% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 40%, transparent); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
  }
  /* Entity TIER-up -- a toast sized to `.rank-slot`'s own footprint
     (`.rank-slot-wrap` has no padding of its own, so `inset:0` here exactly
     covers it) so it can never grow past `.objective-card`'s hard fixed
     height -- it overlays INSIDE the existing box, never changing the
     card's height. Not `position:fixed`: this lives inside one specific
     card, not the whole viewport, so it never needs the click-swallowing
     guard the scope overlays above do -- `.rank-slot` renders no
     interactive controls of its own for the toast to cover. */
  .entity-rankup-toast {
    position: absolute; inset: 0; z-index: 5; cursor: pointer;
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border-radius: 6px; border: 1px solid var(--tier);
    background: rgba(11,25,41,.94);
    box-shadow: 0 0 22px color-mix(in srgb, var(--tier) 45%, transparent);
  }
  .entity-rankup-text { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  .entity-rankup-text b { color: var(--tier); }
  .entity-rankup-text i { font-style: normal; color: var(--muted); font-size: .7rem; }
  @media (prefers-reduced-motion: no-preference) {
    .entity-rankup-toast { animation: entity-toast-in .2s ease-out; }
    @keyframes entity-toast-in {
      from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); }
    }
  }
  /* Rank tab (rankpage.js): scope picker + card + chart + breakdown, all
     scaled off ONE scope response — no separate route/course/overall pages.
     --border-soft/--muted mirror the rest of the design system (this file
     has no --line or --dim token, despite what an earlier draft assumed). */
  .rank-page { display: flex; flex-direction: column; gap: 14px; }
  /* Scope chip row (task D.1) — every season's tier at a glance, op.gg
     style. Wraps onto more rows rather than scrolling; `.is-selected`
     mirrors the scope <select>'s current value so clicking a chip never
     looks like it did nothing. */
  .scope-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .scope-chip {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
    border: 1px solid var(--border-soft); border-radius: 10px;
    background: rgba(8, 20, 34, .4); cursor: pointer; text-align: left;
  }
  .scope-chip:hover { border-color: var(--gold); }
  .scope-chip.is-selected { border-color: var(--gold); background: rgba(240, 189, 50, .14); }
  .scope-chip-text { display: flex; flex-direction: column; line-height: 1.15; }
  .scope-chip-text b { font-size: 12px; font-weight: 600; }
  /* Top-N strip (task D.2) — op.gg's "recent form" row: small, tier-tinted
     icon tiles, never a table. Fixed tile size + flex-wrap keeps rows even
     at any width instead of the row wrapping raggedly. */
  .rank-topn-card h3 { margin: 0 0 8px; }
  .topn-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .topn-tile {
    display: inline-flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; border-radius: 8px; overflow: hidden;
    border: 2px solid var(--tier-tint, var(--border-soft));
    background: rgba(8, 20, 34, .4);
  }
  .topn-icon { width: 100%; height: 100%; object-fit: contain; }
  .topn-icon.courseicon { width: 90%; height: 90%; }
  .rank-card-main { display: flex; align-items: center; gap: 16px; margin: 10px 0; }
  .rank-card-main h2 { margin: 0; font-size: 24px; }
  /* Task C.5: names the MARELO-vs-saved-PB distinction so it reads as
     intentional, not as the two banners disagreeing by accident. */
  .rank-card-note { margin: 0 0 10px; font-style: italic; }
  .rank-factors label { display: block; margin: 6px 0; font-size: 12px; color: var(--muted); }
  .rank-factors i {
    display: block; height: 8px; border-radius: 4px; background: var(--gold);
    margin: 3px 0; max-width: 100%;
  }
  /* Fixed pixel height, not `height:auto` — HistoryChart measures its own
     rendered width via ResizeObserver and redraws the viewBox to match, so
     the box and the viewBox always share one aspect ratio (1:1 drawing, no
     letterboxing, no scaled text). An `auto` height let the two diverge
     whenever `max-height` capped it below what `width:100%` implied. */
  .rank-chart { display: block; width: 100%; height: 220px; }
  .rank-chart-span { margin: 4px 0 0; }
  .rank-breakdown-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table td {
    padding: 5px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle;
  }
  /* Column headers carry the "(pts)" unit ONCE per surface (task C.2) —
     the score and gain cells below stay bare numbers, never repeating it
     per row. */
  .rank-table th {
    padding: 4px 8px 6px; border-bottom: 1px solid var(--border-soft);
    text-align: left; font-size: 11px; font-weight: 600; color: var(--muted);
    white-space: nowrap;
  }
  .rank-table tr.unpracticed .rank-cell-name { opacity: .55; }
  /* Excluded dims the WHOLE row (it counts nowhere); unpracticed dims only the
     name (gain_for's docstring: it should still read as a quest, not dead
     weight) — two different states, two different treatments. */
  .rank-table tr.is-excluded { opacity: .5; }
  .rank-cell-points { text-align: right; white-space: nowrap; }
  .rank-cell-gain { color: var(--gold); text-align: right; white-space: nowrap; }
  /* The next-rank column (task C.3) can run "Diamond III → Diamond IV" —
     the longest string on the row; it gets the room a wrap would otherwise
     take from the name column, and shrinks its type rather than reflow at
     narrow widths (swept 900px in the harness, see task-c-report.md). */
  .rank-cell-next { white-space: nowrap; font-size: 12px; }
  @media (max-width: 640px) { .rank-cell-next { font-size: 11px; } }
  .objective-live-state {
    min-width: 0; min-height: 32px; display: flex; align-items: center; justify-content: center;
    gap: .4rem; color: var(--muted); border-inline: 1px solid var(--border-soft);
  }
  .objective-live-state.running { color: var(--green); font-weight: 700; }
  .live-state-icon { font-size: 1.15rem; }
  .objective-card .pbtag {
    margin-left: 0; text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums; font-weight: 700;
  }
  .analysis-card, .attempts-card {
    height: 458px; min-height: 458px; min-width: 0; overflow: hidden;
  }
  .analysis-card { display: flex; flex-direction: column; }
  .card-heading {
    min-height: 44px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft); margin-bottom: .65rem; padding-bottom: .55rem;
  }
  .card-heading h3 { margin-top: 1px; }
  .analysis-block { min-height: 0; }
  /* ⓘ hints: an instant styled tooltip on hover/keyboard focus. The native
     title= delay read as "this button does nothing" (2026-07-24). */
  .hint { position: relative; display: inline-flex; cursor: help; color: var(--muted); }
  .hint::after {
    content: attr(data-tip); position: absolute; z-index: 40;
    left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
    width: max-content; max-width: 250px; padding: .4rem .55rem;
    border: 1px solid #42617e; border-radius: 6px;
    background: #0b1929; color: var(--text);
    font-size: .72rem; font-weight: 400; line-height: 1.4; text-align: left;
    white-space: normal; box-shadow: 0 12px 34px rgba(0,0,0,.5);
    opacity: 0; visibility: hidden; transition: opacity .12s;
    pointer-events: none;
  }
  .hint:hover::after, .hint:focus-visible::after { opacity: 1; visibility: visible; }
  .timeline-block { flex: 0 0 112px; }
  .trend-block { flex: 1 1 auto; min-height: 190px; overflow: hidden; }
  .trend-block svg { max-height: 210px; }
  /* Practice-log controls, in the card they act on: sort in the heading,
     reset visibility in the footer (the old analysis toolbar is gone). */
  .attempts-tools { display: flex; align-items: center; gap: .7rem; }
  .sort-control {
    min-height: 34px; display: inline-flex; align-items: center; gap: .3rem;
    padding: .2rem .3rem .2rem .5rem; border: 1px solid #344b64;
    border-radius: 6px; background: #101f31; color: var(--muted);
  }
  .sort-control select {
    min-height: 26px; max-width: 130px; border: 0; background: transparent;
    padding-block: 0; color: var(--text);
  }
  /* Focus ring wraps the WHOLE control (icon included), not just the inner
     select — the half-highlighted control read as broken (2026-07-24). */
  .sort-control:focus-within { outline: 2px solid #78b9ff; outline-offset: 2px; }
  .sort-control select:focus-visible { outline: none; }
  .attempt-footer-tools { display: flex; align-items: center; gap: .4rem; }
  .reset-toggle {
    min-height: 30px; display: inline-flex; align-items: center; gap: .4rem;
    padding: .2rem .45rem; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: .82rem;
  }
  .reset-toggle:hover { color: var(--text); }
  .reset-toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .reset-toggle:has(input:checked) { color: var(--gold-soft); border-color: #8e7330; }
  .attempts-card { display: flex; flex-direction: column; }
  .attempt-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; }
  .attempt-table { margin: 0; font-size: .79rem; font-variant-numeric: tabular-nums; }
  .attempt-table tr { height: 40px; }
  .attempt-table td { padding: .3rem .36rem; border-bottom: 1px solid var(--border-soft); }
  .attempt-index { width: 38px; }
  .attempt-medal { width: 34px; text-align: center; }
  .attempt-result { min-width: 0; }
  .attempt-delta { width: 72px; white-space: nowrap; font-weight: 700; }
  .attempt-strategy { width: 150px; white-space: nowrap; }
  .attempt-strategy select { max-width: 120px; min-width: 0; height: 30px; min-height: 30px; }
  .attempt-actions {
    width: 210px; text-align: right; white-space: nowrap;
  }
  .attempt-actions button { min-height: 30px; padding: .25rem .45rem; font-size: .76rem; }
  .attempt-actions .icon-button { width: 31px; padding-inline: 0; }
  .save-pb-narrow { display: none; }
  .attempt-footer {
    min-height: 40px; display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; border-top: 1px solid var(--border-soft); padding-top: .45rem;
  }
  .quiet-button, .attempt-footer > button {
    min-height: 30px; border: 0; background: transparent; color: var(--muted);
  }
  .detail-drawer { grid-column: 1 / -1; padding-block: 10px; }
  .detail-drawer summary {
    cursor: pointer; color: #d7e1ec; font-weight: 650;
  }
  .detail-drawer[open] summary { margin-bottom: .75rem; }
  .detail-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
  .danger-text { color: var(--coral); background: transparent; border-color: #61404a; }
  /* Compilation drawer (failcomp.js) — inner content; shell reuses .stdpanel/
     .disc.standards-toggle/.stdbody from the Rank-standards drawer. */
  .compilation-body { display: flex; flex-direction: column; gap: .7rem; }
  .compilation-lead { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.45; max-width: 46ch; }
  .compilation-settings { display: flex; flex-direction: column; gap: .35rem; }
  .compilation-fields { display: flex; flex-wrap: wrap; gap: .5rem; }
  .compilation-field { display: inline-flex; align-items: center; gap: .4rem; color: #cdd3da; font-size: .82rem; }
  .compilation-field input { width: 4.25rem; text-align: right; }
  .compilation-field .unit { color: var(--muted); }
  .compilation-settings small { font-size: .74rem; }
  .compilation-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
  .compilation-msg { font-size: .82rem; }
  .compilation-result {
    display: flex; flex-direction: column; gap: .4rem;
    padding-top: .6rem; border-top: 1px solid var(--border-soft);
  }
  .compilation-summary { display: flex; align-items: center; gap: .4rem; color: #a3e0a3; font-size: .82rem; }
  .compilation-path {
    color: var(--muted); font-size: .76rem; word-break: break-all;
    background: rgba(0,0,0,.28); border: 1px solid var(--border-soft);
    border-radius: 5px; padding: .35rem .5rem;
  }
  .compilation-reveal { align-self: flex-start; font-size: .8rem; }
  .stable-empty {
    min-height: 80px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center;
  }
  .stable-empty.compact { min-height: 32px; justify-content: flex-start; }
  .stable-chart-placeholder {
    flex: 1; min-height: 300px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .4rem; color: var(--muted);
    text-align: center; border-bottom: 1px solid var(--border-soft);
  }
  .stable-chart-placeholder b { color: #dce5ee; }
  .stable-chart-placeholder span { font-size: .78rem; }
  .route-focus-card { overflow: hidden; }
  /* Segments + Routes share one calm, responsive workshop language.  The
     library and editor are separate cards so state changes replace content
     inside stable slots instead of reflowing the whole page. */
  .workshop-page { min-width: 0; display: grid; gap: 12px; }
  .workshop-hero {
    min-height: 82px; display: flex; align-items: center;
    justify-content: space-between; gap: 1rem;
  }
  .workshop-title { min-width: 0; display: flex; align-items: center; gap: .75rem; }
  .workshop-title-icon, .workshop-empty-icon {
    width: 42px; height: 42px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #385875; border-radius: 50%;
    background: #102238; color: var(--gold-soft);
  }
  .workshop-title h2 { margin: .08rem 0 .16rem; }
  .workshop-title p {
    margin: 0; color: var(--muted); font-size: .79rem; line-height: 1.35;
  }
  .workshop-card { min-width: 0; margin: 0; }
  .workshop-card-heading {
    min-height: 50px; display: flex; align-items: center;
    justify-content: space-between; gap: .8rem;
    padding-bottom: .65rem; margin-bottom: .65rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .workshop-card-heading h2, .workshop-card-heading h3 { margin-top: .08rem; }
  .count-badge {
    min-width: 28px; height: 26px; padding: 0 .42rem;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #38536d; border-radius: 999px;
    color: #bed0e1; background: #102036; font-size: .74rem;
  }
  .workshop-empty {
    min-height: 460px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .55rem;
    padding: 1.25rem; color: var(--muted); text-align: center;
  }
  .workshop-empty h3 { color: var(--text); }
  .workshop-empty p { max-width: 430px; margin: 0 0 .35rem; font-size: .8rem; }
  .workshop-empty.compact { min-height: 110px; font-size: .78rem; }
  .workshop-error { padding-block: .7rem; }

  .segments-workshop {
    min-width: 0; display: grid;
    grid-template-columns: minmax(300px,360px) minmax(0,1fr);
    align-items: start; gap: 12px;
  }
  /* The editor is the half that actually overflowed the PAGE: a fixed 620px
     floor plus its own content grew the document past the viewport, the page
     got a scrollbar, and because a scrollbar steals width the whole layout
     shifted left the moment the library grew (live audit 2026-07-25 — the
     library itself was already capped correctly, measured 39px clear of the
     fold). Bound it to the viewport exactly like the library and let its own
     body scroll; min() keeps the 620px floor only where it fits. */
  .segment-editor {
    min-height: min(620px, var(--pane-cap, calc(100vh - 205px)));
    max-height: var(--pane-cap, calc(100vh - 205px));
  }
  /* Library panel: viewport-bounded, the LIST is the scroll container. The
     old cap sat on the list (100vh - 230px) and ignored the card's own
     offset from the viewport top, so the card bottom ran off-screen (user
     report 2026-07-24). 205px ≈ context bar + hero + gaps at page top;
     sticky keeps the panel fully in view while a long editor scrolls. */
  .segment-library, .route-library {
    display: flex; flex-direction: column;
    position: sticky; top: 88px;
    min-height: 0; max-height: var(--pane-cap, calc(100vh - 205px));
  }
  /* Library filter box — sits between the heading and the scrolling list, so
     it stays put while results scroll under it (flex: 0 0 auto against the
     list's flex: 1 1 auto). */
  .library-search {
    flex: 0 0 auto; width: 100%; margin: 0 0 .55rem;
    padding: .42rem .6rem; font-size: .82rem;
    color: var(--text); background: rgba(8,20,34,.58);
    border: 1px solid var(--border-soft); border-radius: 8px;
  }
  .library-search::placeholder { color: var(--muted); }
  .library-search:focus {
    outline: none; border-color: #6287aa; background: rgba(8,20,34,.85);
  }
  .segment-list {
    min-height: 0; flex: 1 1 auto;
    overflow: auto; display: grid; align-content: start; gap: .55rem;
    padding-right: 2px; scrollbar-width: thin;
  }
  .segrow {
    min-width: 0; display: grid; gap: .4rem;
    padding: .55rem; margin: 0;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.62);
  }
  .segrow.on { border-color: #6287aa; background: rgba(41,76,111,.25); }
  .segment-row-main {
    min-width: 0; min-height: 38px; display: grid; gap: .28rem;
    justify-items: start; padding: .1rem .18rem;
    border: 0; background: transparent; text-align: left;
  }
  .segment-row-main:hover { border: 0; background: transparent; }
  .segment-row-name {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 700;
  }
  .segment-row-state { min-height: 19px; display: flex; flex-wrap: wrap; gap: .3rem; }
  .segment-row-state .chip { padding: .05rem .42rem; font-size: .65rem; }
  .target-chip { color: var(--gold-soft); border-color: #806e37; }
  .muted-chip { color: var(--muted); border-color: #344353; }
  .segment-row-actions {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: .3rem;
  }
  .segment-row-actions button { min-width: 0; min-height: 31px; padding: .25rem .35rem; font-size: .69rem; }
  .segment-row-actions .is-selected { color: var(--gold-soft); border-color: #846e2e; }
  .segment-row-actions .icon-button { width: 31px; min-width: 31px; }
  /* overflow-y auto, not hidden: the pane is viewport-bounded above, so a long
     definition scrolls INSIDE the card rather than growing the document. */
  .segment-editor { overflow-x: hidden; overflow-y: auto; }
  .segbuilder { min-width: 0; border: 0; padding: 0; margin: 0; }
  .builder-heading {
    min-height: 50px; display: flex; align-items: center;
    justify-content: space-between; gap: .75rem;
    padding-bottom: .65rem; margin-bottom: .8rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .builder-heading h2 { margin-top: .08rem; }
  .builder-name { display: grid; gap: .28rem; }
  .builder-name input { width: 100%; min-width: 0; }
  .builder-enabled {
    display: flex; align-items: center; gap: .55rem; margin: .65rem 0;
    padding: .65rem .75rem; border: 1px solid var(--border-soft);
    border-radius: 7px; background: rgba(8,20,34,.55);
  }
  .builder-enabled input { min-height: 0; }
  .builder-enabled span { display: grid; gap: .05rem; }
  .builder-enabled small, .seghead small, .setting-copy span {
    color: var(--muted); font-size: .7rem; font-weight: 400;
  }
  .segment-definition-grid {
    display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .65rem;
  }
  .segsection {
    min-width: 0; margin: 0; padding: .65rem;
    border-radius: 8px; background: rgba(8,20,34,.48);
  }
  .segsection.seg-guard { grid-column: 1 / -1; }
  .seghead {
    min-height: 38px; display: flex; align-items: center; gap: .5rem;
    padding: 0 0 .5rem; margin: 0 0 .45rem;
    border-bottom: 1px solid currentColor; border-radius: 0; background: transparent !important;
  }
  .seghead > span:last-child { display: grid; gap: .05rem; }
  .seghead-icon { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center; }
  .seg-start .seghead { color: #8fce9f; }
  .seg-end .seghead { color: #e79a9a; }
  .seg-guard .seghead { color: #d8b77f; }
  .segclause {
    min-width: 0; min-height: 48px; margin: .4rem 0; padding: .42rem .5rem;
    gap: .42rem; border: 1px solid rgba(72,96,119,.35);
    border-left-width: 3px;
  }
  .segclause select { flex: 1 1 150px; }
  .segclause input { flex: 0 1 90px; }
  .segclause .clause-remove { flex: 0 0 31px; margin-left: auto; }
  .segment-add-condition { margin-top: .25rem; padding-inline: .25rem; }
  .builder-actions {
    min-height: 56px; display: flex; align-items: center; justify-content: flex-end;
    flex-wrap: wrap; gap: .5rem; margin-top: .75rem;
    padding-top: .75rem; border-top: 1px solid var(--border-soft);
  }
  .builder-actions .meta { margin-right: auto; font-size: .72rem; }

  .routes-workshop {
    min-width: 0; display: grid;
    grid-template-columns: minmax(240px,300px) minmax(0,1fr);
    align-items: start; gap: 12px;
  }
  /* .route-library shares the segment-library viewport-bound rule above;
     .library-actions (margin-top:auto) stays pinned inside the card. */
  .route-list {
    min-height: 0; flex: 1 1 auto;
    overflow-y: auto; overflow-x: hidden;
    display: grid; grid-template-columns: minmax(0,1fr);
    align-content: start; gap: .4rem;
    padding-right: 2px; scrollbar-width: thin;
  }
  .route-list-item {
    width: 100%; min-width: 0; min-height: 54px;
    display: grid; grid-template-columns: minmax(0,1fr) auto;
    justify-content: initial; text-align: left; padding: .48rem .58rem;
    background: rgba(8,20,34,.58); border-color: var(--border-soft);
  }
  .route-list-item > span { min-width: 0; display: grid; gap: .08rem; }
  .route-list-item b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .route-list-item small { color: var(--muted); font-size: .68rem; }
  .route-list-item > .ui-icon { transform: rotate(-90deg); color: var(--muted); }
  .route-list-item.on { border-color: #6287aa; background: rgba(61,101,143,.25); }
  .route-list-item.on > .ui-icon { color: #9cc9f2; }
  /* Collapsible library groups (2026-07-24, generalized from the route
     library): ONE class per level, indent expressed by the nesting itself
     (a node's children render through the same component one level deeper —
     see grouplist.js), so a third level costs nothing new here either. Rows
     keep their own .4rem gap; the group supplies a slightly larger gap above
     each header so sections read as sections without a divider line. */
  .lib-cat {
    min-width: 0; display: grid; align-content: start; gap: .4rem;
    grid-template-columns: minmax(0,1fr);
  }
  .lib-cat + .lib-cat { margin-top: .5rem; }
  .lib-cat-header {
    width: 100%; min-width: 0; display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center; gap: .4rem;
    justify-content: initial; text-align: left;
    padding: .3rem .5rem; background: transparent;
    border-color: transparent; color: var(--muted);
    font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
  }
  .lib-cat-header:hover { color: var(--text); background: rgba(8,20,34,.5); }
  .lib-cat-header b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: .74rem; letter-spacing: inherit;
  }
  .lib-cat-header > .ui-icon { transition: transform .12s ease; }
  .lib-cat-header.shut > .ui-icon { transform: rotate(-90deg); }
  /* EVERY level indents, and the indent COMPOUNDS through nesting — a child
     is always one step right of its parent, at any depth, with a guide line
     tying it to the header above it (user rule 2026-07-25: anything that
     implies a parent/child relationship indents the child one level; a
     sub-group flush with its parent reads as a sibling).

     This deliberately supersedes the earlier "depth-0 has no guide line"
     rule, which restored a pre-migration route look at the cost of leaving
     sub-group HEADERS flush with their parent — the regression the live audit
     caught. One rule on .lib-group does it: nesting supplies the depth, so a
     third or fourth level needs nothing new. */
  .lib-group {
    min-width: 0; display: grid; grid-template-columns: minmax(0,1fr);
    align-content: start; gap: .4rem;
    margin-left: .5rem; padding-left: .45rem;
    border-left: 1px solid var(--border-soft);
  }
  .lib-cat-header.sub {
    padding-left: .3rem; font-size: .68rem;
    text-transform: none; letter-spacing: .02em;
  }
  .lib-cat-header.sub b { font-size: .72rem; font-weight: 600; }
  /* Indent the ROW with a margin and let it stretch — `width: 100%` (the base
     .route-list-item rule) plus a margin is wider than the column, which both
     broke the indent and gave the library a horizontal scrollbar (live report
     2026-07-24). A vertical list never scrolls sideways: names ellipsise. */
  .lib-cat .route-list-item, .lib-cat .segrow { width: auto; }
  /* Two columns, not three: the library column is 240-300px, and three
     icon+label buttons overflowed the card (live report 2026-07-24 — "Delete"
     hung past the edge). The third wraps to its own row. min-width:0 on the
     buttons is the belt — a long label truncates instead of escaping. */
  .library-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: .4rem;
    margin-top: auto; padding-top: .65rem; border-top: 1px solid var(--border-soft);
  }
  .library-actions > button {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Same viewport bound as .segment-editor, for the same reason: an unbounded
     right-hand pane grows the document, the page gets a scrollbar, and the
     layout shifts sideways. The routes workshop has the identical shape, so it
     gets the identical treatment rather than waiting to be reported. */
  .route-workspace {
    min-width: 0; display: grid; gap: 12px;
    max-height: var(--pane-cap, calc(100vh - 205px)); overflow-x: hidden; overflow-y: auto;
  }
  .route-empty-card { min-height: min(520px, var(--pane-cap, calc(100vh - 205px))); }
  .route-setup-card { min-height: 134px; }
  .route-identity { margin-bottom: .45rem; }
  .routeavg { margin: 0; }
  .routestart {
    min-width: 0; display: grid; grid-template-columns: minmax(150px,190px) minmax(0,1fr);
    align-items: center; gap: .7rem; margin: 0;
  }
  .setting-copy { display: grid; gap: .12rem; }
  .routestart .segclause { margin: 0; }
  .route-plan-card { min-height: 370px; }
  .route-step-list { display: grid; gap: .55rem; }
  .routestep {
    min-width: 0; margin: 0; padding: .65rem;
    border-color: var(--border-soft); background: rgba(8,20,34,.55);
  }
  .routestep.routebroken { border-color: #7a414a; background: rgba(74,35,42,.22); }
  .routestep-head { min-height: 34px; gap: .42rem; }
  .routenum {
    width: 26px; height: 26px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #3d5872; border-radius: 50%;

  }

    display: grid; min-width: 56px; padding-left: .5rem;

  }
  .route-stat small { color: var(--muted); font-size: .58rem; text-transform: uppercase; letter-spacing: .04em; }
  .route-stat b { color: #d8bd7a; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .route-stat.cumulative b { color: var(--gold-soft); }
  .routestep-actions { display: flex; gap: .28rem; }
  .routestep-actions .icon-button { width: 31px; min-width: 31px; min-height: 31px; }
  .routecands { margin: .45rem 0 .25rem 34px; }
  .routecands .chip {

  }
  .routestep-foot { margin: .42rem 0 0 34px; }
  .routepick {
    min-width: 0; flex: 1; display: grid;

    gap: .38rem; align-items: center;
  }

  .routeadd {
    min-width: 0; display: grid; grid-template-columns: minmax(150px,190px) minmax(0,1fr);
    align-items: center; gap: .7rem; margin-top: .75rem; padding-top: .75rem;
    border-top: 1px solid var(--border-soft);
  }
  .route-share-card { padding-block: .7rem; }
  .route-share-card > summary {

    align-items: center; gap: .5rem; cursor: pointer; list-style: none;

  .route-share-card > summary::-webkit-details-marker { display: none; }

  .route-share-card > summary small { color: var(--muted); font-size: .69rem; font-weight: 400; }

  .routejson {

  /* Run: a fixed live-console slot plus a separate progress card. */
  .run-state, .feed-connection {

  .run-state.is-live .status-light, .feed-connection.is-live .status-light { background: var(--green); }

  /* "You are here" marker (standards.js markerPosition). A cell highlight
     would be a lie -- your time is essentially never AT a cutoff -- so the
     label lives on the active column's header instead of floating a row
     between two cutoffs: at narrow table widths (<= ~900px, live-tested)
     a floating row's label collided with the cutoff time on the same row,
     illegibly. The two cutoffs actually bracketing your time get their own
     mark; every easier tier below that (already running faster than) reads
     as beaten. */
  .std-you-badge {
    display: block; margin-top: 2px; font-size: 10px; font-weight: 600;
    color: var(--gold); white-space: nowrap;

     cell (the active-column outline), and two box-shadow rules of equal
     specificity don't combine -- the later one simply wins outright. */
  .std-marker-bracket { background: color-mix(in srgb, var(--gold) 22%, transparent); }

  /* Rank-banner crowding, keyed on the PANE and not the viewport.
     ------------------------------------------------------------------
     A rank banner cannot be abbreviated: kicker, medal, tier + division,
     and the "next" target with its delta are all the information. When the
     row runs out of room the text ellipsizes mid-word, which the user read
     as "a visual error entirely" (live report 2026-07-25). Three rounds of
     flex tuning did not fix it because the row was over-subscribed, and a
     fourth round measured it at three viewport widths and still missed it.

     These are @container rules, on .practice-page's inline-size container
     (declared above, and already what the star row's cqw units resolve
     against), because VIEWPORT WIDTH IS THE WRONG SIGNAL HERE: the sidebar
     is 206px wide above 1180px and a 76px rail below it, so the pane a card
     lives in is NOT monotonic in window width. Measured on the shipping
     shell: a 1181px window gives the card a 947px pane, while a 1180px
     window gives it 1076px. A max-width media query therefore cannot
     express "this card is too narrow"; every viewport threshold is wrong on
     one side of that jump. The container width is the thing that actually
     varies, so it is the thing that gates.

     Thresholds are measured, not guessed (headless sweep, 8 fixtures,
     scrollWidth > clientWidth on every element inside .rank-banner):
       - side by side, a banner gets about (pane - 260) / 2;
       - the widest real row is "STRATEGY * GRANDMASTER III -> Grandmaster
         II -1.28s" at 386px with the basis line hidden, 487px with it;
       - so two banners need a pane over ~1250px to keep the basis line, and
         over ~1100px without it. Below that they stack and each takes the
         full row.
     The basis line ("50/50 - 12:34.56") is what gives way first: it is
     recoverable context -- the rank mode is in the header picker and the
     full text stays in the title -- while the delta is the actionable
     number a run is chasing. Drop the recoverable thing, keep the one that
     says what to do next.

     Stacking gets its own fixed height (190px) rather than reusing the
     mobile 258px: only the metrics row grows here, the heading does not
     wrap yet. Fixed height + overflow:hidden at every breakpoint, because
     the user streams this card in OBS and a card that reflowed would shift
     their capture mid-run. */
  @container (max-width: 1250px) {
    .rank-banner-basis { display: none; }
  }
