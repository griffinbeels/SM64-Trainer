  /* ===================================================================
     Card collapse
     ===================================================================
     Every practice card can be folded to its heading. Requested for ALL
     layouts, not just narrow ones: at 900x1180 the practice log sits below
     two tall cards and cannot be reached without scrolling.

     A plain `height` interpolation, because both ends are real numbers --
     these cards carry hard pixel heights so an OBS capture never reflows
     mid-run, and collapsing just swaps one fixed height for a smaller one.
     The contract survives in both states, and the height only changes when
     the user asks it to.

     ONE `transition` declaration per element, and `.is-collapsed` sets only
     target VALUES. A second `transition` in the state rule would replace this
     one wholesale rather than adding to it, which is what produces the
     "smooth one way, snaps the other" asymmetry.

     The curve starts at y1 = 0 so the first frame actually moves rather than
     jumping a third of the way, and eases at both ends so nothing arrives
     still travelling. Timings are custom properties so the Wave 5 motion
     inspector can drive them instead of a future guess. */
  :root {
    --card-collapse-ms: 260ms;
    --card-collapse-ease: cubic-bezier(.32, 0, .24, 1);
    --card-collapsed-height: 52px;
  }

  /* `align-self: start` in BOTH states, so `height` is the only thing that
     moves and it moves between two real numbers.
     ------------------------------------------------------------------
     These cards are grid items sharing a row, and the default
     `align-items: normal` stretches them to the row's height — which is why a
     collapsed card sprang straight back to 458px however the rule was written,
     inline `!important` included. Opting out of the stretch costs nothing
     visually: every one of these cards already declares an explicit height,
     so they were the same size stretched or not.
     `max-height` was the first fix and it SNAPPED, because its open value is
     `none` and `none -> 52px` is not interpolable. Both ends have to be
     numbers for a transition to exist at all. */
  .practice-card {
    align-self: start;
    transition: height var(--card-collapse-ms) var(--card-collapse-ease);
  }
  /* (0,2,0) beats the bare `.objective-card` / `.analysis-card` height rules
     in the @container blocks above -- a container query adds no specificity of
     its own -- and this section sits after them, so it wins on both counts. */
  /* `max-height`, not `height`, and `align-self: start` with it.
     ------------------------------------------------------------------
     These cards are GRID ITEMS. `.practice-detail-grid` puts the analysis card
     and the practice log in the same row, and a grid item with the default
     `align-items: normal` stretches to its row — so a collapsed log sharing a
     row with an open analysis card was stretched straight back to the row's
     height. Measured: the rule matched, `var()` resolved to 52px, it had the
     highest specificity and came last, and the computed height stayed 458px.
     An INLINE `height: 52px !important` was ignored too, which is what finally
     ruled the cascade out — nothing about specificity can beat the row.
     `align-self: start` opts the item out of the stretch and `max-height`
     then binds. */
  /* UNFINISHED — collapses correctly, but SNAPS. Not merged.
     `max-height` is what actually binds here (plain `height` is ignored on
     these cards however it is written, inline !important included — see the
     note above), and its open value is `none`, which cannot interpolate. The
     honest fixes are (a) measure the open height in JS and write both ends as
     definite values, or (b) move the animation off the card and onto a body
     wrapper using the interpolable `grid-template-rows: 1fr -> 0fr`. Shipping
     it snapping would break the standing rule that every state change
     animates, so it stays behind this comment until one of those lands. */
  .practice-card.is-collapsed {
    align-self: start;
    max-height: var(--card-collapsed-height);
    min-height: 0;
    overflow: hidden;
  }
  /* Everything below the heading fades as the card folds. `visibility` rides
     the same transition so a collapsed card cannot be tabbed into, while
     `opacity` alone would leave it focusable and invisible. */
  .practice-card > *:not(.card-heading):not(.shead):not(.objective-heading) {
    transition: opacity calc(var(--card-collapse-ms) * .7) var(--card-collapse-ease),
                visibility var(--card-collapse-ms) step-end;
  }
  .practice-card.is-collapsed > *:not(.card-heading):not(.shead):not(.objective-heading) {
    opacity: 0; visibility: hidden;
    transition: opacity calc(var(--card-collapse-ms) * .5) var(--card-collapse-ease),
                visibility var(--card-collapse-ms) step-start;
  }

  .card-collapse {
    flex: 0 0 auto; width: 30px; min-width: 30px; height: 30px; min-height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: transform var(--card-collapse-ms) var(--card-collapse-ease),
                background 140ms ease, color 140ms ease;
  }
  .card-collapse:hover { background: #16283e; color: var(--text); }
  /* Points down when open, right when collapsed -- the chevron glyph itself
     points down, so collapsed is the rotated state. */
  .practice-card.is-collapsed .card-collapse { transform: rotate(-90deg); }

  /* The practice log leads, and the DOM is what says so.
     This was a `@container (max-width: 1060px)` block giving `.log-list-card`
     order 1 and `.analysis-card` order 2 -- his hierarchy (selector ->
     practice log -> analysis, "all the important information is hidden!!!!")
     expressed as a NARROW-ONLY override of a DOM order that said the
     opposite. Two costs, both real: above 1060px the analysis card took the
     top of the page, and `.route-focus-card` was never in the list at all, so
     picking a route pushed the log below a full route listing ("The practice
     log should always stay at the top, under the quick select picker",
     2026-08-05). Reordering the DOM (practice.js) says it once, for every
     width and every mode, and a card added later cannot silently default to
     order 0 and land above the log. `.detail-drawer` is last in the DOM too,
     so its own `order: 3` had nothing left to do either. */

  /* ===================================================================
     Practice log entity cards (Task 7; re-tuned 2026-08-03, spec
     practice-log-entity-cards -- the round that turned this into a REGISTRY)
     ===================================================================
     practicelog.js's `.log-card` -- one row per practiced star or segment,
     newest activity first. Every number and shape choice below is a row in
     `ui/logtuning.js`, threaded through as a CSS custom property
     (`var(--log-<kebab-key>, <fallback>)`) or a modifier class
     (`<prefix>-<value>`) on the log's own wrapper, `.log-list-card` --
     `PracticeLog` (practicelog.js) sets both ONCE, at mount, from the active
     tuning slot, and every `.log-card` underneath inherits the custom
     properties for free (they cascade) and matches the class-scoped rules
     below by being a descendant. `LogCard` itself never imports the
     registry -- it does not need to, which is the whole point of routing
     the tuning through CSS instead of props. `/ui/tunelog.html` is the
     inspector; fallback values in `var()` below match the registry's own
     shipped defaults so the page still looks right before JS has run.

     What the fallbacks implement, and why: the user reported four things
     about the shipped log ("reads as disorganized / sloppy") --
       1. collapsed cards didn't line up (a flexible identity column sized
          itself per-card); fixed by `--log-identity-percent` (floored by
          `--log-identity-floor`) -- every card reserves the SAME SHARE of
          its own card width for the identity column, so every icon lands on
          the same x regardless of what else is on that row. Re-tuned
          2026-08-04 (spec practice-log-entity-cards) from a fixed px track
          to a percentage share; the `oneLine` section below has the full
          reasoning -- identity/ranks/PB are the same mechanism now, not one
          fixed track among flexible ones.
       2/3. a closed card was vertically massive at a narrow window, and
          should look the SAME at a wide one, just bigger ("maybe this can
          just be the same layout in both screen sizes") -- fixed by
          `collapsedLayout: oneLine` (icon, name, ranks, PB, chevron on one
          row) plus `widthMode: same` (no width-triggered layout switch),
          both the shipped default; `rankStyle: chips` is what makes ONE
          LINE possible at all, since a full rank banner (progress bar,
          next-step line, basis) cannot fit beside a name, a second rank, a
          PB tag and a chevron on one row.
       4. an open card's attempt rows didn't read as belonging to it; fixed
          by `--log-body-indent` (pushes the table right) and
          `--log-body-tint` (a black wash over the SAME background colour,
          so the rows read as sitting UNDER the card rather than as a
          different surface).

     `collapsedLayout: stacked` and `widthMode: stackNarrow` both survive as
     real, selectable options -- they ARE today's original narrow layout,
     kept so the human can dial back to it and compare rather than having it
     deleted out from under him.

     2026-08-04 round (spec 2026-08-04-rank-variants): two more genuine
     layout bugs plus four new options to try, all against this same
     registry. BUG 1 -- the ranks grid track absorbing free space up to its
     own fixed cap instead of genuinely, so the PB tag and chevron sat well
     short of the card's true right edge -- is at the `log-layout-oneline`
     rule below, with the full reasoning. BUG 2 -- the rank icon having no
     tunable of its own while every OTHER size on the card grew one, which
     read as the whole rank display being too short -- is at
     `.log-list-card .rank-banner-icon`, below. The four options:
     `nameOverflow` (shrink-to-fit, JS-measured, ui/components/shrinkname.js)
     and `courseName` (hide the course/context line) both live in the
     Identity rules just above; `rankStyle` gained `stackedRow` (the same
     MARELO-shaped Stacked display, side by side instead of one above the
     other) and `column` (a third, even more condensed `layout` value of
     RankBanner's own, `.rank-banner-column` above) -- both proved to keep
     the climb by the SAME live guards `stacked` already has
     (tests/test_ui_rank_stacked_climb.py's sibling for column;
     tests/test_ui_rank_stacked_layout_source.py already covers every
     `layout` value structurally, not just one).

     SUPERSEDED (2026-08-04, layout-matrix round, same day): every mention of
     a single `rankStyle` choice above describes what shipped that morning,
     not what ships now -- Griffin: "we need a different layout for narrow
     and a different layout for wide, and different layouts depending on if
     there's a different rank standard for strategy/star." One global choice
     could never answer that; four CHOICES rows (one per cell of narrow/wide
     x two-ladder/one-ladder) replaced it the same day, resolved by the
     "Layout matrix" CSS section below the `oneLine`/`rankStyle` rules --
     kept here rather than rewritten, since the bugs and reasoning above are
     still exactly what happened.

     Two things this card deliberately does NOT inherit, unlike every other
     `.practice-card` on this page: a fixed height (`.analysis-card`/
     `.objective-card` are a hard 458-463px so an OBS capture never reflows
     mid-run -- the log is the page's one variable-height surface BY DESIGN,
     since how many cards it draws depends on what was practiced) and
     `overflow: hidden` (a rank banner's wing paints ~9px above its own box
     -- `.rank-slot`'s own comment, above -- and a container clip cannot
     tell a wing from a word). Neither rule lives on `.practice-card` or
     `.log-list-card` itself, so this section is what keeps it that way
     rather than adding one by accident. */
  .log-list { display: flex; flex-direction: column; gap: var(--log-card-gap, 2px); margin-top: .2rem; }
  .log-card {
    min-width: 0; border: 1px solid var(--border-soft); border-radius: 9px;
    background: rgba(9,22,36,.55);
    /* ONE `transition` declaration on this element -- `.is-selected` (below)
       sets ONLY its two target values and declares no `transition` of its
       own, or it would wholesale-replace this one the instant a card became
       selected (the standing trap: CSS `transition` is not additive across
       rules on the same element, so a higher-specificity state rule that
       declares its own `transition` silently drops whatever this one does
       not repeat). Griffin's rule: every state change animates, both
       directions -- `.log-card` had no transition at all before, so
       `.is-selected` snapped. */
    transition: border-color 160ms ease, background 160ms ease;
  }
  .log-card.is-selected { border-color: #5d89b8; background: rgba(20,42,66,.55); }
  .log-card.is-unassigned { background: rgba(9,22,36,.3); }
  /* The Ready/Running highlight the deleted Active Target card used to carry
     alone (amendment A8: "whatever we're CURRENTLY practicing should be
     highlighted in the practice log in this way to make it abundantly
     clear"). Same gold `.active-star` accents the quick-select row's own
     "this cell is what's active" cell already uses
     (`.starcell.active-star`) -- one visual language for "active" across the
     app, not a second one invented for this card. Declared explicitly for
     the combined selected+active case (0,3,0) rather than relying on source
     order against `.is-selected` (0,2,0): browsing a DIFFERENT card while
     the active one keeps practising is the ordinary case, so both signals
     must be able to show on two different cards, or on the same one,
     without one silently winning by accident. */
  .log-card.log-card-active { border-color: #e0c36a; background: rgba(224,195,106,.07); }
  .log-card.log-card-active.is-selected { border-color: #e0c36a; background: rgba(20,42,66,.55); }
  /* identity (art+name) | ranks | PB | fold -- the same four things every
     other section's own heading carries, one row instead of a whole card.
     `min-height` derives from the icon size and the head's own vertical
     padding rather than a fifth literal, so a bigger icon never gets
     silently clipped by a shorter row. Every layout choice below overrides
     grid-template-columns/areas; nothing else in this base rule changes
     between them. */
  .log-card-head {
    min-width: 0; display: grid;
    min-height: calc(var(--log-icon-size, 40px) + var(--log-head-pad-y, 10px) * 2);
    align-items: center; gap: .65rem;
    padding: var(--log-head-pad-y, 10px) var(--log-head-pad-x, 14px);
  }
  /* NAMED AREAS, not just columns -- and that is the whole bug this replaced
     (live report 2026-08-04: "the unassigned entry card is ~double height
     compared to the normal card height"). `.log-card-fold` carries
     `grid-area: fold`, and a named grid-area with NO matching
     `grid-template-areas` does not fall back to auto-placement: the name
     resolves to implicit lines, so the button was placed on a whole new
     implicit ROW under the label instead of beside it. Two rows, double
     height, and nothing overflowed or truncated -- so every DOM probe read
     the card as perfectly healthy. Declaring the area is the fix; the
     two-column track list alone never could be. */
  .log-card.is-unassigned .log-card-head {
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-areas: "identity fold";
  }
  .log-card.is-unassigned .log-card-name { grid-area: identity; }
  /* Wraps the select-button row AND the strategy picker beneath it
     (amendment A2 -- the card head's strategy NAME became the same picker
     the deleted Active Target card used). `grid-area: identity` lived on
     `.log-card-select` alone before this; it moves up here so a genuine
     interactive `<select>` can sit BELOW the button as its sibling rather
     than nested inside it -- a `<select>` is not valid content for a
     `<button>`, and nesting them would also mean a click on the picker
     bubbles into the card's own "select this card" gesture. Every layout
     variant (oneLine/twoLine/stacked, ranks-in-head/-in-body) names exactly
     one "identity" grid area, so this wrapper drops into all of them with no
     further CSS -- same mechanism `.log-card-select` used before, just one
     level up. */
  /* One-line-heads round (2026-08-04): a flex ROW, not a column -- the
     strategy picker sits BESIDE the icon+name button now instead of stacked
     beneath it (Griffin: "move the selector to the right of the identity
     display... this should also reduce the entire height of the card").
     Both children (`.log-card-select` below, `.log-card-strat-picker`/
     `.log-card-strat` near the bottom of this file) are this div's own flex
     items -- the picker lives INSIDE whichever grid track "identity" already
     owns in every layout/placement combination, so no `grid-template-areas`
     anywhere in this section needed a new named area for it, and it can
     never draw from the ranks or PB tracks. */
  .log-card-identity {
    grid-area: identity;
    min-width: 0; display: flex; flex-direction: row; align-items: center; gap: .5rem;
    container: log-card-identity / inline-size;
  }
  /* A PB caveat belongs immediately LEFT of the strategy picker, never in
     the PB track. Reserve the slot even when no caveat is present: a saved PB
     gaining or losing a marker must not shove the selector sideways at a
     fixed window size. The full word fits when the identity allocation can
     afford it; the identity's OWN container (not the page width) collapses
     the slot to the same glyph-only treatment the quick selector uses. */
  .log-card-caveat-slot {
    flex: 0 0 7rem; min-width: 0;
    display: inline-flex; align-items: center; justify-content: flex-end;
  }
  .log-card-caveat-slot:empty { visibility: hidden; }
  .log-card-caveat-slot .caveat-chip {
    margin-left: 0; gap: .22rem; padding: .04rem .38rem;
  }
  .log-card-caveat-slot .caveat-chip-word { display: inline; }
  @container log-card-identity (max-width: 430px) {
    .log-card-caveat-slot { flex-basis: 1.45rem; }
    .log-card-caveat-slot .caveat-chip { gap: 0; padding-inline: .3rem; }
    .log-card-caveat-slot .caveat-chip-word { display: none; }
  }
  /* NO STEP TRACK ON THIS ROW ANY MORE (2026-08-06). Everything that used to
     live here -- the track's own placement, the `align-self` baseline pair
     that put it on the name's line, `flex-wrap: wrap` so a long route could
     take a second line, and `:has(.step-row)` stopping the name from growing
     -- is DELETED with the element, not left dormant. Griffin's ruling after
     two rounds of trying to seat it: "we should just remove the step
     indicator entirely from the display here. It's too cramped."
     The identity row is therefore back to what it was before the track
     arrived: `nowrap`, one growing name button, the picker on the right. Do
     not re-add a wrap here for a future third item without measuring what it
     does to the head's height -- an item that wraps inside this row grows the
     card, and every card in the log is meant to be the same height.
     The `.step-row`/`.step-chip`/`.step-mark` rules near the top of this file
     STAY: the segment recorder's own review row (`StepPicker`) still draws
     them, and that is the surviving consumer. */
  /* The picker sits hard right. `.log-card-select` grows into the row, so
     this margin is belt-and-braces rather than the mechanism -- it is what
     keeps the picker right-aligned if the name button ever stops growing.
     From "the drop down for 'Standard' there should be all the way to the
     right, like for a star's card" (2026-08-06). */
  .log-card-identity .log-card-strat-picker,
  .log-card-identity .log-card-strat { margin-left: auto; }
  .log-card-select {
    /* `flex: 1 1 auto` -- the identity row's other item
       (`.log-card-strat-picker`/`.log-card-strat`) carries a fixed
       flex-basis, so THIS is the one that actually stretches into whatever
       room a wide card offers, and the one that gives up space first as the
       row narrows (a bigger flex-basis loses proportionally more under
       flex-shrink) -- the name ellipsises before the picker gets crowded. */
    min-width: 0; flex: 1 1 auto; display: flex; align-items: center; gap: var(--log-identity-gap, 10px);
    padding: 0; border: 0; border-radius: 6px; background: none;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
    /* Same shape as `.log-card` above: one declaration here, `:hover` sets
       only the target background. Matches `.log-card-fold`'s own 140ms
       background transition just below, so the whole head's hover language
       is one duration. */
    transition: background 140ms ease;
  }
  /* Had no hover at all before -- only `:focus-visible` -- so a mouse user
     got no feedback that this whole row is one clickable target until they
     actually clicked it. Same treatment `.log-card-fold`'s own hover uses. */
  .log-card-select:hover { background: #16283e; }
  .log-card-select:focus-visible { outline: 2px solid #78b9ff; outline-offset: 3px; }
  .log-card-art {
    flex: 0 0 auto; width: var(--log-icon-size, 40px); height: var(--log-icon-size, 40px);
    object-fit: contain;
  }
  .log-card-name { min-width: 0; display: flex; flex-direction: column; gap: .05rem; }
  .log-card-context {
    color: var(--muted); font-size: var(--log-course-size, 8px); text-transform: uppercase;
    letter-spacing: .04em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .log-card-name b {
    font-size: var(--log-name-size, 11px); font-weight: 700;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* identityAlign: "left" restates the flex row's own default start-
     alignment EXPLICITLY (a genuine no-op, since `justify-content` is
     already `flex-start` with no rule at all) so it is a real, greppable
     rule rather than an implicit gap a reader -- or the tuning guard's own
     "is this option actually read" scan -- has to infer. "centred" is the
     one that visibly moves something. */
  .log-list-card.log-align-left .log-card-select { justify-content: flex-start; }
  .log-list-card.log-align-centred .log-card-select { justify-content: center; }
  .log-list-card.log-align-centred .log-card-name { align-items: center; text-align: center; }
  /* nameOverflow (Option 1): what happens to `.log-card-name b` when the
     name is wider than the identity column. "ellipsis" restates the base
     rule above explicitly (a genuine no-op, same reasoning as `log-align-
     left`) -- it is what the base rule already does with no choice applied
     at all. "wrap" is the real change: the row's own `min-height` is a
     FLOOR, not a ceiling, so a second line simply grows the head (and the
     grid row it shares with identity/ranks/pb/fold) rather than being
     clipped. "shrinktofit" is measured in JS
     (ui/components/shrinkname.js -- CSS cannot size text by its own
     rendered length) and keeps the SAME overflow/ellipsis fallback as
     "ellipsis": the JS writes an inline `font-size` that outranks this
     rule entirely when it fits, and this is the honest degrade for the one
     case its own floor still cannot resolve (a name far longer than
     anything the corpus this was tuned against carries). */
  .log-list-card.log-nameoverflow-ellipsis .log-card-name b {
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .log-list-card.log-nameoverflow-wrap .log-card-name b {
    overflow: visible; white-space: normal; text-overflow: clip;
  }
  .log-list-card.log-nameoverflow-shrinktofit .log-card-name b {
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* courseName (Option 4): the small course/context line above the entity
     name. "show" restates the default (a genuine no-op); "hide" frees a
     whole line of the identity column's own height -- built as a plain
     preference rather than tied to a width, since he asked for the choice
     of whether it is worth the room, not for it to vanish only when the
     window narrows (`.claude/rules/`-style: a control this codebase already
     avoids hard-wiring to a breakpoint when the user only asked for an
     option). */
  .log-list-card.log-coursename-show .log-card-context { display: block; }
  .log-list-card.log-coursename-hide .log-card-context { display: none; }
  /* The switchable rank banner for this entity (Strategy or Overall). Row or
     column depending on `collapsedLayout` (below). No overflow clip here: a
     hat's wings paint outside its own box, same reason as `.rank-slot`. */
  /* BUG 1 (2026-08-04 round): this box's own GRID CELL is the flexible one
     in the `oneLine` layout (see its `grid-template-columns` rule below --
     its own comment there has the full reasoning), which is what lets it
     take the slack instead of the PB tag and chevron. No `justify-self`
     override is used for that, DELIBERATELY: an explicit `justify-self:
     start` produces the identical POSITION but changes how this box
     computes its OWN width in the process (a grid item with a real
     justify-self value sizes to fit-content instead of stretch-to-fill),
     which starves `.rank-banner-name`'s flex-grow of the room the stretched
     box used to hand it for free -- measured live: it cost `.rank-banner-
     name` exactly the pixel or two some maxed-tier names (a Mario/Luigi
     rank) needed, turning 28 pre-existing narrow-width truncations
     (tests/test_responsive.py's own long-owed 850-913px shortfall) into 88
     across nearly every viewport in the matrix, caught only by running the
     real sweep, not by eye.

     Re-tuned again 2026-08-04 (spec practice-log-entity-cards, the percent-
     columns round): this box no longer carries its own `max-width` cap
     either. BUG 1's fix gave the grid CELL all the leftover space and then
     capped this BOX inside it at a fixed 420px, so on a wide card the free
     space showed up as a gap beside a capped banner rather than a wider
     one; now the `oneLine` cell itself IS the percentage share
     (`--log-ranks-percent`), so the default stretch above fills that share
     exactly -- there is no second number to keep in step with the grid
     track, and no leftover gap for one to create. `twoLine`/`stacked`
     (below) have no share of their own to fill instead: their `ranks` cell
     is still a plain `minmax(0, 1fr)`, so this box now stretches to that
     row's own full width in those two layouts -- a real, accepted
     difference from before (they used to share this box's 420px cap too),
     left alone because neither is the shipped default and the responsive
     sweep only ever exercises `oneLine`. */
  .log-card-ranks {
    grid-area: ranks;
    min-width: 0;
    display: flex; gap: var(--log-rank-gap, 13px);
    align-self: stretch; justify-content: center;
  }
  .log-card-ranks .rank-progress-track { height: var(--log-rank-bar-height, 5px); }
  /* BUG 2 (2026-08-04 round): scoped to the log card, not the generic
     `.rank-banner-icon` rule above -- that rule also reaches the objective
     card's own banners and both tuning demos, none of which this registry
     tunes, and widening it there would move something nobody asked to move.
     The old bare 24px is what made the whole rank display read as too short
     next to a bigger course icon and a wider name column once THOSE grew
     tunables of their own; this is the one size on the card that had none. */
  .log-list-card .rank-banner-icon { --icon-size: var(--log-rank-icon-size, 28px); }
  .log-card-head .pbtag {
    grid-area: pb; justify-self: end;
    font-size: var(--log-pb-size, 13px);
    /* RESTORED 2026-08-05, and the regression the percent-columns round
       (2026-08-04) introduced by removing this is a SHARED COLUMN GRID one,
       not the backward-bleed BUG 1 already documented above: "the strategy
       selector position was in the same spot regardless of whether the user
       has a PB or not" (his screenshot: rows reading a formatted time put the
       selector at one x, rows reading "no PB yet" put it noticeably further
       right). `.log-card-head` is a SEPARATE grid per card, not a subgrid
       shared down the list, so nothing forces two rows' columns to agree --
       the only thing that DOES is every row computing the identical track
       widths, which needs every row's PB TRACK minimum to be the same
       number. The `pb` track below already reads `minmax(auto, …)`
       DELIBERATELY (its own comment explains why `0` was wrong: it disables
       grid's automatic-minimum-size protection entirely) -- `auto` means
       "this track's floor is whatever is inside it," and without a min-width
       HERE that is the PB TAG'S OWN TEXT, which is shorter for "no PB yet"
       than for a saved time. Giving the tag a constant floor makes its
       min-content contribution to the track constant too, so `auto` reads
       the SAME number on every row regardless of what that row's PB says --
       the track's own shape (a share of the card, still free to grow past
       this floor for a genuinely long PB string) is untouched. This is a
       DIFFERENT number from the deleted 92px: `--log-pb-width` is a fresh
       logtuning.js row (default 100px, "Result" group), tuned against a
       render carrying every PB length in play (a short time, a long one,
       "no PB yet"), not a restatement of the old constant. */
    min-width: var(--log-pb-width, 100px);
    /* Pushes the PB tag away from the rank column -- 0 by default (byte-
       identical), a real gap once a wide rank display (Stacked included)
       leaves the two crowded together. */
    margin-left: var(--log-pb-offset, 0px);
    white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700;
  }
  /* Book mark (Task 7, spec 2026-08-07-library-page) sits BESIDE the fold
     button now, sharing its "fold" grid-area through this wrapper rather
     than claiming a fifth named area of its own -- see practicelog.js's own
     comment at the call site for why a new area was rejected. `.log-card-
     fold`'s `grid-area: fold` below is what actually places this wrapper (it
     is the direct grid child); the button keeps the declaration as a
     harmless no-op on the rare `UnassignedLogCard` header, which has no
     wrapper and still needs it. */
  .log-card-actions { grid-area: fold; display: flex; align-items: center; gap: .3rem; }
  /* Same 30px icon-button shape as `.log-card-fold` below, minus its rotate
     transition -- sharing that class outright would spin the bookmark
     glyph -90deg on every closed card along with the chevron. */
  .log-card-library-link {
    flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex;
    align-items: center; justify-content: center; padding: 0;
    border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  .log-card-library-link:hover { background: #16283e; color: var(--text); }
  .log-card-fold {
    grid-area: fold;
    flex: 0 0 auto; width: 30px; height: 30px; display: inline-flex;
    align-items: center; justify-content: center; padding: 0;
    border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: transform 160ms ease, background 140ms ease, color 140ms ease;
  }
  .log-card-fold:hover { background: #16283e; color: var(--text); }
  /* Points down when open, right when closed -- same convention as
     `.card-collapse` (above), a separate mechanism (LogCard's fold is local
     component state, not the shared useCollapsed class) reusing the same
     visual language rather than growing its own. */
  .log-card.is-closed .log-card-fold { transform: rotate(-90deg); }
  /* DELETED, not zeroed to taste: `padding: 0 .7rem .55rem` here dated from
     when the step row was a row of its OWN beneath the card head and needed
     the card's horizontal padding plus a gap under it. It moved onto the
     identity line (see `.log-card-identity .step-row`), where
     `.log-card-head`'s own padding already does both jobs -- so all that was
     left was 8.8px of invisible slack UNDER the track and 11.2px of stolen
     width on each side of it. The slack is what made an armed card 7px taller
     than every other one the moment the track stopped being centred on the
     row, which is how it was found; the stolen width came free with it and
     `tests/test_step_track_fits.py` measures the wider row now. */
  /* Item 4: an open card's rows read as belonging to it -- extra LEFT
     padding (the RIGHT/bottom stay the card's own .7rem/.6rem, only the
     side facing the head's fold column grows) plus a black wash the same
     hue as the card itself, so the rows read as sitting UNDER the card
     rather than as a different surface. `--log-body-gap` is the padding
     ABOVE the first row, under the divider. */
  .log-card-body {
    padding: var(--log-body-gap, 4px) .7rem .6rem calc(.7rem + var(--log-body-indent, 50px));
    border-top: 1px solid var(--border-soft);
    background: rgba(0, 0, 0, var(--log-body-tint, 0.16));
  }
  .log-card-body .attempt-table tr { height: var(--log-row-height, 40px); }
  /* A STAR'S PIECES, inside its own card (round 22, 2026-08-08): "the
     subsection should appear WITHIN the star's practice log entry as a
     sub-entry... indented a bit so it's clear that it's owned by the parent
     card." Indent is the machine-level rule -- anything implying parent/child
     indents the child ONE level -- and it is expressed by the DOM nesting
     itself (a margin on this wrapper), never by a depth custom property,
     matching `.lib-group`'s own treatment. The guide line is the same
     vocabulary the library groups use, so "owned by the parent" reads the
     same way in both places.
     No `Disclose` of its own: this block sits INSIDE the parent's, so the
     parent's fold animates it for free -- "if the parent star closes the
     card, these close with it". */
  /* ALIGNED WITH THE CARD'S OWN CONTENT, not indented again on top of it
     (round 23, 2026-08-08). Griffin: "all of the segment cards should be
     in-line with the rank standards card above it (aka they should be
     expanded to the left a bit to be in line with the rest of the elements
     above)." `.log-card-body` already carries `--log-body-indent`, so an
     extra margin here indented the pieces TWICE -- which is also why their
     attempt rows wrapped where the parent's identical rows fit ("some
     elements may bleed into two rows (like the checkbox next to the 12\"20")):
     a child had ~70px less width than its parent at the same window size.
     The guide line stays, pulled into the body's own left padding by the
     negative margin, so the content edge lands exactly on the Rank standards
     panel's while the line still says "owned by the parent". Content x is
     therefore unchanged by the border -- the two values must stay equal. */
  .log-card-children {
    display: flex; flex-direction: column; gap: .3rem;
    margin: .5rem 0 .1rem -.75rem; padding-left: .75rem;
    border-left: 1px solid var(--border-soft);
  }
  /* Pieces read as belonging to the card around them rather than as a second
     list of top-level cards: no gold "active" border of their own (the parent
     already carries it for the pair) and a quieter surface. */
  .log-card-children .log-card { background: rgba(255,255,255,.02); }
  /* NOT here: a rule zeroing `--log-body-indent` inside a nested card. It was
     written for the wrap in round 23 and MEASURED not to cause it -- with the
     indent restored, a piece's result cell is 44px against its parent's 44px
     at the 850px floor. The wrap was entirely the double LEFT OFFSET above.
     A child's rows keep lining up under the child's own name, the same way
     every other card's do. */
  .log-list-footer { display: flex; justify-content: center; margin-top: .3rem; }
  /* The rank wash (`.rank-banner::before`, near the top of this file) bleeds
     -8px top / -12px bottom / -16px left assuming it lands in a CARD's own
     padding -- true for `.objective-card`/`.analysis-card`, whose rank
     banners sit as the last thing before the card's own edge (or a fixed row
     re-scoped for it, `.seg-waiting` above). A log card's head is a tight
     single ROW (identity | ranks | PB | fold), so above and beside
     `.log-card-ranks` are other interactive controls, not empty padding --
     measured, the wash bled 12px onto the fold button, 8px onto the select
     button, 5px onto the sibling banner and 3px onto the PB tag at every
     width (uilab's decoration probe). Zero the bleed rather than re-tune it
     smaller: this row has no reserved padding for it to fade into, the same
     reasoning the seg-waiting override (near the top of this file) already
     uses. It wins on SPECIFICITY, not source order: the base rule it
     overrides, `.rank-banner::before`, is a class + pseudo-element (0,1,1);
     adding the `.log-card-ranks` ancestor here makes this one (0,2,1) --
     one class higher, so it would win even declared first. Ditto
     `.log-card-ranks .rank-banner:first-child::before` below it, at (0,3,1)
     against the (0,2,1) `.rank-banner:first-child::before` it overrides. */
  .log-card-ranks .rank-banner::before { top: 0; bottom: 0; left: 0; right: 0; }
  .log-card-ranks .rank-banner:first-child::before { left: 0; border-radius: 0; }
  /* Item 3, 2026-08-04 layout-matrix round -- Griffin: "the background for
     each rank standard display should be a bit longer... the colors here
     have a gradient that stops kinda in the middle behind the cap... We
     might need to move everything over to the left a bit." The base wash
     (above, `.rank-banner::before`) was tuned for the objective card's own
     ~380px-wide row; a log-card rank widget is 96-200px (Column/Stacked),
     so the SAME `34% -> 88%` stops put the fade well inside a box this much
     narrower -- solid color for barely a third of it, fully faded a tenth
     short of the far edge. Only the gradient's COLOUR STOPS change here,
     never `top`/`bottom`/`left`/`right` (the box geometry set just above,
     which is the only thing the decoration probe's bleed check reads) --
     this box's own extent is unchanged, so it cannot bleed onto a neighbour
     any more than it already didn't. Starts solid closer to the left edge
     (10%, was 34% -- "move everything over to the left") and now reaches
     the box's own far edge before fading out (100%, was 88%) instead of
     leaving a dead final tenth -- "should be taking up a bit more space." */
  .log-card-ranks .rank-banner::before {
    background-image: linear-gradient(90deg,
      color-mix(in srgb, var(--climb-color, transparent) 34%, transparent) 10%,
      transparent 100%);
  }
  .log-card-ranks .rank-banner:not(:first-child)::before {
    background-image: linear-gradient(90deg, transparent,
      color-mix(in srgb, var(--climb-color, transparent) 34%, transparent) 4%,
      transparent 96%);
  }

  /* ---- Layout matrix: which of the six variants a card shows, per cell -----
     (2026-08-04, spec practice-log-entity-cards round 2). Four CHOICES rows
     (ui/logtuning.js) replace the single `rankStyle` this section used to
     read -- historically one per cell of narrow/wide x two-ladder/one-ladder
     -- and this is the CSS that resolves them. Task 0097 made every practice
     card a one-banner display, so practicelog.js now always supplies
     `log-card-one-ladder`; the `*-two-*` selectors remain only so the tuning
     registry's older saved values still parse, not as a reachable card shape.
     Which of the six shapes applies is therefore `.log-list-card`'s
     `log-rankstyle-<width>-one-<value>` class crossed with an `@container`
     query at 860px
     against `.practice-page` -- never `@media`, this file's own law, above.
     Measured DIRECTLY IN CONTAINER-WIDTH terms, not the pane/window
     width a first pass measured by mistake: `.practice-page` sits
     inside the app shell's sidebar column, so its own width is
     never the window's. Forcing every cell to stackedRow and
     reading `.practice-page`'s real `getBoundingClientRect().width`
     directly, this is where two MARELO widgets side by side first
     reach their own full designed size (stackedRankWidth x2 + gap,
     413px shipped) rather than being squeezed under it -- never
     literally WRAPPING at any width tried. "Not yet given its own
     room" is the real signal here, not overflow -- and it sits
     comfortably below the app's 850px supported floor once the
     sidebar's real width (a 76px rail below 1180px window width,
     this codebase's own responsiveness law) is accounted for, so
     Column is reachable in practice, not only on paper.
     `RankBanner` itself is untouched -- its `layout` prop
     stays row/stacked/column for its other caller (tune.js's manual preview);
     practicelog.js no longer resolves one at all. Every rule below reaches
     `.rank-banner` and its children through ANCESTOR context alone, the same
     mechanism `collapsedLayout`/`widthMode` already use, so the identical card
     can show Column at 900px and stackedRow at 1400px with no re-render --
     nothing here is a JS decision. `:not(.rank-banner-empty)` on every grid-
     shape rule keeps a sentinel ("pick a strat to see your rank") in its own
     plain flex layout regardless of the chosen shape -- today's JS-gated
     mechanism could never reach a sentinel with `-stacked`/`-column` (the early
     return in RankBanner precedes the class ternary), and an ancestor-only
     selector has no such gate for free, so it is stated explicitly here. */

@container not (max-width: 860px) {
    /* "banners" -- RankBanner's own unmodified output; declared for the same reason every no-op choice in this file is (a real rule, never an implicit gap). */
    :is(
        .log-list-card.log-rankstyle-wide-two-banners .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-banners .log-card.log-card-one-ladder
      ) .log-card-ranks .rank-banner { opacity: 1; }
  }

@container (max-width: 860px) {
    :is(
        .log-list-card.log-rankstyle-narrow-two-banners .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-narrow-one-banners .log-card.log-card-one-ladder
      ) .log-card-ranks .rank-banner { opacity: 1; }
  }

@container not (max-width: 860px) {
    /* "chips" drops the label, bar, next-step line and basis, leaving icon+name; "capsOnly" also drops the name, leaving the icon alone. The wash goes with them in both -- a colour flourish behind fields that are no longer there reads as a stray highlight. */
    :is(
        .log-list-card.log-rankstyle-wide-two-chips .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-chips .log-card.log-card-one-ladder,
        .log-list-card.log-rankstyle-wide-two-capsonly .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-capsonly .log-card.log-card-one-ladder
      ) .log-card-ranks .rank-banner-kicker,
    :is(
        .log-list-card.log-rankstyle-wide-two-chips .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-chips .log-card.log-card-one-ladder,
        .log-list-card.log-rankstyle-wide-two-capsonly .log-card.log-card-two-ladder,

    :is(
        .log-list-card.log-rankstyle-wide-two-chips .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-chips .log-card.log-card-one-ladder,
        .log-list-card.log-rankstyle-wide-two-capsonly .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-capsonly .log-card.log-card-one-ladder

    :is(

        .log-list-card.log-rankstyle-wide-one-chips .log-card.log-card-one-ladder,

        .log-list-card.log-rankstyle-wide-two-capsonly .log-card.log-card-two-ladder,
        .log-list-card.log-rankstyle-wide-one-capsonly .log-card.log-card-one-ladder

    :is(

        .log-list-card.log-rankstyle-wide-one-capsonly .log-card.log-card-one-ladder
      ) .log-card-ranks .rank-banner-name {
      display: none;
    }
  }

@container (max-width: 860px) {

@container not (max-width: 860px) {
    /* "stacked" and "stackedRow" are the SAME MARELO-shaped grid (RankBanner's own .rank-banner-stacked, above, replicated here since layout is no longer a JS prop for this card) -- only their CONTAINER direction differs, set separately below. */
    :is(

    :is(

        .log-list-card.log-rankstyle-wide-one-stacked .log-card.log-card-one-ladder,
        .log-list-card.log-rankstyle-wide-two-stackedrow .log-card.log-card-two-ladder,

    /* Live report 2026-08-04: the wash bisected by a dark line at the

       report and the fix. Same reasoning, reached here through the log
       card's OWN ancestor classes rather than the `layout` prop. */
    :is(
        .log-list-card.log-rankstyle-wide-two-stacked .log-card.log-card-two-ladder,

  /* ---- collapsedLayout: the head's own grid shape ------------------------
     All three are real, always-selectable shapes -- not a responsive
     override -- so the inspector can flip between them at one width and
     compare. `oneLine` is the shipped default and its own row is the one
     place identity/ranks/PB genuinely split ONE row three ways, which is
     what makes a percentage split meaningful there; `twoLine`/`stacked` give
     identity the whole first row to itself, so a flexible `minmax(0,1fr)`
     already keeps every card's icon flush left with nothing to apportion.

     PERCENT COLUMNS (2026-08-04 round, spec practice-log-entity-cards):
     identity/ranks/PB were three independently-tuned PIXEL numbers until
     this round -- a fixed identity track (BUG 1's own history, below, has
     the detail), a fixed max-width cap on the rank banners, a fixed
     min-width floor on the PB tag. User, 2026-08-04: "I think the rank
     column should maybe take up 70% of the width, 20% for the course
     identity, 10% for the pb+dropdown icon... we should be able to control
     the relative overall spacing as a percentage of the whole column
     width." A pixel number is right at exactly one card width; a SHARE is
     right at every width by construction, which is why this is a
     simplification and not merely a unit swap -- one fewer thing to
     re-tune per breakpoint, not a new thing to learn.

     The three shares (`--log-identity-percent`/`--log-ranks-percent`/
     `--log-pb-percent`, all "%"-unit rows in ui/logtuning.js) are written by
     `logTuningVars` as bare CSS `fr` values, not literal percentages --
     see that function's own comment for why. The practical consequence
     lives entirely in the track function below: `minmax(floor, Nfr)` for
     identity, `minmax(0, Nfr)` for ranks and PB. A `<flex>` (`fr`) track is
     a WEIGHT among its siblings, not an absolute fraction of the row, so
     the three do NOT need to sum to 100 -- the grid distributes whatever
     space is left after every track's own minimum (identity's floor; 0 for
     the other two) in proportion to these weights, so 20/70/10 and
     40/140/20 draw pixel-identical rows. That is the "what happens when
     they don't total 100" decision this round had to make, stated here
     rather than only in the registry: NORMALIZE, for free, via the
     browser's own grid algorithm -- no clamping or renormalizing math of
     ours to keep in step between this file and ui/logtuning.js (the
     multiple-independent-implementations risk CLAUDE.md's dev-process rules
     warn about). The cost is that a share can never be read as a literal
     percentage of the card off the tuning inspector's own number --
     20 really does mean "20 parts of however many parts the three
     currently add up to", not "20% of the card" the instant someone dials
     a fourth share in from the sidelines. Nothing here creates one today.

     `minmax(floor, …)` on identity, not a bare length -- carried over from
     the original fixed-track lesson (BUG 1's own paragraph below has the
     full incident): a plain `<length>` track has that length as BOTH its
     base size and its growth limit, so it never shrinks below it even when
     the row has less room than that, and the excess bleeds past the card's
     own edge rather than being clipped. `--log-identity-floor` (248px,
     measured against the widest of 97 corpus star names at the shipped
     13px name size) is that same protection re-aimed at a percentage: below
     the app's 850px supported floor, 20% of the row is well under 248px, so
     without this minimum the identity column would keep shrinking past the
     point where a real name still fits, and truncating text is the honest
     degrade a bare bleed past the card edge is not. Ranks/PB carry no floor
     of their own -- `min-width: 0` on `.log-card-ranks` and the PB tag's
     own un-stretched content width are what keeps EITHER from forcing an
     overflow if their share reads very small; text there degrades by
     wrapping/reflowing inside RankBanner rather than the fixed identity
     column's single-line ellipsis, so there was no equivalent "widest
     value in the corpus" floor to measure for either of them.

     BUG 1 (2026-08-04 round, preserved -- the incident that made the RANKS
     track genuinely flexible in the first place, before this round made
     ALL THREE tracks flexible together): the ranks track used to be a
     second `minmax(0, …)` fixed-looking cap (reading the same pixel
     tunable `.log-card-ranks`'s own max-width read), the identical species
     as identity's own track above. A grid track with a definite `<length>`
     max still grows to fill LEFTOVER free space up to that max before
     anything else gets a look at it (the "maximize tracks" step of grid
     track sizing), and once both fixed-looking tracks were maxed out,
     nothing in this template had a claim on whatever space remained -- it
     simply sat unused, past the PB tag and the fold chevron, at the card's
     own true right edge. That is exactly the reported bug: "the PB number
     should be right aligned all the way to the right of the card, along
     with the dropdown arrow." Making ranks a `minmax(0, 1fr)` track fixed
     it by giving ranks the one genuinely flexible claim on that leftover
     space; the rank BANNER's own content stayed capped by a separate
     `max-width` on `.log-card-ranks` (so the space just moved to sit beside
     a still-420px-capped banner instead of past the row's own end) until
     THIS round removed that second cap too -- see `.log-card-ranks`'s own
     rule, above, for why a second capping number is no longer needed now
     that the grid track itself is the percentage share. */
  /* The PB track's own minimum is `auto`, not `0` -- measured live, not
     guessed (2026-08-04, same round): a bare `0` is an EXPLICIT minimum, and
     an explicit minimum turns OFF grid's "automatic minimum size" behaviour
     entirely, so the track shrank straight to its bare `10fr` share (as
     little as 44px at the 850px supported floor) with nothing keeping it as
     wide as the PB tag actually is. The tag itself is `justify-self: end`
     (never stretched, sized to its own content) and carries no `min-width`
     of its own any more (see its rule, above) -- so it rendered at its
     natural ~98px, right-aligned against a 44px-wide cell, which put its
     LEFT edge 42-53px behind the cell's own start: `.log-card-ranks x
     .pbtag` overlap and `.rank-banner::before` decoration bleed, at every
     viewport from the 850px floor up to ~1280px (uilab's own probe --
     invisible to a screenshot at either end state, the exact trap this
     round was warned about). `auto` restores the respected floor: the
     track's minimum becomes its content's own min-content size (~98px
     here, `white-space: nowrap` so it cannot shrink further) whenever that
     exceeds the naive `fr` share, while the `fr` share still governs growth
     beyond it. Identity's own track keeps its EXPLICIT floor
     (`--log-identity-floor`) on purpose -- that one is a deliberately
     measured constant independent of whatever text happens to be on
     screen, not a stand-in for `auto`; ranks needs no minimum at all
     (`.log-card-ranks` already declares its own `min-width: 0`, and its
     `.rank-banner` children do too, so ellipsis is genuinely reachable
     rather than something a track floor would prevent). */
  .log-list-card.log-layout-oneline .log-card:not(.is-unassigned) .log-card-head {
    grid-template-columns:
      minmax(var(--log-identity-floor, 220px), var(--log-identity-percent, 20fr))
      minmax(0, var(--log-ranks-percent, 70fr))
      minmax(auto, var(--log-pb-percent, 8fr))
      auto;
    grid-template-areas: "identity ranks pb fold";
  }
  .log-list-card.log-layout-oneline .log-card-ranks { flex-direction: row; flex-wrap: wrap; align-items: center; }

  .log-list-card.log-layout-twoline .log-card:not(.is-unassigned) .log-card-head {
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-areas: "identity fold" "ranks pb";
    row-gap: .45rem;
  }
  .log-list-card.log-layout-twoline .log-card-ranks { flex-direction: row; flex-wrap: wrap; align-items: center; }

  /* Today's original narrow layout, promoted to a selectable shape rather
     than a width-triggered fallback -- see `log-width-stacknarrow` below for
     the one place it still switches in automatically. */
  .log-list-card.log-layout-stacked .log-card:not(.is-unassigned) .log-card-head {
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-areas: "identity fold" "ranks ranks" "pb pb";
    row-gap: .45rem;
  }
  .log-list-card.log-layout-stacked .log-card-ranks { flex-direction: column; }

  /* ---- widthMode: does a narrow window override the choice above? -------
     "same" (the shipped default -- "maybe this can just be the same layout
     in both screen sizes") declares nothing here on purpose: whatever
     `collapsedLayout` picked above holds at every supported width, 850px
     included. "stackNarrow" reintroduces a width-triggered switch to the
     Stacked shape below a 900px container -- same threshold this card
     always used, kept for a straight comparison against "same" -- REGARDLESS
     of which `collapsedLayout` is chosen; it does not require
     `log-layout-stacked` to also be set. Equal specificity with the three
     blocks above (5 classes each), so source order is what makes this win
     once its container query matches -- it must stay declared AFTER them. */
  @container (max-width: 900px) {
    .log-list-card.log-width-stacknarrow .log-card:not(.is-unassigned) .log-card-head {
      grid-template-columns: minmax(0,1fr) auto;
      grid-template-areas: "identity fold" "ranks ranks" "pb pb";
      row-gap: .45rem;
    }
    .log-list-card.log-width-stacknarrow .log-card-ranks { flex-direction: column; }
  }
  /* "same" is the absence of the @container override above -- declared here
     anyway (a genuine no-op) for the same reason `.log-align-left` and
     `.log-rankstyle-banners` are: every option gets a real rule. */
  .log-list-card.log-width-same .log-card-head { opacity: 1; }

  /* The single-`rankStyle`-choice flex-direction overrides that used to live
     here (`.log-list-card.log-rankstyle-stacked`/`-stackedrow`/`-column`)
     are GONE -- retired with the `rankStyle` choice itself (2026-08-04,
     layout-matrix round). Their job is done by the four-cell "Layout
     matrix" section above instead, at higher specificity by construction
     (each selector there crosses FOUR classes -- the cell's own
     `log-rankstyle-<width>-<ladder>-<value>` plus `.log-card`'s own
     `log-card-two-ladder`/`log-card-one-ladder` -- against these three
     classes' worth here), so no source-order trick is needed to make it
     win; the trap this comment used to document (declare LAST or lose the
     tie against `collapsedLayout`/`widthMode`) no longer applies. */

  /* ===================================================================
     Rank placement -- head (today) or inside the dropdown (spec
     practice-log-entity-cards, round 3)
     ===================================================================
     logtuning.js's own `rankPlacement{Narrow,Wide}{Two,One}Ladders` header
     comment has the full reasoning. Unlike every rule above, the DECISION
     (which of the four cells applies, and therefore where `.log-card-ranks`
     physically sits in the DOM) is made in JS -- practicelog.js calls
     `rankPlacementFor` once per section and hands `LogCard` a plain
     "head"/"body" string, because a CSS class cannot relocate a MOUNTED
     `RankBanner` to a different DOM subtree without unmounting and
     remounting it (which would restart its climb). What lives here is only
     the CONSEQUENCE of that JS decision: `.log-card-ranks-in-body` is a
     class `LogCard` sets on `.log-card` itself once it has decided, and
     everything below reacts to THAT -- never to width or ladder-count a
     second time, so CSS and JS can never disagree about which cell applies.
     The `.log-rankplace-*` modifier classes (auto-generated by
     `logTuningClasses`, landing on `.log-list-card`) exist for the registry
     itself -- so `/ui/tunelog.html` can show a control for each of the four
     cells -- and get real, if deliberately UNIFORM, CSS below: uniform
     because these page-level classes cannot safely express a PER-CARD
     difference (all four are present on `.log-list-card` at once, one
     value each; a rule keyed on any one of them would paint every card's
     `.log-card-ranks-in-body`, not only the cards that specific cell
     actually governs) -- the real per-cell difference is the head-vs-body
     CHOICE ITSELF, already carried correctly by the per-card class below. */
  .log-card-body > .log-card-ranks {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--log-rank-gap, 13px);
    margin: 0 0 .6rem;
  }
  /* SUPERSEDED (amendment A2): the strategy name used to be plain text here,
     printed only in "body" placement so a collapsed card could still say
     which strategy it was showing. It is a live `StratPicker` now (below,
     `.log-card-strat-picker`), rendered UNCONDITIONALLY -- a picker has to
     work whether or not a strategy is set yet, not just display one already
     chosen, so it no longer waits on the placement cell at all. This class
     survives for the one text-only case a picker cannot cover: a deleted
     segment definition has nowhere left to write a strategy, so LogCard
     falls back to this plain "Definition deleted" label in its place.
     `flex: 0 1 <width>` (one-line-heads round, 2026-08-04) -- this text sits
     in the identity row's SECOND flex slot now, the same one the real
     picker below occupies; both share one width so the two never jump
     sideways depending on whether a definition is broken. */
  .log-card-strat {
    flex: 0 1 var(--log-strat-picker-width, 130px); min-width: 0;
    display: block; color: var(--muted); font-size: 9px; text-transform: uppercase;
    letter-spacing: .03em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* The live strategy picker itself -- same slot in the identity column the
     plain-text label above used to occupy, now a real `<select>`
     (`ui/components/stratpicker.js`, shared with every other strategy
     control in the app: same dropdown, same "+ new strat…" modal, same
     dropped-write recovery). Sized down from the global `select` rule's
     default so it reads as a small identity-column label rather than a
     full-size form control -- `select` already reserves its own
     ellipsis/arrow lane (ui-core.md's dropdown rule), so no extra overflow
     handling is needed here. A click inside it never reaches the card's own
     "select this card" button: they are SIBLINGS now (the wrapper this rule
     targets, `.log-card-identity` above), not nested, so there is nothing
     for a click to bubble into.

     `flex: 0 1 var(--log-strat-picker-width, …)` (one-line-heads round,
     2026-08-04) -- a fixed-ish flex-basis, own `min-width: 0` so it can
     still shrink at the identity floor rather than forcing an overflow,
     `flex-grow: 0` so it never balloons to fill a wide card the way
     `.log-card-select` (grow: 1) does. */
  .log-card-strat-picker {
    flex: 0 1 var(--log-strat-picker-width, 130px); min-width: 0;
    display: block;
  }
  .log-card-strat-picker select {
    width: 100%; min-width: 0; max-width: 100%;
    font-size: 10px; padding: 1px 1.3rem 1px 2px; border: 0; border-radius: 4px;
    /* NEVER `transparent` here (ui-core.md's dropdown rule,
       tests/test_ui_dropdown_theming.py) -- Chromium themes a select's OWN
       popup off its computed background, so a transparent one gets a white
       list. `#0d1928` is the same opaque navy `option { background-color }`
       already paints the popup itself, so the closed control reads as part
       of the dark card while still being a real, non-transparent colour. */
    background: #0d1928; color: var(--muted);
  }
  .log-card-strat-picker select:hover { background: #16283e; color: var(--text); }
  .log-card-strat-picker select:focus-visible { outline: 2px solid #78b9ff; outline-offset: 1px; }
  /* The head's own grid, minus the "ranks" track -- identity takes what
     ranks used to own, so the freed space is never a blank gap. `oneLine`
     is the shipped `collapsedLayout` and the only one whose row genuinely
     splits three ways; `twoLine`/`stacked` just lose the "ranks" grid row
     outright, since nothing draws into it any more.

     BUG (found by this round, one-line-heads, 2026-08-04): the identity
     track here was a bare `1fr` against pb's own `var(--log-pb-percent,
     8fr)` -- an 8x SMALLER flex weight than pb's, the exact opposite of
     "identity takes what ranks used to own". A `fr` value is a WEIGHT among
     the row's simultaneously-flexible tracks, not an absolute claim, so this
     handed roughly 8/9 of every card's leftover width to the pb TRACK (never
     to the PB TAG itself -- it is `justify-self: end` and never stretches,
     so the extra width was invisible padding) while identity sat pinned at
     its own 220px floor regardless of the card's real width -- measured live
     at 850/900/1920px alike, all three landed on an identical 220px identity
     column. Invisible before this round because nothing else shared that
     column with the name; `nameOverflow: shrinkToFit` silently absorbed it
     by shrinking the font instead of the box ever growing. Adding the
     strategy picker into this same column is what exposed it --
     `tests/test_log_card_name_fits.py` went from clean to 91/97 names
     overflowing at EVERY tested width, not just the narrow ones, which is
     the tell that the column itself was starved rather than merely tight.
     `90fr` mirrors the two shares identity absorbed (identityPercent 20 +
     ranksPercent 70, this file's own shipped defaults) as a single literal
     weight -- `fr` values cannot be summed inside `calc()`, so this is a
     plain number rather than a live derivation of the two tunables, same as
     `1fr` already was; it only needs to stay clearly dominant over pb's own
     8fr, not track either tunable exactly. */
  .log-list-card.log-layout-oneline .log-card.log-card-ranks-in-body:not(.is-unassigned) .log-card-head {
    grid-template-columns:
      minmax(var(--log-identity-floor, 220px), 90fr)
      minmax(auto, var(--log-pb-percent, 8fr))
      auto;
    grid-template-areas: "identity pb fold";
  }
  .log-list-card.log-layout-twoline .log-card.log-card-ranks-in-body:not(.is-unassigned) .log-card-head {
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-areas: "identity fold";
  }
  .log-list-card.log-layout-stacked .log-card.log-card-ranks-in-body:not(.is-unassigned) .log-card-head {
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-areas: "identity fold" "pb pb";
  }
  /* The registry's own eight option-classes, uniform across quadrants for
     the reason stated above -- "head" restates today's placement explicitly
     (a genuine no-op, same convention as `log-align-left`); "body" sizes the
     strategy-name line down slightly, since it is new text competing with
     the icon/name for the same column regardless of which cell chose it. */
  :is(
      .log-list-card.log-rankplace-narrow-two-head,
      .log-list-card.log-rankplace-narrow-one-head,
      .log-list-card.log-rankplace-wide-two-head,
      .log-list-card.log-rankplace-wide-one-head
    ) .log-card-head { opacity: 1; }
  :is(
      .log-list-card.log-rankplace-narrow-two-body,
      .log-list-card.log-rankplace-narrow-one-body,
      .log-list-card.log-rankplace-wide-two-body,
      .log-list-card.log-rankplace-wide-one-body
    ) .log-card-strat { font-size: 9px; }

  /* ===================================================================
     "Time to go" -- the next-rank timesave line (spec
     practice-log-entity-cards, round 3)
     ===================================================================
     `ranks.js`'s own header comment on `nextStepMode` has the four modes.
     "classic"/"always"/"compact" all render through the EXISTING
     `.rank-banner-next` element (only its TEXT changes, in
     `ranks.js::nextStepWords`), so nothing here has to style them beyond the
     registry's own option classes below. "hover" is the one with genuinely
     new markup: `.rank-next-popup`, a sibling of the fill `<i>` inside
     `.rank-progress-track`. */
  .rank-next-popup {
    position: absolute; bottom: 100%; margin-bottom: 4px;
    left: calc((var(--next-fill-pct, 0%) + 100%) / 2);
    transform: translate(-50%, 4px);
    padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: #101f31; border: 1px solid var(--border-soft);
    color: var(--text); pointer-events: none;
    opacity: 0;
    /* ONE declaration, both directions -- the standing rule. The `:hover`
       rule below sets only the target opacity/transform values. */
    transition: opacity 140ms ease, transform 140ms ease;
  }
  /* The UNFILLED portion of the bar, from where the fill ends to the
     track's own far edge -- a separate layer from the fill `<i>` (never
     re-tinted with `--climb-color`; this blink has nothing to do with a
     climb) so it can blink independently. Stays clipped to the track's own
     rounded box like everything else in it -- only the popup above needs to
     escape that box, which is why `overflow` opens up only for it, below. */
  .rank-progress-track::after {
    content: ""; position: absolute; top: 0; bottom: 0;
    left: var(--next-fill-pct, 0%); right: 0;
    background: rgba(255,255,255,.4);
    opacity: 0; pointer-events: none;
  }
  @keyframes rank-next-blink { 0%, 100% { opacity: 0; } 50% { opacity: .5; } }
  /* Scoped to ONE banner's own hover -- plain `:hover`, so two rank
     displays on the same card can never cross-react (Griffin: "It should
     ONLY appear if they hover over that specific rank standard section...
     each rank standard display would be controlled independently").
     Suppressed outright while `.is-climbing` sits on the root (ranks.js,
     unchanged -- true for the whole leaving/climbing/arriving stretch, not
     only the visible middle of it): the bar's fill moves continuously
     during a climb, so both the popup's TEXT and its POSITION (which reads
     the same moving `--next-fill-pct`) would be changing while shown --
     exactly what "may only change while invisible" (.claude/rules/ui-
     climb.md) forbids, a second way. Gating on `:not(.is-climbing)` means
     hover simply has nothing to reveal for that whole stretch; if the
     pointer is already resting here when a climb starts, the popup's own
     transition (declared above, unconditionally, per this file's standing
     both-directions rule) fades it back OUT instead of snapping, and the
     same transition fades it back in once the climb settles and the pointer
     is still there -- a climb reads correctly with a pointer resting on the
     bar either way. */
  .rank-banner-nextstep-hover .rank-progress-track {
    position: relative; overflow: visible;
  }
  .rank-banner-nextstep-hover:not(.is-climbing):not(.is-swapping) .rank-progress-track:hover .rank-next-popup {
    opacity: 1; transform: translate(-50%, 0);
  }
  @media (prefers-reduced-motion: no-preference) {
    .rank-banner-nextstep-hover:not(.is-climbing):not(.is-swapping) .rank-progress-track:hover::after {
      animation: rank-next-blink 900ms ease-in-out infinite;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    /* No blink keyframe, but the popup itself still reveals -- same
       reduced-motion contract every other celebration effect in this file
       follows (the information still arrives, just without the motion). */
    .rank-banner-nextstep-hover:not(.is-climbing):not(.is-swapping) .rank-progress-track:hover::after {
      opacity: .5;
    }
  }
  /* The registry's own sixteen option-classes. Uniform across quadrants for
     the same reason the rank-placement classes above are: these are
     page-level classes and cannot safely express a per-card difference (see
     that section's comment) -- the real per-cell difference is which VALUE
     each row ships (narrow defaults to `hover`, wide to `always`), already
     carried correctly by `nextStepMode` as a prop. */
  :is(
      .log-list-card.log-nextstep-narrow-two-always, .log-list-card.log-nextstep-narrow-one-always,
      .log-list-card.log-nextstep-wide-two-always, .log-list-card.log-nextstep-wide-one-always,
      .log-list-card.log-nextstep-narrow-two-compact, .log-list-card.log-nextstep-narrow-one-compact,
      .log-list-card.log-nextstep-wide-two-compact, .log-list-card.log-nextstep-wide-one-compact
    ) .rank-banner-next { font-variant-numeric: tabular-nums; }
  :is(
      .log-list-card.log-nextstep-narrow-two-hidden, .log-list-card.log-nextstep-narrow-one-hidden,
      .log-list-card.log-nextstep-wide-two-hidden, .log-list-card.log-nextstep-wide-one-hidden
    ) .log-card-ranks .rank-progress-track { margin-top: 2px; }
  :is(
      .log-list-card.log-nextstep-narrow-two-hover, .log-list-card.log-nextstep-narrow-one-hover,
      .log-list-card.log-nextstep-wide-two-hover, .log-list-card.log-nextstep-wide-one-hover
    ) .rank-next-popup { font-size: 11px; }

</style></head>
<body>
<div id="app"></div>
<script type="module" src="/ui/app.js"></script>
</body></html>
