     the row you read while running are visibly one thing. `required` borrows
     the live step's gold rather than the done tick's grey: in the editor the
     ticked stop is the assertion being made, not a thing already behind you. */
  .step-chip.required { color: var(--gold); opacity: 1; font-weight: 700; }
  .step-chip.skipped { color: var(--muted); opacity: .5; }
  /* A chip that toggles is a real button; strip the chrome, keep the ring. */
  .step-toggle, .step-track-door {
    display: flex; align-items: baseline; gap: .22rem; min-width: 0;
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    font: inherit; color: inherit; border-radius: 4px;
  }
  .step-track-door { gap: 0; }
  .step-toggle:focus-visible, .step-track-door:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  .step-picker { margin-top: .5rem; }
  .step-picker-hint { margin: .2rem 0 0; }
  /* The builder's THEN section. Start and Finish are each one any-of set where
     order means nothing; here order is the entire content, so a step wears its
     ordinal and its own move controls and the "any of these" nesting sits one
     level in. */
  .then-step {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; margin-bottom: 8px;
  }
  .then-step-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; margin-bottom: 6px;
  }
  .then-step-n {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; border-radius: 999px;
    background: rgba(240,189,50,.16); color: var(--gold);
    font-weight: 700; font-variant-numeric: tabular-nums; font-size: .78rem;
  }
  .then-step-moves { display: flex; gap: 2px; }
  .then-step-moves .icon-button:disabled { opacity: .35; cursor: default; }
  /* The seeded-edit notice sits at the point of the edit, not in a library
     menu — editing a shipped movement opts it out of every future corpus
     refresh, and that cost was invisible from inside the editor. */
  .builder-seeded {
    border: 1px solid var(--line); border-left: 3px solid var(--gold);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 10px;
    background: rgba(240,189,50,.06);
  }
  .builder-seeded.is-dirty { border-left-color: #e0803a; }
  .builder-seeded p.meta { margin: .25rem 0 .5rem; }
  /* The re-record door (round 16) — same one-row shape as .builder-icon:
     label, action, consequence, at the point where "recorded wrong" is
     noticed. `flex-wrap` so the meta line drops under the button in a
     narrow editor pane instead of overflowing it. */
  .builder-rerecord { display: flex; align-items: center; gap: .6rem;
    flex-wrap: wrap; margin-bottom: 10px; }
  .builder-rerecord .field-label { margin: 0; }
  /* Trailing `auto` track added 2026-07-28 for the collapse toggle. Without
     it the button becomes an implicit 5th column at the grid's default size
     and pushes the strategy picker out of the card. */
  /* The name column's floor is MEASURED, not chosen: 296px is the widest star
     name in `memory/addresses.py::STAR_NAMES` rendered at this h2's own font
     ("Quick Race Through Downtown!", 293px) plus 3px. It was 180px, which is
     narrower than most of the 97 names, so the star being practised ellipsised
     mid-word -- "Fall onto the Cag..." at 850 and 900px (live report,
     2026-07-29). The name is the one thing on this card that says WHAT you are
     practising; the space comes out of the strategy column, which has a
     picker's worth of slack and a value the user just chose.
     `tests/test_objective_name_fits.py` measures every name against the real
     column at the supported floor, so this number cannot rot as names change. */
  .objective-heading {
    min-width: 0; display: grid;
    grid-template-columns: 28px auto minmax(296px,1fr) minmax(150px,380px) auto;
    gap: .65rem; align-items: center;
  }
  .objective-symbol {
    color: var(--gold); display: inline-flex; align-items: center; justify-content: center;
  }
  /* The active card's symbol + eyebrow ARE the target picker's trigger (the
     header's PRACTICE TARGET card owned that job until 2026-07-26). It spans
     the two cells those elements already occupied, so the heading's four
     column tracks are untouched and nothing else on the card moves. Its own
     padding is negative-margined back out for the same reason. */
  .objective-pick {
    grid-column: 1 / 3; display: inline-flex; align-items: center; gap: .5rem;
    margin: -.28rem -.4rem; padding: .28rem .4rem;
    border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: inherit; cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .objective-pick:hover { background: #16283e; border-color: #496784; }
  .objective-pick > .ui-icon { color: var(--muted); }
  .objective-pick .eyebrow { cursor: pointer; }
  .objective-name { min-width: 0; }
  .objective-context {
    display: block; color: var(--muted); font-size: .72rem;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .objective-name h2 {
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* Third column (auto) added 2026-07-25 round 4 for StrategyFastestHint --
     the fastest-known-strategy name moved HERE from the rank banner (it and
     the banner's next: target were clipping mid-word competing for one
     line). This row is wider and carries only text, no medal/bar, so it has
     the room the banner didn't. */
  .objective-strategy {
    min-width: 0; display: grid; grid-template-columns: auto minmax(70px,1fr) auto;
    gap: .4rem; align-items: center;
  }
  .objective-strategy select { width: 100%; min-width: 0; }
  .objective-strategy-fastest {
    color: var(--muted); white-space: nowrap; font-size: .82rem;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .objective-metrics {
    min-width: 0; display: grid; grid-template-columns: minmax(420px,2.6fr) 66px minmax(112px,auto);
    gap: 12px; align-items: center; border-top: 1px solid var(--border-soft);
    margin-top: .62rem; padding-top: .55rem;
    position: relative; z-index: 0;
  }
  /* Two RankBanners side by side, EQUAL treatment (spec 2026-07-25 round 2):
     a labelled, gradient Strategy Rank banner next to a small unlabelled
     "Bronze III" chip read as a rendering fault to the user, not two
     deliberate measures -- so the Overall Rank now gets the identical
     .rank-banner box, sharing the row 50/50 rather than being squeezed into
     a fixed-width hairline-divided chip. Each shrinks independently (its own
     children ellipsis); when only one banner is present (Overall Rank is
     absent when entity_rank has nothing to grade) it simply takes the row. */
  /* NO `overflow: hidden` here, and that is load-bearing (live report,
     2026-07-27: "the tips of the wings get cut off at the top of the rank
     standard rectangle"). `.hat` draws its wings OUTSIDE its own declared box
     by design, about 0.24x the icon size above the cap, so any clipping
     ancestor decapitates them. The clip used to be the row's blunt safety net
     for long text; that job moved onto the two elements that can actually
     overflow (`.rank-banner-name` and `.rank-banner-next` both ellipsise
     themselves), which is where it belonged anyway -- a container clip cannot
     tell a wing from a word. */
  .rank-slot { min-width: 0; display: flex; align-items: stretch; gap: .7rem; }
  .rank-slot .meta { min-width: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Rank wash: ONE gradient per rank banner, painted BY that banner
     (moved down from `.rank-slot-wrap::before` on 2026-07-27). It used to
     hang off the shared wrapper with a `--rank-wash-split: 50%` and two
     colours handed down from practice.js, which was fine while a banner's
     colour was a constant -- and wrong the moment the banner started
     CLIMBING through tiers, because the wash still showed the destination.
     It clashed with the cap on screen and spoiled the reveal several seconds
     early (live report 2026-07-27, a Luigi-green wash under a Wario-gold
     cap).

     Painting it here fixes that by construction: `--climb-color` is the
     banner's own colour at THIS frame, already cross-faded across a tier
     boundary by ui/celebrations.js, so the wash, the bar and the cap can
     never disagree again. The split constant is gone too -- the boundary
     between two banners IS the DOM boundary between them, at every width and
     in the stacked layout, with nothing to keep in sync.

     Bleeds: -8px top / -12px bottom, and -16px LEFT only. The left edge of
     the rank slot really is the card's own edge, so that bleed lands in the
     card's padding. The right edge never is -- `.rank-slot` is column ONE of
     `.objective-metrics`, with the live state and the PB tag in columns two
     and three -- so the matching `:last-child { right: -16px }` this rule
     shipped with crossed the 12px grid gap and painted 4px onto the live
     state, at EVERY width (measured 4x32px at 1920 and 1400). It read as
     harmless only because the gradient is `transparent 88%` and had faded out
     by the time it got there; the same rule with a colour still in it is what
     produced the reported overlap once the banners stacked. Deleted 2026-07-29
     rather than re-tuned: an edge a box does not own has no correct bleed.

     A second banner ramps in over its first 8% so the seam reads as shading
     rather than two flat colours abutting. An unranked banner has no
     `--climb-color` and paints nothing, which is what it did before. */
  .rank-banner::before {
    content: ""; position: absolute; z-index: -1; pointer-events: none;
    top: -8px; bottom: -12px; left: 0; right: 0;
    background-image: linear-gradient(90deg,
      color-mix(in srgb, var(--climb-color, transparent) 34%, transparent),
      transparent 88%);
  }
  .rank-banner:not(:first-child)::before {
    background-image: linear-gradient(90deg, transparent,
      color-mix(in srgb, var(--climb-color, transparent) 34%, transparent) 8%,
      transparent 90%);
  }
  .rank-banner:first-child::before { left: -16px; border-radius: 0 0 0 8px; }
  .rank-banner-empty::before { background-image: none; }
  /* The -12px bottom bleed above (and the stacked band's own :last-child
     override below) was sized to fade into THE CARD'S OWN bottom padding --
     safe reasoning while `.objective-metrics` was always the card's last
     content row. Multi-step segments (this branch) added a THIRD row,
     `.seg-waiting`, directly below it with no room for a 12px fade to land
     in, so the wash bled onto real content instead of empty padding --
     invisible to every instrument until `tools/ui_fixture.py::_arm_segment`
     could reach an armed segment at all (uilab's decoration probe, which DOES
     see this class of bug since it derives the pseudo's rect rather than
     walking the DOM: 243x4px onto div.seg-waiting, 2026-07-29). The fade
     itself is unchanged for every OTHER state; it only has nothing left to
     bleed into once there's a real row below it, so it stops at that row's
     edge instead. */
  .objective-card:has(.seg-waiting) .rank-banner::before { bottom: 0; }
  .rank-banner {
    min-width: 0; flex: 1 1 0; display: grid; gap: .34rem; align-content: center;
    min-height: 36px;
    position: relative; z-index: 0;   /* hosts its own wash, below */
  }
  /* The sentinel ("no standards" / "pick a strat") variant of the SAME
     banner box -- min-height matches the graded version (medal row + bar)
     so the rare case of a sentinel Strategy banner beside a GRADED Overall
     one (e.g. the active strategy has no ladder of its own, but the star's
     best-possible ladder is still gradeable off the same time) doesn't look
     visibly shorter. */
  .rank-banner-empty { display: flex; align-items: center; gap: .5rem; }
  /* "Strategy Rank" / "Overall Rank" kickers -- which measure this banner
     is, prefixed on the SAME line as the medal, never a new line:
     .objective-card is a hard fixed height (122px desktop / 258px under
     760px, both non-reflowing) and a stacked layout here would silently
     bleed the card into whatever sits below it. Deliberately NOT `.meta`
     -- `.rank-slot .meta`'s `flex:1 1 auto; min-width:0` out-specifies a
     same-weight class rule here and shrinks the label into "STRA…", which
     reads as broken, not tight; own color/no-shrink instead. */
  .rank-banner-kicker {
    flex: 0 0 auto; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; font-size: .62rem; font-weight: 650;
  }
  /* Practice-log rank view picker. It occupies the existing kicker slot, so
     changing Strategy/Overall never adds a row or shifts the cap/bar geometry.
     These are real pressed-state buttons (not tabs: there is no tabpanel),
     stripped down to read like the compact kicker they replace. */
  .rank-mode-buttons {
    display: inline-flex; align-items: center; gap: .16rem;
    white-space: nowrap;
  }
  .rank-mode-button {
    appearance: none; border: 0; border-bottom: 2px solid transparent;
    border-radius: 2px; background: transparent; color: var(--muted);
    padding: .08rem .2rem .11rem; margin: 0;
    font: inherit; font-weight: inherit; letter-spacing: inherit;
    text-transform: inherit; line-height: 1.05; cursor: pointer;
  }
  .rank-mode-button:hover { color: var(--text); }
  .rank-mode-button.is-selected {
    color: var(--gold); border-bottom-color: currentColor;
  }
  .rank-mode-button:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  /* Also un-clipped, for the wings (see `.rank-slot` above) -- this row is the
     icon's DIRECT parent and was the closer of the two clippers. Each child
     now owns its own truncation instead: the name and the "next" span
     ellipsise, the kicker is `flex: 0 0 auto` on purpose, and the icon must
     not be squeezed either. */
  .rank-banner-row {
    min-width: 0; display: flex; align-items: center; gap: .3rem;
    white-space: nowrap;
  }
  .rank-banner-row > .rank-icon-slot { flex: 0 0 auto; }
  /* Round 4 (addendum, task 8, 2026-07-26): reserves the icon's own wing
     spill (see the comment in ranks.js) so the kicker and the rank name
     stop visually colliding with painted wing pixels the flex `gap` above
     never accounted for -- `.hat`'s wings are absolutely positioned OUTSIDE
     its declared box on purpose, so widening the row's shared `gap` would
     not have reached the actual overlap; this margin is scoped to the one
     child that needs it.

     Round 5 (addendum, task 8, 2026-07-26, "sweep every container sized for
     the old disc"): this was the FIRST instance of the bug fixed, one round
     before it was recognised as a class rather than a one-off -- the
     9px-each-side margin above was hand-picked to match the wing spill AT
     THIS ONE CALL SITE'S size (24px). Generalised into `.rank-icon-slot`
     (below), which any container can reuse at any size, so the next call
     site inherits the right geometry instead of re-deriving it: reserves
     HAT_WING_SPILL_RATIO (~0.370, caps.js -- derived from the same
     CAP_BOX/CANVAS geometry hat.js's own layout math uses, never hand-
     copied) times `--icon-size` on each side. A call site sets
     `--icon-size` to the SAME `size` it passes its RankIcon and adds the
     class; the margin follows automatically at any size. Reserves the FULL
     wing-inclusive extent rather than just the layout box: wings are
     present at every division except V and never on Capless, so 32 of the
     45 tier+division combinations DO have at least one wing pair --
     reserving for them is the common case on this branch, not the rare
     one, and this is the same choice the original 9px margin already made
     (it happened to equal the FULL spill, not just the layout box, at its
     one size). */
  .rank-icon-slot {
    --icon-size: 18px;
    flex: 0 0 auto; display: inline-flex;
    margin: 0 calc(var(--icon-size) * .370);
  }
  .rank-banner-icon { --icon-size: 24px; }
  /* Truncates itself, now that neither `.rank-slot` nor `.rank-banner-row`
     clips (they cannot, without cutting the icon's wings off). */
  .rank-banner-name {
    font-weight: 800; letter-spacing: .4px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  /* Same sequential text exchange used by the MARELO route swap. Both values
     occupy one grid cell, so the longer rank/basis never changes layout while
     the old text fades fully out before the new text fades in. */
  .rank-banner-swap-text {
    display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0;
  }
  .rank-banner-swap-text > * {
    grid-area: 1 / 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  /* FADES with the bar (`--climb-reveal`, written per frame by
     ui/rankclimb.js off the same step and the same curve the bar uses, on a
     clock with a floor of its own): out while the bar fills at the start of a
     climb, back in while it fills at the end — and, when no rank is gained at
     all, out and back in across the single step that moves the bar.
     Defaults to 1, so every banner that is not mid-climb renders exactly as it
     always did.

     This was a left-to-right MASK wipe until 2026-07-27, fired by a
     celebration beat when the climb settled. Two things were wrong with that
     and the user saw both at once -- "it looks like the text that appears
     while we're doing this is totally glitchy": a beat fires at a moment, so
     its timing could only be tuned to line up with the bar rather than tied to
     it, and a moving mask gradient over text that is ALSO changing its
     contents reads as tearing. Opacity is what he asked for ("just a fade
     away") and has neither problem. NO `transition` here on purpose -- the
     value is already animated frame by frame, and a CSS transition on top
     would lag it back out of sync. */
  /* `flex-shrink: 999` (was 1, 2026-08-03, practice-log-entity-cards): this
     hint and `.rank-banner-name` above are the only two children of
     `.rank-banner-row` allowed to shrink at all -- the kicker and the icon
     are both `flex: 0 0 auto` -- and until this round they shared that job
     at an EQUAL weight, splitting a tight row's deficit PROPORTIONALLY
     between them. `.rank-banner-name` is on uilab_project.py's own
     NEVER_TRUNCATE list and this line is not; a rank NAME truncating to
     half its characters ("LUIGI 2" -> "LU…") to leave room for this line's
     OWN half-cut sentence is losing the wrong one. A huge shrink-factor
     imbalance makes this line the one that gives first -- CSS resolves a
     shrink deficit as a WEIGHTED split (shrink-factor x basis), so at 999:1
     this line absorbs a deficit up to roughly 1000x its own width before
     `.rank-banner-name` loses a single pixel, and only past that point (two
     full "Banners"-style rank displays sharing a narrow tuned rank column,
     right at the app's supported 850px floor) does the name still have to
     give a little -- a genuine capacity conflict between his tuned rank
     column width and two full banners' worth of content, not a priority
     bug, and the remaining failure `tests/test_responsive.py` reports at
     850-913px is that conflict, left for a decision rather than papered
     over. Never `flex-shrink: 0` outright: tried and reverted the same
     round -- an UNSHRINKABLE name overflows its own banner box at those
     same narrow widths instead of ellipsising, which bleeds into the
     neighbouring rank/PB tag and is worse than what it replaces. */
  .rank-banner-next {
    flex-shrink: 999; overflow: hidden; text-overflow: ellipsis;
    opacity: var(--climb-reveal, 1);
  }
  /* Progress toward the next rank: full slot width, never a fixed px bar —
     a 200px bar used to bleed past the card edge (2026-07-24). */
  .rank-progress-track {
    height: 5px; overflow: hidden; border-radius: 3px;
    background: rgba(4,13,23,.72);
  }
  .rank-progress-track i { display: block; height: 100%; border-radius: inherit; }
  /* ---- The level-up climb (task 0012, 2026-07-26) ------------------------
     Three variables, all written per frame by ui/rankclimb.js from the
     entries in ui/celebrations.js, all with a fallback so a surface renders
     correctly with no celebration running:

       --climb-color    the tier's colour, cross-faded across a tier boundary
       --climb-flash    1 -> 0 decay at each level crossed
       --climb-settle-scale  how much the banner is swollen right now

     They are read here rather than set inline per element for the reason the
     bar's colour moved off `style=` at all: during a tier crossing the colour
     is a BLEND of two tiers, and having one name for "whatever colour this
     rank is right now" is what lets the bar, the glow and the rank name agree
     on it without three call sites each mixing their own.

     Nothing here changes layout. `.objective-card` is a hard fixed height
     (122px desktop, 258px under 760px) and a celebration that grew the card
     would push the one below it or clip — so every effect is a colour, a
     shadow or a transform. */
  .rank-banner .rank-progress-track {
    box-shadow: 0 0 calc((var(--climb-flash, 0) + var(--climb-anticipate, 0) * .85) * 10px)
                color-mix(in srgb, var(--climb-color, #3a4250)
                          calc((var(--climb-flash, 0)
                                + var(--climb-anticipate, 0) * .85) * 85%), transparent);
  }
  .rank-banner .rank-progress-track i { background: var(--climb-color, #3a4250); }
  .rank-banner .rank-banner-name {
    color: color-mix(in srgb, #fff calc(var(--climb-flash, 0) * 55%), currentColor);
    text-shadow: 0 0 calc(var(--climb-flash, 0) * 9px)
                 color-mix(in srgb, var(--climb-color, #3a4250)
                           calc(var(--climb-flash, 0) * 90%), transparent);
  }
  /* The landing. `scale` (the individual transform property) so it composes
     with anything else that ever transforms this row rather than replacing
     it -- the same reason the wings use `rotate`/`scale` instead of
     `transform`. */
  .rank-banner { scale: calc(1 + var(--climb-settle-scale, 0)); }
  /* .rank-banner-stacked -- the MARELO-shaped compact layout (spec
     2026-08-03-practice-log-entity-cards, `RankBanner`'s `layout` prop,
     ranks.js). ranks.js renders the IDENTICAL tree either way -- kicker,
     icon, name, basis and next-step line all still inside `.rank-banner-row`,
     `.rank-progress-track` still its sibling -- because the climb this
     animates must stay the one hook, one plan, one set of animated values
     every OTHER rank display shares ("I want the user to be able to use this
     new design AND STILL be able to have all the animations that they'd
     normally get"). Only the ARRANGEMENT of those same parts differs, and
     this class is the whole of that difference: `.rank-banner-row` turns
     `display: contents`, so its own children stop being ONE flex row and
     become direct grid items of `.rank-banner` itself, laid out into a
     named-area grid alongside `.rank-progress-track` (already a sibling, so
     it needs no `display: contents` of its own). Kicker and basis are
     dropped -- the same way the narrower Chips/Caps-only rank styles already
     drop them (`.log-rankstyle-chips`/`.log-rankstyle-capsonly`, below) --
     since a caller rendering two of these side by side (a card's Strategy
     and Star/Segment banners) already tells them apart by POSITION, not by
     a label neither of those two styles shows either. */
  .rank-banner-stacked {
    display: grid; align-content: center;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas: "icon bar" "name next";
    column-gap: .5rem; row-gap: .1rem;
  }
  .rank-banner-stacked .rank-banner-row { display: contents; }
  .rank-banner-stacked .rank-banner-kicker,
  .rank-banner-stacked .rank-banner-basis { display: none; }
  .rank-banner-stacked .rank-icon-slot.rank-banner-icon {
    grid-area: icon; justify-self: center; align-self: end;
  }
  .rank-banner-stacked .rank-banner-name {
    grid-area: name; justify-self: center; align-self: start;
    max-width: 72px; font-size: .68rem; text-align: center;
  }
  /* Live report 2026-08-04: "rank standard displays show a line in the
     middle of the render (you can see that the gradient is bisected in the
     middle)... I would expect the background gradient to be unbroken. This
     also didn't happen in the tuning tool." At the ladder FLOOR (no time
     recorded, or -- rarer -- any other division whose fill happens to land
     at 0) the fill `<i>` inside this track can draw as narrow as 0% wide,
     and this track's own near-opaque background (`rgba(4,13,23,.72)`,
     tuned so a COLOURED FILL reads clearly against it) is what remained
     visible: a flat dark bar sitting in the geometric MIDDLE of
     `.rank-banner::before`'s wash, between the icon row and the name row.
     Row layout never shows this -- there the SAME track sits at the
     banner's own BOTTOM EDGE, where a dark strip reads as trim rather than
     a seam (left untouched here, on purpose: it "has always looked right",
     his words, and objective-card/header/Rank-tab all still use it). Only
     the two GRID layouts put "bar" in the vertical middle of the box, so
     only they need the fix -- `background: transparent` lets the wash
     paint straight through when there is nothing filled, and costs the
     FILL nothing: `caps.js::barFill` anchors every graded (non-floor) rank
     at >=50% width of solid `--climb-color`, which reads clearly against
     the wash's own translucent tint (max 34%) regardless of what used to
     sit behind the empty remainder. */
  .rank-banner-stacked .rank-progress-track {
    grid-area: bar; align-self: center; background: transparent;
  }
  /* Still opts into the SAME `--climb-reveal` fade `.rank-banner-next`
     always has (above) -- this rule only repositions it, nothing here
     touches opacity. */
  .rank-banner-stacked .rank-banner-next {
    grid-area: next; align-self: start; font-size: .68rem;
  }
  /* .rank-banner-column -- the even-more-condensed layout (Option 3,
     spec 2026-08-04-rank-variants: Griffin's own sketch, `[cap]` /
     `[progress_bar]` / `[rank_name]`, with the entity noun -- "Strategy" or
     the star/segment noun -- in a small font under the name). Same
     reasoning as `.rank-banner-stacked` above: ranks.js renders the
     IDENTICAL tree, only the arrangement differs (a THIRD value of the same
     `layout` prop), so the climb this animates is still the one hook, one
     plan, one set of animated values. Column is what gives the kicker (the
     `label` prop -- dropped entirely by Stacked) a home again: two Column
     banners sit side by side, same as Stacked-side-by-side, so position
     alone does not say which is which the way Stacked's own top/bottom
     order does -- hence the small kicker line under the name, exactly what
     the sketch asked for. Basis and the next-step line are dropped, same as
     Chips/Caps-only/Stacked -- Column's whole point is fitting the most
     condensed reading in the least room, and neither fits that budget. */
  .rank-banner-column {
    display: grid; justify-items: center; align-content: center;
    grid-template-areas: "icon" "bar" "name" "kicker";
    row-gap: .12rem;
  }
  .rank-banner-column .rank-banner-row { display: contents; }
  .rank-banner-column .rank-banner-basis,
  .rank-banner-column .rank-banner-next { display: none; }
  .rank-banner-column .rank-icon-slot.rank-banner-icon { grid-area: icon; }
  .rank-banner-column .rank-banner-name {
    grid-area: name; text-align: center; font-size: .68rem; max-width: 96px;
  }
  /* Same "the bar sits in the wash's own vertical middle here" reasoning as
     `.rank-banner-stacked` above -- see its own comment for the report and
     the fix. */
  .rank-banner-column .rank-progress-track {
    grid-area: bar; width: 96px; background: transparent;
  }
  .rank-banner-column .rank-banner-kicker { grid-area: kicker; text-align: center; }
  /* MARELO header bar. It used to sit right-aligned on a 44px row of its own
     UNDER the context grid, because .context-bar's 4-column template is
     redefined at two breakpoints and a 5th column would have meant touching
     all three. It is now IN the grid, in slot 2 — the practice-target card
     that occupied that slot was deleted (2026-07-26, user), so the column
     came free with no template change and the extra header row went away.
     --border/rgba(11,25,41,.92) mirror .context-control's panel styling (this
     design system has no --panel or --line token). Height is no longer fixed
     at 44px and does not need to be: it fills a grid cell whose height is set
     by .context-bar's own min-height and its 54px siblings, so a rank-up
     still cannot reflow the OBS capture. */
  /* .marelo-bar also always carries .context-control and .context-select
     (marelo.js) -- position: relative and cursor: pointer come from those
     shared rules, so this block only adds what is genuinely specific to the
     rank card (the fixed min-height, the gold hover below). */
  .marelo-bar {
    display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0;
    min-height: 68px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 7px; background: rgba(11,25,41,.92);
    color: var(--text); text-align: left;
  }
  .marelo-bar:hover { border-color: var(--gold); }
  /* Round 2 layout (2026-07-28, user's own sketch): a LEFT column pairing the
     rank icon with the rank NAME directly beneath it, and a RIGHT column
     stacking the scope name, a FULL-WIDTH progress bar and the points -- the
     bar is now the dominant element instead of a 96px sliver squeezed beside
     three lines of text. `flex: 0 0 auto` keeps the icon column exactly as
     wide as its own content, so the body column gets everything else. */
  .marelo-bar-icon-col {
    display: flex; flex-direction: column; align-items: center;
    flex: 0 0 auto; gap: 3px;
  }
  .marelo-bar-body {
    display: flex; flex-direction: column; justify-content: center;
    min-width: 0; flex: 1 1 auto; gap: 5px;
  }
  /* Both text rows ellipsise -- a fluid, FULL-WIDTH bar between them already
     gives every column width its own honest amount of room (it just gets
     thinner), so neither row needs the old 96px track's container-query
     carve-out to stay legible below it. `.context-value` is a DESCENDANT
     selector, not a direct child: a route SWAP wraps it in `.marelo-swap-fade`
     (below) while the crossfade runs, and a child combinator would have
     silently dropped this rule for that whole window -- the exact trap
     ui-core.md documents for `.context-select > select`. `.meta` (the points
     line) never moves during a swap, so it stays the tighter `>` form. */
  .marelo-bar-body .context-value, .marelo-bar-body > .meta {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .marelo-bar-body > .meta { font-size: .78rem; }
  /* Route SWAP crossfade (2026-07-28): the old and new rank text, and the old
     and new route name, share ONE grid cell -- `grid-area: 1/1` overlays both
     children instead of stacking them, so a fade never reflows the card, and
     the track sizes to the WIDER of the two (never the narrower, which would
     clip whichever text is still fading in). Purely structural, no size
     threshold of any kind, so it needs no @container gate. */
  .marelo-swap-fade { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
  .marelo-swap-fade > * { grid-area: 1 / 1; min-width: 0; }
  /* The rank name under the icon. "Short by construction" is what this said
     until 2026-07-28 and it was wrong: at the card's 16px/700 the widest name
     in the registry -- "Toadsworth 1" -- measures 102px against a 78px cap, so
     it shipped as "Toadsw…" in both the flown card and the resting header.
     The nine cap names are a fixed, known set, so the size is DERIVED from the
     widest of them rather than guessed: 13px/700 puts "Toadsworth 1" at 83px,
     and 96px leaves room for font-metric drift without eating the bar (the
     column is already 55px of icon, and every pixel here comes off the bar
     beside it). The ellipsis stays as insurance only --
     tests/test_ui_rank_name_fits.py measures EVERY name against this rule and
     fails if one would trip it, so it should never actually fire. */
  /* Descendant, not `>` -- a route swap wraps this in `.marelo-swap-fade`
     (above) for the duration of its crossfade, same reasoning as
     `.marelo-bar-body .context-value`. */
  .marelo-bar-icon-col b {
    max-width: 96px; font-size: .82rem; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Round 5 (addendum, task 8, 2026-07-26): `.marelo-bar`'s own gap
     was already close to this icon's wing spill at size 34 (~12.6px a
     side) -- borderline enough that `.rank-icon-slot` is worth it here
     too, rather than leaving a margin this narrow to fail the moment font
     metrics or a future size change shift it. */
  .marelo-bar-icon { --icon-size: 34px; }
  /* Mario-cap rank icons (2026-07-25). Ports a design probe whose composition
     was rendered and eyeballed across all 45 tier x division states before
     this shipped -- hat.js is the only caller and these rules are not to be
     "cleaned up" independent of a render. Regenerate the contact sheet from
     the live registry with `tools/hat_sheet.py` before touching any of them.
     The wing flap (task 6, below) is
     the one animation this component carries, gated on
     prefers-reduced-motion the way .starholder already does. */
  /* font-display: block (final review M9, 2026-07-25) -- without it the
     glyph paints in the Impact fallback until the font loads, most visibly
     on the 96px rank-up overlay whose whole job is to look like an event.
     A short blank beats a flash of the wrong face there. */
  @font-face {
    font-family: "SuperMario256"; font-display: block;
    src: url("/ui/assets/fonts/SuperMario256.ttf") format("truetype");
  }
  /* `.hat`'s OWN box is exactly the cap's footprint, BOTH axes (hat.js sets
     width/height to the cap's own, not the canvas's) -- that is what makes
     it a drop-in for the medal/crest it replaced inside seventeen
     fixed-height cards. `.hat-canvas` is the full sprite canvas (taller AND
     wider, to hold the wingspan), positioned by hat.js so the cap portion
     lines up with `.hat`'s own top-left corner -- the wings spill outside
     `.hat` on purpose, on whichever side(s) they grow (fix round 1,
     2026-07-25, height only: the first cut sized `.hat` itself to the
     canvas and grew every caller's row ~6px. Fix round 2, final review I1,
     2026-07-25: the same fix had never been applied to width, leaving the
     box 45% wider than the cap at every call site that never draws a
     wing). `.hat` must never gain its own `overflow: hidden`, or that spill
     gets clipped instead of shown; an ANCESTOR doing that is the caller's
     call, not this component's. */
  .hat { position: relative; display: inline-block; }
  .hat-canvas { position: absolute; }
  .hat i { position: absolute; inset: 0; display: block; }
  /* Every tinted layer is TWO rules off the SAME --art: a masked colour fill
     under a multiplied greyscale shade. One custom property feeds both, so
     a call site cannot hand them different files and let the page backdrop
     leak into the multiply (pinned by tests/test_ui_caps.py). */
  .hat .fill {
    background-color: var(--c);
    -webkit-mask: var(--art) center / contain no-repeat;
            mask: var(--art) center / contain no-repeat;
  }
  /* Capless's ring reads as "you don't have this yet" rather than "a thin
     solid cap" (dashed/dotted is the established convention for an absent/
     placeholder state). Round 2 (addendum, task 8, 2026-07-26): an SVG
     polygon walking CAP_OUTLINE_POLY (hat.js) with a dashed stroke, replacing
     round 1's CSS mask-composite attempt (two intersecting masks -- a
     repeating-linear-gradient over cap_outline.png), which produced visibly
     uneven dashes. That defect was ANGULAR: a linear gradient's band, clipped
     by a curved contour, gives a dash whose apparent length depends on the
     angle between the band and the local tangent -- long smears where the
     outline ran parallel to the bands, short stubs where it crossed them, and
     no amount of retuning the gradient's period could fix an angular problem
     with a scalar knob. `stroke-dasharray` measures dash length ALONG the
     path, uniform by construction, which is the actual fix.
     `.dotted-ring` only needs `position/inset` (`.hat i`'s rule doesn't
     apply -- this is an `<svg>`, not an `<i>`) and `fill: none` on the
     polygon so the ring reads as a stroke, not a filled shape (that would
     paint over the dim under-fill beneath it, which must stay visible and
     solid). Everything else (points, stroke colour/width, dasharray) is set
     inline per-instance in hat.js, since they depend on `size`/the tier's own
     colour -- this rule only supplies what's true for every instance. */
  .hat .dotted-ring {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .hat .dotted-ring polygon { fill: none; }
  .hat .shade {
    background: var(--art) center / contain no-repeat;
    mix-blend-mode: multiply;
  }
  /* Grandmaster/Metal's specular sweep -- SCREENED rather than multiplied,
     since it lightens the cap instead of shading it; the one non-multiply
     blend a tier's material needs. */
  .hat .highlight {
    background: linear-gradient(135deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 55%);
    -webkit-mask: var(--art) center / contain no-repeat;
            mask: var(--art) center / contain no-repeat;
    mix-blend-mode: screen;
  }
  /* The spots are painted in their own colour but must curve with the cap,
     so their shade is the CAP's OWN greyscale (--art) masked to the spot
     shapes (--mask) -- not the spots' own flat-white greyscale, which would
     sit flat on the cap instead of curving with it. */
  .hat .spot-shade {
    background: var(--art) center / contain no-repeat;
    -webkit-mask: var(--mask) center / contain no-repeat;
            mask: var(--mask) center / contain no-repeat;
    mix-blend-mode: multiply;
  }
  .hat .patch { background: var(--art) center / contain no-repeat; }
  /* The sign field, positioned from caps.js's PATCH_BOX via custom
     properties the component sets per instance, rather than a second copy
     of the fractions living in this file. `inset: auto` FIRST -- it is the
     shorthand for top/right/bottom/left, so declaring it after left/top
     silently resets them (cost one render during design). */
  .hat .glyph {
    position: absolute; inset: auto;
    left: var(--patch-left); top: var(--patch-top);
    width: var(--patch-width); height: var(--patch-height);
    display: grid; place-items: center; line-height: 1;
    font-family: "SuperMario256", Impact, sans-serif;
  }
  /* The slot reel (task 0012, "animate the number ticking in, like a slot
     machine… it should feel like a slot ticking up"). TWO cells and a slide
     between them, never a wrapping strip of all five digits: a tier crossing
     (1 -> 5) and a climb into Mario (1 -> M) are then the same motion as an
     ordinary 4 -> 3, with no wrap to special-case and no moment where the
     reel jumps backwards to re-enter at the top.

     `clip-path` rather than `overflow: hidden` alone: the sign field is a
     DOME (caps.js's PATCH_BOX is a rectangle around it, not its shape), so a
     rectangular clip lets a digit in transit show its corners outside the
     patch art. The ellipse follows the dome's crown closely enough at every
     size, and costs no second mask image to keep in step with patch.png. */
  .hat .glyph.glyph-reel {
    display: block; overflow: hidden;
    clip-path: inset(0 round 46% 46% 12% 12% / 52% 52% 12% 12%);
  }
  .hat .glyph-reel > span {
    display: block; height: 200%;
    translate: 0 calc(var(--roll) * -50%);
  }
  .hat .glyph-reel > span > b {
    display: grid; place-items: center; height: 50%; font-weight: inherit;
  }
  /* The tier-crossing SLAM (task 0012 round 2, 2026-07-27 -- "the new hat
     should SLAM in… it should squash and shake allllll the way down to a
     flat line, and then BURST back up"). `scale`/`translate` (the individual
     transform properties) rather than `transform`, for the same
     one-declaration-per-element reason the wings use them: they compose with
     anything else that ever transforms this icon instead of replacing it.

     `transform-origin: 50% 100%` is what makes it read as weight rather than
     as a zoom -- the cap compresses onto its own brim and springs off it. The
     defaults are the identity, so every icon in the app that is not mid-slam
     is untouched. */
  .hat {
    transform-origin: 50% 100%;
    scale: var(--cap-sx, 1) var(--cap-sy, 1);
    translate: calc(var(--cap-shake, 0) * 1px) 0;
  }
  /* The twinkle. Sits OUTSIDE the cap's box on purpose (like the wings) and
     must never be clipped -- see `.rank-slot` for why nothing above it
     clips. `mix-blend-mode: screen` so a sparkle over the cap brightens it
     instead of stamping a flat white shape on it. */
  .hat-sparkles {
    position: absolute; left: -35%; top: -45%; width: 170%; height: 180%;
    pointer-events: none; overflow: visible; mix-blend-mode: screen;
  }
  /* ONE transform declaration per wing, driven by two registered custom
     properties -- and that is the whole trick (task 0012, 2026-07-26). Three
     different things move a wing: the idle flap (`.hat-flap`, a keyframe),
     the one-shot fold (`.hat-fold`, a keyframe), and the climb (numbers
     written per frame by ui/rankclimb.js). Expressed as three rules each
     setting `transform`, the highest-specificity one WHOLESALE REPLACES the
     others -- `transition`/`transform` are not additive across rules, which
     is the exact defect that made the Rank tab's ladder band expand
     instantly and collapse smoothly under "identical" CSS. Expressed as
     inputs to one declaration, they compose instead: a wing can be growing
     and flapping at once, and a climb can interrupt a flap mid-cycle.

     `@property` is what makes a custom property animatable at all -- an
     unregistered one is a string to the animation engine and jumps from one
     keyframe to the next with no interpolation.

     `--wing-tuck` 0 = out, 1 = folded away behind the cap; the pivots (23%
     64%, 69% 66%) are measured off the wing1..4 PNGs' own alpha bounding
     boxes -- the edge nearest the cap stays fixed across tiers while only
     the tip grows outward -- not guessed. Wings already stack UNDER the cap
     in hat.js's layer order, so rotating and shrinking toward that pivot
     makes them recede BEHIND it by construction. The GROW is that same
     motion played backwards (a wing arrives the way it leaves), which is why
     there is no second set of numbers for it. */
  @property --wing-tuck { syntax: "<number>"; inherits: true; initial-value: 0; }
  @property --wing-flap { syntax: "<number>"; inherits: true; initial-value: 0; }
  .hat .wing-l, .hat .wing-r {
    scale: calc(1 - var(--wing-tuck) * .7);
    opacity: calc(1 - var(--wing-tuck));
  }
  .hat .wing-l {
    transform-origin: 23% 64%;
    rotate: calc(var(--wing-tuck) * -80deg + var(--wing-flap) * -14deg);
  }
  .hat .wing-r {
    transform-origin: 69% 66%;
    rotate: calc(var(--wing-tuck) * 80deg + var(--wing-flap) * 14deg);
  }
  /* Task 6 (2026-07-25-mario-cap-rank-icons): the idle flap. `.hat-flap` is
     set only by hat.js's `flap` prop -- celebrate.js's rank-up overlays --
     never the idle rank icons scattered across every other card, which would
     be motion noise on a screen that's on stream. It now animates the
     VARIABLE rather than the transform, so it shares the declaration above
     with the climb instead of overriding it. */
  @media (prefers-reduced-motion: no-preference) {
    .hat-flap { animation: wing-flap 1.1s ease-in-out infinite; }
    @keyframes wing-flap {
      0%, 100% { --wing-flap: 0; }
      50% { --wing-flap: 1; }
    }
  }
  /* Task 10 (addendum, 2026-07-25): the wing FOLD -- set by hat.js's
     `foldWings` prop, true for exactly the ONE render TierRankUp shows at
     its fill -> flip boundary (celebrate.js), where the outgoing division's
     wings are drawn one last time so THIS can play instead of them simply
     vanishing. User's own framing: "it flaps and celebrates, then folds
     away and vanishes... booya, upgraded! Just gotta earn the wings again."
     A performed loss, not a discontinuity -- the wing policy itself
     (division V wears none) is unchanged.

     Reuses the flap's own pivots (23%/64%, 69%/66%, measured off each wing
     sprite's alpha bbox) and continues the SAME rotational sense as the
     flap's downswing (wing-l negative, wing-r positive) so the tuck reads
     as one continuous gesture rather than a new one. Wings already stack
     UNDER the cap in hat.js's layer order, so rotating + shrinking them
     toward that pivot makes them recede BEHIND the cap by construction --
     "tucking its ears back" needs no z-index trick here. `forwards` holds
     the ended (rotated, scaled down, invisible) state so nothing pops back
     visible before the next tick actually drops the layer to 0 wings.

     `.hat-fold::after` is the small bright blink the user asked the loss
     to end on ("perhaps with a shiny blink") -- one radial flash on the
     SAME .5s timeline as the fold, so it cannot drift out of sync with it.
     `flap` and `foldWings` are never BOTH meaningful at once conceptually,
     but celebrate.js always passes `flap=true` alongside `foldWings` on
     this one tick for simplicity -- hat.js resolves that by putting
     `hat-fold` on the outer span INSTEAD of `hat-flap` whenever folding
     (see hat.js's `motionClass`), so only one of these two rule sets ever
     actually applies to a given Hat; there is no dependency on CSS source
     order to break the tie. */
  @media (prefers-reduced-motion: no-preference) {
    /* Now one keyframe on the SHARED variable rather than a per-side
       transform (task 0012): the end state it used to spell out by hand --
       rotate ±80deg, scale .3, opacity 0 -- is exactly `--wing-tuck: 1` in
       the declaration above, which is also what the climb's grow animates
       backwards through. Two treatments, one geometry, no chance of the two
       disagreeing about where a folded wing sits. */
    .hat-fold { animation: wing-tuck .5s cubic-bezier(.4, 0, .6, 1) forwards; }
    @keyframes wing-tuck {
      from { --wing-tuck: 0; }
      to { --wing-tuck: 1; }
    }
    .hat-fold::after {
      content: ""; position: absolute; inset: -25%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.95), transparent 65%);
      pointer-events: none; opacity: 0;
      animation: wing-fold-shine .5s ease-out forwards;
    }
    @keyframes wing-fold-shine {
      0%, 62% { opacity: 0; transform: scale(.5); }
      74% { opacity: .9; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }
  }
  /* The bar is now the RIGHT column's dominant element (round 2, 2026-07-28)
     rather than a 96px sliver -- full width of `.marelo-bar-body`, and
     visibly thicker so it reads as the primary thing on the card, not a
     footnote beside the text. */
  .marelo-track {
    width: 100%; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12);
    overflow: hidden; flex: 0 0 auto;
  }
  /* Same three climb variables as the practice card's banners, read the same
     way -- this bar runs the same primitive (ui/rankclimb.js), so it must not
     grow a second way of expressing the same celebration. */
  .marelo-track > i { display: block; height: 100%; background: var(--climb-color, #3a4250); }
  .marelo-bar .marelo-track {
    box-shadow: 0 0 calc(var(--climb-flash, 0) * 10px)
                color-mix(in srgb, var(--climb-color, #3a4250)
                          calc(var(--climb-flash, 0) * 85%), transparent);
  }
  .marelo-bar b {
    text-shadow: 0 0 calc(var(--climb-flash, 0) * 9px)
                 color-mix(in srgb, var(--climb-color, #3a4250)
                           calc(var(--climb-flash, 0) * 90%), transparent);
  }
  /* The overall rank-up (components/marelocelebrate.js, 2026-07-28).
     Replaces the two hand-rolled scope overlays that used to live here
     (TierRankUp's fill->flip->hold, DivisionRankUp's top banner) -- a KNOWN
     DEVIATION flagged since 2026-07-26. This overlay clones the REAL route
     rank card, flies it to the centre, and hands it to ui/rankclimb.js, the
     same climb every rank banner runs -- so there is no CSS here for the
     climb itself (the flash/shake/burst/digit-reel/wing-grow variables are
     already up beside .rank-progress-track and .rank-banner) and no size
     @media at all: the card's geometry is MEASURED from the live header at
     runtime and expressed as a transform, so it is correct at every width by
     construction (`.marelo-celebrate*` are component selectors --
     `tests/test_responsive_structure.py` is a red build for a viewport rule
     on one).

     Fixed so it can never reflow an OBS capture; pointer-events OFF on the
     wrapper and ON only for the card, so it never eats a click meant for the
     game. z-index sits above .modal-backdrop (200): a rank-up can land while
     a modal is open and must still be seen.

     Report 2 (2026-07-28, live report: "it looks like the card briefly
     becomes invisible" during the fly-out AND the fly-back): `.marelo-celebrate`
     used to BE the fading backdrop, with `.marelo-celebrate-card` rendered as
     its CHILD -- a parent's opacity multiplies every child's, so the card sat
     at effective opacity 0 on the first frame, faded in as it travelled, and
     faded back out before landing, never reaching 1 even at rest (the tuned
     `backdropOpacity` is 0.8). The fix is structural, not a value: the
     backdrop is now `.marelo-celebrate-backdrop`, a SIBLING of the card, not
     an ancestor -- this wrapper keeps only the shared custom properties
     (children still need to read them, custom properties flow DOWN the tree)
     and is never assigned an opacity of its own, so nothing above the card
     can ever touch its opacity again.
     `tests/test_ui_celebrate.py::test_the_card_never_has_its_own_opacity_rule`
     pins this structurally -- no rule may set `opacity` on
     `.marelo-celebrate-card` or on `.marelo-celebrate` itself (its one
     remaining ancestor below `.app-shell`). */
  .marelo-celebrate {
    position: fixed; inset: 0; z-index: 210; pointer-events: none;
  }
  .marelo-celebrate-backdrop {
    position: fixed; inset: 0; pointer-events: none;
    background-color:
      color-mix(in srgb, var(--climb-color, transparent) var(--backdrop-tint, 0%),
                rgba(3, 9, 18, 1));
    opacity: 0;
    /* TWO properties, ONE declaration (`.claude/rules/ui-core.md`'s rule: a
       second `transition:` on any state of this element would REPLACE this
       one wholesale, not add to it). Opacity paces the fly-out/fly-back
       fade; background-color is the tier cross-fade (report 1, 2026-07-28,
       "we should ... animate from current background color to capless
       color, then when we cross from CAPLESS -> TOAD, animate from capless
       to toad color") -- its own duration, `--tier-fade-ms`, is deliberately
       NOT `--fly-ms`: a tier crossing can land mid-climb, long after the
       flight itself finished moving. */
    transition: opacity var(--fly-ms, 900ms) var(--fly-ease, ease),
                background-color var(--tier-fade-ms, 500ms) ease;
  }
  .marelo-celebrate-backdrop.is-lifted { opacity: var(--backdrop-alpha, .55); }
  /* EXACTLY ONE transition declaration on this element. A :hover or state
     rule declaring its own would REPLACE this one wholesale (a rule's
     transition is not additive), which is what makes a motion glide one way
     and snap the other -- there is deliberately no second rule here, not
     even for prefers-reduced-motion: the JS already computes --fly-ms as 0
     in that case (marelocelebrate.js), so the transition already resolves
     to an instant jump with no CSS override needed. */
  .marelo-celebrate-card {
    position: fixed; transform-origin: center center; pointer-events: auto;
    cursor: pointer;
    transition: transform var(--fly-ms, 900ms) var(--fly-ease, ease);
    /* NEVER an opacity rule here, and never on `.marelo-celebrate` above --
       see the comment on `.marelo-celebrate` for why, and the guard test
       that mutation-proves it. */
  }
  /* The header's own card is hidden while its clone is out, so there is
     never a double image -- and it must not climb, because the clone IS its
     climb (one event, one thing celebrating it -- the mistake the deleted
     entity toasts made). */
  .marelo-slot.is-celebrating { opacity: 0; }
  /* Rank tab (rankpage.js): scope picker + card + chart + breakdown, all
     scaled off ONE scope response — no separate route/course/overall pages.
     --border-soft/--muted mirror the rest of the design system (this file
     has no --line or --dim token, despite what an earlier draft assumed). */
  .rank-page { display: flex; flex-direction: column; gap: 14px; }
  /* Scope chip row (task D.1) — every season's tier at a glance, op.gg
     style. Wraps onto more rows rather than scrolling; `.is-selected`
     mirrors the scope <select>'s current value so clicking a chip never
     looks like it did nothing. */
  .scope-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .scope-chip {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
    border: 1px solid var(--border-soft); border-radius: 10px;
    background: rgba(8, 20, 34, .4); cursor: pointer; text-align: left;
  }
  .scope-chip:hover { border-color: var(--gold); }
  .scope-chip.is-selected { border-color: var(--gold); background: rgba(240, 189, 50, .14); }
  .scope-chip-text { display: flex; flex-direction: column; line-height: 1.15; }
  .scope-chip-text b { font-size: 12px; font-weight: 600; }
  /* Round 5 (addendum, task 8, 2026-07-26): 8px gap vs. a ~11.1px wing
     spill at size 30. */
  .scope-chip-icon { --icon-size: 30px; }
  /* One tier-tinted icon tile per rankable entity — the Coverage strip.
     (These names were `.topn-*` until round 9: they were introduced for a
     "Best in scope" top-12 card that Coverage made redundant, and the card
     was removed rather than left as a second row of the same tiles.)
     `flex: 0 0 auto` is load-bearing: without it a full route's worth of
     tiles SHRINK to fit their row while the height stays put, which is what
     made the art look squished (live report 2026-07-25). */
  .entity-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .entity-tile {
    flex: 0 0 auto;
    /* the ✎ badge positions against this — see the .editicon block above */
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: var(--tile-size, 42px); height: var(--tile-size, 42px);
    border-radius: 8px; overflow: hidden;
    border: 2px solid var(--tier-tint, var(--border-soft));
    background: rgba(8, 20, 34, .4);
  }
  /* Coverage's unpracticed entries: the art stays (you have to recognise
     WHICH star you haven't touched), the tier ring and the colour go. */
  .entity-tile.is-unpracticed { opacity: .38; filter: grayscale(.75); }
  .entity-tile.is-unpracticed:hover { opacity: .7; }
  /* The whole scope in one strip — 24 entries for a 16 Star route, 120+ for
     a full run. The cap plus scroll is what stops a long route pushing the
     chart and the breakdown off the screen; four rows fit before it engages. */
  .rank-coverage-strip { max-height: 216px; overflow-y: auto; }
  .rank-coverage { margin: 4px 0 3px; }
  .entity-tile-icon { width: 100%; height: 100%; object-fit: contain; }
  .entity-tile-icon.courseicon { width: 90%; height: 90%; }
  /* The tiles are buttons (round 7: "I could click on it and get an overview
     of my history for that star"), so they need the padding/appearance reset
     every icon button in this design system takes. */
  .entity-tile { padding: 0; cursor: pointer; }
  .entity-tile.is-open { box-shadow: 0 0 0 2px rgba(240,189,50,.55); }
  .entity-detail {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border-soft);
  }
  .entity-detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .entity-detail-head h4 { margin: 0; font-size: 15px; }
  .entity-detail-head .meta { margin: 0; }
  /* Round 5 (addendum, task 8, 2026-07-26): 10px gap vs. a ~11.1px wing
     spill at size 30. */
  .entity-detail-icon { --icon-size: 30px; }
  .entity-detail-spacer { flex: 1 1 auto; }
  /* Its own scroller with a fixed cap, not a growing list: this card sits
     above the chart and the breakdown, and a ten-row expansion that pushed
     both down the page would move the thing the user was reading. */
  .entity-attempts {
    max-height: 208px; overflow-y: auto; margin-top: 8px;
  }
  .entity-attempts table { width: 100%; border-collapse: collapse; }
  .entity-attempts td {
    padding: 4px 8px; border-bottom: 1px solid var(--border-soft);
    font-size: 12px; white-space: nowrap;
  }
  /* Round 5 (addendum, task 8, 2026-07-26 -- "sweep every container sized
     for the old disc"): the SAME class of bug as `.attempt-medal` above,
     smaller in magnitude only because this table's icons are size=14 --
     22px was already narrower than the layout box alone (14 *
     HAT_LAYOUT_WIDTH_RATIO ~= 23px, caps.js), before wings (14 *
     HAT_WING_SPILL_RATIO ~= 5px each side) push the real extent to ~33px. */
  .entity-attempts td:first-child { width: 34px; }
  .entity-attempts .entity-attempt-strat {
    width: 100%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--muted);
  }
  .entity-attempts tr.is-pb td { color: var(--gold); }
  .rank-card-main { display: flex; align-items: center; gap: 16px; margin: 10px 0; }
  .rank-card-main h2 { margin: 0; font-size: 24px; }
  /* Round 5 (addendum, task 8, 2026-07-26 -- "sweep every container sized
     for the old disc"): the biggest gap of the whole sweep -- 16px vs. a
     ~23.7px wing spill at size 64. Every prior round's fixture happened to
     land on Capless (which never wings), so this was never actually
     rendered with wings on until this round's targeted check. */
  .rank-card-icon { --icon-size: 64px; }
  /* Task C.5: names the MARELO-vs-saved-PB distinction so it reads as
     intentional, not as the two banners disagreeing by accident. */
  .rank-card-note { margin: 0 0 10px; font-style: italic; }
  /* `.rank-factor` rows are DIVs — see the note in rankpage.js: as <label>s
     they forwarded hover and click to the first coverage tile inside them,
     so hovering the caption lit up an unrelated star. */
  .rank-factor { display: block; margin: 6px 0; font-size: 12px; color: var(--muted); }
  /* Round 4 (addendum, task 8, 2026-07-26): Mastery is a plain meter again,
     reusing `.rank-progress-track` (below) — it moved OFF the tier ladder
     because it isn't a rank. Mastery is a mean SCORE, one of the two
     factors MARELO is made of (marelo = mastery x coverage), and drawing it
     on a ladder that also carries rank icons implied it WAS a rank — the
     user caught the two disagreeing outright (Capless 5 on the card, the
     ladder marker sitting in Toad territory). The ladder now belongs to
     MARELO alone (`.rank-ladder-wrap`, under `.rank-card-main`) so there is
     exactly one rank-shaped drawing on this card. */
  /* Round 5 (addendum, task 8, 2026-07-26): replaces the permanent 45-icon
     showcase strip entirely -- see rankpage.js's LadderBar comment for the
     proof that a static layout could never satisfy "icons only ever sit
     exactly above their own pip." Reserves room ABOVE the bar for whichever
     floating icon layer is showing -- the at-rest YOU mark, or a hovered
     band's five popped-out icons -- so neither ever overlaps the card text
     sitting above this wrapper. */
  .rank-ladder-wrap { margin: 4px 0 10px; padding-top: 62px; }
  .rank-ladder {
    position: relative; height: 16px;
    display: flex; gap: 2px;
    border-radius: 8px; background: rgba(4,13,23,.72);
  }
  /* Each tier is its own flex item, not a slice of one continuous gradient
     (round 1-4's `.rank-ladder-bands`/`.rank-ladder-fill` pair, deleted).
     `--band-weight` (set inline, rankpage.js) is `band.to - band.from` --
     the tier's real SCORE width -- so flex-grow makes the resting layout
     proportional BY CONSTRUCTION by is-mine, with no percentage maths
     duplicated here. `min-width: 0` lets a band shrink below its own
     content size: without it a flex item's default `min-width: auto`
     refuses to shrink past whatever's inside, which would stop the eight
     compressing bands (below) from ever getting small enough to hand a
     hovered band its expansion width. */
  .rank-band {
    position: relative; min-width: 0; height: 100%;
    flex-grow: var(--band-weight); flex-shrink: 1; flex-basis: 0%;
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
  }
  /* Round 8 (task 8, 2026-07-26 -- the user: "it should animate from the
     starting bar position to the expanded bar position... it should also
     animate back"): ONE `transition` declaration for `.rank-band`, covering
     every property EITHER state of it ever sets (flex-grow/flex-basis here,
     transform/box-shadow below), and it is the ONLY place `transition` is
     declared for this element -- no separate declaration on the `:hover`
     rule below. That used to be two rules: this one covered flex-grow/
     flex-basis, `:hover`'s own rule covered transform/box-shadow -- and
     since `:hover` has higher specificity, its `transition` COMPLETELY
     REPLACED this one's (CSS `transition` is not additive across rules on
     the same element) the instant a band gained the `:hover` match, so
     flex-grow/flex-basis had NO transition during the split second they
     needed one most: entering hover. Leaving hover worked fine, because
     `:hover` stops matching and THIS rule's transition takes back over --
     which is exactly the asymmetric "some things snap, some things don't,
     and it depends on direction" bug a probe confirmed before this fix
     (measured `flex-basis`/width jumping straight to its target value on
     the very first frame of expansion, but interpolating smoothly on
     collapse). Fixed by moving every property either state can change onto
     ONE list, here, so there is exactly one transition config regardless of
     which direction the state is changing -- same duration, same easing,
     both directions, structurally impossible to diverge again. This is
     also what lets the flex reflow trick work AT ALL: the eight compressing
     siblings never transition their OWN flex-grow/basis (those values never
     change for them), they only look smooth because the hovered band's
     property is ACTUALLY interpolating frame by frame and the browser
     naturally reflows around that on every rendered frame -- if the
     hovered band's own change snaps, the siblings have nothing to reflow
     smoothly around either, which is why the ENTIRE row used to snap
     together on expand and only the row's OWN sizing snapped, not the
     icons (see `.rank-band-icon` below, which was never double-declared
     and always animated correctly in both directions). Pip/icon/marker
     `left:%` positions need no transition of their own for the same
     reason: they are computed from the band's CURRENT width every frame,
     so they ride this one width transition for free once it is real. */
  @media (prefers-reduced-motion: no-preference) {
    .rank-band {
      transition: flex-grow .25s ease, flex-basis .25s ease,
        transform .25s ease, box-shadow .25s ease;
    }
  }
  /* The expansion is the thing that makes per-division icons legible at
     all (see the LadderBar comment) -- not optional garnish. Fixed rigid
     width (`flex-shrink: 0` too, so nothing can squeeze it back down) lets
     the other eight bands compress to absorb the difference, proportionally
     among themselves (their own flex-grow ratios are untouched -- only the
     space left to share shrank). `max(260px, calc(var(--band-weight) * 1%))`
     guards the one tier that's ALREADY close to 260px at rest on a big card
     (Toadsworth/Silver is 20 of the 100 score points -- 20% of a ~1300px bar
     is ~260px): without the `max()`, "expanding" it could actually shrink
     it, which reads as a bug, not an affordance. 260px (round 7, task 8,
     2026-07-26 -- widened from 230px, "so five slots breathe", a starting
     point settled by render, not arithmetic, once the user's own division
     could sit at any fraction of the slot it fills rather than only ever
     on a midpoint) is comfortable room for four or five 20px icons with
     realistic wing spill. `:focus-within` puts a keyboard user who Tabbed
     onto one of the five pips inside in the exact same state a mouse hover
     would -- no separate keyboard path to keep in sync with the mouse
     one. Sets ONLY target values here, deliberately -- the transition that
     animates TOWARD them lives once, above, on the unconditional rule. */
  .rank-band:hover, .rank-band:focus-within {
    flex: 0 0 max(260px, calc(var(--band-weight) * 1%));
    z-index: 3;
  }
  @media (prefers-reduced-motion: no-preference) {
    .rank-band:hover, .rank-band:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(0,0,0,.4);
    }
  }
  /* The painted fill lives in its OWN clipped box, separate from the pips/
     icons below: `.rank-band` itself must never clip, since a popped-out
     icon has to escape upward past the bar's own top edge. Rounded corners
     only on the two ends of the whole bar, same as the old single-element
     bar's own border-radius. */
  .rank-band-surface { position: absolute; inset: 0; overflow: hidden; }
  .rank-band:first-child .rank-band-surface { border-radius: 8px 0 0 8px; }
  .rank-band:last-child .rank-band-surface { border-radius: 0 8px 8px 0; }
  /* Dim base + bright clipped fill is the SAME "how far along" reading the
     old whole-bar gradient gave (`.rank-ladder-bands`/`.rank-ladder-fill`),
     just scoped to one band's own `--band-tint` (`capGradient(tier) ||
     rankColor(tier)`, rankpage.js -- the SAME colour the standards table
     and every other tier surface already use) instead of one continuous
     linear-gradient image spanning all nine. Plain `background` on purpose,
     never `color-mix()`: `capGradient()` returns a `linear-gradient(...)`
     STRING for the two patterned tiers (Toadsworth, Toad), and `color-mix`
     requires two `<color>` tokens -- feeding it a gradient is invalid CSS,
     exactly the round-4 bug. `background` accepts a flat colour or a
     gradient string identically, so both forms render correctly here. */
  .rank-band-base, .rank-band-fill {
    position: absolute; inset: 0; background: var(--band-tint);
  }
  /* Deliberately NOT the lever for "light up what I have cleared", and the
     2026-07-27 fix's first attempt spent a round learning that. It dropped
     this to `opacity: .14; filter: saturate(.55)` -- borrowing
     `.entity-tile.is-unpracticed`'s dim+desaturate -- so the eight unreached
     bands would stop competing with the one cleared band. They stopped
     competing by disappearing: "the dimmed bars should be way less dimmed...
     they all basically look black. I think we should at least show a little
     bit of color for each of them!!" A tile is a discrete thing you either
     have or have not; these nine bands are a MAP of the whole ladder, and a
     tier you have not reached yet still has to be findable on it -- it is
     what you are climbing toward, and the hover that expands it has to look
     worth aiming at. So this is back at the value it has always had, and the
     entire lit/unlit distinction is carried by the gloss below, on the side
     that is meant to change. */
  .rank-band-base { opacity: .26; }
  .rank-band-fill { opacity: 1; width: 0; }
  /* What makes a REACHED band read as lit (live report 2026-07-27 -- "the bar
     is incorrectly DIM for the section of the bar to the left... all of the
     bars, across all ranks from 0...the users current rank, should be lit up
     -- because this should be symbolizing 'i have made it this far'").
     Capless's band was ALREADY filled to 100% when that was written; measuring
     the reported screenshot's own pixels gave #735648 exactly, i.e. the tint at
     full opacity. The defect was not the fill width, it was that "reached" was
     encoded ONLY as opacity of the tier's own colour -- a RELATIVE signal,
     legible in the one partially-filled band (where the dim and bright halves
     of ONE hue sit against each other) and nowhere else. A fully-reached band
     has no dim half beside it, so the eye judges it against its NEIGHBOURS,
     which are different hues -- and Capless (#735648) is the darkest cap in
     the registry. Lit to 100% it measured 10.77% relative luminance against
     5.85% for the brightest band the user had NOT reached (Vanish): 1.84x,
     which is a difference in shade, not a difference in state. The first
     thing anyone earns was the thing least likely to look earned.
     The gloss is the fix because it is an ABSOLUTE lift -- a fixed amount of
     white composited over whatever the tier's colour happens to be -- so every
     reached band gains the same "the light is on behind this" surface no
     matter its own luminance, and a lit Capless differs from a lit Toad in
     HUE, not in whether it looks switched on. It rides the FILL, whose width
     IS the reached fraction, so a partially-reached band is glossed for
     exactly as far as the user has got and not a pixel further.
     Strengthened (avg alpha .145 -> .212) when the base above went back to
     .26: with the dim side no longer helping, the whole separation is this
     rule's to earn. There is a ceiling on that -- rendering every tier lit
     at once, an average past ~.22 starts milking the hues it is lifting
     (Waluigi purple toward lavender, Mario red toward pink), which is the
     same crime as the over-dimming, just on the other side of the bar. */
  .rank-band-fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.46) 0%,
      rgba(255,255,255,.18) 40%, rgba(255,255,255,.05) 62%,
      rgba(255,255,255,.26) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
  }
  /* The pip: a focusable 9px hit box (a 1px line is not a target -- same
     reasoning the old `.rank-ladder-step` used), positioned at a LOCAL
     percentage of its OWN band -- 0/20/40/60/80%, since DIVISIONS_PER_TIER
     always cuts a tier into five equal-score slices. That percentage marks
     where the division BEGINS (round 6 -- the icon for the SAME division
     sits at a different percentage now, its slot's own midpoint, see
     `.rank-band-icon` below); it is what stays correct whether the band is
     squeezed to a sliver (Mario, at rest) or expanded to its full hover
     width -- the alignment guarantee lives here, not in per-band math. */
  .rank-band-pip {
    position: absolute; top: 0; bottom: 0; left: 0; width: 9px;
    transform: translateX(-50%); cursor: pointer;
  }
  .rank-band-pip:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 1px; border-radius: 2px;
  }
  .rank-band-pip::after {
    content: ""; position: absolute; left: 50%; top: 5px; bottom: 5px;
    width: 1px; background: rgba(255,255,255,.28); transform: translateX(-50%);
  }
  .rank-band-pip.is-tier::after {
    top: 0; bottom: 0; width: 2px; background: rgba(6,16,28,.9);
  }
  /* The icon: round 6 (addendum, task 8, 2026-07-26 -- the user: "each of
     the symbols are in the middle of their subdivision section"). A pip
     marks a BOUNDARY; an icon names the SPAN between one pip and the next,
     so it sits at that span's own midpoint now, not on the boundary line --
     sitting it on the pip made it ambiguous which of the two neighbouring
     divisions it named. `.rank-band-icon` is a SIBLING of `.rank-band-pip`
     (not nested inside it, which it was before this round) so it can carry
     its OWN `left:%` at a different local percentage than the pip --
     rankpage.js computes both from the SAME `index`, offset by half a
     slice, so they can never drift apart even though they no longer share
     one literal position. `left: 0` here is a harmless default; every
     instance sets its own inline `left` (rankpage.js). Hidden and tucked
     toward the bar at rest (`pointer-events: none` so an invisible icon can
     never steal a hover meant for a neighbour), popped up to full size and
     opacity only while `.rank-band` is hovered or focused --
     `pointer-events: auto` there so a mouse resting directly on the now-
     much-bigger icon gets ITS OWN tooltip rather than passing through to
     whatever's behind it. */
  .rank-band-icon {
    position: absolute; left: 0; bottom: calc(100% + 8px);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 10px) scale(.5);
  }
  @media (prefers-reduced-motion: no-preference) {
    .rank-band-icon { transition: opacity .25s ease, transform .25s ease; }
  }
  .rank-band:hover .rank-band-icon, .rank-band:focus-within .rank-band-icon {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, 0) scale(1);
  }
  /* The reached-this-far marker: a bright edge on the fill, so the exact
     value is readable against a banded track that has plenty of edges of
     its own. Round 6 (addendum, task 8, 2026-07-26 -- the user: "I would
     expect my big symbol to still be visible, and for my exact progress
     inside the rank to still be visible... when hovering over your rank's
     area"): a CHILD of the ONE `.rank-band` the user's own score falls in
     now (rankpage.js sets `isCurrentBand`), not a global overlay on
     `.rank-ladder` positioned by a percentage of the WHOLE bar. That used
     to mean this line hid behind an EXPANDED band -- both were absolutely
     positioned siblings competing for stacking inside the SAME parent
     (`.rank-ladder`), and the hovered band's own `z-index: 3` beat this
     line's `z-index: 2`. Nested inside that one band instead, this line's
     z-index is compared only within THAT band's own local stacking
     context (created the moment the band's `:hover`/`:focus-within` rule
     sets its own `z-index`), above that band's surface/pips/icons in both
     the resting and the expanded state -- the stacking bug is fixed as a
     side effect of the same restructure that fixes the position. */
  .rank-ladder-head {
    position: absolute; top: -1px; bottom: -1px; width: 2px;
    background: var(--text); transform: translateX(-1px); z-index: 2;
  }
  /* The one permanent icon: the user's own rank, floating above its EXACT
     score position -- never a showcase tile. Bigger than the hover-revealed
     ones (CURRENT_RANK_ICON_SIZE, rankpage.js), since nothing else marks
     "this one is you" at rest any more. Same face as the cap's own
     sign-field glyph (`.hat .glyph`) for YOU -- a display word, not a
     caption -- with enough gap below it that the bigger icon can never
     grow into the text above it.
     Round 6 (addendum, task 8, 2026-07-26): no longer hides while a band
     is expanded. The earlier reasoning -- "YOU's position is only true at
     rest, and a hovered band is deliberately not proportional" -- was
     correct as far as it went, but hiding was the wrong remedy: the user's
     score is never actually unknowable during expansion, only expressed in
     the wrong coordinate system. Positioned as a fraction of the ONE band
     it belongs to (same as `.rank-ladder-head` above) instead of a
     fraction of the whole bar, its position recomputes correctly whenever
     that band's own width changes -- exactly how the pip/icon alignment
     already survives expansion. Hovering the user's own band is now a
     genuine zoom into where they actually are, with nothing left to hide:
     the showcase icons sit at their slot's own midpoint (they label a
     SPAN), this marker sits at the user's true fraction (it marks a
     VALUE) -- different meanings, visibly different positions, neither
     has to move off what it means. */
  .rank-ladder-mark.is-you {
    position: absolute; bottom: calc(100% + 8px); left: 0;
    transform: translateX(-50%); z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .rank-ladder-you {
    color: var(--gold); font-size: .68rem; font-weight: 700;
    letter-spacing: .1em; line-height: 1;
    font-family: "SuperMario256", Impact, sans-serif;
  }
  @media (prefers-reduced-motion: no-preference) {
    .rank-ladder-you-icon { animation: rank-mark-bob 2.4s ease-in-out infinite; }
    @keyframes rank-mark-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  }
  /* Fixed pixel height, not `height:auto` — HistoryChart measures its own
     rendered width via ResizeObserver and redraws the viewBox to match, so
     the box and the viewBox always share one aspect ratio (1:1 drawing, no
     letterboxing, no scaled text). An `auto` height let the two diverge
     whenever `max-height` capped it below what `width:100%` implied. */
  .rank-chart { display: block; width: 100%; height: 220px; }
  .rank-chart-span { margin: 4px 0 0; }
  /* The wheel-zoom affordances (round 6): a hint while the whole journey is
     in view, a reset once it isn't. Both live in the span caption rather
     than as chrome over the plot — the chart is 220px of fixed height with
     a tier label gutter, and a floating control would sit on the curve. */
  .rank-chart-hint { opacity: .75; }
  .rank-chart-block .linkish {
    background: none; border: 0; padding: 0; font: inherit; color: var(--gold);
    text-decoration: underline; cursor: pointer;
  }
  .rank-breakdown-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table td {
    padding: 5px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle;
  }
  /* Column headers carry the "(pts)" unit ONCE per surface (task C.2) —
     the score and gain cells below stay bare numbers, never repeating it
     per row. */
  .rank-table th {
    padding: 4px 8px 6px; border-bottom: 1px solid var(--border-soft);
    text-align: left; font-size: 11px; font-weight: 600; color: var(--muted);
    white-space: nowrap;
  }
  .rank-table tr.unpracticed .rank-cell-name { opacity: .55; }
