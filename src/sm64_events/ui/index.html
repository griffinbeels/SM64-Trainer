  /* Excluded dims the WHOLE row (it counts nowhere); unpracticed dims only the
     name (gain_for's docstring: it should still read as a quest, not dead
     weight) — two different states, two different treatments. */
  .rank-table tr.is-excluded { opacity: .5; }
  .rank-cell-points { text-align: right; white-space: nowrap; }
  .rank-cell-gain { color: var(--gold); text-align: right; white-space: nowrap; }
  /* The next-rank column (task C.3) can run "Diamond III → Diamond IV" —
     the longest string on the row; it gets the room a wrap would otherwise
     take from the name column, and shrinks its type rather than reflow at
     narrow widths (swept 900px in the harness, see task-c-report.md). */
  .rank-cell-next { white-space: nowrap; font-size: 12px; }
  .objective-live-state {
    min-width: 0; min-height: 32px; display: flex; align-items: center; justify-content: center;
    gap: .4rem; color: var(--muted); border-inline: 1px solid var(--border-soft);
  }
  .objective-live-state.running { color: var(--green); font-weight: 700; }
  .live-state-icon { font-size: 1.15rem; }
  .objective-card .pbtag {
    margin-left: 0; text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums; font-weight: 700;
  }
  /* +5px over the original 458 (2026-08-03, Task 7): `.analysis-card` is now
     the ONE page-level analysis card instead of one per section (Task 6),
     and its available height comes from a different layout than what these
     numbers were tuned against -- `.trend-block` (below) overflowed its own
     box by 5px at every width this rule governs (measured: scrollHeight 237
     vs clientHeight 232). Re-measured, not guessed: `.attempts-card` --
     the OTHER class this rule used to cover -- is gone; the practice log
     (`.log-list-card`) is a variable-height surface by design and was never
     sized by this rule to begin with. */
  .analysis-card {
    height: 463px; min-height: 463px; min-width: 0; overflow: hidden;
  }
  .analysis-card { display: flex; flex-direction: column; }
  .card-heading {
    min-height: 44px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-soft); margin-bottom: .65rem; padding-bottom: .55rem;
  }
  .card-heading h3 { margin-top: 1px; }
  .analysis-block { min-height: 0; }
  /* ⓘ hints: an instant styled tooltip on hover/keyboard focus. The native
     title= delay read as "this button does nothing" (2026-07-24). */
  .hint { position: relative; display: inline-flex; cursor: help; color: var(--muted); }
  .hint::after {
    content: attr(data-tip); position: absolute; z-index: 40;
    left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
    /* 80cqw floor added 2026-07-28: at 250px flat this tooltip is WIDER than
       the block it sits in once the pane is under ~312px, and .trend-block
       clips (`overflow: hidden`). Two consequences, one visible and one not:
       the hidden tooltip pushed the block's scrollWidth 6px past its client
       width at the WCAG reflow floor (which is how the sweep found it), and
       the tooltip would have been CUT OFF when actually shown — a hint that
       cannot be read. cqw resolves against .practice-page, and at any normal
       width min() picks the 250px, so nothing changes above ~312px. */
    width: max-content; max-width: min(250px, 80cqw); padding: .4rem .55rem;
    border: 1px solid #42617e; border-radius: 6px;
    background: #0b1929; color: var(--text);
    font-size: .72rem; font-weight: 400; line-height: 1.4; text-align: left;
    white-space: normal; box-shadow: 0 12px 34px rgba(0,0,0,.5);
    opacity: 0; visibility: hidden; transition: opacity .12s;
    pointer-events: none;
  }
  .hint:hover::after, .hint:focus-visible::after { opacity: 1; visibility: visible; }
  .timeline-block { flex: 0 0 112px; }
  .trend-block { flex: 1 1 auto; min-height: 190px; overflow: hidden; }
  /* max-WIDTH as well as max-height: the trend chart carries its own width and
     hung 6px past the block at the WCAG 1.4.10 reflow floor (320px), where
     `overflow: hidden` on .trend-block cut its right-hand axis label off
     rather than scaling it (sweep, 2026-07-28). */
  .trend-block svg { max-height: 210px; max-width: 100%; }
  /* Only the EMPTY trend block becomes a flex column, so its empty state can
     claim the block's slack and centre in it. Applying this unconditionally
     would stop the graph's own margins collapsing against the h4's and push
     the SVG down into `overflow: hidden`, clipping its x-axis labels. */
  .trend-block:has(> .empty-state) { display: flex; flex-direction: column; }
  /* Practice-log controls, in the card they act on: sort in the heading,
     reset visibility in the footer (the old analysis toolbar is gone). */
  .attempts-tools { display: flex; align-items: center; gap: .7rem; }
  /* Three controls ("N shown" / Stats / sort) need more width than the two
     this row used to have, and the row is kept to one line rather than left
     to wrap: `.log-list-card` is variable-height and does not clip (Task 7),
     so a second heading line no longer costs a clip the way it would on a
     fixed-height `overflow: hidden` card (ui-core.md's WRAPPING trap) --
     it would just look like a header that grew a spare line for no reason,
     which is reason enough on its own. Gated on @container against
     .practice-page, never @media, for the reason
     ui-core.md's responsiveness law states: the sidebar's 1180px step makes
     the pane a card lives in non-monotonic in window width, so no viewport
     threshold can stand in for "this card is too narrow".
     Icon-only Stats first (drop the label, the icon + title still say what
     it does), tighter gaps, THEN the count -- measured against the real
     fixture at the WCAG 1.4.10 reflow floor (320px), the widest heading text
     ("Unassigned attempts") and the narrowest ("Recent attempts") both: the
     count is the one truly recoverable value here (the log below it shows
     the same number of rows), so it goes last, same principle as
     .rank-banner-basis dropping before the delta it sits beside. */
  @container (max-width: 420px) {
    .stat-menu-label { display: none; }
    .attempts-tools { gap: .4rem; }
  }
  @container (max-width: 340px) {
    .attempts-tools > .meta { display: none; }
  }
  .sort-control {
    min-height: 34px; display: inline-flex; align-items: center; gap: .3rem;
    padding: .2rem .3rem .2rem .5rem; border: 1px solid #344b64;
    border-radius: 6px; background: #101f31; color: var(--muted);
  }
  /* Matches .sort-control's own fill rather than going transparent: a
     transparent select makes Chromium theme its popup WHITE (see the
     `option` rule at the top of this stylesheet — this control was the
     original casualty). */
  .sort-control select {
    min-height: 26px; max-width: 130px; border: 0; background: #101f31;
    padding-block: 0; color: var(--text);
  }
  /* Focus ring wraps the WHOLE control (icon included), not just the inner
     select — the half-highlighted control read as broken (2026-07-24). */
  .sort-control:focus-within { outline: 2px solid #78b9ff; outline-offset: 2px; }
  .sort-control select:focus-visible { outline: none; }
  .attempt-footer-tools { display: flex; align-items: center; gap: .4rem; }
  .reset-toggle {
    min-height: 30px; display: inline-flex; align-items: center; gap: .4rem;
    padding: .2rem .45rem; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: .82rem;
  }
  .reset-toggle:hover { color: var(--text); }
  .reset-toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .reset-toggle:has(input:checked) { color: var(--gold-soft); border-color: #8e7330; }
  .attempt-table { margin: 0; font-size: .79rem; font-variant-numeric: tabular-nums; }
  .attempt-table tr { height: 40px; }
  .attempt-table td { padding: .3rem .36rem; border-bottom: 1px solid var(--border-soft); }
  .attempt-index { width: 38px; }
  /* Round 5 (addendum, task 8, 2026-07-26 -- "sweep every container sized
     for the old disc"): 34px was sized for a 22px SQUARE Medal/Crest. A Hat
     at size=22 has a layout box alone of 22 * HAT_LAYOUT_WIDTH_RATIO (~1.632,
     caps.js) = ~36px -- already wider than the old cell -- and its wings
     then spill a further 22 * HAT_WING_SPILL_RATIO (~0.370) = ~8px past
     that on each side, for a real extent of ~52px in a 34px cell: it could
     never centre, and the overflow read as crowding the time column beside
     it (the user's exact report). 54px reserves the full wing-inclusive
     extent with a touch of room, consistent with the rank-banner fix
     (round 4) and every other site swept this round -- see caps.js's
     HAT_LAYOUT_WIDTH_RATIO/HAT_WING_SPILL_RATIO for where these numbers
     come from. */
  .attempt-medal { width: 54px; text-align: center; }
  /* NEVER WRAPS, at any width and at any nesting depth (round 24). The
     narrow-container variant far below has said `nowrap` since it was
     written; the WIDE one did not, so a result cell squeezed by anything
     other than the viewport broke its check away from its time onto a second
     line -- and a nested card is exactly that: its column is narrow while the
     `@container` query, which measures `.practice-page`, still reports wide.
     Griffin, on the second round of it: "the checkmark is spanning two
     lines... it should be one line, checkmark side by side with the time...
     each entry line should be exactly ONE row's worth of height. We need to
     make sure elements look the same for a row regardless of whether it's in
     a subentry or a top level entry." A wrap also breaks the row's own
     `--log-row-height`, which is where "one row's worth of height" comes
     from. */
  .attempt-result { min-width: 0; white-space: nowrap; }
  .attempt-delta { width: 72px; white-space: nowrap; font-weight: 700; }
  .attempt-strategy { width: 150px; white-space: nowrap; }
  .attempt-strategy select { max-width: 120px; min-width: 0; height: 30px; min-height: 30px; }
  .attempt-actions {
    width: 210px; text-align: right; white-space: nowrap;
  }
  .attempt-actions button { min-height: 30px; padding: .25rem .45rem; font-size: .76rem; }
  .attempt-actions .icon-button { width: 31px; padding-inline: 0; }
  .save-pb-narrow { display: none; }
  /* THE DISCLOSURE PRIMITIVE (components/collapsible.js::Disclose). Two
     rules and no more, deliberately: everything about HOW it opens is a
     measured animation, and anything expressed here in CSS would be a second
     opinion about it. The wrapper carries no padding, no border and no
     background of its own -- it is a clipping box during the run and nothing
     at all afterwards, so the surfaces inside it keep owning their own look
     and a closed one leaves no trace in the layout. */
  .disclose { display: block; }
  .disclose-inner { min-width: 0; }
  /* A SMIDGE OF ROOM ABOVE THE RANK SYMBOL, because that symbol spills outside
     its own box and the disclosure clips. Measured on the real page rather
     than guessed: 36 elements sit above `.disclose-inner`'s top edge -- the
     rank icon's wings and their shading -- by 2px at the shipped icon size,
     which is enough to flatten the top of a wing for the whole animation and
     restore it in one frame at the end. Griffin saw it and named the cause
     from two screenshots: "the top of the Waluigi 1 wing is cut off...
     something is weird here with layers, i think, or some type of clipping
     boundary", then asked for exactly this: "there needs to be a smidge of
     margin above where the rank symbol is displayed so that it doesn't clip".
     Scoped with `:has` so a dropdown with nothing to spill -- the Rank
     standards panel -- is not pushed down for a reason that does not apply to
     it. The value is deliberately larger than the 2px measured: the icon size
     is a tunable, so the spill grows with it. */
  .disclose-inner:has(.rank-banner) { padding-top: 8px; }
  .attempt-footer {
    min-height: 40px; display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; border-top: 1px solid var(--border-soft); padding-top: .45rem;
  }
  /* A FOOTER WITH NO CONTROLS TAKES NO ROOM. Both of its children are
     conditional -- the pagination hides itself at one page, and `HideToggle`
     renders nothing when no attempt is hidden -- so an ordinary short card
     drew an empty 40px box with a separator line above it, between the last
     attempt row and the in-card Rank standards panel. Measured, not guessed:
     48px of gap, 40 of it this box and 8 the panel's own margin (Griffin,
     2026-08-05: "we should move the rank standards up a little bit to
     tighten up the space vertically... basically just tightening up the
     gap"). `:has(button)` is the test rather than `:empty`, because the
     wrapper divs are always present and only their CONTENTS vary -- an
     `:empty` rule would never match and would look like a fix that did
     nothing. */
  .attempt-footer:not(:has(button)) {
    min-height: 0; padding-top: 0; border-top: 0;
  }
  .quiet-button, .attempt-footer > button {
    min-height: 30px; border: 0; background: transparent; color: var(--muted);
  }
  /* Real pagination (amendment A8) -- First/Prev/page-count/Next/Last,
     replacing "Show 10 more". Flex row so the five pieces wrap together
     rather than as five loose inline elements at a narrow card width;
     `:disabled` dims a First/Prev at page one or a Next/Last at the last
     page, which `.quiet-button` never needed before (nothing on it could
     previously be disabled). */
  .attempt-pagination { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
  .attempt-pagination button:disabled { opacity: .35; cursor: default; }
  .attempt-pagination-info { white-space: nowrap; }
  .detail-drawer { grid-column: 1 / -1; padding-block: 10px; }
  .detail-drawer summary {
    cursor: pointer; color: #d7e1ec; font-weight: 650;
  }
  .detail-drawer[open] summary { margin-bottom: .75rem; }
  .detail-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
  .danger-text { color: var(--coral); background: transparent; border-color: #61404a; }
  /* Compilation drawer (failcomp.js) — inner content; shell reuses .stdpanel/
     .disc.standards-toggle/.stdbody from the Rank-standards drawer. */
  .compilation-body { display: flex; flex-direction: column; gap: .7rem; }
  .compilation-lead { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.45; max-width: 46ch; }
  .compilation-settings { display: flex; flex-direction: column; gap: .35rem; }
  .compilation-fields { display: flex; flex-wrap: wrap; gap: .5rem; }
  .compilation-field { display: inline-flex; align-items: center; gap: .4rem; color: #cdd3da; font-size: .82rem; }
  .compilation-field input { width: 4.25rem; text-align: right; }
  .compilation-field .unit { color: var(--muted); }
  .compilation-settings small { font-size: .74rem; }
  .compilation-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
  .compilation-msg { font-size: .82rem; }
  .compilation-result {
    display: flex; flex-direction: column; gap: .4rem;
    padding-top: .6rem; border-top: 1px solid var(--border-soft);
  }
  .compilation-summary { display: flex; align-items: center; gap: .4rem; color: #a3e0a3; font-size: .82rem; }
  .compilation-path {
    color: var(--muted); font-size: .76rem; word-break: break-all;
    background: rgba(0,0,0,.28); border: 1px solid var(--border-soft);
    border-radius: 5px; padding: .35rem .5rem;
  }
  .compilation-reveal { align-self: flex-start; font-size: .8rem; }
  .stable-empty {
    min-height: 80px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center;
  }
  .stable-empty.compact {
    min-height: 32px; justify-content: flex-start; text-align: left;
  }
  /* "Nothing here yet" panels -- components/emptystate.js.  A card with a
     hard fixed height and no data to draw is a large silent void, and a void
     reads as a broken render rather than an honest state (live report
     2026-07-25).  So the four panels that can legitimately be empty get a
     404-shaped state instead: one dimmed cast member, a headline naming what
     is missing, the action that fills it, and a joke.

     `flex: 1 1 auto; min-height: 0` makes it fill what the card has LEFT
     without growing it -- `.analysis-card`/`.objective-card` are a hard
     463px/458px for OBS stability, and a placeholder that pushed past that
     would shove the layout the moment the first attempt landed. The log's
     own empty rows (`AttemptLogEmpty`, inside `.log-card-body`) reuse this
     same class harmlessly on a variable-height card -- nothing here competes
     for the flex slack, so it simply sizes to content. */
  .empty-state {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .26rem;
    padding: .6rem 1rem 1rem; text-align: center;
  }
  /* Sized by HEIGHT, never width: the six PNGs are alpha-trimmed to their own
     silhouettes, so they have different aspect ratios and only a shared
     height makes them read as one set. */
  .empty-art {
    position: relative; flex: 0 1 auto; min-height: 0;
    height: 128px; margin-bottom: .5rem;
    display: flex; align-items: flex-end; justify-content: center;
  }
  /* The floor.  A soft ellipse grounds the character so it reads as standing
     in the panel instead of pasted onto it; it stays put while the art bobs,
     because a shadow bobbing along with it would look like both are falling. */
  .empty-art::after {
    content: ""; position: absolute; z-index: 0;
    left: 50%; bottom: -5px; transform: translateX(-50%);
    width: 92px; height: 15px;
    background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent);
  }
  .empty-art img {
    position: relative; z-index: 1;
    height: 100%; width: auto; max-width: 100%; object-fit: contain;
    /* Dimmed on purpose: at full strength a 128px Toad out-shouts the live
       rank banner one card over.  Opacity plus a little desaturation makes it
       decoration; the drop-shadow keeps the silhouette off the panel instead
       of letting it dissolve into the navy. */
    opacity: .42; filter: saturate(.75) drop-shadow(0 7px 11px rgba(0,0,0,.55));
  }
  .empty-headline { color: #dce5ee; font-size: .92rem; }
  .empty-hint { max-width: 46ch; color: var(--muted); font-size: .78rem; }
  .empty-quip {
    max-width: 46ch; margin-top: .32rem; color: var(--gold-soft); opacity: .5;
    font-size: .74rem; font-style: italic;
  }
  @media (prefers-reduced-motion: no-preference) {
    .empty-art img { animation: emptybob 4.4s ease-in-out infinite; }
    @keyframes emptybob { 0%, 100% { transform: translateY(0); }
                          50% { transform: translateY(-7px); } }
  }
  /* Segments + Routes share one calm, responsive workshop language.  The
     library and editor are separate cards so state changes replace content
     inside stable slots instead of reflowing the whole page. */
  .workshop-page { min-width: 0; display: grid; gap: 12px; }
  .workshop-hero {
    /* flex-wrap + margin-right:auto on the title (below), not
       justify-content:space-between with a fixed 2-child assumption --
       segments.js grew a SECOND hero action (Task 13, "Record a segment"
       beside "New segment") and space-between distributes a 3rd child into
       the horizontal CENTER of the row rather than grouping it with the
       other button. The auto-margin trick generalises to any number of
       trailing action children while rendering byte-identical for the
       existing single-button case (routes.js's own hero) -- title flush
       left, the trailing button(s) flush right, same gap. Self-responsive:
       wraps onto a second line rather than clipping if the hero ever gets
       too narrow for both buttons, no @container/@media needed. */
    min-height: 82px; display: flex; align-items: center; flex-wrap: wrap;
    justify-content: flex-start; gap: 1rem;
  }
  .workshop-title {
    min-width: 0; display: flex; align-items: center; gap: .75rem;
    margin-right: auto;
  }
  .workshop-title-icon, .workshop-empty-icon {
    width: 42px; height: 42px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #385875; border-radius: 50%;
    background: #102238; color: var(--gold-soft);
  }
  .workshop-title h2 { margin: .08rem 0 .16rem; }
  .workshop-title p {
    margin: 0; color: var(--muted); font-size: .79rem; line-height: 1.35;
  }
  .workshop-card { min-width: 0; margin: 0; }
  .workshop-card-heading {
    min-height: 50px; display: flex; align-items: center;
    justify-content: space-between; gap: .8rem;
    padding-bottom: .65rem; margin-bottom: .65rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .workshop-card-heading h2, .workshop-card-heading h3 { margin-top: .08rem; }
  .count-badge {
    min-width: 28px; height: 26px; padding: 0 .42rem;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #38536d; border-radius: 999px;
    color: #bed0e1; background: #102036; font-size: .74rem;
  }
  .workshop-empty {
    min-height: 460px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .55rem;
    padding: 1.25rem; color: var(--muted); text-align: center;
  }
  .workshop-empty h3 { color: var(--text); }
  .workshop-empty p { max-width: 430px; margin: 0 0 .35rem; font-size: .8rem; }
  .workshop-empty.compact { min-height: 110px; font-size: .78rem; }
  .workshop-error { padding-block: .7rem; }

  .segments-workshop {
    min-width: 0; display: grid;
    grid-template-columns: minmax(300px,360px) minmax(0,1fr);
    align-items: start; gap: 12px;
  }
  /* The editor is the half that actually overflowed the PAGE: a fixed 620px
     floor plus its own content grew the document past the viewport, the page
     got a scrollbar, and because a scrollbar steals width the whole layout
     shifted left the moment the library grew (live audit 2026-07-25 — the
     library itself was already capped correctly, measured 39px clear of the
     fold). Bound it to the viewport exactly like the library and let its own
     body scroll; min() keeps the 620px floor only where it fits. */
  .segment-editor {
    min-height: min(620px, var(--pane-cap, calc(100vh - 205px)));
    max-height: var(--pane-cap, calc(100vh - 205px));
  }
  /* Library panel: viewport-bounded, the LIST is the scroll container. The
     old cap sat on the list (100vh - 230px) and ignored the card's own
     offset from the viewport top, so the card bottom ran off-screen (user
     report 2026-07-24). 205px ≈ context bar + hero + gaps at page top;
     sticky keeps the panel fully in view while a long editor scrolls. */
  .segment-library, .route-library {
    display: flex; flex-direction: column;
    position: sticky; top: 88px;
    min-height: 0; max-height: var(--pane-cap, calc(100vh - 205px));
  }
  /* Library filter box — sits between the heading and the scrolling list, so
     it stays put while results scroll under it (flex: 0 0 auto against the
     list's flex: 1 1 auto). The Library tab's own runner-search box (final
     review fix, minor: shared class) used to reuse this exact class -- one
     CSS change for either surface silently restyled the other, and it broke
     the segments-editor uilab story once
     (tests/test_uilab_story_setup_scoping.py). It uses `.library-target-
     search` below now; this block stays segments.js's own. */
  .library-search {
    flex: 0 0 auto; width: 100%; margin: 0 0 .55rem;
    padding: .42rem .6rem; font-size: .82rem;
    color: var(--text); background: rgba(8,20,34,.58);
    border: 1px solid var(--border-soft); border-radius: 8px;
  }
  .library-search::placeholder { color: var(--muted); }
  .library-search:focus {
    outline: none; border-color: #6287aa; background: rgba(8,20,34,.85);
  }
  .library-target-search {
    flex: 0 0 auto; width: 100%; margin: 0 0 .55rem;
    padding: .42rem .6rem; font-size: .82rem;
    color: var(--text); background: rgba(8,20,34,.58);
    border: 1px solid var(--border-soft); border-radius: 8px;
  }
  .library-target-search::placeholder { color: var(--muted); }
  .library-target-search:focus {
    outline: none; border-color: #6287aa; background: rgba(8,20,34,.85);
  }
  /* Overall Rank Standards — the target page's own header section. Shaped
     like a `.library-section` so it reads as a peer of the strategy
     accordions below it, but deliberately NOT one: it is not part of their
     single-open group, because closing the ladder to read a strategy (or the
     reverse) is exactly the comparison it exists to support. */
  .library-overall {
    margin: 0 0 .6rem;
    border: 1px solid var(--border-soft); border-radius: 10px;
    background: rgba(8,20,34,.5);
  }
  .library-overall-toggle {
    width: 100%; display: flex; align-items: center; gap: .4rem;
    padding: .5rem .65rem; font-size: .85rem; font-weight: 600;
    color: var(--text); background: none; border: 0; cursor: pointer;
    text-align: left;
  }
  .library-overall-toggle .meta { font-weight: 400; min-width: 0; }
  .library-overall-chevron {
    margin-left: auto; flex: 0 0 auto;
    transition: transform .18s ease;
  }
  .library-overall-toggle[aria-expanded="true"] .library-overall-chevron {
    transform: rotate(180deg);
  }
  .library-overall-body {
    padding: 0 .65rem .6rem; display: grid; gap: .5rem;
    overflow-x: auto;
  }
  .library-overall-note { margin: 0; font-size: .78rem; color: var(--muted); }
  .library-overall-table {
    width: 100%; border-collapse: collapse; font-size: .8rem;
  }
  .library-overall-table th {
    padding: .22rem .4rem; text-align: left; font-weight: 600;
    font-size: .72rem; color: var(--muted);
    border-bottom: 1px solid var(--border-soft);
  }
  .library-overall-table td {
    padding: .26rem .4rem; border-bottom: 1px solid rgba(255,255,255,.05);
    vertical-align: middle;
  }
  /* Round 2: the same shape as the entry bands below — a cap-art band head
     with its span, opening into five INDENTED subdivision rows. The indent is
     expressed by the nesting (one `.library-overall-divisions` padding), the
     project's own parent/child rule, not by a depth variable. */
  .library-overall-ladder { display: grid; gap: .3rem; }
  .library-overall-band {
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.42); overflow: hidden;
  }
  .library-overall-band-head {
    display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
    padding: .34rem .5rem; font-size: .82rem;
    background: rgba(255,255,255,.03);
  }
  .library-overall-range {
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .library-overall-by { margin-left: auto; text-align: right; min-width: 0; }
  .library-overall-divisions {
    padding: .16rem .5rem .3rem 1.35rem;   /* the child indent */
    display: grid; gap: .1rem;
  }
  .library-overall-division {
    display: flex; align-items: center; gap: .4rem;
    padding: .16rem .3rem; border-radius: 6px; font-size: .78rem;
  }
  .library-overall-division-label {
    display: flex; align-items: center; gap: .3rem; white-space: nowrap;
  }
  .library-overall-division .meta { font-variant-numeric: tabular-nums; }
  .library-overall-band-head.is-you { background: rgba(96,152,209,.16); }
  .library-overall-division.is-you { background: rgba(96,152,209,.20); }
  .library-overall-division.is-next { background: rgba(233,196,106,.13); }
  .library-overall-you, .library-overall-next { margin-left: auto; }
  /* The Library's own FIND box (round 12) and the result rows it swaps the
     course grid for. A third `.library-*search*` class was deliberately not
     minted here: the two above are each owned by one surface and the comment
     on the first records what sharing one cost, so this takes its own name
     rather than a third variant of theirs. */
  .library-find { position: relative; margin: 0 0 .8rem; }
  .library-find-input {
    width: 100%; padding: .55rem 2.2rem .55rem .75rem; font-size: .9rem;
    color: var(--text); background: rgba(8,20,34,.58);
    border: 1px solid var(--border-soft); border-radius: 9px;
  }
  .library-find-input::placeholder { color: var(--muted); }
  .library-find-input:focus {
    outline: none; border-color: #6287aa; background: rgba(8,20,34,.85);
  }
  /* Chrome draws its own clear affordance on type=search; ours is a real
     button so it can carry a label and a hit target, and two of them side by
     side reads as a rendering fault. */
  .library-find-input::-webkit-search-cancel-button { display: none; }
  .library-find-clear {
    position: absolute; top: 50%; right: .45rem; transform: translateY(-50%);
    width: 1.6rem; height: 1.6rem; padding: 0; line-height: 1;
    color: var(--muted); background: none; border: 0; border-radius: 6px;
    cursor: pointer;
  }
  .library-find-clear:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .library-find-empty { margin: .6rem 0 0; }
  .library-results { display: grid; gap: .4rem; align-content: start; }
  /* justify-content is NAMED, not left to the default: a bare `display:flex`
     on a <button> centres its children in Chromium (the UA sheet's own
     `justify-content: center` for buttons wins over flex's initial value), so
     every row drew its icon and both lines floating in the middle of a
     full-width card -- correct content, visibly off its own left edge. */
  .library-result {
    display: flex; align-items: center; justify-content: flex-start;
    gap: .7rem; width: 100%;
    padding: .5rem .65rem; text-align: left; cursor: pointer;
    color: var(--text); background: rgba(8,20,34,.4);
    border: 1px solid var(--border-soft); border-radius: 10px;
    transition: background .18s ease, border-color .18s ease;
  }
  .library-result:hover { background: rgba(14,32,52,.72); border-color: #6287aa; }
  .library-result-icon {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 8px;
    object-fit: cover;
  }
  /* min-width: 0 is what lets the two lines below ellipsise instead of
     pushing the row wider than its pane -- a flex child's default min-width
     is its content, so without this a long target name overflows the card
     rather than truncating inside it. */
  .library-result-text { display: grid; gap: .1rem; min-width: 0; }
  .library-result-name {
    font-weight: 600; font-size: .92rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .library-result-sub {
    font-size: .78rem; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .segment-list {
    min-height: 0; flex: 1 1 auto;
    overflow: auto; display: grid; align-content: start; gap: .55rem;
    padding-right: 2px; scrollbar-width: thin;
  }
  .segrow {
    min-width: 0; display: grid; gap: .4rem;
    padding: .55rem; margin: 0;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.62);
  }
  .segrow.on { border-color: #6287aa; background: rgba(41,76,111,.25); }
  .segment-row-main {
    min-width: 0; min-height: 38px; display: grid; gap: .28rem;
    justify-items: start; padding: .1rem .18rem;
    border: 0; background: transparent; text-align: left;
  }
  .segment-row-main:hover { border: 0; background: transparent; }
  .segment-row-name {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 700;
  }
  .segment-row-state { min-height: 19px; display: flex; flex-wrap: wrap; gap: .3rem; }
  .segment-row-state .chip { padding: .05rem .42rem; font-size: .65rem; }
  .target-chip { color: var(--gold-soft); border-color: #806e37; }
  .muted-chip { color: var(--muted); border-color: #344353; }
  .segment-row-actions {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: .3rem;
  }
  .segment-row-actions button { min-width: 0; min-height: 31px; padding: .25rem .35rem; font-size: .69rem; }
  .segment-row-actions .is-selected { color: var(--gold-soft); border-color: #846e2e; }
  .segment-row-actions .icon-button { width: 31px; min-width: 31px; }
  /* overflow-y auto, not hidden: the pane is viewport-bounded above, so a long
     definition scrolls INSIDE the card rather than growing the document. */
  .segment-editor { overflow-x: hidden; overflow-y: auto; }
  .segbuilder { min-width: 0; border: 0; padding: 0; margin: 0; }
  .builder-heading {
    min-height: 50px; display: flex; align-items: center;
    justify-content: space-between; gap: .75rem;
    padding-bottom: .65rem; margin-bottom: .8rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .builder-heading h2 { margin-top: .08rem; }
  .builder-name { display: grid; gap: .28rem; }
  .builder-name input { width: 100%; min-width: 0; }
  .builder-enabled {
    display: flex; align-items: center; gap: .55rem; margin: .65rem 0;
    padding: .65rem .75rem; border: 1px solid var(--border-soft);
    border-radius: 7px; background: rgba(8,20,34,.55);
  }
  .builder-enabled input { min-height: 0; }
  .builder-enabled span { display: grid; gap: .05rem; }
  .builder-enabled small, .seghead small, .setting-copy span {
    color: var(--muted); font-size: .7rem; font-weight: 400;
  }
  /* Match-mode control (spec 2026-07-28-multi-step-segments, final-review
     finding 4) -- boxed like .builder-enabled above; the description wraps
     to its own full-width row beneath the label+select one so a long
     sentence never fights the select for horizontal room. The clock-start
     control (round 15) is the same shape and shares every rule -- it
     shipped with NO rule at all, and its description overlapped its own
     select across the 1019-1075px band (the sweep's 52-defect finding,
     2026-08-08). */
  .builder-matchmode, .builder-clockstart {
    display: flex; flex-wrap: wrap; align-items: center; gap: .55rem;
    margin: .65rem 0; padding: .65rem .75rem;
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(8,20,34,.55);
  }
  .builder-matchmode .field-label, .builder-clockstart .field-label { margin: 0; }
  .builder-matchmode select, .builder-clockstart select {
    min-width: 0; max-width: 20rem; }
  .builder-matchmode .meta, .builder-clockstart .meta { flex-basis: 100%; }
  .segment-definition-grid {
    display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .65rem;
  }
  .segsection {
    min-width: 0; margin: 0; padding: .65rem;
    border-radius: 8px; background: rgba(8,20,34,.48);
  }
  .segsection.seg-guard { grid-column: 1 / -1; }
  .seghead {
    min-height: 38px; display: flex; align-items: center; gap: .5rem;
    padding: 0 0 .5rem; margin: 0 0 .45rem;
    border-bottom: 1px solid currentColor; border-radius: 0; background: transparent !important;
  }
  .seghead > span:last-child { display: grid; gap: .05rem; }
  .seghead-icon { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center; }
  .seg-start .seghead { color: #8fce9f; }
  .seg-end .seghead { color: #e79a9a; }
  .seg-guard .seghead { color: #d8b77f; }
  .segclause {
    min-width: 0; min-height: 48px; margin: .4rem 0; padding: .42rem .5rem;
    gap: .42rem; border: 1px solid rgba(72,96,119,.35);
    border-left-width: 3px;
  }
  .segclause select { flex: 1 1 150px; }
  .segclause input { flex: 0 1 90px; }
  .segclause .clause-remove { flex: 0 0 31px; margin-left: auto; }
  .segment-add-condition { margin-top: .25rem; padding-inline: .25rem; }

  /* Split into two / Merge with another (Task 18, spec 2026-07-28-multi-
     step-segments) -- boxed panels like .builder-enabled above, one action
     per box. Grid's default justify-items:stretch would otherwise pull the
     trailing button full-width, so it alone opts out. */
  .builder-split, .builder-merge {
    display: grid; gap: .5rem; margin: .65rem 0; padding: .65rem .75rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.48);
  }
  .builder-split .field-label, .builder-merge .field-label {
    display: flex; align-items: center; gap: .4rem; margin: 0;
  }
  .split-names { display: flex; gap: .5rem; flex-wrap: wrap; }
  .split-names input { flex: 1 1 160px; min-width: 0; }
  .merge-body { display: grid; gap: .5rem; }
  .merge-controls { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .merge-controls select { flex: 0 1 160px; }
  .builder-split > button, .merge-body > button { justify-self: start; }
  .builder-actions {
    min-height: 56px; display: flex; align-items: center; justify-content: flex-end;
    flex-wrap: wrap; gap: .5rem; margin-top: .75rem;
    padding-top: .75rem; border-top: 1px solid var(--border-soft);
  }
  .builder-actions .meta { margin-right: auto; font-size: .72rem; }

  /* Author-time lint findings (Task 16, spec 2026-07-28-multi-step-segments)
     -- one row per tracking/lint.py finding, beside Save. Errors and warnings
     share one box (no severity grouping): they're few enough per definition
     that a second layout tier would be more chrome than content. */
  .lint-panel {
    display: grid; gap: .4rem; margin-top: .75rem; padding: .55rem .7rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.48);
  }
  .lint-finding { display: flex; align-items: flex-start; gap: .4rem; font-size: .82rem; }
  .lint-finding svg { flex: 0 0 auto; margin-top: .15rem; }
  .lint-error { color: #e79a9a; }
  .lint-warning { color: #d8b77f; }

  .backtest-panel {
    display: grid; gap: .5rem; margin-top: .75rem; padding: .65rem .75rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.48);
  }
  .backtest-summary { display: flex; flex-wrap: wrap; gap: .55rem; align-items: baseline; }
  .backtest-unclosed { display: grid; gap: .25rem; }
  .backtest-attempts {
    display: grid; gap: .2rem; max-height: 220px; overflow-y: auto;
    padding-right: 2px; scrollbar-width: thin;
  }

  /* The RECORDER -- ui/components/segmenttimeline.js. Self-responsive
     (flex-wrap + a capped, scrollable row list), like iconpicker.js's
     .icongrid above: this renders inside a Modal, which is NOT nested in
     .practice-page (the only element with container-type: inline-size), so
     there is no @container to gate against here -- and nothing below needs
     a breakpoint anyway.

     There is deliberately NO styling for a live/paused distinction: the
     surface has one state, and a badge saying "streaming" would be inventing
     the mode the rewrite removed (2026-08-05). */
  .record-view-toggle {
    display: flex; align-items: center; gap: .4rem;
    margin-bottom: .65rem; font-size: .82rem; color: var(--muted);
  }
  .record-picks {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    margin-bottom: .45rem;
  }
  /* ONE CARD PER VISIT (2026-08-05). The SCROLL moved up here from
     .record-rows: with cards, each list is short and it is the stack of
     places that gets long, so capping each card's own rows would give a
     screenful of tiny independent scrollers. */
  .record-cards {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 45vh; overflow-y: auto; padding-right: 4px;
  }
  /* `flex: 0 0 auto` is load-bearing, not tidying. A flex column SHRINKS its
     children by default, so several cards competing for the 45vh above were
     squeezed below their content — and with overflow:hidden for the rounded
     corners, the rows at the bottom of each card were silently eaten. The
     responsive sweep found it at 18 viewports × 3 states; nothing about the
     rendering looked wrong, which is exactly why the probe exists. The stack
     scrolls; a card never does. */
  .record-card {
    flex: 0 0 auto;
    border: 1px solid var(--border-soft); border-radius: 9px;
    background: rgba(8,20,34,.30); overflow: hidden;
  }
  /* The HEADER is the fold: one affordance, one hit target — the same rule
     the context cards are built on (a chevron beside a heading gives one
     gesture two targets, and the mismatch reads as a bug). */
  .record-card-head {
    width: 100%; display: flex; align-items: center; gap: .5rem;
    padding: .45rem .6rem; text-align: left; cursor: pointer;
    background: rgba(255,255,255,.03); color: var(--text);
    border: 0; border-bottom: 1px solid var(--border-soft);
    transition: background 140ms ease;
  }
  .record-card-head:hover { background: rgba(255,255,255,.07); }
  .record-card.folded .record-card-head { border-bottom-color: transparent; }
  .record-card-chevron {
    display: inline-grid; place-items: center; color: var(--muted);
    transition: transform 180ms ease;
  }
  .record-card.folded .record-card-chevron { transform: rotate(-90deg); }
  .record-card-icon {
    width: 20px; height: 20px; object-fit: contain; flex: 0 0 auto;
  }
  .record-card-name {
    flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: .86rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* `grid-template-rows: 1fr -> 0fr` is the one height transition that needs
     no measured pixel value, and it interpolates in Chromium 117+ (150 here).
     `visibility` rides along so a folded card's buttons leave the tab order —
     zero height with overflow:hidden does not take them out of it. Its own
     delay is what keeps the content visible THROUGH the collapse rather than
     vanishing on frame one. */
  .record-card-body {
    display: grid; grid-template-rows: 1fr;
    transition: grid-template-rows 200ms ease, visibility 0s linear 0s;
  }
  .record-card.folded .record-card-body {
    grid-template-rows: 0fr; visibility: hidden;
    transition: grid-template-rows 200ms ease, visibility 0s linear 200ms;
  }
  .record-card-clip { min-height: 0; overflow: hidden; }
  .record-rows {
    display: flex; flex-direction: column; gap: 4px;
    padding: 4px; padding-right: 4px;
  }
  .record-row {
    min-width: 0; display: flex; align-items: center; gap: .55rem;
    text-align: left; padding: .5rem .65rem;
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(8,20,34,.48); color: var(--text); cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .record-row:hover { background: rgba(255,255,255,.06); }
  .record-row.picked {
    border-color: rgba(255,196,84,.55); background: rgba(255,196,84,.10);
  }
  /* The ordinal slot holds its width in EVERY state, picked or not, or the
     label jumps sideways the moment a row is chosen -- the same reason
     steptrack.js reserves its marker cell. */
  .record-mark {
    flex: 0 0 1.35rem; height: 1.35rem; display: inline-grid;
    place-items: center; border-radius: 999px; font-size: .72rem;
    font-variant-numeric: tabular-nums; color: var(--muted);
    background: rgba(255,255,255,.05);
  }
  .record-mark.role-start, .record-mark.role-finish {
    color: #10202f; background: var(--gold); font-weight: 700;
  }
  .record-mark.role-stop {
    color: var(--text); background: rgba(255,196,84,.30);
  }
  .record-label { flex: 1 1 auto; min-width: 0; }
  /* The row and its rename control sit side by side: a button inside a button
     is invalid and the browser drops it silently. The wrapper is what makes the
     pencil a sibling rather than a child. */
  .record-row-wrap { display: flex; align-items: stretch; gap: 4px; min-width: 0; }
  .record-row-wrap > .record-row { flex: 1 1 auto; min-width: 0; }
  .record-rename {
    flex: 0 0 auto; width: 2rem; border: 1px solid var(--border-soft);
    border-radius: 7px; background: rgba(8,20,34,.48); color: var(--muted);
    cursor: pointer; font-size: .95rem; line-height: 1;
    opacity: 0; transition: opacity 140ms ease, color 140ms ease,
                            border-color 140ms ease;
  }
  /* Revealed on hover or focus, never removed from the tree -- a control that
     appears from nothing has nothing to animate, and keyboard users need it to
     exist before they can reach it. */
  .record-row-wrap:hover .record-rename,
  .record-rename:focus-visible { opacity: 1; }
  .record-rename:hover { color: var(--gold); border-color: rgba(255,196,84,.55); }
  .record-rename-edit { display: flex; align-items: center; gap: .3rem; }
  .record-rename-input {
    flex: 0 0 11rem; min-width: 0; padding: .35rem .5rem;
    border: 1px solid rgba(255,196,84,.55); border-radius: 7px;
    background: rgba(8,20,34,.8); color: var(--text); font: inherit;
  }
  /* The visible commit/cancel pair — the cancel affordance he asked for
     (round 12 item 5); Escape still works but a key is not an affordance. */
  .record-rename-ok, .record-rename-cancel {
    flex: 0 0 auto; width: 1.8rem; padding: .3rem 0;
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(8,20,34,.48); color: var(--muted);
    cursor: pointer; font-size: .85rem; line-height: 1;
    transition: color 140ms ease, border-color 140ms ease;
  }
  .record-rename-ok:hover { color: var(--good, #7dd97d); border-color: rgba(125,217,125,.55); }
  .record-rename-cancel:hover { color: var(--bad, #ff7d7d); border-color: rgba(255,125,125,.55); }
  .record-role {
    flex: 0 0 auto; font-size: .7rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--gold);
  }
  .record-igt {
    flex: 0 0 auto; font-variant-numeric: tabular-nums;
    font-size: .82rem; color: var(--muted);
  }
  .record-review { display: flex; flex-direction: column; gap: .5rem; }
  .record-parent {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  }

  .routes-workshop {
    min-width: 0; display: grid;
    grid-template-columns: minmax(240px,300px) minmax(0,1fr);
    align-items: start; gap: 12px;
  }
  /* .route-library shares the segment-library viewport-bound rule above;
     .library-actions (margin-top:auto) stays pinned inside the card. */
  .route-list {
    min-height: 0; flex: 1 1 auto;
    overflow-y: auto; overflow-x: hidden;
    display: grid; grid-template-columns: minmax(0,1fr);
    align-content: start; gap: .4rem;
    padding-right: 2px; scrollbar-width: thin;
  }
  .route-list-item {
    width: 100%; min-width: 0; min-height: 54px;
    display: grid; grid-template-columns: minmax(0,1fr) auto;
    justify-content: initial; text-align: left; padding: .48rem .58rem;
    background: rgba(8,20,34,.58); border-color: var(--border-soft);
  }
  .route-list-item > span { min-width: 0; display: grid; gap: .08rem; }
  .route-list-item b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .route-list-item small { color: var(--muted); font-size: .68rem; }
  .route-list-item > .ui-icon { transform: rotate(-90deg); color: var(--muted); }
  .route-list-item.on { border-color: #6287aa; background: rgba(61,101,143,.25); }
  .route-list-item.on > .ui-icon { color: #9cc9f2; }
  /* Collapsible library groups (2026-07-24, generalized from the route
     library): ONE class per level, indent expressed by the nesting itself
     (a node's children render through the same component one level deeper —
     see grouplist.js), so a third level costs nothing new here either. Rows
     keep their own .4rem gap; the group supplies a slightly larger gap above
     each header so sections read as sections without a divider line. */
  .lib-cat {
    min-width: 0; display: grid; align-content: start; gap: .4rem;
    grid-template-columns: minmax(0,1fr);
  }
  .lib-cat + .lib-cat { margin-top: .5rem; }
  .lib-cat-header {
    width: 100%; min-width: 0; display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center; gap: .4rem;
    justify-content: initial; text-align: left;
    padding: .3rem .5rem; background: transparent;
    border-color: transparent; color: var(--muted);
    font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
  }
  .lib-cat-header:hover { color: var(--text); background: rgba(8,20,34,.5); }
  .lib-cat-header b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: .74rem; letter-spacing: inherit;
  }
  .lib-cat-header > .ui-icon { transition: transform .12s ease; }
  .lib-cat-header.shut > .ui-icon { transform: rotate(-90deg); }
  /* EVERY level indents, and the indent COMPOUNDS through nesting — a child
     is always one step right of its parent, at any depth, with a guide line
     tying it to the header above it (user rule 2026-07-25: anything that
     implies a parent/child relationship indents the child one level; a
     sub-group flush with its parent reads as a sibling).

     This deliberately supersedes the earlier "depth-0 has no guide line"
     rule, which restored a pre-migration route look at the cost of leaving
     sub-group HEADERS flush with their parent — the regression the live audit
     caught. One rule on .lib-group does it: nesting supplies the depth, so a
     third or fourth level needs nothing new. */
  .lib-group {
    min-width: 0; display: grid; grid-template-columns: minmax(0,1fr);
    align-content: start; gap: .4rem;
    margin-left: .5rem; padding-left: .45rem;
    border-left: 1px solid var(--border-soft);
  }
  .lib-cat-header.sub {
    padding-left: .3rem; font-size: .68rem;
    text-transform: none; letter-spacing: .02em;
  }
  .lib-cat-header.sub b { font-size: .72rem; font-weight: 600; }
  /* Indent the ROW with a margin and let it stretch — `width: 100%` (the base
     .route-list-item rule) plus a margin is wider than the column, which both
     broke the indent and gave the library a horizontal scrollbar (live report
     2026-07-24). A vertical list never scrolls sideways: names ellipsise. */
  .lib-cat .route-list-item, .lib-cat .segrow { width: auto; }
  /* Two columns, not three: the library column is 240-300px, and three
     icon+label buttons overflowed the card (live report 2026-07-24 — "Delete"
     hung past the edge). The third wraps to its own row. min-width:0 on the
     buttons is the belt — a long label truncates instead of escaping. */
  .library-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: .4rem;
    margin-top: auto; padding-top: .65rem; border-top: 1px solid var(--border-soft);
  }
  .library-actions > button {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Same viewport bound as .segment-editor, for the same reason: an unbounded
     right-hand pane grows the document, the page gets a scrollbar, and the
     layout shifts sideways. The routes workshop has the identical shape, so it
     gets the identical treatment rather than waiting to be reported. */

  /* Compare, narrow pane. Was `@media (max-width:820px)` plus a second half in
     `@media (max-width:760px)` until 2026-07-28. Viewport 820 gives the pane
     701px and viewport 760 gives it 725px, so the pair were applying their
     "narrower" treatment to a WIDER pane — the same inversion the Active
     Target card had. One threshold, on the pane, replaces both.

     Placed HERE, immediately after the base rules, and that is load-bearing:
     these first went in where the old @media block sat near the top of the
     stylesheet and silently lost to `.primary-transport` above on source
     order — identical specificity (0,2,0), later rule wins. The sweep kept
     reporting the identical overlap through a fix that read as correct. */
  @container (max-width: 700px) {
    .compare-grid { flex-direction: column; }
    .compare-col, .compare-center { width: 100%; flex: none; }
    .compare-center { padding-top: .4rem; }
    .compare-transport { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .compare-transport-card { align-items: stretch; flex-direction: column; }
  }
  /* Four transport buttons across, once wrapping them is worse than shrinking
     them. `.primary-transport` is named EXPLICITLY rather than relying on the
     neighbouring `.compare-transport button` reset: that reset is (0,1,1) and
     the 92px min-width above is (0,2,0), so the button stayed 92px wide inside
     a ~64px grid cell and overlapped its neighbour by 22px at 320px. Found by
     the sweep the first time secondary tabs were measured at more than three
     viewports — the old coverage never looked at Compare below 760. */
  @container (max-width: 430px) {
    .compare-transport { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); }
    .compare-transport button,
    .compare-transport .primary-transport {
      min-width: 0; padding-inline: .28rem; font-size: .7rem;

  /* The picker grid is WIDE, not tall: 25 course cells at the default 600px
     came out 5 columns x 5 rows and scrolled, which is the thing the grid
     replaced a scrolling list to avoid (live audit 2026-07-25). At ~1100px the
     same cells lay out 8-9 across and fit in three rows with room to spare. */
  .modal-grid { width: min(96vw, 1100px); }
  .modal-header {
    flex: 0 0 auto; min-height: 78px; display: grid;
    grid-template-columns: 42px minmax(0,1fr) 36px;
    align-items: center; gap: .7rem; padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg,rgba(18,39,62,.98),rgba(11,27,44,.98));
  }
  .modal-icon {
    width: 40px; height: 40px; display: inline-flex;
    align-items: center; justify-content: center;
    border: 1px solid #456480; border-radius: 50%;
    color: var(--gold-soft); background: #10243a;
  }
  .modal-heading { min-width: 0; }
  .modal-heading h2 {
    margin: 0; color: var(--text); font-size: 1.12rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-heading p { margin: .16rem 0 0; color: var(--muted); font-size: .72rem; line-height: 1.35; }
  .modal-close { justify-self: end; }
  .modal-body { min-height: 0; overflow: auto; padding: 16px; scrollbar-width: thin; }
  .modal-actions {
    flex: 0 0 auto; min-height: 62px; display: flex;
    justify-content: flex-end; align-items: center; gap: .5rem;
    margin: 0; padding: 12px 16px;
    border-top: 1px solid var(--border-soft); background: rgba(7,18,31,.85);
  }
  .modal-field { display: grid; gap: .3rem; }
  .modal-field input, .modal-field select { width: 100%; min-width: 0; }
  .modal-field small { color: var(--muted); font-size: .68rem; }
  .modal-error {
    min-height: 38px; display: flex; align-items: center;
    margin-top: .65rem; padding: .5rem .65rem;
    border: 1px solid #72434b; border-radius: 6px;
    background: rgba(99,45,55,.22); color: #f0a4aa;
  }

  .strategy-name-field { margin-bottom: 1rem; }
  .stratname { margin: 0; }
  /* "Include in ranking" — a checkbox ROW, and deliberately NOT a
     `.modal-field`: that class stretches its input to `width: 100%`, which
     turned the tick into a 36px square and pushed its label out of the
     modal. Sized explicitly here, with the same `min-height: 0` +
     accent-color every other checkbox in this design system takes.
     `align-items: start` keeps the box on the first line as the
     explanation wraps. */
  .strategy-include-field {
    display: flex; align-items: start; gap: .5rem; margin-bottom: 1rem;
  }
  .strategy-include-field input[type="checkbox"] {
    width: 15px; height: 15px; min-height: 0; margin: .15rem 0 0;

  .strategy-include-field > span { display: grid; gap: .12rem; }
  .strategy-include-field .meta { font-size: .69rem; }

  /* "You are here" marker (standards.js markerPosition). A cell highlight
     would be a lie -- your time is essentially never AT a cutoff -- so the
     label lives on the active column's header instead of floating a row
     between two cutoffs: at narrow table widths (<= ~900px, live-tested)
     a floating row's label collided with the cutoff time on the same row,
     illegibly. The two cutoffs actually bracketing your time get their own
     mark; every easier tier below that (already running faster than) reads
     as beaten. */
  .std-you-badge {
    display: block; margin-top: 2px; font-size: 10px; font-weight: 600;
    color: var(--gold); white-space: nowrap;
  }
  /* background, not box-shadow: .col-active already owns box-shadow on this
     cell (the active-column outline), and two box-shadow rules of equal
     specificity don't combine -- the later one simply wins outright. */
  .std-marker-bracket { background: color-mix(in srgb, var(--gold) 22%, transparent); }

  .update-installing span.update-retrying { color: var(--gold); }

  .replay-player > video {

  }

    z-index: 20;

    max-height: min(76vh,640px); overflow: auto; padding: .8rem;

  .popover-heading > div { display: grid; gap: .08rem; }
  .popover-note { margin: .25rem 0 .7rem; color: var(--muted); font-size: .68rem; }
  .buffer-usage { display: grid; gap: .4rem; margin-bottom: .7rem; }
  .buffer-usage > div:first-child { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .buffer-usage span { color: var(--muted); font-size: .68rem; }
  .buffer-meter { height: 7px; overflow: hidden; border-radius: 99px; background: #14263a; }
  .buffer-meter > div { height: 100%; border-radius: inherit; background: var(--meter-color); }
  .replay-setting-grid { display: grid; border-block: 1px solid var(--border-soft); }
  .replay-setting-row {
    min-width: 0; min-height: 58px; display: grid;
    grid-template-columns: minmax(150px,1fr) 240px;
    align-items: center; gap: .6rem; padding: .55rem 0;

  }

    width: 240px; min-width: 0; display: grid; align-content: center;
    justify-self: end; gap: .38rem;

  }

  }

  .primary-button { color: #1b1607; background: var(--gold); border-color: var(--gold-soft); font-weight: 750; }
  .primary-button:hover { background: var(--gold-soft); }
  .settings-head, .settings-section-head {

  }
  .settings-backdrop {

    width: min(480px, 94vw); height: 100%; overflow-y: auto; padding: 20px;
    border-left: 1px solid #3b5874; background: #0a1726;
    box-shadow: -18px 0 55px rgba(0,0,0,.38);
  }
  .settings-head { margin-bottom: .8rem; }
  .settings-head h2 { margin: 0; }
  .settings-section { padding: 1rem 0; border-top: 1px solid var(--border-soft); }
  .settings-section h3 { margin-bottom: .3rem; }
  .settings-field { display: flex; align-items: center; justify-content: space-between;
                    gap: .6rem; margin: .35rem 0 .2rem; font-size: .85rem; }
  .settings-field select { min-width: 0; max-width: 60%; }
  .settings-section p, .settings-note { color: var(--muted); font-size: .8rem; margin: .2rem 0 .65rem; }
  .settings-field {

    gap: .7rem; margin-bottom: .4rem;
  }

  .settings-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
  .settings-actions button { justify-content: flex-start; }
  .session-list { display: grid; gap: .45rem; }
  .session-row {
    min-width: 0; display: grid; grid-template-columns: 1fr auto; gap: .4rem;
  }

  }
  .session-pick span:last-child { color: var(--muted); font-size: .72rem; }
  .danger-icon, .danger-button { color: var(--coral); border-color: #65404a; }
  .danger-zone { margin-top: .35rem; }
  .mobile-more-backdrop {
    position: fixed; inset: 0; z-index: 70; align-items: flex-end;
    background: rgba(0,5,12,.65);
  }
  .mobile-more-sheet {
    width: 100%; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid #3b5874; border-radius: 14px 14px 0 0; background: #0c1928;
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8rem; }
  .sheet-head span { display: block; color: var(--muted); font-size: .75rem; }

  @media (max-width: 1180px) {
    .app-shell { grid-template-columns: var(--sidebar-rail) minmax(0,1fr); }
    .app-sidebar { padding-inline: 8px; }
    .app-brand { min-height: 64px; justify-content: center; padding-inline: 0; }
    .app-brand img { width: 54px; height: 50px; }
    .app-brand span, .nav-group-label, .nav-item span, .status-main, .status-sub { display: none; }
    .nav-group { padding-block: .48rem; }
    .nav-item { justify-content: center; padding-inline: 0; }
    .nav-item.on { box-shadow: inset 2px 0 0 #76b5f5; }
    .sidebar-status { justify-items: center; padding: .55rem .3rem; }

    /* The rail's connection + recording block.
       ----------------------------------------------------------------
       These are SIDEBAR chrome, and they belong in a viewport query: the
       sidebar's width is a fact about the shell, and the sidebar is not
       inside `.view-pane`, so it has no size container to ask.

       They spent a few hours inside `@container (max-width: 1060px)`, where
       they could never match — the Wave 2 conversion classified
       `.recording-status` as component-internal because SHELL_SELECTORS did
       not list it. The result is exactly what the user reported: "the
       recording section is clearly too big and the dot is not sized properly
       when the sidebar is small". Nothing was styling it at all. Same shape as
       the `.context-bar` rule that came back on all seven tabs at once.

       In the rail the label collapses to a dot: `font-size: 0` hides the text
       (which has no room) and `::before` draws the indicator, CENTRED rather
       than left-aligned in a full-width box, with the border and padding
       dropped so the block is a dot and not a panel containing one. */
    .connection-line { display: block; }
    .recording-status {
      width: 100%; display: flex; justify-content: center;
      border-top: 0; padding-top: .35rem;
    }
    .recording-status > span, .recording-status .dot {
      display: flex; align-items: center; justify-content: center;
    }
    .recording-status .dot { font-size: 0; overflow: visible; }
    .recording-status .dot::before {
      content: ""; display: block; width: 10px; height: 10px;
      border-radius: 50%; background: currentColor;
    }
    .recording-status .recording-light { display: none; }

    .context-bar {
      grid-template-columns: minmax(145px,.8fr) minmax(210px,2.25fr)
                             minmax(130px,.65fr);
    }
  }


  /* Rank-banner crowding, keyed on the PANE and not the viewport.
     ------------------------------------------------------------------
     A rank banner cannot be abbreviated: kicker, medal, tier + division,
     and the "next" target with its delta are all the information. When the
     row runs out of room the text ellipsizes mid-word, which the user read
     as "a visual error entirely" (live report 2026-07-25). Three rounds of
     flex tuning did not fix it because the row was over-subscribed, and a
     fourth round measured it at three viewport widths and still missed it.

     These are @container rules, on .practice-page's inline-size container
     (declared above, and already what the star row's cqw units resolve
     against), because VIEWPORT WIDTH IS THE WRONG SIGNAL HERE: the sidebar
     is 206px wide above 1180px and a 76px rail below it, so the pane a card
     lives in is NOT monotonic in window width. Measured on the shipping
     shell: a 1181px window gives the card a 947px pane, while a 1180px
     window gives it 1076px. A max-width media query therefore cannot
     express "this card is too narrow"; every viewport threshold is wrong on
     one side of that jump. The container width is the thing that actually
     varies, so it is the thing that gates.

     Thresholds are measured, not guessed (headless sweep, 8 fixtures,
     scrollWidth > clientWidth on every element inside .rank-banner):
       - side by side, a banner gets about (pane - 260) / 2;
       - the widest real row is "STRATEGY * GRANDMASTER III -> Grandmaster
         II -1.28s" at 386px with the basis line hidden, 487px with it;
       - so two banners need a pane over ~1250px to keep the basis line, and
         over ~1100px without it. Below that they stack and each takes the
         full row.
     The basis line ("50/50 - 12:34.56") is what gives way first: it is
     recoverable context -- the rank mode is in the header picker and the
     full text stays in the title -- while the delta is the actionable
     number a run is chasing. Drop the recoverable thing, keep the one that
     says what to do next.

     Stacking gets its own fixed height (190px) rather than reusing the
     mobile 258px: only the metrics row grows here, the heading does not
     wrap yet. Fixed height + overflow:hidden at every breakpoint, because
     the user streams this card in OBS and a card that reflowed would shift
     their capture mid-run. */
  @container (max-width: 1250px) {
    .rank-banner-basis { display: none; }
  }
  @container (max-width: 1100px) {
    /* Height is this branch's 216px, not main's 190px: multi-step segments
       adds the `.seg-waiting` line below, which main's measurement never saw.
       Everything else here is main's (78f12dd) — see its reasoning below. */
    .objective-card { height: 216px; min-height: 216px; overflow: hidden; }
    .objective-strategy-fastest { display: none; }
    /* Stacked: the two washes must not touch, let alone overlap.
       ------------------------------------------------------------------
       Side by side, the -8px/-12px vertical bleeds carry each wash into the
       metrics row's own padding, above and below a single band. Stacked, they
       point at EACH OTHER: 20px of bleed across a 4.8px gap, so the top
       banner's wash ran 7.2px into the bottom banner's box and the bottom
       one's ran 3.2px back into the top -- 15.2px of overlap, identical at
       1100, 900, 760 and 420. The second banner paints last, so it covered the
       first one's lower edge and the two colours met with no seam. That is
       the "rank standards are still overlapping ... there needs to be some
       vertical margin between the bottom of the green rect and the top of the
       white rect" of 2026-07-29, and it is the THIRD report of it.

       That bleed is doing TWO jobs, and only one of them is about the card's
       edge. It separates the band from the edge, AND it is the band's own
       internal padding -- the 8px above the medal row and the 12px below the
       progress bar that give a band its shape side by side. Deleting it on the
       inner edges took both, so the top band ended flush against its own
       progress bar while the bottom one kept its room, and the two stopped
       matching each other (live report 2026-07-29, with the wide layout beside
       it as the reference: "breaks continuity with how the actual rank
       standard display is designed").

       So the bleeds are left EXACTLY as they are, and the gap is opened wide
       enough to clear them: 8px top + 12px bottom + the 8px of margin that is
       actually wanted between two bands = 28px. Every band is then the same
       56px tall as it is side by side, with the medal row and the progress bar
       in the same places inside it, and nothing about the decoration changes
       between layouts. A lone banner is untouched.

       Two rejected, both tried and measured:
         - killing the inner bleeds (shipped for one round) -- the band then
           ends flush against its own progress bar, which is the report above;
         - converting the inner bleed to real padding -- correct in principle,
           but `* { box-sizing: border-box }` means the banner's `min-height:
           36px` ABSORBS that padding rather than growing by it, so the bands
           came out 44px and 48px instead of 56px and did not even match each
           other. It needs a matching min-height per case, which is two more
           numbers to keep in sync with these two.
       The gap costs 20px of card height either way -- that is the honest
       price. Side by side the bleeds spend room the card already has above and
       below the row; stacked, there is no room between two bands to spend, so
       it has to be made.

       Caught by uilab probe class 5 (decoration collisions), added the same
       day. Classes 1-4 all walk the DOM, and a pseudo-element is not in it --
       which is why three sweeps in a row called this page clean while the
       user was looking straight at the defect. */
    .rank-slot { flex-direction: column; align-items: stretch; gap: 28px; }
    .rank-banner::before { left: -16px; border-radius: 0; }
    /* Give the NON-LAST banner its bottom bleed back when `.seg-waiting` is
       present. The base rule up at `.objective-card:has(.seg-waiting)` zeroes
       every banner's bottom, which is right side by side — there both banners
       sit directly above `.seg-waiting` and both would bleed onto it. Stacked,
       only the LAST one faces that row; the others face the 28px gap, which
       already clears a 12px bleed by 16px.
       Zeroing them anyway takes the bleed's SECOND job with it: it is also the
       band's own internal padding below the progress bar (the comment above
       this block explains why, and it is the rejected alternative that shipped
       for one round — "the top band ended flush against its own progress bar
       while the bottom one kept its room"). Note the decoration probe cannot
       catch this direction: no probe class fails on too LITTLE bleed, which is
       why this arrived by review rather than by the sweep. `:not(:last-child)`
       and not `:last-child` — side by side that would name the RIGHT banner
       and leave the left one bleeding onto the row. */
    .objective-card:has(.seg-waiting) .rank-banner:not(:last-child)::before {
      bottom: -12px;
    }
    /* Narrow-pane variant of the step row (Task 6, this branch): the stacked
       rank banners already claim most of the taller card, so this tightens
       rather than wraps -- the chips ellipsise instead of growing a second
       line, which inside this fixed-height card would clip a sibling rather
       than show anything. Kept through the main merge; the rank rules above
       are main's (42404b7), which fixes the stacked-wash overlap by widening
       the gap past the bleed rather than zeroing the inner edges as this
       branch had. */
    .seg-waiting { font-size: .74rem; gap: .35rem; margin-top: .3rem; }
    .step-track { gap: .34rem; }
    .step-chip + .step-chip::before { margin-right: .22rem; }
  }

  /* The tight band: both the star name and the strategy picker want the row.
     ------------------------------------------------------------------
     Between 700px (where the heading breaks to two rows and the pressure ends)
     and 794px, the five-column heading cannot give the widest star name AND
     the widest strategy their full width at the same time. The arithmetic, all
     measured on the shipping shell at the 850px supported floor:

       card 731 - 32 padding - 28 icon - 105 eyebrow - 30 chevron - 42 gaps
         = 494px for the name and the strategy block together
       widest star name  293px @ 19.2px   ("Quick Race Through Downtown!")
       widest strategy   194px            ("Ultimate Cycle (Pipe)" + control
                                            chrome: 8 + 25.6 padding, border)
       "STRATEGY" label   60px + 6.4 gap
       -> 293 + 194 + 66 = 553 into 494. Over by 59px.

     Two things give way, in the order of how load-bearing they are:

     1. The label. The word STRATEGY appears again three lines down as the rank
        banner's own kicker, and the select carries it as a title, so this is
        the one piece of text here that is genuinely recoverable. Same rule the
        fastest-strategy hint gives way under, one block up.
     2. A small type step on the name, 1.2rem -> 1.1rem, which buys 24px on the
        widest name for a size still comfortably above the card's body text.
        The user offered this lever explicitly ("we can also slightly decrease
        font sizes if necessary at smaller widths"); it is used ONLY here, and
        only as much as the arithmetic needs.

     That leaves 272 for the name (widest becomes 269) and 222 for the select
     (widest needs 194) -- both fit, with margin on each side rather than the
     4px a single lever would have left. What does NOT give way is the name
     itself: it is the one thing on this card that says what you are
     practising, and ellipsising it mid-word is the bug this fixes. */
  @container (max-width: 793px) {
    .objective-heading { grid-template-columns: 28px auto minmax(272px,1fr) minmax(120px,380px) auto; }
    .objective-name h2 { font-size: 1.1rem; }
    .objective-strategy { grid-template-columns: minmax(70px,1fr) auto; }
    .objective-strategy .field-label { display: none; }
    /* The caveat's WORD gives way here too, leaving the same glyph pill the
       quick-select cell wears. Measured, not chosen: at a 706px pane the wide
       metrics row overflowed the card by 23px with "? Unattributed" in it
       (the responsive sweep's own report, both Bowser stories, 850x1180 and
       851x1000). The sentence is not lost -- the title is on the chip, not on
       the word, so it still answers a hover at every width. */
    .caveat-chip { gap: 0; padding-inline: .3rem; }
    .caveat-chip-word { display: none; }
  }

  /* Objective card, narrow pane.
     ------------------------------------------------------------------
     These rules lived in `@media (max-width: 760px)` until 2026-07-28, and
     moving them here is not a relocation -- it FIXES WHICH CARDS GET THEM.

     Measured on the shipping shell:
       viewport 760 -> pane 725 -> card 699px    (sidebar gone)
       viewport 761 -> pane 642 -> card 608px    (76px rail present)
     The 3-column metrics template needs about 646px. So the 699px card had
     room for it and was being forced into the cramped 2-column layout with a
     258px height it overflowed by 21px, while the 608px card -- which cannot
     fit 646 -- was left on the 3-column template and overflowed sideways by
     29px. Both reported live (900x1180 and 760x1180, 2026-07-28); both are
     the same root cause, which is that pane width is not monotonic in window
     width and no viewport threshold can express "this card is too narrow".

     700px is the pane at which the card stops fitting the wide metrics row,
     with the sweep's two probe points (642 and 725) either side of it. */
  @container (max-width: 700px) {
    .objective-heading {
      grid-template-columns: 26px 1fr; align-items: start;
    }
    .objective-heading .eyebrow { align-self: center; }
    .objective-name { grid-column: 1 / -1; padding-left: 0; }
    .objective-name h2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; }
    .objective-strategy {
      grid-column: 1 / -1; min-width: 0;
      grid-template-columns: 70px minmax(0,1fr);
    }
    /* The label comes BACK here. The block above hides it because the heading
       is one crowded row; at this width the strategy owns a full row of its
       own and has the 70px for it. `inline` is the <span> default -- restated
       rather than `revert`, which would also undo the hide in a UA-sheet
       sense and is not what is meant. */
    .objective-strategy .field-label { display: inline; }
    .objective-strategy select { min-width: 0; max-width: 100%; }
    .objective-metrics {
      /* PB tag needs ~130-150px, not the ~239px a .7fr share was giving it
         at typical mobile widths -- rebalanced 2026-07-25 round 4 so the
         stacked rank banners (now carrying a next: delta and, on longer
         entity labels like "Segment", tighter margins) get the room. */
      grid-template-columns: minmax(0,1.7fr) minmax(125px,.55fr); gap: 8px;
      align-items: center;
    }
    /* Two side-by-side banners have no room to breathe in this narrow
       column (shared with the pbtag column) -- stack them instead. */
    /* Same 28px as the wider stacked block above, and for the same reason --
       it is 8 + 12 of bleed plus the 8px of margin that is wanted. Shrinking
       it here would put the two washes back in contact at exactly the widths
       where the card is most crowded. */
    .rank-slot { min-height: 45px; flex-direction: column; align-items: stretch; gap: 28px; }
    /* The strategy header reverts to 2 columns here (above); the
       fastest-strategy hint would otherwise drop to its own row (a 3rd
       grid child with only 2 explicit columns) rather than sit inline, so
       it's dropped at this width instead -- same "least load-bearing text
       gives way first" rule as round 3's banner crowding fix. */
    .objective-strategy-fastest { display: none; }
    .objective-live-state { grid-column: 1; grid-row: 2; border: 0; justify-content: flex-start; }
    .objective-card .pbtag { grid-column: 2; grid-row: 1 / span 2; align-self: center; white-space: normal; }
    /* Height is MEASURED, not chosen -- see the generated block below. */
    .objective-card {
      height: var(--objective-card-narrow); min-height: var(--objective-card-narrow);
      overflow: hidden;
    }
  }
  @container (max-width: 400px) {
    /* Was `@media (max-width: 430px)`; viewport 430 gives the pane 395px. */
    .objective-metrics { grid-template-columns: 1fr 118px; }
  }

     .view-pane, so a container query above it can never match (2026-07-28:
