     setting `transform`, the highest-specificity one WHOLESALE REPLACES the
     others -- `transition`/`transform` are not additive across rules, which
     is the exact defect that made the Rank tab's ladder band expand
     instantly and collapse smoothly under "identical" CSS. Expressed as
     inputs to one declaration, they compose instead: a wing can be growing
     and flapping at once, and a climb can interrupt a flap mid-cycle.

     `@property` is what makes a custom property animatable at all -- an
     unregistered one is a string to the animation engine and jumps from one
     keyframe to the next with no interpolation.

     `--wing-tuck` 0 = out, 1 = folded away behind the cap; the pivots (23%
     64%, 69% 66%) are measured off the wing1..4 PNGs' own alpha bounding
     boxes -- the edge nearest the cap stays fixed across tiers while only
     the tip grows outward -- not guessed. Wings already stack UNDER the cap
     in hat.js's layer order, so rotating and shrinking toward that pivot
     makes them recede BEHIND it by construction. The GROW is that same
     motion played backwards (a wing arrives the way it leaves), which is why
     there is no second set of numbers for it. */
  @property --wing-tuck { syntax: "<number>"; inherits: true; initial-value: 0; }
  @property --wing-flap { syntax: "<number>"; inherits: true; initial-value: 0; }
  .hat .wing-l, .hat .wing-r {
    scale: calc(1 - var(--wing-tuck) * .7);
    opacity: calc(1 - var(--wing-tuck));
  }
  .hat .wing-l {
    transform-origin: 23% 64%;
    rotate: calc(var(--wing-tuck) * -80deg + var(--wing-flap) * -14deg);
  }
  .hat .wing-r {
    transform-origin: 69% 66%;
    rotate: calc(var(--wing-tuck) * 80deg + var(--wing-flap) * 14deg);
  }
  /* Task 6 (2026-07-25-mario-cap-rank-icons): the idle flap. `.hat-flap` is
     set only by hat.js's `flap` prop -- celebrate.js's rank-up overlays --
     never the idle rank icons scattered across every other card, which would
     be motion noise on a screen that's on stream. It now animates the
     VARIABLE rather than the transform, so it shares the declaration above
     with the climb instead of overriding it. */
  @media (prefers-reduced-motion: no-preference) {
    .hat-flap { animation: wing-flap 1.1s ease-in-out infinite; }
    @keyframes wing-flap {
      0%, 100% { --wing-flap: 0; }
      50% { --wing-flap: 1; }
    }
  }
  /* Task 10 (addendum, 2026-07-25): the wing FOLD -- set by hat.js's
     `foldWings` prop, true for exactly the ONE render TierRankUp shows at
     its fill -> flip boundary (celebrate.js), where the outgoing division's
     wings are drawn one last time so THIS can play instead of them simply
     vanishing. User's own framing: "it flaps and celebrates, then folds
     away and vanishes... booya, upgraded! Just gotta earn the wings again."
     A performed loss, not a discontinuity -- the wing policy itself
     (division V wears none) is unchanged.

     Reuses the flap's own pivots (23%/64%, 69%/66%, measured off each wing
     sprite's alpha bbox) and continues the SAME rotational sense as the
     flap's downswing (wing-l negative, wing-r positive) so the tuck reads
     as one continuous gesture rather than a new one. Wings already stack
     UNDER the cap in hat.js's layer order, so rotating + shrinking them
     toward that pivot makes them recede BEHIND the cap by construction --
     "tucking its ears back" needs no z-index trick here. `forwards` holds
     the ended (rotated, scaled down, invisible) state so nothing pops back
     visible before the next tick actually drops the layer to 0 wings.

     `.hat-fold::after` is the small bright blink the user asked the loss
     to end on ("perhaps with a shiny blink") -- one radial flash on the
     SAME .5s timeline as the fold, so it cannot drift out of sync with it.
     `flap` and `foldWings` are never BOTH meaningful at once conceptually,
     but celebrate.js always passes `flap=true` alongside `foldWings` on
     this one tick for simplicity -- hat.js resolves that by putting
     `hat-fold` on the outer span INSTEAD of `hat-flap` whenever folding
     (see hat.js's `motionClass`), so only one of these two rule sets ever
     actually applies to a given Hat; there is no dependency on CSS source
     order to break the tie. */
  @media (prefers-reduced-motion: no-preference) {
    /* Now one keyframe on the SHARED variable rather than a per-side
       transform (task 0012): the end state it used to spell out by hand --
       rotate ±80deg, scale .3, opacity 0 -- is exactly `--wing-tuck: 1` in
       the declaration above, which is also what the climb's grow animates
       backwards through. Two treatments, one geometry, no chance of the two
       disagreeing about where a folded wing sits. */
    .hat-fold { animation: wing-tuck .5s cubic-bezier(.4, 0, .6, 1) forwards; }
    @keyframes wing-tuck {
      from { --wing-tuck: 0; }
      to { --wing-tuck: 1; }
    }
    .hat-fold::after {
      content: ""; position: absolute; inset: -25%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.95), transparent 65%);
      pointer-events: none; opacity: 0;
      animation: wing-fold-shine .5s ease-out forwards;
    }
    @keyframes wing-fold-shine {
      0%, 62% { opacity: 0; transform: scale(.5); }
      74% { opacity: .9; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }
  }
  /* The bar is now the RIGHT column's dominant element (round 2, 2026-07-28)
     rather than a 96px sliver -- full width of `.marelo-bar-body`, and
     visibly thicker so it reads as the primary thing on the card, not a
     footnote beside the text. */
  .marelo-track {
    width: 100%; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12);
    overflow: hidden; flex: 0 0 auto;
  }
  /* Same three climb variables as the practice card's banners, read the same
     way -- this bar runs the same primitive (ui/rankclimb.js), so it must not
     grow a second way of expressing the same celebration. */
  .marelo-track > i { display: block; height: 100%; background: var(--climb-color, #3a4250); }
  .marelo-bar .marelo-track {
    box-shadow: 0 0 calc(var(--climb-flash, 0) * 10px)
                color-mix(in srgb, var(--climb-color, #3a4250)
                          calc(var(--climb-flash, 0) * 85%), transparent);
  }
  .marelo-bar b {
    text-shadow: 0 0 calc(var(--climb-flash, 0) * 9px)
                 color-mix(in srgb, var(--climb-color, #3a4250)
                           calc(var(--climb-flash, 0) * 90%), transparent);
  }
  /* The overall rank-up (components/marelocelebrate.js, 2026-07-28).
     Replaces the two hand-rolled scope overlays that used to live here
     (TierRankUp's fill->flip->hold, DivisionRankUp's top banner) -- a KNOWN
     DEVIATION flagged since 2026-07-26. This overlay clones the REAL route
     rank card, flies it to the centre, and hands it to ui/rankclimb.js, the
     same climb every rank banner runs -- so there is no CSS here for the
     climb itself (the flash/shake/burst/digit-reel/wing-grow variables are
     already up beside .rank-progress-track and .rank-banner) and no size
     @media at all: the card's geometry is MEASURED from the live header at
     runtime and expressed as a transform, so it is correct at every width by
     construction (`.marelo-celebrate*` are component selectors --
     `tests/test_responsive_structure.py` is a red build for a viewport rule
     on one).

     Fixed so it can never reflow an OBS capture; pointer-events OFF on the
     wrapper and ON only for the card, so it never eats a click meant for the
     game. z-index sits above .modal-backdrop (200): a rank-up can land while
     a modal is open and must still be seen.

     Report 2 (2026-07-28, live report: "it looks like the card briefly
     becomes invisible" during the fly-out AND the fly-back): `.marelo-celebrate`
     used to BE the fading backdrop, with `.marelo-celebrate-card` rendered as
     its CHILD -- a parent's opacity multiplies every child's, so the card sat
     at effective opacity 0 on the first frame, faded in as it travelled, and
     faded back out before landing, never reaching 1 even at rest (the tuned
     `backdropOpacity` is 0.8). The fix is structural, not a value: the
     backdrop is now `.marelo-celebrate-backdrop`, a SIBLING of the card, not
     an ancestor -- this wrapper keeps only the shared custom properties
     (children still need to read them, custom properties flow DOWN the tree)
     and is never assigned an opacity of its own, so nothing above the card
     can ever touch its opacity again.
     `tests/test_ui_celebrate.py::test_the_card_never_has_its_own_opacity_rule`
     pins this structurally -- no rule may set `opacity` on
     `.marelo-celebrate-card` or on `.marelo-celebrate` itself (its one
     remaining ancestor below `.app-shell`). */
  .marelo-celebrate {
    position: fixed; inset: 0; z-index: 210; pointer-events: none;
  }
  .marelo-celebrate-backdrop {
    position: fixed; inset: 0; pointer-events: none;
    background-color:
      color-mix(in srgb, var(--climb-color, transparent) var(--backdrop-tint, 0%),
                rgba(3, 9, 18, 1));
    opacity: 0;
    /* TWO properties, ONE declaration (`.claude/rules/ui-core.md`'s rule: a
       second `transition:` on any state of this element would REPLACE this
       one wholesale, not add to it). Opacity paces the fly-out/fly-back
       fade; background-color is the tier cross-fade (report 1, 2026-07-28,
       "we should ... animate from current background color to capless
       color, then when we cross from CAPLESS -> TOAD, animate from capless
       to toad color") -- its own duration, `--tier-fade-ms`, is deliberately
       NOT `--fly-ms`: a tier crossing can land mid-climb, long after the
       flight itself finished moving. */
    transition: opacity var(--fly-ms, 900ms) var(--fly-ease, ease),
                background-color var(--tier-fade-ms, 500ms) ease;
  }
  .marelo-celebrate-backdrop.is-lifted { opacity: var(--backdrop-alpha, .55); }
  /* EXACTLY ONE transition declaration on this element. A :hover or state
     rule declaring its own would REPLACE this one wholesale (a rule's
     transition is not additive), which is what makes a motion glide one way
     and snap the other -- there is deliberately no second rule here, not
     even for prefers-reduced-motion: the JS already computes --fly-ms as 0
     in that case (marelocelebrate.js), so the transition already resolves
     to an instant jump with no CSS override needed. */
  .marelo-celebrate-card {
    position: fixed; transform-origin: center center; pointer-events: auto;
    cursor: pointer;
    transition: transform var(--fly-ms, 900ms) var(--fly-ease, ease);
    /* NEVER an opacity rule here, and never on `.marelo-celebrate` above --
       see the comment on `.marelo-celebrate` for why, and the guard test
       that mutation-proves it. */
  }
  /* The header's own card is hidden while its clone is out, so there is
     never a double image -- and it must not climb, because the clone IS its
     climb (one event, one thing celebrating it -- the mistake the deleted
     entity toasts made). */
  .marelo-slot.is-celebrating { opacity: 0; }
  /* Rank tab (rankpage.js): scope picker + card + chart + breakdown, all
     scaled off ONE scope response — no separate route/course/overall pages.
     --border-soft/--muted mirror the rest of the design system (this file
     has no --line or --dim token, despite what an earlier draft assumed). */
  .rank-page { display: flex; flex-direction: column; gap: 14px; }
  /* Scope chip row (task D.1) — every season's tier at a glance, op.gg
     style. Wraps onto more rows rather than scrolling; `.is-selected`
     mirrors the scope <select>'s current value so clicking a chip never
     looks like it did nothing. */
  .scope-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .scope-chip {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px;
    border: 1px solid var(--border-soft); border-radius: 10px;
    background: rgba(8, 20, 34, .4); cursor: pointer; text-align: left;
  }
  .scope-chip:hover { border-color: var(--gold); }
  .scope-chip.is-selected { border-color: var(--gold); background: rgba(240, 189, 50, .14); }
  .scope-chip-text { display: flex; flex-direction: column; line-height: 1.15; }
  .scope-chip-text b { font-size: 12px; font-weight: 600; }
  /* Round 5 (addendum, task 8, 2026-07-26): 8px gap vs. a ~11.1px wing
     spill at size 30. */
  .scope-chip-icon { --icon-size: 30px; }
  /* One tier-tinted icon tile per rankable entity — the Coverage strip.
     (These names were `.topn-*` until round 9: they were introduced for a
     "Best in scope" top-12 card that Coverage made redundant, and the card
     was removed rather than left as a second row of the same tiles.)
     `flex: 0 0 auto` is load-bearing: without it a full route's worth of
     tiles SHRINK to fit their row while the height stays put, which is what
     made the art look squished (live report 2026-07-25). */
  .entity-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .entity-tile {
    flex: 0 0 auto;
    /* the ✎ badge positions against this — see the .editicon block above */
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: var(--tile-size, 42px); height: var(--tile-size, 42px);
    border-radius: 8px; overflow: hidden;
    border: 2px solid var(--tier-tint, var(--border-soft));
    background: rgba(8, 20, 34, .4);
  }
  /* Coverage's unpracticed entries: the art stays (you have to recognise
     WHICH star you haven't touched), the tier ring and the colour go. */
  .entity-tile.is-unpracticed { opacity: .38; filter: grayscale(.75); }
  .entity-tile.is-unpracticed:hover { opacity: .7; }
  /* The whole scope in one strip — 24 entries for a 16 Star route, 120+ for
     a full run. The cap plus scroll is what stops a long route pushing the
     chart and the breakdown off the screen; four rows fit before it engages. */
  .rank-coverage-strip { max-height: 216px; overflow-y: auto; }
  .rank-coverage { margin: 4px 0 3px; }
  .entity-tile-icon { width: 100%; height: 100%; object-fit: contain; }
  .entity-tile-icon.courseicon { width: 90%; height: 90%; }
  /* The tiles are buttons (round 7: "I could click on it and get an overview
     of my history for that star"), so they need the padding/appearance reset
     every icon button in this design system takes. */
  .entity-tile { padding: 0; cursor: pointer; }
  .entity-tile.is-open { box-shadow: 0 0 0 2px rgba(240,189,50,.55); }
  .entity-detail {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border-soft);
  }
  .entity-detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .entity-detail-head h4 { margin: 0; font-size: 15px; }
  .entity-detail-head .meta { margin: 0; }
  /* Round 5 (addendum, task 8, 2026-07-26): 10px gap vs. a ~11.1px wing
     spill at size 30. */
  .entity-detail-icon { --icon-size: 30px; }
  .entity-detail-spacer { flex: 1 1 auto; }
  /* Its own scroller with a fixed cap, not a growing list: this card sits
     above the chart and the breakdown, and a ten-row expansion that pushed
     both down the page would move the thing the user was reading. */
  .entity-attempts {
    max-height: 208px; overflow-y: auto; margin-top: 8px;
  }
  .entity-attempts table { width: 100%; border-collapse: collapse; }
  .entity-attempts td {
    padding: 4px 8px; border-bottom: 1px solid var(--border-soft);
    font-size: 12px; white-space: nowrap;
  }
  /* Round 5 (addendum, task 8, 2026-07-26 -- "sweep every container sized
     for the old disc"): the SAME class of bug as `.attempt-medal` above,
     smaller in magnitude only because this table's icons are size=14 --
     22px was already narrower than the layout box alone (14 *
     HAT_LAYOUT_WIDTH_RATIO ~= 23px, caps.js), before wings (14 *
     HAT_WING_SPILL_RATIO ~= 5px each side) push the real extent to ~33px. */
  .entity-attempts td:first-child { width: 34px; }
  .entity-attempts .entity-attempt-strat {
    width: 100%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--muted);
  }
  .entity-attempts tr.is-pb td { color: var(--gold); }
  .rank-card-main { display: flex; align-items: center; gap: 16px; margin: 10px 0; }
  .rank-card-main h2 { margin: 0; font-size: 24px; }
  /* Round 5 (addendum, task 8, 2026-07-26 -- "sweep every container sized
     for the old disc"): the biggest gap of the whole sweep -- 16px vs. a
     ~23.7px wing spill at size 64. Every prior round's fixture happened to
     land on Capless (which never wings), so this was never actually
     rendered with wings on until this round's targeted check. */
  .rank-card-icon { --icon-size: 64px; }
  /* Task C.5: names the MARELO-vs-saved-PB distinction so it reads as
     intentional, not as the two banners disagreeing by accident. */
  .rank-card-note { margin: 0 0 10px; font-style: italic; }
  /* `.rank-factor` rows are DIVs — see the note in rankpage.js: as <label>s
     they forwarded hover and click to the first coverage tile inside them,
     so hovering the caption lit up an unrelated star. */
  .rank-factor { display: block; margin: 6px 0; font-size: 12px; color: var(--muted); }
  /* Round 4 (addendum, task 8, 2026-07-26): Mastery is a plain meter again,
     reusing `.rank-progress-track` (below) — it moved OFF the tier ladder
     because it isn't a rank. Mastery is a mean SCORE, one of the two
     factors MARELO is made of (marelo = mastery x coverage), and drawing it
     on a ladder that also carries rank icons implied it WAS a rank — the
     user caught the two disagreeing outright (Capless 5 on the card, the
     ladder marker sitting in Toad territory). The ladder now belongs to
     MARELO alone (`.rank-ladder-wrap`, under `.rank-card-main`) so there is
     exactly one rank-shaped drawing on this card. */
  /* Round 5 (addendum, task 8, 2026-07-26): replaces the permanent 45-icon
     showcase strip entirely -- see rankpage.js's LadderBar comment for the
     proof that a static layout could never satisfy "icons only ever sit
     exactly above their own pip." Reserves room ABOVE the bar for whichever
     floating icon layer is showing -- the at-rest YOU mark, or a hovered
     band's five popped-out icons -- so neither ever overlaps the card text
     sitting above this wrapper. */
  .rank-ladder-wrap { margin: 4px 0 10px; padding-top: 62px; }
  .rank-ladder {
    position: relative; height: 16px;
    display: flex; gap: 2px;
    border-radius: 8px; background: rgba(4,13,23,.72);
  }
  /* Each tier is its own flex item, not a slice of one continuous gradient
     (round 1-4's `.rank-ladder-bands`/`.rank-ladder-fill` pair, deleted).
     `--band-weight` (set inline, rankpage.js) is `band.to - band.from` --
     the tier's real SCORE width -- so flex-grow makes the resting layout
     proportional BY CONSTRUCTION by is-mine, with no percentage maths
     duplicated here. `min-width: 0` lets a band shrink below its own
     content size: without it a flex item's default `min-width: auto`
     refuses to shrink past whatever's inside, which would stop the eight
     compressing bands (below) from ever getting small enough to hand a
     hovered band its expansion width. */
  .rank-band {
    position: relative; min-width: 0; height: 100%;
    flex-grow: var(--band-weight); flex-shrink: 1; flex-basis: 0%;
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
  }
  /* Round 8 (task 8, 2026-07-26 -- the user: "it should animate from the
     starting bar position to the expanded bar position... it should also
     animate back"): ONE `transition` declaration for `.rank-band`, covering
     every property EITHER state of it ever sets (flex-grow/flex-basis here,
     transform/box-shadow below), and it is the ONLY place `transition` is
     declared for this element -- no separate declaration on the `:hover`
     rule below. That used to be two rules: this one covered flex-grow/
     flex-basis, `:hover`'s own rule covered transform/box-shadow -- and
     since `:hover` has higher specificity, its `transition` COMPLETELY
     REPLACED this one's (CSS `transition` is not additive across rules on
     the same element) the instant a band gained the `:hover` match, so
     flex-grow/flex-basis had NO transition during the split second they
     needed one most: entering hover. Leaving hover worked fine, because
     `:hover` stops matching and THIS rule's transition takes back over --
     which is exactly the asymmetric "some things snap, some things don't,
     and it depends on direction" bug a probe confirmed before this fix
     (measured `flex-basis`/width jumping straight to its target value on
     the very first frame of expansion, but interpolating smoothly on
     collapse). Fixed by moving every property either state can change onto
     ONE list, here, so there is exactly one transition config regardless of
     which direction the state is changing -- same duration, same easing,
     both directions, structurally impossible to diverge again. This is
     also what lets the flex reflow trick work AT ALL: the eight compressing
     siblings never transition their OWN flex-grow/basis (those values never
     change for them), they only look smooth because the hovered band's
     property is ACTUALLY interpolating frame by frame and the browser
     naturally reflows around that on every rendered frame -- if the
     hovered band's own change snaps, the siblings have nothing to reflow
     smoothly around either, which is why the ENTIRE row used to snap
     together on expand and only the row's OWN sizing snapped, not the
     icons (see `.rank-band-icon` below, which was never double-declared
     and always animated correctly in both directions). Pip/icon/marker
     `left:%` positions need no transition of their own for the same
     reason: they are computed from the band's CURRENT width every frame,
     so they ride this one width transition for free once it is real. */
  @media (prefers-reduced-motion: no-preference) {
    .rank-band {
      transition: flex-grow .25s ease, flex-basis .25s ease,
        transform .25s ease, box-shadow .25s ease;
    }
  }
  /* The expansion is the thing that makes per-division icons legible at
     all (see the LadderBar comment) -- not optional garnish. Fixed rigid
     width (`flex-shrink: 0` too, so nothing can squeeze it back down) lets
     the other eight bands compress to absorb the difference, proportionally
     among themselves (their own flex-grow ratios are untouched -- only the
     space left to share shrank). `max(260px, calc(var(--band-weight) * 1%))`
     guards the one tier that's ALREADY close to 260px at rest on a big card
     (Toadsworth/Silver is 20 of the 100 score points -- 20% of a ~1300px bar
     is ~260px): without the `max()`, "expanding" it could actually shrink
     it, which reads as a bug, not an affordance. 260px (round 7, task 8,
     2026-07-26 -- widened from 230px, "so five slots breathe", a starting
     point settled by render, not arithmetic, once the user's own division
     could sit at any fraction of the slot it fills rather than only ever
     on a midpoint) is comfortable room for four or five 20px icons with
     realistic wing spill. `:focus-within` puts a keyboard user who Tabbed
     onto one of the five pips inside in the exact same state a mouse hover
     would -- no separate keyboard path to keep in sync with the mouse
     one. Sets ONLY target values here, deliberately -- the transition that
     animates TOWARD them lives once, above, on the unconditional rule. */
  .rank-band:hover, .rank-band:focus-within {
    flex: 0 0 max(260px, calc(var(--band-weight) * 1%));
    z-index: 3;
  }
  @media (prefers-reduced-motion: no-preference) {
    .rank-band:hover, .rank-band:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(0,0,0,.4);
    }
  }
  /* The painted fill lives in its OWN clipped box, separate from the pips/
     icons below: `.rank-band` itself must never clip, since a popped-out
     icon has to escape upward past the bar's own top edge. Rounded corners
     only on the two ends of the whole bar, same as the old single-element
     bar's own border-radius. */
  .rank-band-surface { position: absolute; inset: 0; overflow: hidden; }
  .rank-band:first-child .rank-band-surface { border-radius: 8px 0 0 8px; }
  .rank-band:last-child .rank-band-surface { border-radius: 0 8px 8px 0; }
  /* Dim base + bright clipped fill is the SAME "how far along" reading the
     old whole-bar gradient gave (`.rank-ladder-bands`/`.rank-ladder-fill`),
     just scoped to one band's own `--band-tint` (`capGradient(tier) ||
     rankColor(tier)`, rankpage.js -- the SAME colour the standards table
     and every other tier surface already use) instead of one continuous
     linear-gradient image spanning all nine. Plain `background` on purpose,
     never `color-mix()`: `capGradient()` returns a `linear-gradient(...)`
     STRING for the two patterned tiers (Toadsworth, Toad), and `color-mix`
     requires two `<color>` tokens -- feeding it a gradient is invalid CSS,
     exactly the round-4 bug. `background` accepts a flat colour or a
     gradient string identically, so both forms render correctly here. */
  .rank-band-base, .rank-band-fill {
    position: absolute; inset: 0; background: var(--band-tint);
  }
  /* Deliberately NOT the lever for "light up what I have cleared", and the
     2026-07-27 fix's first attempt spent a round learning that. It dropped
     this to `opacity: .14; filter: saturate(.55)` -- borrowing
     `.entity-tile.is-unpracticed`'s dim+desaturate -- so the eight unreached
     bands would stop competing with the one cleared band. They stopped
     competing by disappearing: "the dimmed bars should be way less dimmed...
     they all basically look black. I think we should at least show a little
     bit of color for each of them!!" A tile is a discrete thing you either
     have or have not; these nine bands are a MAP of the whole ladder, and a
     tier you have not reached yet still has to be findable on it -- it is
     what you are climbing toward, and the hover that expands it has to look
     worth aiming at. So this is back at the value it has always had, and the
     entire lit/unlit distinction is carried by the gloss below, on the side
     that is meant to change. */
  .rank-band-base { opacity: .26; }
  .rank-band-fill { opacity: 1; width: 0; }
  /* What makes a REACHED band read as lit (live report 2026-07-27 -- "the bar
     is incorrectly DIM for the section of the bar to the left... all of the
     bars, across all ranks from 0...the users current rank, should be lit up
     -- because this should be symbolizing 'i have made it this far'").
     Capless's band was ALREADY filled to 100% when that was written; measuring
     the reported screenshot's own pixels gave #735648 exactly, i.e. the tint at
     full opacity. The defect was not the fill width, it was that "reached" was
     encoded ONLY as opacity of the tier's own colour -- a RELATIVE signal,
     legible in the one partially-filled band (where the dim and bright halves
     of ONE hue sit against each other) and nowhere else. A fully-reached band
     has no dim half beside it, so the eye judges it against its NEIGHBOURS,
     which are different hues -- and Capless (#735648) is the darkest cap in
     the registry. Lit to 100% it measured 10.77% relative luminance against
     5.85% for the brightest band the user had NOT reached (Vanish): 1.84x,
     which is a difference in shade, not a difference in state. The first
     thing anyone earns was the thing least likely to look earned.
     The gloss is the fix because it is an ABSOLUTE lift -- a fixed amount of
     white composited over whatever the tier's colour happens to be -- so every
     reached band gains the same "the light is on behind this" surface no
     matter its own luminance, and a lit Capless differs from a lit Toad in
     HUE, not in whether it looks switched on. It rides the FILL, whose width
     IS the reached fraction, so a partially-reached band is glossed for
     exactly as far as the user has got and not a pixel further.
     Strengthened (avg alpha .145 -> .212) when the base above went back to
     .26: with the dim side no longer helping, the whole separation is this
     rule's to earn. There is a ceiling on that -- rendering every tier lit
     at once, an average past ~.22 starts milking the hues it is lifting
     (Waluigi purple toward lavender, Mario red toward pink), which is the
     same crime as the over-dimming, just on the other side of the bar. */
  .rank-band-fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.46) 0%,
      rgba(255,255,255,.18) 40%, rgba(255,255,255,.05) 62%,
      rgba(255,255,255,.26) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
  }
  /* The pip: a focusable 9px hit box (a 1px line is not a target -- same
     reasoning the old `.rank-ladder-step` used), positioned at a LOCAL
     percentage of its OWN band -- 0/20/40/60/80%, since DIVISIONS_PER_TIER
     always cuts a tier into five equal-score slices. That percentage marks
     where the division BEGINS (round 6 -- the icon for the SAME division
     sits at a different percentage now, its slot's own midpoint, see
     `.rank-band-icon` below); it is what stays correct whether the band is
     squeezed to a sliver (Mario, at rest) or expanded to its full hover
     width -- the alignment guarantee lives here, not in per-band math. */
  .rank-band-pip {
    position: absolute; top: 0; bottom: 0; left: 0; width: 9px;
    transform: translateX(-50%); cursor: pointer;
  }
  .rank-band-pip:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 1px; border-radius: 2px;
  }
  .rank-band-pip::after {
    content: ""; position: absolute; left: 50%; top: 5px; bottom: 5px;
    width: 1px; background: rgba(255,255,255,.28); transform: translateX(-50%);
  }
  .rank-band-pip.is-tier::after {
    top: 0; bottom: 0; width: 2px; background: rgba(6,16,28,.9);
  }
  /* The icon: round 6 (addendum, task 8, 2026-07-26 -- the user: "each of
     the symbols are in the middle of their subdivision section"). A pip
     marks a BOUNDARY; an icon names the SPAN between one pip and the next,
     so it sits at that span's own midpoint now, not on the boundary line --
     sitting it on the pip made it ambiguous which of the two neighbouring
     divisions it named. `.rank-band-icon` is a SIBLING of `.rank-band-pip`
     (not nested inside it, which it was before this round) so it can carry
     its OWN `left:%` at a different local percentage than the pip --
     rankpage.js computes both from the SAME `index`, offset by half a
     slice, so they can never drift apart even though they no longer share
     one literal position. `left: 0` here is a harmless default; every
     instance sets its own inline `left` (rankpage.js). Hidden and tucked
     toward the bar at rest (`pointer-events: none` so an invisible icon can
     never steal a hover meant for a neighbour), popped up to full size and
     opacity only while `.rank-band` is hovered or focused --
     `pointer-events: auto` there so a mouse resting directly on the now-
     much-bigger icon gets ITS OWN tooltip rather than passing through to
     whatever's behind it. */
  .rank-band-icon {
    position: absolute; left: 0; bottom: calc(100% + 8px);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 10px) scale(.5);
  }
  @media (prefers-reduced-motion: no-preference) {
    .rank-band-icon { transition: opacity .25s ease, transform .25s ease; }
  }
  .rank-band:hover .rank-band-icon, .rank-band:focus-within .rank-band-icon {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, 0) scale(1);
  }
  /* The reached-this-far marker: a bright edge on the fill, so the exact
     value is readable against a banded track that has plenty of edges of
     its own. Round 6 (addendum, task 8, 2026-07-26 -- the user: "I would
     expect my big symbol to still be visible, and for my exact progress
     inside the rank to still be visible... when hovering over your rank's
     area"): a CHILD of the ONE `.rank-band` the user's own score falls in
     now (rankpage.js sets `isCurrentBand`), not a global overlay on
     `.rank-ladder` positioned by a percentage of the WHOLE bar. That used
     to mean this line hid behind an EXPANDED band -- both were absolutely
     positioned siblings competing for stacking inside the SAME parent
     (`.rank-ladder`), and the hovered band's own `z-index: 3` beat this
     line's `z-index: 2`. Nested inside that one band instead, this line's
     z-index is compared only within THAT band's own local stacking
     context (created the moment the band's `:hover`/`:focus-within` rule
     sets its own `z-index`), above that band's surface/pips/icons in both
     the resting and the expanded state -- the stacking bug is fixed as a
     side effect of the same restructure that fixes the position. */
  .rank-ladder-head {
    position: absolute; top: -1px; bottom: -1px; width: 2px;
    background: var(--text); transform: translateX(-1px); z-index: 2;
  }
  /* The one permanent icon: the user's own rank, floating above its EXACT
     score position -- never a showcase tile. Bigger than the hover-revealed
     ones (CURRENT_RANK_ICON_SIZE, rankpage.js), since nothing else marks
     "this one is you" at rest any more. Same face as the cap's own
     sign-field glyph (`.hat .glyph`) for YOU -- a display word, not a
     caption -- with enough gap below it that the bigger icon can never
     grow into the text above it.
     Round 6 (addendum, task 8, 2026-07-26): no longer hides while a band
     is expanded. The earlier reasoning -- "YOU's position is only true at
     rest, and a hovered band is deliberately not proportional" -- was
     correct as far as it went, but hiding was the wrong remedy: the user's
     score is never actually unknowable during expansion, only expressed in
     the wrong coordinate system. Positioned as a fraction of the ONE band
     it belongs to (same as `.rank-ladder-head` above) instead of a
     fraction of the whole bar, its position recomputes correctly whenever
     that band's own width changes -- exactly how the pip/icon alignment
     already survives expansion. Hovering the user's own band is now a
     genuine zoom into where they actually are, with nothing left to hide:
     the showcase icons sit at their slot's own midpoint (they label a
     SPAN), this marker sits at the user's true fraction (it marks a
     VALUE) -- different meanings, visibly different positions, neither
     has to move off what it means. */
  .rank-ladder-mark.is-you {
    position: absolute; bottom: calc(100% + 8px); left: 0;
    transform: translateX(-50%); z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 6px;

     whenever `max-height` capped it below what `width:100%` implied. */
  .rank-chart { display: block; width: 100%; height: 220px; }

  .hint { position: relative; display: inline-flex; cursor: help; color: var(--muted); }

  .segments-workshop {
    min-width: 0; display: grid;
    grid-template-columns: minmax(300px,360px) minmax(0,1fr);
    align-items: start; gap: 12px;
  }
  /* The editor is the half that actually overflowed the PAGE: a fixed 620px
     floor plus its own content grew the document past the viewport, the page
     got a scrollbar, and because a scrollbar steals width the whole layout
     shifted left the moment the library grew (live audit 2026-07-25 — the
     library itself was already capped correctly, measured 39px clear of the
     fold). Bound it to the viewport exactly like the library and let its own
     body scroll; min() keeps the 620px floor only where it fits. */
  .segment-editor {
    min-height: min(620px, var(--pane-cap, calc(100vh - 205px)));
    max-height: var(--pane-cap, calc(100vh - 205px));
  }
  /* Library panel: viewport-bounded, the LIST is the scroll container. The
     old cap sat on the list (100vh - 230px) and ignored the card's own
     offset from the viewport top, so the card bottom ran off-screen (user
     report 2026-07-24). 205px ≈ context bar + hero + gaps at page top;
     sticky keeps the panel fully in view while a long editor scrolls. */
  .segment-library, .route-library {
    display: flex; flex-direction: column;
    position: sticky; top: 88px;
    min-height: 0; max-height: var(--pane-cap, calc(100vh - 205px));
  }
  /* Library filter box — sits between the heading and the scrolling list, so
     it stays put while results scroll under it (flex: 0 0 auto against the
     list's flex: 1 1 auto). */
  .library-search {
    flex: 0 0 auto; width: 100%; margin: 0 0 .55rem;
    padding: .42rem .6rem; font-size: .82rem;
    color: var(--text); background: rgba(8,20,34,.58);
    border: 1px solid var(--border-soft); border-radius: 8px;
  }
  .library-search::placeholder { color: var(--muted); }
  .library-search:focus {
    outline: none; border-color: #6287aa; background: rgba(8,20,34,.85);
  }
  .segment-list {
    min-height: 0; flex: 1 1 auto;
    overflow: auto; display: grid; align-content: start; gap: .55rem;
    padding-right: 2px; scrollbar-width: thin;
  }
  .segrow {
    min-width: 0; display: grid; gap: .4rem;
    padding: .55rem; margin: 0;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.62);
  }
  .segrow.on { border-color: #6287aa; background: rgba(41,76,111,.25); }
  .segment-row-main {
    min-width: 0; min-height: 38px; display: grid; gap: .28rem;
    justify-items: start; padding: .1rem .18rem;
    border: 0; background: transparent; text-align: left;
  }
  .segment-row-main:hover { border: 0; background: transparent; }
  .segment-row-name {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 700;
  }
  .segment-row-state { min-height: 19px; display: flex; flex-wrap: wrap; gap: .3rem; }
  .segment-row-state .chip { padding: .05rem .42rem; font-size: .65rem; }
  .target-chip { color: var(--gold-soft); border-color: #806e37; }
  .muted-chip { color: var(--muted); border-color: #344353; }
  .segment-row-actions {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: .3rem;
  }
  .segment-row-actions button { min-width: 0; min-height: 31px; padding: .25rem .35rem; font-size: .69rem; }
  .segment-row-actions .is-selected { color: var(--gold-soft); border-color: #846e2e; }
  .segment-row-actions .icon-button { width: 31px; min-width: 31px; }
  /* overflow-y auto, not hidden: the pane is viewport-bounded above, so a long
     definition scrolls INSIDE the card rather than growing the document. */
  .segment-editor { overflow-x: hidden; overflow-y: auto; }
  .segbuilder { min-width: 0; border: 0; padding: 0; margin: 0; }
  .builder-heading {
    min-height: 50px; display: flex; align-items: center;
    justify-content: space-between; gap: .75rem;
    padding-bottom: .65rem; margin-bottom: .8rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .builder-heading h2 { margin-top: .08rem; }
  .builder-name { display: grid; gap: .28rem; }
  .builder-name input { width: 100%; min-width: 0; }
  .builder-enabled {
    display: flex; align-items: center; gap: .55rem; margin: .65rem 0;
    padding: .65rem .75rem; border: 1px solid var(--border-soft);
    border-radius: 7px; background: rgba(8,20,34,.55);
  }
  .builder-enabled input { min-height: 0; }
  .builder-enabled span { display: grid; gap: .05rem; }
  .builder-enabled small, .seghead small, .setting-copy span {
    color: var(--muted); font-size: .7rem; font-weight: 400;
  }
  /* Match-mode control (spec 2026-07-28-multi-step-segments, final-review
     finding 4) -- boxed like .builder-enabled above; the description wraps
     to its own full-width row beneath the label+select one so a long
     sentence never fights the select for horizontal room. */
  .builder-matchmode {
    display: flex; flex-wrap: wrap; align-items: center; gap: .55rem;
    margin: .65rem 0; padding: .65rem .75rem;
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(8,20,34,.55);
  }
  .builder-matchmode .field-label { margin: 0; }
  .builder-matchmode select { min-width: 0; max-width: 20rem; }
  .builder-matchmode .meta { flex-basis: 100%; }
  .segment-definition-grid {
    display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .65rem;
  }
  .segsection {
    min-width: 0; margin: 0; padding: .65rem;
    border-radius: 8px; background: rgba(8,20,34,.48);
  }
  .segsection.seg-guard { grid-column: 1 / -1; }
  .seghead {
    min-height: 38px; display: flex; align-items: center; gap: .5rem;
    padding: 0 0 .5rem; margin: 0 0 .45rem;
    border-bottom: 1px solid currentColor; border-radius: 0; background: transparent !important;
  }
  .seghead > span:last-child { display: grid; gap: .05rem; }
  .seghead-icon { width: 27px; height: 27px; display: inline-flex; align-items: center; justify-content: center; }
  .seg-start .seghead { color: #8fce9f; }
  .seg-end .seghead { color: #e79a9a; }
  .seg-guard .seghead { color: #d8b77f; }
  .segclause {
    min-width: 0; min-height: 48px; margin: .4rem 0; padding: .42rem .5rem;
    gap: .42rem; border: 1px solid rgba(72,96,119,.35);
    border-left-width: 3px;
  }
  .segclause select { flex: 1 1 150px; }
  .segclause input { flex: 0 1 90px; }
  .segclause .clause-remove { flex: 0 0 31px; margin-left: auto; }
  .segment-add-condition { margin-top: .25rem; padding-inline: .25rem; }

  /* Split into two / Merge with another (Task 18, spec 2026-07-28-multi-
     step-segments) -- boxed panels like .builder-enabled above, one action
     per box. Grid's default justify-items:stretch would otherwise pull the
     trailing button full-width, so it alone opts out. */
  .builder-split, .builder-merge {
    display: grid; gap: .5rem; margin: .65rem 0; padding: .65rem .75rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.48);
  }
  .builder-split .field-label, .builder-merge .field-label {
    display: flex; align-items: center; gap: .4rem; margin: 0;
  }
  .split-names { display: flex; gap: .5rem; flex-wrap: wrap; }
  .split-names input { flex: 1 1 160px; min-width: 0; }
  .merge-body { display: grid; gap: .5rem; }
  .merge-controls { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .merge-controls select { flex: 0 1 160px; }
  .builder-split > button, .merge-body > button { justify-self: start; }
  .builder-actions {
    min-height: 56px; display: flex; align-items: center; justify-content: flex-end;
    flex-wrap: wrap; gap: .5rem; margin-top: .75rem;
    padding-top: .75rem; border-top: 1px solid var(--border-soft);
  }
  .builder-actions .meta { margin-right: auto; font-size: .72rem; }

  /* Author-time lint findings (Task 16, spec 2026-07-28-multi-step-segments)
     -- one row per tracking/lint.py finding, beside Save. Errors and warnings
     share one box (no severity grouping): they're few enough per definition
     that a second layout tier would be more chrome than content. */
  .lint-panel {
    display: grid; gap: .4rem; margin-top: .75rem; padding: .55rem .7rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.48);
  }
  .lint-finding { display: flex; align-items: flex-start; gap: .4rem; font-size: .82rem; }
  .lint-finding svg { flex: 0 0 auto; margin-top: .15rem; }
  .lint-error { color: #e79a9a; }
  .lint-warning { color: #d8b77f; }

  .backtest-panel {
    display: grid; gap: .5rem; margin-top: .75rem; padding: .65rem .75rem;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(8,20,34,.48);
  }
  .backtest-summary { display: flex; flex-wrap: wrap; gap: .55rem; align-items: baseline; }
  .backtest-unclosed { display: grid; gap: .25rem; }
  .backtest-attempts {
    display: grid; gap: .2rem; max-height: 220px; overflow-y: auto;
    padding-right: 2px; scrollbar-width: thin;
  }

  /* "Record a segment" timeline picker (Task 13, spec 2026-07-28-multi-
     step-segments) -- ui/components/segmenttimeline.js. Self-responsive
     (flex-wrap + a capped, scrollable row list), like iconpicker.js's
     .icongrid above: this renders inside a Modal, which is NOT nested in
     .practice-page (the only element with container-type: inline-size), so
     there is no @container to gate against here -- and nothing below needs
     a breakpoint anyway. */
  .record-steps { display: flex; gap: .5rem; margin-bottom: .75rem; }
  .record-step {
    padding: .25rem .65rem; border-radius: 999px; font-size: .78rem;
    color: var(--muted); background: rgba(255,255,255,.04);
  }
  .record-step.on { color: var(--text); background: rgba(255,196,84,.16); }
  .record-view-toggle {
    display: flex; align-items: center; gap: .4rem;
    margin-bottom: .65rem; font-size: .82rem; color: var(--muted);
  }
  .record-rows {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 45vh; overflow-y: auto; padding-right: 4px;
  }
  .record-row {
    min-width: 0; text-align: left; padding: .5rem .65rem;
    border: 1px solid var(--border-soft); border-radius: 7px;
    background: rgba(8,20,34,.48); color: var(--text); cursor: pointer;
  }
  .record-row:hover { background: rgba(255,255,255,.06); }
  .record-picked { display: flex; align-items: center; gap: .5rem; }
  .record-review { display: flex; flex-direction: column; gap: .5rem; }

  .routes-workshop {
    min-width: 0; display: grid;
    grid-template-columns: minmax(240px,300px) minmax(0,1fr);
    align-items: start; gap: 12px;
  }
  /* .route-library shares the segment-library viewport-bound rule above;
     .library-actions (margin-top:auto) stays pinned inside the card. */
  .route-list {
    min-height: 0; flex: 1 1 auto;
    overflow-y: auto; overflow-x: hidden;
    display: grid; grid-template-columns: minmax(0,1fr);
    align-content: start; gap: .4rem;
    padding-right: 2px; scrollbar-width: thin;
  }
  .route-list-item {
    width: 100%; min-width: 0; min-height: 54px;
    display: grid; grid-template-columns: minmax(0,1fr) auto;
    justify-content: initial; text-align: left; padding: .48rem .58rem;
    background: rgba(8,20,34,.58); border-color: var(--border-soft);
  }
  .route-list-item > span { min-width: 0; display: grid; gap: .08rem; }
  .route-list-item b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .route-list-item small { color: var(--muted); font-size: .68rem; }
  .route-list-item > .ui-icon { transform: rotate(-90deg); color: var(--muted); }
  .route-list-item.on { border-color: #6287aa; background: rgba(61,101,143,.25); }
  .route-list-item.on > .ui-icon { color: #9cc9f2; }
  /* Collapsible library groups (2026-07-24, generalized from the route
     library): ONE class per level, indent expressed by the nesting itself
     (a node's children render through the same component one level deeper —
     see grouplist.js), so a third level costs nothing new here either. Rows
     keep their own .4rem gap; the group supplies a slightly larger gap above
     each header so sections read as sections without a divider line. */
  .lib-cat {
    min-width: 0; display: grid; align-content: start; gap: .4rem;
    grid-template-columns: minmax(0,1fr);
  }
  .lib-cat + .lib-cat { margin-top: .5rem; }
  .lib-cat-header {
    width: 100%; min-width: 0; display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center; gap: .4rem;
    justify-content: initial; text-align: left;
    padding: .3rem .5rem; background: transparent;
    border-color: transparent; color: var(--muted);
    font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
  }
  .lib-cat-header:hover { color: var(--text); background: rgba(8,20,34,.5); }
  .lib-cat-header b {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: .74rem; letter-spacing: inherit;
  }
  .lib-cat-header > .ui-icon { transition: transform .12s ease; }
  .lib-cat-header.shut > .ui-icon { transform: rotate(-90deg); }
  /* EVERY level indents, and the indent COMPOUNDS through nesting — a child
     is always one step right of its parent, at any depth, with a guide line
     tying it to the header above it (user rule 2026-07-25: anything that
     implies a parent/child relationship indents the child one level; a
     sub-group flush with its parent reads as a sibling).

     This deliberately supersedes the earlier "depth-0 has no guide line"
     rule, which restored a pre-migration route look at the cost of leaving
     sub-group HEADERS flush with their parent — the regression the live audit
     caught. One rule on .lib-group does it: nesting supplies the depth, so a
     third or fourth level needs nothing new. */
  .lib-group {
    min-width: 0; display: grid; grid-template-columns: minmax(0,1fr);
    align-content: start; gap: .4rem;
    margin-left: .5rem; padding-left: .45rem;
    border-left: 1px solid var(--border-soft);
  }
  .lib-cat-header.sub {
    padding-left: .3rem; font-size: .68rem;
    text-transform: none; letter-spacing: .02em;
  }
  .lib-cat-header.sub b { font-size: .72rem; font-weight: 600; }
  /* Indent the ROW with a margin and let it stretch — `width: 100%` (the base
     .route-list-item rule) plus a margin is wider than the column, which both
     broke the indent and gave the library a horizontal scrollbar (live report
     2026-07-24). A vertical list never scrolls sideways: names ellipsise. */
  .lib-cat .route-list-item, .lib-cat .segrow { width: auto; }
  /* Two columns, not three: the library column is 240-300px, and three
     icon+label buttons overflowed the card (live report 2026-07-24 — "Delete"
     hung past the edge). The third wraps to its own row. min-width:0 on the
     buttons is the belt — a long label truncates instead of escaping. */
  .library-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: .4rem;
    margin-top: auto; padding-top: .65rem; border-top: 1px solid var(--border-soft);
  }
  .library-actions > button {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Same viewport bound as .segment-editor, for the same reason: an unbounded
     right-hand pane grows the document, the page gets a scrollbar, and the
     layout shifts sideways. The routes workshop has the identical shape, so it
     gets the identical treatment rather than waiting to be reported. */
  .route-workspace {
    min-width: 0; display: grid; gap: 12px;
    max-height: var(--pane-cap, calc(100vh - 205px)); overflow-x: hidden; overflow-y: auto;
  }
  .route-empty-card { min-height: min(520px, var(--pane-cap, calc(100vh - 205px))); }
  .route-setup-card { min-height: 134px; }
  .route-identity { margin-bottom: .45rem; }
  .routeavg { margin: 0; }
  .routestart {
    min-width: 0; display: grid; grid-template-columns: minmax(150px,190px) minmax(0,1fr);
    align-items: center; gap: .7rem; margin: 0;
  }
  .setting-copy { display: grid; gap: .12rem; }
  .routestart .segclause { margin: 0; }
  .route-plan-card { min-height: 370px; }
  .route-step-list { display: grid; gap: .55rem; }
  .routestep {
    min-width: 0; margin: 0; padding: .65rem;
    border-color: var(--border-soft); background: rgba(8,20,34,.55);
  }
  .routestep.routebroken { border-color: #7a414a; background: rgba(74,35,42,.22); }
  .routestep-head { min-height: 34px; gap: .42rem; }
  .routenum {
    width: 26px; height: 26px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #3d5872; border-radius: 50%;
    background: #11243a; color: #c7d7e6; font-size: .72rem; font-weight: 700;
  }
  .route-stat {
    display: grid; min-width: 56px; padding-left: .5rem;
    border-left: 1px solid var(--border-soft);
  }
  .route-stat small { color: var(--muted); font-size: .58rem; text-transform: uppercase; letter-spacing: .04em; }
  .route-stat b { color: #d8bd7a; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .route-stat.cumulative b { color: var(--gold-soft); }
  .routestep-actions { display: flex; gap: .28rem; }
  .routestep-actions .icon-button { width: 31px; min-width: 31px; min-height: 31px; }
  .routecands { margin: .45rem 0 .25rem 34px; }
  .routecands .chip {
    display: inline-flex; align-items: center; max-width: 100%;
    border-color: #3d5770; background: #102137;
  }
  .routestep-foot { margin: .42rem 0 0 34px; }
  .routepick {
    min-width: 0; flex: 1; display: grid;
    grid-template-columns: minmax(85px,.6fr) minmax(130px,1fr) minmax(140px,1.25fr) auto;
    gap: .38rem; align-items: center;
  }
  .routepick select { width: 100%; min-width: 0; }
  .routepick > button { white-space: nowrap; }
  .routeadd {
    min-width: 0; display: grid; grid-template-columns: minmax(150px,190px) minmax(0,1fr);
    align-items: center; gap: .7rem; margin-top: .75rem; padding-top: .75rem;
    border-top: 1px solid var(--border-soft);
  }
  .route-share-card { padding-block: .7rem; }
  .route-share-card > summary {
    min-height: 40px; display: grid; grid-template-columns: 30px minmax(0,1fr) auto;
    align-items: center; gap: .5rem; cursor: pointer; list-style: none;
  }
  .route-share-card > summary::-webkit-details-marker { display: none; }
  .route-share-card > summary > span:first-child { color: #93badf; }
  .route-share-card > summary > span:nth-child(2) { display: grid; gap: .06rem; }
  .route-share-card > summary small { color: var(--muted); font-size: .69rem; font-weight: 400; }
  .route-share-card .detail-chevron { color: var(--muted); transition: transform .16s ease; }
  .route-share-card[open] .detail-chevron { transform: rotate(180deg); }
  .routeio {
    margin-top: .65rem; padding: .75rem 0 0; border: 0; border-radius: 0;
    border-top: 1px solid var(--border-soft);
  }
  .routejson {
    box-sizing: border-box; min-height: 110px; margin: .4rem 0;
    resize: vertical; background: #091523;
  }

  /* Run: a fixed live-console slot plus a separate progress card. */
  .run-state, .feed-connection {
    display: inline-flex; align-items: center; gap: .45rem;
    min-height: 32px; padding: .3rem .62rem;
    border: 1px solid #38516a; border-radius: 999px;
    color: var(--muted); background: rgba(8,20,34,.6);
    font-size: .73rem; font-weight: 700;
  }
  .run-state .status-light, .feed-connection .status-light {
    width: 8px; height: 8px; background: #72849a;
  }
  .run-state.is-live, .feed-connection.is-live { color: var(--green); border-color: #376249; }
  .run-state.is-live .status-light, .feed-connection.is-live .status-light { background: var(--green); }
  .run-console-card { min-height: 600px; overflow: hidden; }
  .runbar {
    min-width: 0; min-height: 64px; display: grid;
    grid-template-columns: minmax(230px,1fr) auto minmax(120px,160px);
    align-items: end; gap: .7rem; margin: 0;
    padding-bottom: .75rem; border-bottom: 1px solid var(--border-soft);
  }
  .run-route-picker, .run-pb-slot { min-width: 0; display: grid; gap: .25rem; }
  .run-route-picker select { width: 100%; min-width: 0; }
  .run-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; }
  .run-actions .is-selected { color: var(--gold-soft); border-color: #806c34; }
  .run-pb-slot { justify-items: end; }
  .run-pb-slot b {
    font-size: 1rem; color: var(--green); font-variant-numeric: tabular-nums;
  }
  .run-error { margin-top: .55rem; }
  .run-live-slot { min-height: 500px; }
  .run-empty { min-height: 490px; }
  .run-live-content { min-width: 0; }
  .run-clock-row {
    min-height: 142px; display: grid;
    grid-template-columns: minmax(280px,1fr) minmax(240px,340px);
    align-items: center; gap: 1rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .runclock {
    margin-top: .15rem; font-size: clamp(2.5rem,6vw,5.4rem);
    font-weight: 780; line-height: 1; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  .run-time-button {
    min-height: 0; padding: 0; border: 0; border-radius: 4px;
    background: transparent; color: inherit; font: inherit;
    font-variant-numeric: inherit; letter-spacing: inherit;
  }
  .run-time-button:hover { border: 0; background: rgba(112,159,207,.1); }
  .run-clock-note {
    min-width: 0; display: grid; gap: .18rem; padding-left: 1rem;
    border-left: 1px solid var(--border-soft);
  }
  .run-clock-note b { color: #e2e9f0; }
  .run-clock-note span, .run-clock-note small { color: var(--muted); font-size: .73rem; }
  .run-clock-note small { margin-top: .2rem; }
  .run-split-scroll {
    max-height: 342px; overflow: auto; scrollbar-width: thin;
    border-bottom: 1px solid var(--border-soft);
  }
  .runsplits { margin: 0; font-size: .88rem; }
  .runsplits tr { height: 52px; }
  .runsplits td { border-bottom: 1px solid var(--border-soft); padding: .45rem .55rem; }
  .runsplits tr:last-child td { border-bottom: 0; }
  .run-split-index { width: 38px; }
  .run-split-name { min-width: 0; font-weight: 600; }
  .run-split-time { width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
  .run-split-time .run-time-button { width: 100%; justify-content: flex-end; font-weight: 700; }
  .runstep-cur { background: rgba(68,153,136,.15); }
  .runstep-cur td { border-color: #4c907a; }
  .rundone { opacity: .9; }
  .runupcoming { opacity: .48; }
  .run-history-card { min-height: 430px; }
  .runhistory { margin: 0; padding: 0; border: 0; }
  .run-history-toolbar {
    min-height: 40px; display: flex; align-items: center;
    justify-content: space-between; gap: .7rem;
  }
  .run-history-toolbar .reset-toggle {
    min-height: 34px; display: inline-flex; align-items: center; gap: .4rem;
    padding: .3rem .55rem; border: 1px solid #344b64; border-radius: 6px;
    background: #101f31; color: var(--text); font-size: .74rem;
  }
  .run-history-graph {
    height: 170px; display: flex; align-items: center;
    border-block: 1px solid var(--border-soft);
  }
  .rungraph { height: 150px; margin: 0; }
  .rungraph-empty { width: 100%; text-align: center; }
  .run-history-list {
    max-height: 330px; overflow: auto; display: grid; scrollbar-width: thin;
  }
  .run-history-entry { border-bottom: 1px solid var(--border-soft); }
  .run-history-entry:last-child { border-bottom: 0; }
  .run-history-row {
    width: 100%; min-height: 48px; display: grid;
    grid-template-columns: minmax(190px,.85fr) minmax(0,1fr) 22px;
    align-items: center; gap: .6rem; justify-content: initial;
    padding: .45rem .35rem; border: 0; background: transparent; text-align: left;
  }
  .run-history-row:hover { border: 0; background: rgba(86,132,178,.1); }
  .run-history-date { color: var(--muted); font-size: .72rem; }
  .run-history-result { min-width: 0; }
  .history-chevron { color: var(--muted); transition: transform .15s ease; }
  .run-history-entry.open .history-chevron { transform: rotate(180deg); }
  .run-history-splits {
    display: grid; gap: .25rem; padding: .4rem .55rem .7rem 2rem;
    background: rgba(6,16,28,.55);
  }
  .run-history-split {
    min-width: 0; min-height: 36px; display: grid;
    grid-template-columns: 28px minmax(0,1fr) minmax(90px,auto);
    align-items: center; gap: .5rem;
  }
  .run-history-duration {
    display: grid; justify-items: end; font-variant-numeric: tabular-nums;
  }
  .run-history-duration small { color: var(--muted); font-size: .65rem; }
  .runfocus .rungold, .runfocus .runahead, .runfocus .runbehind,
  .runfocus .runclock, .runfocus .run-pb-slot b { color: var(--text); }

  /* Compare: stable source, transport, and two 4:3 video work areas. */
  .compare-sync-note {
    display: inline-flex; align-items: center; gap: .4rem;
    color: var(--muted); font-size: .72rem; white-space: nowrap;
  }
  .compare-feed {
    max-width: none; min-height: 190px; margin: 0;
  }
  .cf-head {
    min-height: 48px; justify-content: space-between; margin: 0 0 .6rem;
    padding-bottom: .6rem; border-bottom: 1px solid var(--border-soft);
  }
  .cf-head h3 { margin-top: .08rem; }
  .cf-head select { min-width: 180px; }
  .cf-list {
    max-height: 150px; overflow-y: auto; border-color: var(--border-soft);
    background: rgba(7,18,31,.5); scrollbar-width: thin;
  }
  .cf-row {
    width: 100%; min-width: 0; min-height: 43px;
    display: grid; grid-template-columns: 92px 130px minmax(0,1fr) auto 20px;
    justify-content: initial; gap: .55rem; padding: .4rem .65rem;
    border: 0; border-bottom: 1px solid var(--border-soft);
    border-radius: 0; background: transparent; text-align: left;
  }
  .cf-row:hover { border-color: var(--border-soft); background: rgba(85,130,176,.1); }
  .cf-row.on { background: rgba(62,102,145,.28); box-shadow: inset 3px 0 0 #76b5f5; }
  .cf-row b { min-width: 0; color: var(--green); font-variant-numeric: tabular-nums; }
  .cf-load-icon { color: var(--muted); }
  .cf-empty { min-height: 98px; display: flex; align-items: center; justify-content: center; }
  /* Bare playback controls, centered under the video pair — no heading copy
     (user request 2026-07-24). */
  .compare-transport-card {
    min-height: 66px; display: flex; align-items: center;
    justify-content: center; gap: 1rem; padding-block: .65rem;
  }
  .compare-transport { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: .4rem; }
  .compare-transport button { min-width: 0; }
  .compare-transport .primary-transport {
    min-width: 92px; color: #171407; background: var(--gold); border-color: var(--gold-soft); font-weight: 750;
  }

  /* Compare, narrow pane. Was `@media (max-width:820px)` plus a second half in
     `@media (max-width:760px)` until 2026-07-28. Viewport 820 gives the pane
     701px and viewport 760 gives it 725px, so the pair were applying their
     "narrower" treatment to a WIDER pane — the same inversion the Active
     Target card had. One threshold, on the pane, replaces both.

     Placed HERE, immediately after the base rules, and that is load-bearing:
     these first went in where the old @media block sat near the top of the
     stylesheet and silently lost to `.primary-transport` above on source
     order — identical specificity (0,2,0), later rule wins. The sweep kept
     reporting the identical overlap through a fix that read as correct. */
  @container (max-width: 700px) {
    .compare-grid { flex-direction: column; }
    .compare-col, .compare-center { width: 100%; flex: none; }
    .compare-center { padding-top: .4rem; }
    .compare-transport { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .compare-transport-card { align-items: stretch; flex-direction: column; }
  }
  /* Four transport buttons across, once wrapping them is worse than shrinking
     them. `.primary-transport` is named EXPLICITLY rather than relying on the
     neighbouring `.compare-transport button` reset: that reset is (0,1,1) and
     the 92px min-width above is (0,2,0), so the button stayed 92px wide inside
     a ~64px grid cell and overlapped its neighbour by 22px at 320px. Found by
     the sweep the first time secondary tabs were measured at more than three
     viewports — the old coverage never looked at Compare below 760. */
  @container (max-width: 430px) {
    .compare-transport { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); }
    .compare-transport button,
    .compare-transport .primary-transport {
      min-width: 0; padding-inline: .28rem; font-size: .7rem;
    }
  }
  .compare-grid {
    min-width: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px; align-items: start;
  }
  .compare-col { min-width: 0; width: auto; flex: none; }
  .compare-stage-card { min-height: 590px; overflow: hidden; }
  .compare-stage-heading {
    min-height: 48px; display: flex; align-items: center;
    justify-content: space-between; gap: .7rem;
    padding-bottom: .65rem; margin-bottom: .7rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .compare-stage-heading h3 { margin-top: .08rem; }
  .compare-stage-heading .cmp-strat { width: min(210px,45%); }
  .compare-col select, .compare-col input, .compare-col video { max-width: 100%; box-sizing: border-box; }
  .vstage video.replay-player {
    width: 100%; aspect-ratio: 4 / 3; object-fit: contain;
    display: block; margin: 0; border: 1px solid #263b50;
    border-radius: 7px; background: #02070c;
  }
  .compare-empty {
    width: 100%; min-height: 0; aspect-ratio: 4 / 3;
    border-color: var(--border-soft); background: rgba(4,12,21,.64);
  }
  .compare-cmp { margin: 0 0 1rem; }
  .workarea { margin: .7rem 0; }
  .wa-track { height: 16px; background: #14263a; }
  .wa-times { margin-top: .22rem; font-variant-numeric: tabular-nums; }
  .wa-btns { flex-wrap: wrap; }
  .vaudio { justify-content: center; }
  .cmp-save input { max-width: none; }
  .compare-drop {
    min-height: 300px; margin-top: 0; padding: 1rem;
    border-color: #3b5873; background: rgba(5,16,29,.45);
  }
  .cd-icon { color: #8fb9df; }
  .cd-existing { width: 100%; }
  .cd-existing select { margin: .3rem 0 0; width: 100%; }

  /* Live diagnostics: fixed log viewport with readable raw payload wrapping. */
  .feed-card { min-height: 660px; overflow: hidden; }
  .feed-scroll {
    height: calc(100vh - 260px); min-height: 500px; max-height: 760px;
    overflow: auto; scrollbar-width: thin;
    border: 1px solid var(--border-soft); border-radius: 8px;
    background: rgba(4,13,23,.7);
  }
  .feed-row {
    min-width: 0; min-height: 56px; display: grid;
    grid-template-columns: 30px minmax(0,1fr); gap: .55rem;
    align-items: start; padding: .62rem .7rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .feed-row:last-child { border-bottom: 0; }
  .feed-row-icon {
    width: 28px; height: 28px; display: inline-flex;
    align-items: center; justify-content: center;
    border: 1px solid #34506a; border-radius: 50%; color: #8cb5dd;
  }
  .feed-event-main { min-width: 0; display: grid; gap: .22rem; }
  .feed-event-title {
    min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: .45rem;
  }
  .feed-event-title b { overflow-wrap: anywhere; }
  .feed-event-title strong { color: var(--green); font-variant-numeric: tabular-nums; }
  .feed-event-meta { color: var(--muted); font-size: .69rem; line-height: 1.35; }
  .feed-payload {

  .feed-reconnected { background: rgba(59,92,124,.16); }
  .feed-reconnected > div { display: grid; gap: .12rem; }
  .feed-reconnected span:last-child { color: var(--muted); font-size: .71rem; }
  .feed-empty { min-height: 490px; }
  .feed-footer {
    min-height: 42px; display: flex; align-items: center;
    justify-content: space-between; gap: 1rem;
    color: var(--muted); font-size: .68rem;
  }
  .feed-footer span { display: inline-flex; align-items: center; gap: .35rem; }

  /* Shared supporting states and modal language. */
  .page-state {
    min-height: 580px; display: flex; align-items: center; justify-content: center;
    gap: .9rem; text-align: left;
  }
  .page-state-icon {
    width: 50px; height: 50px; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid #3c5a76; border-radius: 50%;
    background: #0e2136; color: #8ab9e4;
  }
  .page-state h2 { margin: .12rem 0 .25rem; }
  .page-state p { max-width: 460px; margin: 0; color: var(--muted); font-size: .78rem; }
  .page-state.is-offline .page-state-icon { color: var(--coral); border-color: #6b424b; }
  .inline-state {
    min-height: 42px; display: inline-flex; align-items: center; gap: .45rem;
    color: var(--muted); font-size: .76rem;
  }
  .inline-state.error { color: var(--coral); }
  @media (prefers-reduced-motion: no-preference) {
    .page-state.is-loading .page-state-icon .ui-icon,
    .inline-state.loading .ui-icon { animation: state-spin 1.5s linear infinite; }
    @keyframes state-spin { to { transform: rotate(360deg); } }
  }

  .modal-backdrop {
    padding: 18px; background: rgba(1,7,14,.74);
    backdrop-filter: blur(5px); z-index: 200;
  }
  .modal {
    width: min(100%,600px); max-width: none; max-height: min(88vh,900px);
    display: flex; flex-direction: column; padding: 0; overflow: hidden;
    border: 1px solid #42617e; border-radius: 11px;
    background: #0b1929; box-shadow: 0 26px 90px rgba(0,0,0,.55);
  }
  .modal-large { width: min(100%,780px); }
  /* The picker grid is WIDE, not tall: 25 course cells at the default 600px
     came out 5 columns x 5 rows and scrolled, which is the thing the grid
     replaced a scrolling list to avoid (live audit 2026-07-25). At ~1100px the
     same cells lay out 8-9 across and fit in three rows with room to spare. */
  .modal-grid { width: min(96vw, 1100px); }
  .modal-header {
    flex: 0 0 auto; min-height: 78px; display: grid;
    grid-template-columns: 42px minmax(0,1fr) 36px;
    align-items: center; gap: .7rem; padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg,rgba(18,39,62,.98),rgba(11,27,44,.98));
  }
  .modal-icon {
    width: 40px; height: 40px; display: inline-flex;
    align-items: center; justify-content: center;
    border: 1px solid #456480; border-radius: 50%;
    color: var(--gold-soft); background: #10243a;
  }
  .modal-heading { min-width: 0; }
  .modal-heading h2 {
    margin: 0; color: var(--text); font-size: 1.12rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-heading p { margin: .16rem 0 0; color: var(--muted); font-size: .72rem; line-height: 1.35; }
  .modal-close { justify-self: end; }
  .modal-body { min-height: 0; overflow: auto; padding: 16px; scrollbar-width: thin; }
  .modal-actions {
    flex: 0 0 auto; min-height: 62px; display: flex;
    justify-content: flex-end; align-items: center; gap: .5rem;
    margin: 0; padding: 12px 16px;
    border-top: 1px solid var(--border-soft); background: rgba(7,18,31,.85);
  }
  .modal-field { display: grid; gap: .3rem; }
  .modal-field input, .modal-field select { width: 100%; min-width: 0; }
  .modal-field small { color: var(--muted); font-size: .68rem; }
  .modal-error {
    min-height: 38px; display: flex; align-items: center;
    margin-top: .65rem; padding: .5rem .65rem;
    border: 1px solid #72434b; border-radius: 6px;
    background: rgba(99,45,55,.22); color: #f0a4aa;
  }

  .strategy-name-field { margin-bottom: 1rem; }
  .stratname { margin: 0; }
  /* "Include in ranking" — a checkbox ROW, and deliberately NOT a
     `.modal-field`: that class stretches its input to `width: 100%`, which
     turned the tick into a 36px square and pushed its label out of the
     modal. Sized explicitly here, with the same `min-height: 0` +
     accent-color every other checkbox in this design system takes.
     `align-items: start` keeps the box on the first line as the
     explanation wraps. */
  .strategy-include-field {
    display: flex; align-items: start; gap: .5rem; margin-bottom: 1rem;
  }
  .strategy-include-field input[type="checkbox"] {
    width: 15px; height: 15px; min-height: 0; margin: .15rem 0 0;
    flex: 0 0 auto; accent-color: var(--blue);
  }
  .strategy-include-field > span { display: grid; gap: .12rem; }
  .strategy-include-field .meta { font-size: .69rem; }
  .strategy-ladder-heading {
    display: flex; align-items: end; justify-content: space-between;
    gap: 1rem; margin-bottom: .5rem;
  }
  .strategy-ladder-heading h3 { margin-top: .08rem; }
  .strategy-ladder-heading > span { color: var(--muted); font-size: .69rem; }
  .strategy-ladder {
    overflow: hidden; border: 1px solid var(--border-soft);
    border-radius: 8px; background: rgba(4,13,23,.55);
  }
  .strategy-ladder-labels, .strategy-rank-row {
    min-width: 0; display: grid;
    grid-template-columns: minmax(110px,.7fr) minmax(100px,.65fr) minmax(190px,1.6fr);
    align-items: center; gap: .55rem; padding: .42rem .55rem;
  }
  .strategy-ladder-labels {
    color: var(--muted); background: #0f2034;
    font-size: .63rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  }
  .strategy-rank-row { border-top: 1px solid var(--border-soft); }
  .strategy-rank-row label, .strategy-rank-row input { width: 100%; min-width: 0; }
  .strategy-rank-name {
    min-height: 30px; display: inline-flex; align-items: center;
    padding: .25rem .55rem; border-left: 4px solid var(--rank-color);
    border-radius: 4px; background: color-mix(in srgb,var(--rank-color) 20%,transparent);
    font-weight: 700;
  }

  .standards-toggle {
    width: 100%; min-height: 44px; display: grid;
    grid-template-columns: 24px auto minmax(0,1fr) 20px;
    justify-content: initial; text-align: left; padding: .5rem .7rem;
    border-color: var(--border-soft); color: #dfe7ef; background: #0e1c2c;
  }
  .standards-toggle > .meta {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .standards-chevron { justify-self: end; color: var(--muted); transition: transform .15s ease; }
  .standards-toggle[aria-expanded="true"] .standards-chevron { transform: rotate(180deg); }
  .stdbody {
    padding: .7rem; border-color: var(--border-soft);
    background: rgba(7,18,30,.6);
  }
  .stdtools { min-width: 0; flex-wrap: wrap; gap: .4rem; }
  .stdtools button { min-height: 31px; font-size: .71rem; }
  .stdtools .is-selected { color: var(--gold-soft); border-color: #806d34; }

  /* "You are here" marker (standards.js markerPosition). A cell highlight
     would be a lie -- your time is essentially never AT a cutoff -- so the
     label lives on the active column's header instead of floating a row
     between two cutoffs: at narrow table widths (<= ~900px, live-tested)
     a floating row's label collided with the cutoff time on the same row,
     illegibly. The two cutoffs actually bracketing your time get their own
     mark; every easier tier below that (already running faster than) reads
     as beaten. */
  .std-you-badge {
    display: block; margin-top: 2px; font-size: 10px; font-weight: 600;
    color: var(--gold); white-space: nowrap;
  }
  /* background, not box-shadow: .col-active already owns box-shadow on this
     cell (the active-column outline), and two box-shadow rules of equal
     specificity don't combine -- the later one simply wins outright. */
  .std-marker-bracket { background: color-mix(in srgb, var(--gold) 22%, transparent); }
  .std-beaten { background: color-mix(in srgb, var(--gold) 8%, transparent); }

  .update-summary {
    min-height: 54px; display: flex; align-items: center; gap: .7rem;
    padding: .55rem .7rem; border: 1px solid var(--border-soft);
    border-radius: 7px; background: rgba(7,18,30,.65);
  }
  .update-summary > span { display: grid; gap: .04rem; }
  .update-summary small { color: var(--muted); font-size: .62rem; text-transform: uppercase; }
  .update-summary b { font-variant-numeric: tabular-nums; }
  .update-summary em {
    margin-left: auto; color: var(--gold-soft); font-size: .7rem; font-style: normal;
  }
  .update-notes {
    margin: .7rem 0; max-height: min(42vh,430px);
    border-color: var(--border-soft); background: #07121f;
  }
  .update-release-link { margin: .35rem 0 .7rem; font-size: .75rem; }
  .update-size {
    display: inline-flex; align-items: center; gap: .4rem;
    color: var(--muted); font-size: .72rem;
  }
  .update-installing, .update-error { display: flex; gap: .55rem; align-items: center; }
  .update-installing { display: grid; gap: .15rem; }
  .update-installing span, .update-error span { color: var(--muted); font-size: .72rem; }
  /* Retrying is a status, not a failure: warm, not alarming. */
  .update-installing span.update-retrying { color: var(--gold); }
  .update-error {
    min-height: 52px; padding: .6rem .7rem; border: 1px solid #72434b;
    border-radius: 7px; color: var(--coral); background: rgba(99,45,55,.18);
  }
  .update-error span { display: grid; gap: .1rem; }
  .progress { height: 12px; margin-top: .7rem; border-color: #385570; background: #07121f; }
  .progress-bar { background: var(--gold); }

  .replay-state { min-height: 86px; display: flex; align-items: center; padding: .6rem; }
  .replay-player { min-width: 0; }
  .replay-player > video {
    width: 100%; max-width: 760px; aspect-ratio: 4 / 3;
    object-fit: contain; border: 1px solid #2d465e; border-radius: 7px; background: #02070c;
  }
  .replay-status-row { min-height: 26px; display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .35rem; }
  .replay-notice {
    display: inline-flex; align-items: center; gap: .3rem;
    padding: .18rem .45rem; border: 1px solid #3b5670; border-radius: 999px;
    color: #b8c9da; font-size: .67rem;
  }
  .replay-notice.warning { color: #e3c27c; border-color: #766337; }
  .replay-transport {
    min-width: 0; display: flex; align-items: center; flex-wrap: wrap;
    gap: .35rem; margin: .5rem 0;
  }
  .replay-transport .primary-transport {
    color: #171407; background: var(--gold); border-color: var(--gold-soft); font-weight: 750;
  }
  .replay-frame-note { color: var(--muted); font-size: .67rem; }
  .replay-actions {
    display: flex; align-items: center; flex-wrap: wrap; gap: .4rem;
    padding-top: .5rem; border-top: 1px solid var(--border-soft);
  }
  .replay-path {
    min-width: 0; display: inline-flex; align-items: center; gap: .3rem;
    color: var(--muted); font-size: .7rem;
  }
  .recording-control { position: relative; display: block; min-width: 0; }
  .recording-status > .recording-control { overflow: visible; }
  .recording-button {
    width: 100%; min-width: 0; min-height: 28px; justify-content: flex-start;
    padding: .18rem 0; border: 0; background: transparent;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recording-status .recording-button { display: flex; }
  .recording-button:hover { border: 0; background: transparent; }
  .recording-light {
    width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: currentColor;
  }
  .replay-settings-popover {
    z-index: 20;
    left: 0; right: auto; bottom: calc(100% + 8px); top: auto;
    width: min(450px,calc(100vw - 32px)); min-width: 0;
    max-height: min(76vh,640px); overflow: auto; padding: .8rem;
    text-align: left;
    border-color: #42617e; background: #0b1929;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .popover-heading { display: flex; align-items: center; justify-content: space-between; gap: .7rem; }
  .popover-heading > div { display: grid; gap: .08rem; }
