<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SM64 Trainer — stream overlay</title>
<link rel="icon" type="image/png" href="/ui/favicon.png">
<!--
  The stream overlay: the page an OBS Browser Source points at. It shows the
  current practice target's PB over its GOAL, counts a streak goal's
  successes, and celebrates on top of itself when the goal falls.

  Its own stylesheet rather than index.html's: this is drawn over gameplay at
  video size, not inside the app, and the page must stay TRANSPARENT so OBS
  composites only the ink. Settings come from the URL (goaloverlay.js); the
  designer in the app (Settings -> Stream overlay) writes that URL.
-->
<script type="importmap">
{"imports": {
  "preact": "/ui/vendor/preact.module.js",
  "preact/hooks": "/ui/vendor/hooks.module.js",
  "htm": "/ui/vendor/htm.module.js"
}}
</script>
<style>
  @font-face {
    font-family: "SuperMario256"; font-display: block;
    src: url("/ui/assets/fonts/SuperMario256.ttf") format("truetype");
  }
  /* color-scheme matches the app's, so the designer's preview iframe stays
     see-through: Chrome paints an opaque backdrop behind an iframe whose
     scheme differs from its embedder's. */
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    min-height: 100vh; display: flex; align-items: flex-start;
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Aptos", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[data-align="center"] body { justify-content: center; }
  html[data-align="right"] body { justify-content: flex-end; }
  #overlay { padding: 14px; }

  .ov {
    --ink: #f5f7fb;
    --muted: rgba(214, 224, 238, .66);
    --faint: rgba(214, 224, 238, .22);
    --good: #86e3a4;
    --bad: #ff7d74;
    --panel-top: rgba(22, 33, 51, .93);
    --panel-bottom: rgba(8, 13, 23, .93);
    /* An outline built from shadows rather than text-stroke: it sits OUTSIDE
       the glyph, so small type keeps its weight over a bright course. */
    --outline: 0 0 2px #000, 1.5px 1.5px 0 rgba(0,0,0,.85), -1.5px 1.5px 0 rgba(0,0,0,.85),
               1.5px -1.5px 0 rgba(0,0,0,.85), -1.5px -1.5px 0 rgba(0,0,0,.85),
               0 1.5px 0 rgba(0,0,0,.85), 0 -1.5px 0 rgba(0,0,0,.85),
               1.5px 0 0 rgba(0,0,0,.85), -1.5px 0 0 rgba(0,0,0,.85), 0 3px 10px rgba(0,0,0,.55);
    color: var(--ink);
    transition: opacity .45s ease;
  }
  .ov.is-hidden { opacity: 0; }
  /* The celebration takes the box over, then hands it back: the plate's own
     content leaves while the celebration plays and returns after it has gone,
     one after the other, so the old and new times never overlap. */
  .ov-head, .ov-times, .ov-progress { transition: opacity .3s ease; }
  .is-celebrating .ov-head, .is-celebrating .ov-times, .is-celebrating .ov-progress {
    opacity: 0; transition-duration: .12s;
  }
  .ov-box {
    position: relative; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    padding: 14px 20px 14px 22px;
  }

  /* ---- header: art + name -------------------------------------------------- */
  .ov-head { display: flex; align-items: center; gap: 10px; min-width: 0; height: 30px; }
  .ov-icon {
    width: 30px; height: 30px; flex: none; object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  .ov-icon-empty {
    display: grid; place-items: center; font-size: 18px; color: var(--faint);
    border: 1.5px dashed var(--faint); border-radius: 50%; box-sizing: border-box;
    width: 28px; height: 28px; filter: none;
  }
  .ov-title { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
  .ov-course {
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ov-name {
    font-size: 16px; font-weight: 650; letter-spacing: .005em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .align-right .ov-head { flex-direction: row-reverse; text-align: right; }

  /* ---- PB over GOAL -------------------------------------------------------- */
  .ov-times { display: grid; gap: 1px; }
  .ov-row {
    display: grid; grid-template-columns: 52px auto auto 1fr; align-items: baseline;
    column-gap: 8px; min-width: 0;
  }
  .ov-label {
    font-size: 13px; font-weight: 750; letter-spacing: .16em; color: var(--muted);
  }
  .ov-goal .ov-label { color: var(--accent); }
  .ov-time {
    font-size: 34px; font-weight: 650; line-height: 1.12; letter-spacing: -.005em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ov-goal .ov-time { color: var(--accent); }
  .ov-times-n { font-size: 20px; font-weight: 700; margin-left: 6px; opacity: .85; }
  .ov-check {
    align-self: center; display: inline-grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--good); color: #0b1a10; font-size: 14px; font-weight: 900;
  }
  .ov-source {
    grid-column: 4; justify-self: end; font-size: 12px; font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .is-achieved .ov-goal .ov-time { color: var(--good); }
  .is-achieved .ov-goal .ov-label { color: var(--good); }
  .is-achieved .ov-check { animation: ov-pop .42s cubic-bezier(.2, 1.6, .4, 1) both; }
  .is-idle .ov-time, .is-idle .ov-label { color: var(--faint); }
  .is-idle .ov-name { color: var(--muted); font-weight: 600; }

  /* ---- a counted goal: pips + N / M --------------------------------------- */
  .ov-progress { display: flex; align-items: center; gap: 12px; height: 18px; min-width: 0; }
  .ov-pips { display: flex; align-items: center; gap: 5px; }
  .ov-pip {
    position: relative; width: 11px; height: 11px; border-radius: 50%; box-sizing: border-box;
    border: 1.5px solid var(--faint); background: transparent;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .ov-pip.is-on { background: var(--accent); border-color: var(--accent); }
  /* A streak is a chain: the dots join, so "in a row" reads before the word. */
  .is-streak .ov-pips { gap: 0; }
  .is-streak .ov-pip + .ov-pip { margin-left: 6px; }
  .is-streak .ov-pip + .ov-pip::before {
    content: ""; position: absolute; right: 100%; top: 50%; width: 7px; height: 2px;
    margin-top: -1px; background: var(--faint);
  }
  .is-streak .ov-pip.is-on + .ov-pip.is-on::before { background: var(--accent); }
  .ov-pip.is-new { animation: ov-pip-in .42s cubic-bezier(.2, 1.7, .4, 1) both; }
  .ov-pip.is-new::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid var(--accent); animation: ov-ring .6s ease-out both;
  }
  .ov-pip.is-drain {
    animation: ov-drain .7s ease-in both; animation-delay: var(--d, 0ms);
  }
  .ov-bar {
    flex: 0 1 180px; height: 6px; border-radius: 3px; background: var(--faint); overflow: hidden;
  }
  .ov-bar > span { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .ov-count {
    display: flex; align-items: baseline; gap: 4px; font-size: 13px; font-weight: 600;
    color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .ov-count > b { color: var(--ink); font-size: 15px; font-weight: 750; display: inline-block; }
  .ov-count > b.is-new { animation: ov-count-in .35s ease-out both; }
  .ov-count > .ov-check { width: 16px; height: 16px; font-size: 11px; align-self: center; color: #0b1a10; }
  .is-complete .ov-count > b { color: var(--good); }
  .ov-unit { margin-left: 2px; }
  .is-breaking .ov-unit { color: var(--bad); font-weight: 700; }
  .ov-best { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }

  /* ---- the celebration, drawn inside the same box ------------------------- */
  .ov-party {
    position: absolute; inset: 0; display: flex; align-items: center; gap: 18px;
    padding: 0 22px; border-radius: inherit;
    background:
      radial-gradient(120% 140% at 18% 50%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 62%),
      linear-gradient(180deg, #172336, #0a101b);
    animation: ov-party-life 2.6s ease both;
  }
  .ov-party-sweep {
    position: absolute; top: -20%; bottom: -20%; left: 0; width: 38%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
    transform: translateX(-120%) skewX(-18deg);
    animation: ov-sweep .75s .08s cubic-bezier(.4, 0, .2, 1) both;
    pointer-events: none;
  }
  .ov-party-word {
    position: relative; font-family: "SuperMario256", Impact, sans-serif;
    font-size: 50px; line-height: 1; color: var(--accent); letter-spacing: .02em;
    text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
    -webkit-text-stroke: 1.5px rgba(0,0,0,.55);
    animation: ov-word .6s .1s cubic-bezier(.2, 1.5, .4, 1) both;
  }
  .ov-party-detail {
    position: relative; display: flex; flex-direction: column; gap: 2px;
    animation: ov-detail .45s .38s ease-out both;
  }
  .ov-party-time {
    font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .ov-party-beaten { font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ov-party-beaten s { text-decoration-thickness: 2px; text-decoration-color: var(--bad); }
  .ov-party-burst { position: absolute; left: 88px; top: 50%; width: 0; height: 0; }
  .ov-party-burst i {
    position: absolute; left: -7px; top: -9px; font-style: normal; font-size: 15px;
    color: var(--accent); text-shadow: 0 1px 2px rgba(0,0,0,.6);
    animation: ov-spark 1.1s calc(.18s + var(--i) * 30ms) cubic-bezier(.15, .8, .3, 1) both;
  }

  @keyframes ov-pop { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes ov-pip-in { 0% { transform: scale(.3); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes ov-ring { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(2.3); opacity: 0; } }
  @keyframes ov-drain {
    0% { background: var(--bad); border-color: var(--bad); transform: scale(1.15); }
    100% { background: transparent; border-color: var(--faint); transform: scale(1); }
  }
  @keyframes ov-count-in { 0% { transform: translateY(7px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes ov-party-life {
    0% { opacity: 0; } 5% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; }
  }
  @keyframes ov-sweep { to { transform: translateX(330%) skewX(-18deg); } }
  @keyframes ov-word {
    0% { transform: scale(.35) rotate(-6deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes ov-detail { 0% { transform: translateX(-10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes ov-spark {
    0% { transform: translate(0, 0) scale(.2) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(160deg); opacity: 0; }
  }

  /* ---- theme: plate (the default) ----------------------------------------- */
  .theme-plate .ov-box {
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    border: 1px solid rgba(255, 255, 255, .09); border-radius: 16px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .07);
  }
  .theme-plate .ov-box::before {
    content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .theme-plate.is-achieved .ov-box::before { background: var(--good); }
  .theme-plate.is-idle .ov-box::before { background: var(--faint); }

  /* ---- theme: minimal — no panel, outlined type -------------------------- */
  .theme-minimal { --muted: rgba(236, 241, 248, .86); --faint: rgba(236, 241, 248, .45); }
  .theme-minimal .ov-name, .theme-minimal .ov-course, .theme-minimal .ov-label,
  .theme-minimal .ov-time, .theme-minimal .ov-source, .theme-minimal .ov-count,
  .theme-minimal .ov-best { text-shadow: var(--outline); }
  .theme-minimal .ov-source, .theme-arcade .ov-source { grid-column: auto; justify-self: start; margin-left: 6px; }
  .theme-minimal .ov-pip { box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); }
  .theme-minimal .ov-party {
    background: radial-gradient(60% 90% at 22% 50%, rgba(0,0,0,.55), transparent 75%);
  }
  .theme-minimal .ov-party-time, .theme-minimal .ov-party-beaten { text-shadow: var(--outline); }

  /* ---- theme: bar — one slim line ---------------------------------------- */
  .theme-bar .ov-box {
    flex-direction: row; align-items: center; justify-content: flex-start; gap: 18px;
    padding: 0 18px 0 14px;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    border: 1px solid rgba(255, 255, 255, .09); border-radius: 14px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .07);
  }
  .theme-bar .ov-head { flex: 0 0 190px; }
  /* One line has room for the goal's size OR its source, not both: a counted
     goal's "×10" and pips already say what the goal is. */
  .theme-bar.has-progress .ov-source, .theme-bar .ov-best { display: none; }
  .theme-bar .ov-course { display: none; }
  .theme-bar .ov-name { font-size: 14.5px; }
  .theme-bar .ov-times { display: flex; gap: 18px; flex: none; }
  .theme-bar .ov-row { display: flex; gap: 8px; }
  .theme-bar .ov-label { font-size: 11.5px; }
  .theme-bar .ov-time { font-size: 25px; }
  .theme-bar .ov-times-n { font-size: 15px; }
  .theme-bar .ov-check { width: 18px; height: 18px; font-size: 11px; }
  .theme-bar .ov-source { margin-left: 4px; }
  .theme-bar .ov-progress { flex: 1 1 auto; justify-content: flex-end; }
  .theme-bar .ov-best { margin-left: 0; }
  .theme-bar .ov-party { gap: 14px; padding: 0 18px; }
  .theme-bar .ov-party-word { font-size: 32px; }
  .theme-bar .ov-party-detail { flex-direction: row; align-items: baseline; gap: 10px; }
  .theme-bar .ov-party-time { font-size: 24px; }
  .theme-bar .ov-party-burst { left: 62px; }

  /* ---- theme: arcade — the game's own HUD, big and outlined -------------- */
  .theme-arcade { --muted: rgba(255, 255, 255, .9); --faint: rgba(255, 255, 255, .4); }
  .theme-arcade .ov-box { gap: 4px; }
  .theme-arcade .ov-name, .theme-arcade .ov-course, .theme-arcade .ov-source,
  .theme-arcade .ov-count, .theme-arcade .ov-best { text-shadow: var(--outline); }
  .theme-arcade .ov-label, .theme-arcade .ov-time {
    font-family: "SuperMario256", Impact, sans-serif; font-weight: 400;
    -webkit-text-stroke: 2px rgba(0, 0, 0, .8); paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .55);
  }
  .theme-arcade .ov-row { grid-template-columns: 72px auto auto 1fr; }
  .theme-arcade .ov-label { font-size: 17px; letter-spacing: .06em; color: #fff; }
  .theme-arcade .ov-time { font-size: 40px; letter-spacing: .02em; color: #fff; }
  .theme-arcade .ov-goal .ov-time, .theme-arcade .ov-goal .ov-label { color: var(--accent); }
  .theme-arcade.is-achieved .ov-goal .ov-time, .theme-arcade.is-achieved .ov-goal .ov-label { color: var(--good); }
  .theme-arcade .ov-pip { box-shadow: 0 0 0 1.5px rgba(0,0,0,.7); }
  .theme-arcade .ov-party {
    background: radial-gradient(60% 90% at 22% 50%, rgba(0,0,0,.5), transparent 75%);
  }
  .theme-arcade .ov-party-time, .theme-arcade .ov-party-beaten { text-shadow: var(--outline); }

  @media (prefers-reduced-motion: reduce) {
    .ov *, .ov *::before, .ov *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; }
    .ov-party { animation: none; }
  }
</style>
</head>
<body>
  <div id="overlay"></div>
  <script type="module" src="/ui/goaloverlaypage.js"></script>
</body>
</html>
