<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RK boot</title>
<!--
  The colour-key page: six regions whose composed result on screen answers
  whether the ghost window can be see-through PER PIXEL rather than only as a
  whole.

  Why it matters: an only-Mario ghost owns every background pixel of its
  picture, so the question is no longer "can we dim the game" but "can a pixel
  of this window be absent from the screen entirely". Whole-window opacity
  cannot do that -- it dims every pixel equally, which is the dark sheet he
  saw. LWA_COLORKEY can, if the key colour survives the whole path: the page's
  paint, the WebView2 control, the form behind it, and the layered window.

  The grid is three columns by two rows filling the viewport exactly, so the
  rig can address each region by arithmetic on the window rectangle and needs
  no geometry over the title channel:

      r1 nothing        r2 the key colour   r3 opaque white
      r4 white at 50%   r5 alpha video      r6 canvas

  r5 and r6 are each split left/right -- opaque half and transparent half --
  so one region answers both "does it show" and "is it punched".

  Settings arrive in the FRAGMENT (a file:// URL loses its query through .NET's
  Uri): video=<url>  key=<rrggbb>  post=0|1
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  #grid {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  .cell { position: relative; overflow: hidden; }
  /* r1 paints nothing at all: whatever is behind the page shows through. */
  #r3 { background: #ffffff; }
  #r4 { background: rgba(255, 255, 255, 0.5); }
  #r5 video, #r6 canvas {
    display: block; width: 100%; height: 100%; object-fit: fill;
  }
</style>
</head>
<body>
<div id="grid">
  <div class="cell" id="r1"></div>
  <div class="cell" id="r2"></div>
  <div class="cell" id="r3"></div>
  <div class="cell" id="r4"></div>
  <div class="cell" id="r5"><video id="clip" muted loop playsinline autoplay></video></div>
  <div class="cell" id="r6"><canvas id="sheet"></canvas></div>
</div>
<script>
(function () {
  const params = new URLSearchParams(
    location.hash.replace(/^#/, "") || location.search.replace(/^\?/, ""));
  const post = params.get("post") === "1";
  const key = (params.get("key") || "ff00ff").replace(/^#/, "");
  const source = params.get("video");
  const video = document.getElementById("clip");

  // r2 is painted EXACTLY the key colour. Whether the browser hands that
  // number to the window unchanged is part of what is being measured: a
  // colour-managed pixel that lands one level off is a pixel the key misses.
  document.getElementById("r2").style.background = "#" + key;

  let trouble = "";
  let canvasState = "pending";
  let alphaTransparent = -1;
  let alphaOpaque = -1;

  if (source) video.src = source;
  video.addEventListener("error", () => {
    trouble = "media_error_" + (video.error ? video.error.code : "unknown");
  });
  const playing = video.play();
  if (playing && typeof playing.catch === "function")
    playing.catch((error) => { trouble = "play_rejected_" + error.name; });

  // r6: an opaque square in the LEFT half, the right half cleared. Drawn in
  // device pixels so the halves line up with what the rig samples.
  function paintSheet() {
    const sheet = document.getElementById("sheet");
    const box = sheet.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    sheet.width = Math.max(2, Math.round(box.width * ratio));
    sheet.height = Math.max(2, Math.round(box.height * ratio));
    const pen = sheet.getContext("2d");
    pen.clearRect(0, 0, sheet.width, sheet.height);
    pen.fillStyle = "#ffffff";
    pen.fillRect(0, 0, Math.floor(sheet.width / 2), sheet.height);
  }

  // Does Chromium decode the WebM alpha at all? Asked on a SEPARATE canvas:
  // drawing the video taints whichever canvas it lands on, and r6 has to stay
  // readable as a picture on screen.
  function readVideoAlpha() {
    if (video.readyState < 2 || !video.videoWidth) return;
    try {
      const probe = document.createElement("canvas");
      probe.width = video.videoWidth;
      probe.height = video.videoHeight;
      const pen = probe.getContext("2d");
      pen.clearRect(0, 0, probe.width, probe.height);
      pen.drawImage(video, 0, 0);
      const quarter = Math.floor(probe.width / 4);
      const middle = Math.floor(probe.height / 2);
      alphaOpaque = pen.getImageData(quarter, middle, 1, 1).data[3];
      alphaTransparent = pen.getImageData(probe.width - quarter, middle, 1, 1).data[3];
      canvasState = "ok";
    } catch (error) {
      canvasState = error.name === "SecurityError" ? "tainted" : "err_" + error.name;
    }
  }

  function line() {
    const box = document.getElementById("r1").getBoundingClientRect();
    return "RK t=" + Math.round(performance.now())
      + " vrs=" + video.readyState
      + " vw=" + video.videoWidth + "x" + video.videoHeight
      + " vt=" + (video.currentTime || 0).toFixed(2)
      + " canvas=" + canvasState
      + " va_o=" + alphaOpaque + " va_t=" + alphaTransparent
      + " dpr=" + (window.devicePixelRatio || 1)
      + " cell=" + Math.round(box.width) + "x" + Math.round(box.height)
      + " err=" + (trouble || "none");
  }

  function report() {
    paintSheet();
    readVideoAlpha();
    const text = line();
    document.title = text;
    if (post && window.chrome && window.chrome.webview)
      window.chrome.webview.postMessage(["console", JSON.stringify(text), 0]);
  }

  report();
  setInterval(report, 250);
})();
</script>
</body>
</html>
