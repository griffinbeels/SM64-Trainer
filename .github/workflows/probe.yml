# TEMPORARY (test-lanes only; deleted before merge): the browser run's runner
# setup, exercised without uilab while the pinned uilab commit is unpublished.
name: runner probe

on:
  push:
    branches: [test-lanes]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SM64_REPORT_DIR: ${{ github.workspace }}\test-artifacts
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ffmpeg
          key: ffmpeg-n8.1-win64-gpl

      - name: Install ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg-unpacked"
          Move-Item (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-unpacked")[0].FullName "$env:RUNNER_TEMP\ffmpeg"

      - name: Put ffmpeg on PATH
        run: Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ffmpeg\bin"

      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright's Chromium
        run: uv run --frozen python -m playwright install chromium

      - name: What the runner has
        run: |
          ffmpeg -hide_banner -version | Select-Object -First 1
          node --version
          uv run --frozen python -c "import os, psutil; print(os.cpu_count(), psutil.Process().cpu_affinity())"

      - name: The runner's own infrastructure tests, through the door
        run: >
          uv run --frozen python tools/run_tests.py --workers 2
          tests/test_test_lanes.py tests/test_test_resources.py tests/test_test_job.py
          tests/test_run_tests.py tests/test_browser_ci.py
          --junitxml test-artifacts/junit-probe.xml

      - name: The browser lane refuses without uilab
        run: |
          uv run --frozen python tools/run_tests.py --browser --shard 1/8
          if ($LASTEXITCODE -ne 2) { throw "expected the uilab refusal (exit 2), got $LASTEXITCODE" }
          exit 0

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 3
